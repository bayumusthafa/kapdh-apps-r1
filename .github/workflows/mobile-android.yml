# Build APK DEBUG kapdh-mobile di CI (opsional; tidak termasuk status wajib "CI lulus"). Membuktikan konfigurasi
# Gradle/Android (AGP, Kotlin, minSdk 26 sesuai D7/N-12, desugaring) dapat dibangun tanpa mesin Java lokal.
# APK debug ditandatangani kunci debug dan TIDAK untuk distribusi; build rilis (AAB bertanda tangan) mengikuti
# kapdh-mobile/docs/BUILD.md. Berjalan manual, atau otomatis bila konfigurasi Android/pubspec di main berubah.
name: Mobile Android (APK debug)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Konfigurasi --dart-define-from-file (config/<lingkungan>.json).
        required: true
        type: choice
        default: staging
        options: [staging, production, development]
  push:
    branches: [main]
    paths:
      - kapdh-mobile/android/**
      - kapdh-mobile/pubspec.yaml
      - kapdh-mobile/pubspec.lock
      - .github/workflows/mobile-android.yml

permissions:
  contents: read

concurrency:
  group: mobile-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk-debug:
    name: flutter build apk --debug
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      KAPDH_CONFIG: ${{ inputs.environment || 'staging' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Siapkan kapdh-platform
        uses: ./.github/actions/setup-platform
      - name: Bangkitkan SDK Dart kapdh_api
        working-directory: kapdh-platform
        run: pnpm contracts:gen
      - name: JDK 21 (Gradle 9 / AGP 9)
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            kapdh-mobile/android/*.gradle*
            kapdh-mobile/android/gradle/wrapper/gradle-wrapper.properties
      - name: Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Siapkan Flutter
        uses: ./.github/actions/setup-flutter
      # android/gradle.properties meminta heap 8 GB untuk mesin pengembang; runner standar lebih kecil. Properti di
      # GRADLE_USER_HOME mengalahkan properti proyek tanpa mengubah berkas yang di-commit.
      - name: Batas memori Gradle untuk runner CI
        run: |
          mkdir -p "$HOME/.gradle"
          printf '%s\n' 'org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError' \
            'org.gradle.daemon=false' >"$HOME/.gradle/gradle.properties"
      - name: flutter pub get (lockfile dikunci)
        working-directory: kapdh-mobile
        run: flutter pub get --enforce-lockfile
      - name: flutter build apk --debug (config/${{ env.KAPDH_CONFIG }}.json)
        working-directory: kapdh-mobile
        run: |
          set -euo pipefail
          case "$KAPDH_CONFIG" in staging | production | development) ;; *) exit 1 ;; esac
          flutter build apk --debug --dart-define-from-file="config/$KAPDH_CONFIG.json"
      - name: Simpan APK debug (7 hari)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kapdh-mobile-debug-${{ env.KAPDH_CONFIG }}-${{ github.sha }}
          path: kapdh-mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
