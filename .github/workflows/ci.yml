# CI KAPDH Apps: gerbang rilis N-16 (lint, typecheck, uji unit/integrasi termasuk jalur PostgreSQL 17 nyata dan uji
# akses objek, build image, tanpa kerentanan kritis) dan N-13 (perubahan kontrak tidak memutus klien yang didukung).
# PRD 5.5, 7.1, 9.3; temuan audit D2-09 dan D2-12. Penjelasan setiap job, secrets dan cara menjalankan lokal:
# docs/runbooks/ci-cd.md. Proteksi branch main cukup mewajibkan satu status: "CI lulus".
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash
    working-directory: kapdh-platform

env:
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  workflows:
    name: Workflow dan skrip ops
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pasang shellcheck
        uses: ./.github/actions/install-tool
        with:
          tool: shellcheck
      - name: Pasang actionlint
        uses: ./.github/actions/install-tool
        with:
          tool: actionlint
      - name: actionlint (blok run diperiksa shellcheck)
        working-directory: .
        run: actionlint -color
      - name: shellcheck skrip infra
        run: |
          set -euo pipefail
          mapfile -t scripts < <(git ls-files -- 'infra/*.sh')
          if [ "${#scripts[@]}" -eq 0 ]; then
            echo "Tidak ada skrip shell di infra/."
            exit 0
          fi
          shellcheck --severity=style "${scripts[@]}"
          echo "shellcheck lulus: ${scripts[*]}"

  verify:
    name: Kontrak, build, typecheck, lint, format, drift
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Siapkan kapdh-platform
        uses: ./.github/actions/setup-platform
      - name: Pemeriksaan statis workflow dan uji skrip CI
        run: |
          node infra/ci/check-workflows.mjs
          node infra/ci/images.mjs validate
          node --test 'infra/ci/test/*.test.mjs'
      - name: Lint kontrak OpenAPI dan skema event (PRD 5.2)
        run: pnpm contracts:lint
      - name: Build
        run: pnpm build
      # Compose/env/Dockerfile/Traefik (butuh @kapdh/config hasil build) dan uji kering job rilis dengan psql/node
      # palsu (PRD 5.5, 9.2 #9; temuan audit D2-07, D3-07).
      - name: Validasi statis infra dan uji kering job rilis
        run: |
          set -euo pipefail
          node infra/scripts/validate-infra.mjs
          for f in infra/scripts/*.sh infra/traefik/*.sh; do sh -n "$f"; done
          sh infra/scripts/release-job.test.sh
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Format (Prettier)
        run: pnpm format:check
      - name: Drift berkas terbangkit (token desain, kontrak, skema Drizzle)
        run: |
          set -euo pipefail
          pnpm tokens:gen
          pnpm contracts:gen
          pnpm --filter @kapdh/database exec drizzle-kit check
          # Skema Drizzle yang berubah tanpa migrasi menghasilkan berkas migrations/ baru di bawah ini.
          timeout 300 pnpm --filter @kapdh/database exec drizzle-kit generate
          # Salinan token Flutter di aplikasi wajib identik dengan keluaran generator (PRD 7.2: token diselaraskan).
          cmp packages/design-tokens/flutter/lib/kapdh_tokens.dart ../kapdh-mobile/lib/app/theme/kapdh_tokens.dart
          changes=$(git status --porcelain --untracked-files=all -- . ../kapdh-mobile)
          if [ -n "$changes" ]; then
            echo "::error title=Drift berkas terbangkit::Generator mengubah berkas ter-commit atau membuat berkas baru; jalankan pnpm tokens:gen, pnpm contracts:gen atau db:generate lalu commit hasilnya."
            printf '%s\n' "$changes"
            git --no-pager diff --stat
            exit 1
          fi

  test:
    name: Uji unit dan integrasi (PGlite)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Siapkan kapdh-platform
        uses: ./.github/actions/setup-platform
      # Uji API/admin/web/worker/paket, termasuk uji kontrak expectOperation dan uji akses objek (N-16, PRD 9.2).
      # Konkurensi 2 mengurangi timeout palsu pada uji berat (catatan integrasi fase C).
      - name: pnpm test
        run: pnpm exec turbo run test --concurrency=2

  test-pg:
    name: Uji PostgreSQL 17 nyata (api, worker)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Siapkan kapdh-platform
        uses: ./.github/actions/setup-platform
      # embedded-postgres 17 (ARCHITECTURE §9.2): race kursi terakhir, double approval, Super Admin terakhir, room
      # langsung, idempotensi, outbox dan leader penjadwal worker (AC F01-4, F04-3, F04-4, F09-1, F11-1, F16-2).
      - name: pnpm test:pg (@kapdh/api, @kapdh/worker)
        run: pnpm exec turbo run test:pg --concurrency=1

  contracts-compat:
    name: Kontrak tidak memutus klien (N-13)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout (riwayat dan tag contracts-v*)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Siapkan kapdh-platform
        uses: ./.github/actions/setup-platform
      - name: Pasang oasdiff
        uses: ./.github/actions/install-tool
        with:
          tool: oasdiff
      - name: oasdiff breaking terhadap tag contracts-v* terakhir
        run: >-
          node packages/contracts/scripts/check-breaking.mjs
          --report "$RUNNER_TEMP/kontrak-n13.md"
          --head-out "$RUNNER_TEMP/openapi.yaml"
      - name: Simpan laporan N-13 dan bundle kontrak
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kontrak-n13
          path: |
            ${{ runner.temp }}/kontrak-n13.md
            ${{ runner.temp }}/openapi.yaml
          if-no-files-found: ignore
          retention-days: 14

  dart-sdk:
    name: SDK Dart kapdh_api (analyze dan test)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Siapkan kapdh-platform
        uses: ./.github/actions/setup-platform
      - name: Siapkan Flutter
        uses: ./.github/actions/setup-flutter
      - name: pnpm contracts:test-dart
        run: pnpm contracts:test-dart

  mobile:
    name: Flutter analyze, format dan test (kapdh-mobile)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Siapkan kapdh-platform
        uses: ./.github/actions/setup-platform
      # kapdh-mobile memakai SDK kapdh_api lewat dependensi path; lib/src dibangkitkan, tidak di-commit (ADR-001).
      - name: Bangkitkan SDK Dart
        run: pnpm contracts:gen
      - name: Siapkan Flutter
        uses: ./.github/actions/setup-flutter
      - name: flutter pub get (lockfile dikunci)
        working-directory: kapdh-mobile
        run: flutter pub get --enforce-lockfile
      - name: dart format (kecuali salinan token terbangkit)
        working-directory: kapdh-mobile
        run: |
          set -euo pipefail
          git ls-files -z -- 'lib/*.dart' 'test/*.dart' \
            | grep -zv '^lib/app/theme/kapdh_tokens.dart$' \
            | xargs -0 dart format --output=none --set-exit-if-changed
      - name: flutter analyze
        working-directory: kapdh-mobile
        run: flutter analyze
      - name: flutter test
        working-directory: kapdh-mobile
        run: flutter test

  audit:
    name: Audit kerentanan dependensi (N-16)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Siapkan pnpm dan Node.js
        uses: ./.github/actions/setup-platform
        with:
          install: "false"
          cache: "false"
      # Tinggi dan kritis memblokir kecuali tercatat di infra/ci/vuln-allowlist.json (pemilik, alasan, kedaluwarsa
      # <= 90 hari); PRD 9.3 melarang bug tinggi identitas/akses admin terbuka saat rilis. Sedang = peringatan.
      - name: pnpm audit produksi (gerbang tinggi + allowlist)
        run: |
          set -uo pipefail
          set +e
          pnpm audit --prod --json > "$RUNNER_TEMP/pnpm-audit.json"
          code=$?
          set -e
          echo "pnpm audit keluar $code (bukan nol bila ada advisory; laporan dinilai vuln-gate.mjs)"
          node infra/ci/vuln-gate.mjs --source pnpm-audit "$RUNNER_TEMP/pnpm-audit.json" \
            --fail-on high --label "pnpm audit --prod"
      - name: Pasang osv-scanner
        uses: ./.github/actions/install-tool
        with:
          tool: osv-scanner
      - name: OSV pubspec.lock kapdh-mobile (gerbang tinggi + allowlist)
        working-directory: .
        run: |
          set -uo pipefail
          set +e
          osv-scanner scan source --format json -L kapdh-mobile/pubspec.lock > "$RUNNER_TEMP/osv.json"
          code=$?
          set -e
          # 0 = tanpa temuan, 1 = ada temuan (dinilai vuln-gate.mjs), lainnya = galat alat.
          if [ "$code" -ne 0 ] && [ "$code" -ne 1 ]; then
            echo "::error title=osv-scanner::keluar $code"
            exit "$code"
          fi
          node kapdh-platform/infra/ci/vuln-gate.mjs --source osv "$RUNNER_TEMP/osv.json" \
            --fail-on high --label "OSV kapdh-mobile/pubspec.lock"

  docker-plan:
    name: Rencana image
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Siapkan Node.js
        uses: ./.github/actions/setup-platform
        with:
          install: "false"
          cache: "false"
      - name: Matriks dari infra/ci/images.json
        id: plan
        run: |
          set -euo pipefail
          node infra/ci/images.mjs validate
          echo "matrix=$(node infra/ci/images.mjs matrix --mode ci)" >> "$GITHUB_OUTPUT"

  docker:
    name: Image ${{ matrix.id }} (build tanpa push, uji asap)
    needs: docker-plan
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.docker-plan.outputs.matrix) }}
    env:
      IMAGE: kapdh-ci/${{ matrix.image }}:${{ github.sha }}${{ matrix.tag_suffix }}
      GRYPE_CHECK_FOR_APP_UPDATE: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Siapkan Node.js (gerbang kerentanan tanpa dependensi)
        uses: ./.github/actions/setup-platform
        with:
          install: "false"
          cache: "false"
      - name: Siapkan Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build ${{ matrix.image }} (${{ matrix.environment }})
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: kapdh-platform
          file: kapdh-platform/${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          build-args: |
            ${{ matrix.build_args }}
            KAPDH_COMMIT=${{ github.sha }}
          platforms: linux/amd64
          push: false
          load: true
          provenance: false
          sbom: false
          tags: ${{ env.IMAGE }}
          cache-from: type=gha,scope=${{ matrix.id }}
          cache-to: type=gha,mode=max,scope=${{ matrix.id }}
      # api: migrate.js, jurnal migrasi, roles.sql; web/admin: `nginx -t`; semua: commit terbakar, proses bukan root.
      - name: Uji asap image
        env:
          SMOKE: ${{ matrix.smoke }}
          KAPDH_EXPECTED_COMMIT: ${{ github.sha }}
        run: docker run --rm -e KAPDH_EXPECTED_COMMIT --entrypoint sh "$IMAGE" -c "$SMOKE"
      - name: Pasang grype
        uses: ./.github/actions/install-tool
        with:
          tool: grype
      # N-16: kerentanan kritis paket OS/bahasa di image yang dikirim memblokir (kecuali allowlist yang ditinjau).
      - name: Pindai kerentanan image (gerbang kritis + allowlist)
        env:
          LABEL: image ${{ matrix.id }}
        run: |
          set -euo pipefail
          grype "docker:$IMAGE" --output json --file "$RUNNER_TEMP/grype.json"
          node infra/ci/vuln-gate.mjs --source grype "$RUNNER_TEMP/grype.json" --fail-on critical --label "$LABEL"

  # Stack Compose production lengkap dengan image commit ini (PRD 5.5, 9.2 #9; N-07; temuan audit D2-07, D3-07):
  # dry-run entry image, `nginx -t` varian production dan staging, uji asap header web/admin, job rilis nyata dengan
  # psql (cek versi skema, gerbang pra-migrasi menolak database baru), healthcheck, DB/Redis privat, edge staging
  # terpisah (infra/scripts/ci-stack-smoke.sh). Image hanya dimuat lokal; publish dan promosi ada di
  # deploy-staging.yml dan release.yml (infra/ci/images.json).
  compose-stack:
    name: Stack Compose production (job rilis, gerbang, header, jaringan)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      DOCKER_BUILDKIT: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Siapkan Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image (tag lokal kapdh-ci/kapdh-<layanan>:ci)
        run: |
          set -euo pipefail
          build() { docker buildx build --load --progress=plain "$@" .; }
          build -f infra/Dockerfile.api --target api -t kapdh-ci/kapdh-api:ci
          build -f infra/Dockerfile.api --target release -t kapdh-ci/kapdh-release:ci
          build -f infra/Dockerfile.worker -t kapdh-ci/kapdh-worker:ci
          build -f infra/Dockerfile.web -t kapdh-ci/kapdh-web:ci
          build -f infra/Dockerfile.admin -t kapdh-ci/kapdh-admin:ci
          build -f infra/Dockerfile.web --build-arg PUBLIC_API_URL=https://staging-api.kapdh.or.id/api/v1 \
            -t kapdh-ci/kapdh-web:ci-staging
          build -f infra/Dockerfile.admin --build-arg VITE_API_BASE_URL=https://staging-api.kapdh.or.id/api/v1 \
            -t kapdh-ci/kapdh-admin:ci-staging
      - name: Entry image dapat dimuat (tanpa env -> galat konfigurasi, bukan modul hilang)
        run: |
          set -euo pipefail
          expect_fail() { # <pola> <perintah...>
            pattern="$1"; shift
            if out="$("$@" 2>&1)"; then echo "$out"; echo "seharusnya gagal: $*"; exit 1; fi
            echo "$out" | grep -q "$pattern" || { echo "$out"; echo "pola '$pattern' tidak ada"; exit 1; }
          }
          expect_fail EnvValidationError docker run --rm kapdh-ci/kapdh-api:ci
          expect_fail EnvValidationError docker run --rm kapdh-ci/kapdh-worker:ci
          expect_fail "DATABASE_URL wajib" docker run --rm kapdh-ci/kapdh-api:ci node node_modules/@kapdh/database/dist/bin/migrate.js
          expect_fail "DATABASE_URL wajib" docker run --rm kapdh-ci/kapdh-api:ci node dist/cli/golive-check.js
          expect_fail "KAPDH_ENV wajib" docker run --rm kapdh-ci/kapdh-release:ci
          docker run --rm --entrypoint psql kapdh-ci/kapdh-release:ci --version | grep -q "psql (PostgreSQL) 17"
          test "$(docker run --rm --entrypoint id kapdh-ci/kapdh-api:ci -u)" = "1000"
          test "$(docker run --rm --entrypoint id kapdh-ci/kapdh-web:ci -u)" = "101"
      - name: nginx -t (web dan admin, production dan staging)
        run: |
          set -euo pipefail
          for image in kapdh-web:ci kapdh-web:ci-staging kapdh-admin:ci kapdh-admin:ci-staging; do
            docker run --rm --entrypoint nginx "kapdh-ci/$image" -t
          done
          docker run --rm --entrypoint cat kapdh-ci/kapdh-admin:ci-staging /etc/nginx/conf.d/default.conf \
            | grep -q "connect-src 'self' https://staging-api.kapdh.or.id"
      - name: Uji asap header (kontainer terisolasi, port lokal)
        run: |
          set -euo pipefail
          docker run -d --name web --read-only --tmpfs /tmp -p 127.0.0.1:18080:8080 kapdh-ci/kapdh-web:ci
          docker run -d --name admin --read-only --tmpfs /tmp -p 127.0.0.1:18081:8080 kapdh-ci/kapdh-admin:ci
          sleep 3
          sh infra/scripts/smoke-static.sh web http://127.0.0.1:18080
          sh infra/scripts/smoke-static.sh admin http://127.0.0.1:18081
          docker rm -f web admin
      - name: Stack Compose production (job rilis, healthcheck, gerbang, DB privat)
        run: sh infra/scripts/ci-stack-smoke.sh

  ci-ok:
    name: CI lulus
    if: always()
    needs: [workflows, verify, test, test-pg, contracts-compat, dart-sdk, mobile, audit, docker, compose-stack]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Semua job wajib lulus
        working-directory: .
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          failed=$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key)=\(.value.result)"' <<<"$RESULTS")
          if [ -n "$failed" ]; then
            echo "::error title=CI gagal::$(tr '\n' ' ' <<<"$failed")"
            exit 1
          fi
          echo "Semua job CI lulus."
