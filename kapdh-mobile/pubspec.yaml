name: kapdh_mobile
description: Aplikasi anggota KAPDH Apps (Android dan iOS). PRD v3.5.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  go_router: ^16.0.0
  dio: ^5.8.0
  flutter_secure_storage: ^9.2.4
  google_fonts: ^6.2.1
  intl: ^0.20.2
  # SDK terbangkit dari kontrak OpenAPI (PRD 5.2, N-13; ADR-001). lib/src paket ini dibangkitkan oleh
  # `pnpm contracts:gen` di kapdh-platform dan tidak di-commit; jalankan setelah pull. Saat rilis, tag
  # `contracts-vX.Y.Z` dibuat `pnpm contracts:release-sdk` (commit rilis berisi lib/src terbangkit) dan repo
  # Flutter terpisah memakai: git: {url: <repo KAPDHAPPS>, path: kapdh-platform/packages/contracts/dart/kapdh_api,
  # ref: contracts-vX.Y.Z}.
  kapdh_api:
    path: ../kapdh-platform/packages/contracts/dart/kapdh_api
  qr_flutter: ^4.1.0
  socket_io_client: ^3.1.6
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^22.3.2
  image_picker: ^1.2.4
  file_picker: ^10.2.4
  cached_network_image: ^4.0.4
  connectivity_plus: ^7.3.2
  package_info_plus: ^9.0.1
  url_launcher: ^6.3.3
  shared_preferences: ^2.5.6
  timezone: ^0.11.1
  flutter_widget_from_html_core: ^0.17.4
  uuid: ^4.6.0
  pub_semver: ^2.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  http_mock_adapter: ^0.6.1

flutter:
  uses-material-design: true
  assets:
    - assets/logo-kapdh.png
