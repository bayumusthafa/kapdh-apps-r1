name: kapdh_mobile
description: Aplikasi anggota KAPDH Apps (Android dan iOS). PRD v3.5.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.35.0"

# Versi dikunci di pubspec.lock untuk Flutter 3.47.2 / Dart 3.13.2 (ARCHITECTURE §1, §8.1). Batas bawah caret mengikuti
# versi yang diuji; kenaikan mayor (mis. go_router 17, flutter_secure_storage 10) memerlukan ADR (PRD 7.1).
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # SDK terbangkit dari kontrak OpenAPI (PRD 5.2, N-13; ADR-001). lib/src paket ini dibangkitkan oleh
  # `pnpm contracts:gen` di kapdh-platform dan tidak di-commit; jalankan setelah pull. Saat rilis, tag
  # `contracts-vX.Y.Z` dibuat `pnpm contracts:release-sdk` (commit rilis berisi lib/src terbangkit) dan repo
  # Flutter terpisah memakai: git: {url: <repo KAPDHAPPS>, path: kapdh-platform/packages/contracts/dart/kapdh_api,
  # ref: contracts-vX.Y.Z}.
  kapdh_api:
    path: ../kapdh-platform/packages/contracts/dart/kapdh_api

  # Cangkang aplikasi: state, routing, HTTP.
  flutter_riverpod: ^3.4.3
  go_router: ^16.3.0
  dio: ^5.11.1

  # Penyimpanan: rahasia di Keychain/Keystore, preferensi non-rahasia di shared_preferences.
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.6

  # Push hanya FCM/APNs (ARCHITECTURE §2 butir 4); opsional saat runtime (PUSH_ENABLED).
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  flutter_local_notifications: ^22.3.2

  # Realtime /realtime (ARCHITECTURE §4.9).
  socket_io_client: ^3.1.6

  # Sistem dan platform.
  connectivity_plus: ^7.3.2
  package_info_plus: ^9.0.1
  url_launcher: ^6.3.3
  image_picker: ^1.2.4
  file_picker: ^10.2.4

  # Tampilan.
  qr_flutter: ^4.1.0
  cached_network_image: ^4.0.4
  # Sudah terkunci sebagai dependensi cached_network_image; dipakai langsung untuk cache foto KTA tersendiri yang
  # dihapus saat logout (PRD 5.2, AC F05-3).
  flutter_cache_manager: ^3.4.5
  flutter_widget_from_html_core: ^0.17.4

  # Format, waktu dan utilitas.
  intl: ^0.20.2
  timezone: ^0.11.1
  uuid: ^4.6.0
  pub_semver: ^2.2.1
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Smoke alur kritis di perangkat/emulator nyata (N-12, matriks D7; N-03 diukur di perangkat). Lihat
  # integration_test/ dan docs/qa/device-matrix.md.
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5
  http_mock_adapter: ^0.6.1
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  assets:
    - assets/logo-kapdh.png
    # Teks lisensi font pihak ketiga untuk halaman Akun > Lisensi sumber terbuka (lib/app/app_licenses.dart,
    # THIRD_PARTY_NOTICES.md): Phosphor dan Poppins dibundel langsung sebagai font aset.
    - assets/fonts/phosphor/LICENSE
    - assets/licenses/Poppins-OFL.txt

  fonts:
    # Poppins 4.004 (SIL OFL 1.1, assets/licenses/Poppins-OFL.txt) dari github.com/google/fonts ofl/poppins, tanpa
    # perubahan. Dibundel agar tipografi sama sejak peluncuran pertama tanpa koneksi dan aplikasi tidak menghubungi
    # server font pihak ketiga (ARCHITECTURE §8.1). Hanya bobot yang dipakai lib/: 400, 400 italic, 500, 600, 700;
    # tebal-miring (mis. <strong><em> di isi berita) disintesis engine dari Italic 400.
    - family: Poppins
      fonts:
        - asset: assets/fonts/poppins/Poppins-Regular.ttf
        - asset: assets/fonts/poppins/Poppins-Italic.ttf
          style: italic
        - asset: assets/fonts/poppins/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/poppins/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/poppins/Poppins-Bold.ttf
          weight: 700
    # Ikon Phosphor 2.1 (MIT, assets/fonts/phosphor/LICENSE; ADR-027). Font dibundel langsung karena paket
    # phosphor_flutter 2.1.0 tidak kompatibel dengan Flutter 3.47 (meng-extend IconData yang final). Dipangkas otomatis
    # oleh --tree-shake-icons saat build rilis.
    - family: PhosphorRegular
      fonts:
        - asset: assets/fonts/phosphor/Phosphor-Regular.ttf
    - family: PhosphorFill
      fonts:
        - asset: assets/fonts/phosphor/Phosphor-Fill.ttf
    - family: PhosphorDuotone
      fonts:
        - asset: assets/fonts/phosphor/Phosphor-Duotone.ttf
