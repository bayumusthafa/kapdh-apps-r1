include: package:flutter_lints/flutter.yaml

# `dart format` memakai lebar 120 kolom (gaya kode kapdh-platform).
formatter:
  page_width: 120

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
  language:
    strict-casts: true
    strict-raw-types: true
linter:
  rules:
    - prefer_const_constructors
    - avoid_print
