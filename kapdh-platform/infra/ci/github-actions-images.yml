# Image, konfigurasi deployment dan stack Compose KAPDH (PRD 5.3 "image dibangun CI", 5.5, 7.1; N-07, N-16; temuan
# audit D2-07, D3-07). Disalin ke .github/workflows/images.yml bersama ci.yml (README infra).
#
# - infra-static : validasi statis compose/env/Dockerfile/Traefik + uji kering job rilis (sh = dash di ubuntu).
# - images       : build semua image (api, release, worker, web, admin; web/admin juga varian -staging), dry-run entry
#                  di image, `nginx -t`, uji asap header web/admin, lalu stack Compose production lengkap
#                  (job rilis nyata dengan psql, healthcheck, gerbang go-live, DB/Redis privat).
# - publish      : push main → GHCR `sha-<commit>` (staging memakai tag ini). Tag `v*` → image yang SAMA diberi tag
#                  versi (promosi tanpa build ulang, PRD 5.5). Deploy ke VPS tetap lewat job rilis + Coolify
#                  (docs/runbooks/rilis-dan-gerbang-go-live.md).
name: Images
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
permissions:
  contents: read
# Hanya PR yang dibatalkan oleh push berikutnya. Run push main TIDAK pernah dibatalkan: setiap commit main harus
# menerbitkan image sha-<commit> karena tag versi dipromosikan dari image itu (job promote).
concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}
jobs:
  infra-static:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: kapdh-platform
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with: { package_json_file: kapdh-platform/package.json }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: kapdh-platform/.nvmrc
          cache: pnpm
          cache-dependency-path: kapdh-platform/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @kapdh/config build
      - name: Validasi statis infra
        run: node infra/scripts/validate-infra.mjs
      - name: Sintaks POSIX skrip (dash)
        run: for f in infra/scripts/*.sh infra/traefik/*.sh; do sh -n "$f"; done
      - name: Uji kering job rilis
        run: sh infra/scripts/release-job.test.sh

  images:
    needs: infra-static
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: kapdh-platform
    env:
      DOCKER_BUILDKIT: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Build image (BuildKit; layer pnpm fetch dipakai bersama)
        run: |
          set -eu
          build() { docker buildx build --load --progress=plain "$@" .; }
          build -f infra/Dockerfile.api --target api -t kapdh-ci/kapdh-api:ci
          build -f infra/Dockerfile.api --target release -t kapdh-ci/kapdh-release:ci
          build -f infra/Dockerfile.worker -t kapdh-ci/kapdh-worker:ci
          build -f infra/Dockerfile.web -t kapdh-ci/kapdh-web:ci
          build -f infra/Dockerfile.admin -t kapdh-ci/kapdh-admin:ci
          build -f infra/Dockerfile.web --build-arg PUBLIC_API_URL=https://staging-api.kapdh.or.id/api/v1 \
            -t kapdh-ci/kapdh-web:ci-staging
          build -f infra/Dockerfile.admin --build-arg VITE_API_BASE_URL=https://staging-api.kapdh.or.id/api/v1 \
            -t kapdh-ci/kapdh-admin:ci-staging
      - name: Entry image dapat dimuat (tanpa env → galat konfigurasi, bukan modul hilang)
        run: |
          set -eu
          expect_fail() { # <pola> <perintah...>
            pattern="$1"; shift
            if out="$("$@" 2>&1)"; then echo "$out"; echo "seharusnya gagal: $*"; exit 1; fi
            echo "$out" | grep -q "$pattern" || { echo "$out"; echo "pola '$pattern' tidak ada"; exit 1; }
          }
          expect_fail EnvValidationError docker run --rm kapdh-ci/kapdh-api:ci
          expect_fail EnvValidationError docker run --rm kapdh-ci/kapdh-worker:ci
          expect_fail "DATABASE_URL wajib" docker run --rm kapdh-ci/kapdh-api:ci node node_modules/@kapdh/database/dist/bin/migrate.js
          expect_fail "DATABASE_URL wajib" docker run --rm kapdh-ci/kapdh-api:ci node dist/cli/golive-check.js
          expect_fail "KAPDH_ENV wajib" docker run --rm kapdh-ci/kapdh-release:ci
          docker run --rm --entrypoint psql kapdh-ci/kapdh-release:ci --version | grep -q "psql (PostgreSQL) 17"
          test "$(docker run --rm --entrypoint id kapdh-ci/kapdh-api:ci -u)" = "1000"
          test "$(docker run --rm --entrypoint id kapdh-ci/kapdh-web:ci -u)" = "101"
      - name: nginx -t (web dan admin, production dan staging)
        run: |
          set -eu
          for image in kapdh-web:ci kapdh-web:ci-staging kapdh-admin:ci kapdh-admin:ci-staging; do
            docker run --rm --entrypoint nginx "kapdh-ci/$image" -t
          done
          docker run --rm --entrypoint cat kapdh-ci/kapdh-admin:ci-staging /etc/nginx/conf.d/default.conf \
            | grep -q "connect-src 'self' https://staging-api.kapdh.or.id"
      - name: Uji asap header (kontainer terisolasi, port lokal)
        run: |
          set -eu
          docker run -d --name web --read-only --tmpfs /tmp -p 127.0.0.1:18080:8080 kapdh-ci/kapdh-web:ci
          docker run -d --name admin --read-only --tmpfs /tmp -p 127.0.0.1:18081:8080 kapdh-ci/kapdh-admin:ci
          sleep 3
          sh infra/scripts/smoke-static.sh web http://127.0.0.1:18080
          sh infra/scripts/smoke-static.sh admin http://127.0.0.1:18081
          docker rm -f web admin
      - name: Stack Compose production (job rilis, healthcheck, gerbang, DB privat)
        run: sh infra/scripts/ci-stack-smoke.sh
      - name: Publish ke GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          REGISTRY="$(printf '%s' "$REGISTRY" | tr '[:upper:]' '[:lower:]')"
          tag="sha-$(git rev-parse --short=12 HEAD)"
          for name in api release worker web admin; do
            docker tag "kapdh-ci/kapdh-$name:ci" "$REGISTRY/kapdh-$name:$tag"
            docker push "$REGISTRY/kapdh-$name:$tag"
          done
          for name in web admin; do
            docker tag "kapdh-ci/kapdh-$name:ci-staging" "$REGISTRY/kapdh-$name:$tag-staging"
            docker push "$REGISTRY/kapdh-$name:$tag-staging"
          done
    permissions:
      contents: read
      packages: write

  # Promosi tag versi yang disetujui gerbang rilis: image yang sama (digest sama) dengan build main untuk commit itu.
  promote:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Beri tag versi pada image sha-<commit> (tanpa build ulang)
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          REGISTRY="$(printf '%s' "$REGISTRY" | tr '[:upper:]' '[:lower:]')"
          source_tag="sha-$(git rev-parse --short=12 HEAD)"
          version="${GITHUB_REF_NAME}"
          # Semua sumber wajib ada SEBELUM satu tag pun dibuat (tidak ada promosi setengah jadi).
          missing=""
          for ref in api release worker web admin web:-staging admin:-staging; do
            name="${ref%%:*}"
            suffix=""
            case "$ref" in *:*) suffix="${ref#*:}" ;; esac
            if ! docker buildx imagetools inspect "$REGISTRY/kapdh-$name:$source_tag$suffix" >/dev/null 2>&1; then
              missing="$missing kapdh-$name:$source_tag$suffix"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Image sumber tidak ada:$missing. Tag $version menunjuk commit yang belum diterbitkan workflow Images di main (run dibatalkan/gagal atau commit bukan dari main). Jalankan ulang workflow Images untuk commit itu di main, lalu jalankan ulang job promote."
            exit 1
          fi
          for name in api release worker web admin; do
            docker buildx imagetools create -t "$REGISTRY/kapdh-$name:$version" "$REGISTRY/kapdh-$name:$source_tag"
          done
          for name in web admin; do
            docker buildx imagetools create -t "$REGISTRY/kapdh-$name:$version-staging" \
              "$REGISTRY/kapdh-$name:$source_tag-staging"
          done
