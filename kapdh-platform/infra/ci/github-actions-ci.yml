# Gerbang CI (PRD 7.1, N-16): lint/typecheck/test/build/kontrak. Disalin ke .github/workflows/ci.yml saat repository
# GitHub dibuat (README). Image, nginx -t, uji asap dan stack Compose ada di infra/ci/github-actions-images.yml.
name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kapdh-platform
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with: { package_json_file: kapdh-platform/package.json }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: kapdh-platform/.nvmrc
          cache: pnpm
          cache-dependency-path: kapdh-platform/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm contracts:lint
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm format:check

  # Jalur PostgreSQL 17 nyata (ARCHITECTURE §9.2, PRD 9.2): konkurensi, grant production, gerbang go-live, urutan job
  # rilis sebagai kapdh_migrator. embedded-postgres membawa biner PostgreSQL 17 untuk linux-x64.
  test-pg:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kapdh-platform
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with: { package_json_file: kapdh-platform/package.json }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: kapdh-platform/.nvmrc
          cache: pnpm
          cache-dependency-path: kapdh-platform/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:pg
