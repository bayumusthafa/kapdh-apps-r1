# Situs publik kapdh.or.id (apps/web, Astro static; D12, PRD 4.6). Dipasang sebagai
# /etc/nginx/conf.d/default.conf oleh infra/Dockerfile.web (konteks http di dalam infra/nginx-main.conf).
# TLS diterminasi Traefik/Coolify; HSTS ditambahkan di proxy setelah semua subdomain siap HTTPS (N-07; langkah di
# docs/runbooks/rilis-dan-gerbang-go-live.md bagian 7).
# nginx berjalan non-root sehingga mendengarkan port 8080 (port kontainer, tidak pernah dipublikasikan ke host).
# Diuji: regresi header di apps/web/src/lib/nginx-config.test.ts; `nginx -t` dan infra/scripts/smoke-static.sh di
# image (job compose-stack .github/workflows/ci.yml, infra/scripts/ci-stack-smoke.sh).

# Cache: aset /_astro/ bernama hash -> immutable 1 tahun. Shell HTML selalu divalidasi ulang agar deploy langsung
# berlaku; shell dinamis yang memegang data di memori (verifikasi KTA, hapus akun) dan halaman cadangan tautan
# aplikasi /app tidak pernah disimpan. Berkas asosiasi tautan aplikasi 1 jam (pembaruan sidik/Team ID cepat berlaku).
map $uri $kapdh_cache_control {
    default                                          "no-cache";
    ~^/_astro/                                       "public, max-age=31536000, immutable";
    ~^/kta(/|$)                                      "no-store";
    ~^/delete-account(/|$)                           "no-store";
    ~^/app(/|$)                                      "no-store";
    ~^/404\.html$                                    "no-store";
    ~^/(logo-kapdh\.png|robots\.txt|sitemap\.xml)$   "public, max-age=86400";
    /.well-known/assetlinks.json                     "public, max-age=3600";
    /.well-known/apple-app-site-association          "public, max-age=3600";
}

# Nilai per path hanya untuk respons sukses; respons galat (404 aset /_astro/ yang belum ada di kontainer lama saat
# rolling deploy, 405) selalu no-store agar 404 tidak tersimpan "immutable" di peramban.
map $status $kapdh_cache_control_final {
    default  "no-store";
    200      $kapdh_cache_control;
    206      $kapdh_cache_control;
    304      $kapdh_cache_control;
}

# Halaman /kta/<nomor>, /delete-account dan /app/... tidak diindeks (nilai kosong = header tidak dikirim).
map $uri $kapdh_robots {
    default                  "";
    ~^/kta(/|$)              "noindex, nofollow";
    ~^/delete-account(/|$)   "noindex, nofollow";
    ~^/app(/|$)              "noindex, nofollow";
}

server {
    # Hanya IPv4: Traefik menjangkau kontainer lewat jaringan Docker; listen [::] gagal bila IPv6 kontainer mati.
    # Port 8080: nginx berjalan sebagai user nginx tanpa hak port < 1024 (infra/nginx-main.conf).
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;
    absolute_redirect off;
    client_max_body_size 1k;

    # Situs statis: hanya GET/HEAD. Form halaman dikirim lewat fetch ke API, tidak pernah ke nginx.
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json
               application/xml application/manifest+json image/svg+xml;

    # Header keamanan (N-07). Semua di tingkat server dan TIDAK ada add_header di location (nginx tidak
    # mewariskan add_header ke location yang punya add_header sendiri).
    # CSP cocok dengan hasil build (apps/web/scripts/assert-csp-safe.mjs memastikan tanpa skrip/gaya inline):
    # - skrip, gaya dan font (Poppins di-host sendiri) hanya dari origin ini;
    # - connect-src/img-src ke API di subdomain kapdh.or.id (api.kapdh.or.id; staging juga subdomain, D12) untuk
    #   /public/*, verifikasi KTA, hapus akun dan foto anggota pada hasil verifikasi;
    # - frame-ancestors 'none' (tidak boleh dibingkai), form-action 'self', base-uri 'none', object-src 'none'.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' https://*.kapdh.or.id; connect-src 'self' https://*.kapdh.or.id; manifest-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
    add_header Permissions-Policy "accelerometer=(), autoplay=(), browsing-topics=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), sync-xhr=(), usb=(), xr-spatial-tracking=()" always;
    # no-referrer: path /kta/<nomor> tidak bocor lewat Referer (token di fragmen #t= memang tidak pernah dikirim).
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cache-Control $kapdh_cache_control_final always;
    add_header X-Robots-Tag $kapdh_robots always;

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Healthcheck kontainer (HEALTHCHECK image dan Uptime Kuma); tidak dicatat agar log tidak dibanjiri probe.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Shell verifikasi KTA: setiap /kta/<nomor> dilayani /kta/index.html (F-06). Token QR ada di fragmen #t=
    # sehingga tidak pernah sampai ke nginx; nomor anggota juga tidak dicatat di access log.
    location ~ ^/kta/[^/]+/?$ {
        access_log off;
        try_files /kta/index.html =404;
    }

    location /_astro/ {
        access_log off;
        try_files $uri =404;
    }

    # Berkas asosiasi tautan aplikasi (Android App Links, iOS Universal Links) untuk https://kapdh.or.id/app/...:
    # hanya dua path persis ini yang dikecualikan dari penolakan berkas tersembunyi di bawah. Ditulis
    # apps/web/scripts/write-app-links.mjs saat build hanya bila apps/web/app-links.json terisi; selain itu 404.
    # Dilayani apa adanya tanpa pengalihan, Content-Type persis application/json (tanpa charset; json bukan
    # charset_types).
    location = /.well-known/assetlinks.json {
        types { }
        default_type application/json;
        try_files $uri =404;
    }

    location = /.well-known/apple-app-site-association {
        types { }
        default_type application/json;
        try_files $uri =404;
    }

    # Berkas tersembunyi tidak pernah dilayani (termasuk /.well-known/ selain dua berkas di atas dan /app/.env).
    location ~ /\. {
        return 404;
    }

    # Halaman cadangan tautan aplikasi: /app dan setiap /app/<rute> dilayani /app/index.html
    # (apps/web/src/pages/app/index.astro). Diletakkan SETELAH penolakan berkas tersembunyi (location regex dicocokkan
    # berurutan) dan tidak cocok dengan /apply atau /apps.
    location ~ ^/app(/.*)?$ {
        try_files /app/index.html =404;
    }

    location / {
        try_files $uri $uri/index.html =404;
    }
}
