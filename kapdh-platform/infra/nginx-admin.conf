# Web admin admin.kapdh.or.id (apps/admin, SPA Vite; D12, ARCHITECTURE §7). Dipasang sebagai
# /etc/nginx/conf.d/default.conf oleh infra/Dockerfile.admin (konteks http). TLS diterminasi Traefik/Coolify; HSTS
# diaktifkan di sana setelah semua subdomain siap HTTPS (N-07). Diuji `nginx -t` oleh CI (job docker, smoke image).

# Cache: aset /assets/ bernama hash -> immutable 1 tahun. index.html selalu divalidasi ulang agar deploy langsung berlaku.
map $uri $kapdh_admin_cache_control {
    default        "no-cache";
    ~^/assets/     "public, max-age=31536000, immutable";
}

server {
    # Hanya IPv4: Traefik menjangkau kontainer lewat jaringan Docker; listen [::] gagal bila IPv6 kontainer mati.
    # Port 8080: nginx berjalan sebagai user nginx tanpa hak port < 1024 (infra/nginx-main.conf).
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;
    absolute_redirect off;
    client_max_body_size 1k;

    # SPA statis: hanya GET/HEAD. Semua mutasi dikirim lewat fetch ke API (api.kapdh.or.id), tidak pernah ke nginx.
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # Header keamanan (N-07). Semua di tingkat server dan TIDAK ada add_header di location (nginx tidak mewariskan
    # add_header ke location yang punya add_header sendiri).
    # CSP:
    # - skrip, font (Poppins dibundel) dan manifest hanya dari origin ini; tanpa pihak ketiga (kontrak admin-auth /invite);
    # - style-src 'self' tanpa 'unsafe-inline': gaya dasar TipTap dibundel (injectCSS: false, tiptap-base.css); gaya
    #   inline React lewat CSSOM (element.style) tidak diatur CSP;
    # - connect-src ke API di subdomain kapdh.or.id (api. dan staging-api., D12);
    # - img-src data: (QR pendaftaran TOTP, qrcode.toDataURL), blob: (pratinjau unggahan, unduhan backup code),
    #   https://*.kapdh.or.id (gambar dan bukti lewat URL bertanda tangan API <= 10 menit, PRD 5.4);
    # - media-src blob: dan Permissions-Policy camera=(self): pemindai QR check-in tiket (/events/checkin);
    # - frame-ancestors 'none', form-action 'self', base-uri 'none', object-src 'none'.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data: blob: https://*.kapdh.or.id; connect-src 'self' https://*.kapdh.or.id; media-src 'self' blob:; manifest-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
    add_header Permissions-Policy "accelerometer=(), autoplay=(), browsing-topics=(), camera=(self), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), publickey-credentials-get=(), screen-wake-lock=(), sync-xhr=(), usb=(), xr-spatial-tracking=()" always;
    # no-referrer: token undangan ada di fragmen /invite#t= dan tidak boleh bocor (juga meta referrer di index.html).
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control $kapdh_admin_cache_control always;

    location /assets/ {
        access_log off;
        try_files $uri =404;
    }

    # Berkas tersembunyi tidak pernah dilayani.
    location ~ /\. {
        return 404;
    }

    # Rute TanStack Router (/payments, /members/<id>, /invite, ...) dilayani index.html; berkas yang ada dilayani langsung.
    location / {
        try_files $uri /index.html;
    }
}
