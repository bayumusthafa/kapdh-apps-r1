# Web admin admin.kapdh.or.id (apps/admin, SPA React + Vite; D12, PRD 5.2, N-07; temuan audit D3-07). Dipasang
# sebagai /etc/nginx/conf.d/default.conf oleh infra/Dockerfile.admin (konteks http di dalam infra/nginx-main.conf).
# `__KAPDH_API_ORIGIN__` diganti saat build image dengan origin dari build arg VITE_API_BASE_URL
# (infra/scripts/admin-csp.mjs render), mis. https://api.kapdh.or.id atau https://staging-api.kapdh.or.id.
# TLS diterminasi Traefik/Coolify; HSTS ditambahkan di proxy setelah semua subdomain siap HTTPS (N-07; langkah di
# docs/runbooks/rilis-dan-gerbang-go-live.md bagian 7).
# Diuji: apps/admin/src/nginx-config.test.ts (header), admin-csp.mjs check (hasil build), `nginx -t` dan
# infra/scripts/smoke-static.sh di image (infra/ci/github-actions-images.yml, infra/scripts/ci-stack-smoke.sh).

# Cache: index.html dan semua rute SPA tidak pernah disimpan (deploy langsung berlaku, PRD 5.2; halaman admin tidak
# boleh tertinggal di cache bersama). Aset Vite bernama hash di /assets/ immutable 1 tahun.
map $uri $kapdh_admin_cache {
    default                       "no-store";
    ~^/assets/                    "public, max-age=31536000, immutable";
    ~^/(logo\.png|favicon\.ico)$  "public, max-age=86400";
}

# Nilai per path hanya untuk respons sukses. Respons galat (mis. 404 aset hash baru yang diminta ke kontainer LAMA saat
# rolling deploy Coolify, atau 405) selalu no-store: 404 tidak boleh tersimpan "immutable" 1 tahun di peramban.
map $status $kapdh_admin_cache_control {
    default  "no-store";
    200      $kapdh_admin_cache;
    206      $kapdh_admin_cache;
    304      $kapdh_admin_cache;
}

server {
    # Hanya IPv4 di jaringan Docker; non-root sehingga port 8080 (tidak pernah dipublikasikan ke host).
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;
    absolute_redirect off;
    client_max_body_size 1k;

    # SPA statis: hanya GET/HEAD. Semua mutasi dikirim lewat fetch ke API.
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    # Header keamanan (N-07). Semua di tingkat server dan TIDAK ada add_header di location (nginx tidak mewariskan
    # add_header ke location yang punya add_header sendiri).
    # CSP cocok dengan hasil build Vite (tanpa skrip/gaya inline; admin-csp.mjs check) dan perilaku aplikasi:
    # - skrip, gaya, font (Poppins dibundel @fontsource) hanya dari origin ini; TipTap tanpa <style> sisipan
    #   (injectCSS: false, aturan di src/styles.css);
    # - connect-src: origin ini (dev proxy) dan API (VITE_API_BASE_URL); token akses di memori, refresh cookie
    #   HttpOnly milik API (PRD 5.2);
    # - img-src: data: (QR TOTP/tiket dari pustaka qrcode), blob: (pratinjau unggahan), API (avatar, berkas publik,
    #   URL bertanda tangan <= 10 menit, PRD 5.4); media-src blob: untuk pemindai QR check-in;
    # - frame-ancestors 'none' + X-Frame-Options DENY: portal persetujuan pembayaran/suspend tidak dapat dibingkai
    #   (clickjacking); form-action 'self', base-uri 'none', object-src 'none', worker-src 'none'.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self' data: blob: __KAPDH_API_ORIGIN__; media-src 'self' blob:; connect-src 'self' __KAPDH_API_ORIGIN__; manifest-src 'self'; worker-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
    # Kamera hanya untuk origin ini (pemindai QR check-in, AC F09-5); fitur lain dimatikan.
    add_header Permissions-Policy "accelerometer=(), autoplay=(), browsing-topics=(), camera=(self), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), picture-in-picture=(), publickey-credentials-get=(), screen-wake-lock=(), sync-xhr=(), usb=(), xr-spatial-tracking=()" always;
    # no-referrer: tautan undangan /invite#t=<token> dan path rute admin tidak bocor lewat Referer (kontrak admin-auth).
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cache-Control $kapdh_admin_cache_control always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Healthcheck kontainer (HEALTHCHECK image dan Uptime Kuma); tidak dicatat.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Aset Vite bernama hash: berkas yang tidak ada → 404, tidak pernah index.html (MIME salah, nosniff). `^~` agar
    # lokasi regex ekstensi di bawah tidak mengambil alih path /assets/.
    location ^~ /assets/ {
        access_log off;
        try_files $uri =404;
    }

    # Berkas tersembunyi tidak pernah dilayani.
    location ~ /\. {
        return 404;
    }

    # Permintaan yang jelas berupa berkas statis tidak jatuh ke shell SPA.
    location ~* \.(?:js|mjs|css|map|json|txt|xml|ico|png|jpe?g|gif|svg|webp|woff2?)$ {
        try_files $uri =404;
    }

    # Rute aplikasi (TanStack Router, termasuk /invite#t=...) → index.html; berkas yang ada dilayani langsung.
    location / {
        try_files $uri /index.html;
    }
}
