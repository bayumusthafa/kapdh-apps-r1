# Konfigurasi utama nginx untuk image web dan admin (infra/Dockerfile.web, infra/Dockerfile.admin), dipasang sebagai
# /etc/nginx/nginx.conf. Proses master dan worker berjalan sebagai user nginx (uid 101), BUKAN root: tidak ada direktif
# `user`, berkas pid dan direktori sementara di /tmp, server mendengar port 8080 (conf.d/default.conf). Selebihnya sama
# dengan nginx.conf bawaan image resmi (log ke stdout/stderr lewat symlink /var/log/nginx/*).
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Direktori sementara yang dapat ditulis user nginx (bawaan /var/cache/nginx milik root).
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    include /etc/nginx/conf.d/*.conf;
}
