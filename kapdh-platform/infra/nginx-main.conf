# Konteks utama nginx untuk image situs publik (infra/Dockerfile.web) dan web admin (infra/Dockerfile.admin),
# dipasang sebagai /etc/nginx/nginx.conf. Proses master dan worker berjalan NON-ROOT (uid 101 `nginx` dari image resmi):
# tidak ada direktif `user`, berkas pid dan direktori sementara di /tmp, server mendengar port 8080
# (conf.d/default.conf). TLS diterminasi Traefik/Coolify (PRD 5.1, N-07); konfigurasi server ada di
# infra/nginx-web.conf dan infra/nginx-admin.conf.

# Situs statis kecil: satu worker cukup dan hemat RAM pada VPS 4 vCPU/8 GB yang dipakai bersama (D7, PRD 10.2).
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Direktori sementara yang dapat ditulis pengguna non-root (bawaan /var/cache/nginx milik root).
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # Log akses JSON tanpa query string, Referer, User-Agent, atau IP klien (N-14; PRD 5.5 "log tanpa PII").
    # Path /kta/<nomor> sama sekali tidak dicatat (access_log off di infra/nginx-web.conf).
    log_format kapdh escape=json
        '{"time":"$time_iso8601","service":"nginx","method":"$request_method","path":"$uri",'
        '"status":$status,"bytes":$body_bytes_sent,"duration_s":$request_time}';
    access_log /dev/stdout kapdh;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    include /etc/nginx/conf.d/*.conf;
}
