  /public/kta/verify:
    post:
      tags:
        - Public
      operationId: verifyKta
      summary: Verifikasi token QR KTA terhadap status server terkini; respons hanya identitas minimum (F-06, AC F06-1..F06-4).
      description: |
        Shell situs /kta/{nomor} membaca token dari fragmen URL (#t=) lalu mengirimnya ke sini; nomor saja tidak
        memberi akses profil (F-06). Token QR (ARCHITECTURE §3.2): JWT HS256 dengan header `kid` (rotasi kunci),
        klaim `iss` kapdh-api, `aud` kapdh-kta, `sub` id alumni, `seq` nomor urut N, `iat`, dan
        `exp` = min(iat + 7 hari, expires_at saat terbit). Status selalu dibaca dari DB TERKINI (AC F05-4); cache
        atau kartu offline tidak pernah menjadi sumber hasil. Waktu pembanding adalah jam server (`checked_at`).

        Urutan penilaian (langkah pertama yang cocok menentukan hasil; tidak ada jalur lain):
        1. Token rusak, `kid` tidak dikenal, tanda tangan, issuer atau audience salah -> `invalid_token`, tanpa
           membaca data anggota sehingga keberadaan nomor tidak dapat ditebak dengan token sembarang (AC F06-3).
        2. Akun `sub` tidak ada lagi atau sudah dihapus (F-14) -> `not_found` (AC F06-2 "termasuk setelah
           penghapusan akun"), juga bila `exp` sudah lewat; tanpa identitas.
        3. Keterikatan gagal: nomor pada request bukan nomor terkini akun `sub`, atau `seq` bukan N akun itu (token
           terbit sebelum koreksi nomor, atau nomor diubah) -> `invalid_token` ("QR tidak valid atau perlu
           diperbarui", AC F05-6).
        4. `exp` sudah lewat: hasil TIDAK PERNAH `active` dan `expiring` selalu false (AC F06-3, F05-5 "token QR
           lama tunduk expiry"). Hasilnya `expired` (Kedaluwarsa, AC F06-2) hanya bila KEDUA syarat terpenuhi:
           a) token dipangkas oleh masa keanggotaan, yaitu `exp` < `iat` + 7 hari (exp = expires_at saat terbit);
           b) effective_status TERKINI akun adalah expired.
           Semua kasus lain -> `invalid_token`, misalnya token 7 hari biasa yang kedaluwarsa, anggota yang sudah
           memperpanjang sehingga kini verified/expiring (pemeriksa diminta QR baru), atau anggota yang kini
           suspended, disabled, deletion_pending atau unverified.
        5. `exp` belum lewat: verified -> `active`; expiring -> `active` dengan `expiring` true dan tanggal habis
           (AC F06-1); expired -> `expired`; unverified, suspended, disabled atau deletion_pending -> `inactive`
           tanpa alasan (AC F06-2, F12-4).

        Identitas minimum (`member`, D3): diisi untuk `active` (dengan foto) dan `expired` (tanpa foto); null untuk
        hasil lain. Untuk `expired` dari langkah 4, `member` hanya diisi bila `exp` paling lama 30 hari sebelum
        `checked_at`; token yang lebih tua tetap berhasil `expired` tetapi `member` null, sehingga QR lama yang
        tersalin tidak membuka nama anggota tanpa batas waktu. Tidak pernah memuat email, telepon, NIK, alamat,
        bukti bayar atau alasan suspend (F-06, D3). Respons `Cache-Control: no-store`.
        Kegagalan jaringan/5xx tidak boleh ditampilkan klien sebagai Tidak ditemukan (AC F06-4).

        Pembatasan laju (nilai final D1) -> 429 RATE_LIMITED dengan `retry_after_seconds`:
        - per IP untuk semua request;
        - per hash token (SHA-256 dari token; token mentah tidak pernah disimpan atau dicatat) untuk semua request;
        - per nomor anggota HANYA untuk request yang lolos langkah 1 (tanda tangan, issuer dan audience sah),
          dihitung pada anggota PEMILIK token (klaim `sub`, yaitu nomor yang terikat pada token), bukan pada
          `member_number` di body; batas per token lebih kecil dari batas per nomor.
        Token sampah untuk nomor yang ditebak (N berurutan), maupun token sah milik anggota lain yang dikirim dengan
        nomor korban, hanya menghabiskan kuota IP pengirimnya dan kuota pemilik token itu, tidak pernah kuota nomor
        korban, sehingga pemeriksa sah di lapangan tidak ikut diblokir (F-06, AC F06-4). Klien
        menampilkan 429 sebagai "Tidak dapat memverifikasi" dengan retry, bukan Tidak ditemukan.

        Maintenance (PRD 4.5, ARCHITECTURE §4.3): walaupun memakai metode POST, operasi ini hanya membaca sehingga
        termasuk pengecualian "/public/** reads" dan dikecualikan EKSPLISIT per path pada hook maintenance
        (core-api `maintenanceAllowed`: path `/public/kta/verify`), sehingga tidak pernah menghasilkan
        503 MAINTENANCE dan pemeriksa di lapangan tetap dapat memverifikasi KTA selama maintenance. 5xx lain
        (mis. proxy saat deploy) jatuh ke respons default dan ditampilkan sebagai "Tidak dapat memverifikasi".
      security: []
      x-kapdh-access:
        audience: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KtaVerifyRequest"
      responses:
        "200":
          description: Hasil verifikasi (termasuk not_found dan invalid_token).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KtaVerification"
        "400":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Error"
components:
  parameters:
    AdjustmentId:
      name: adjustmentId
      in: path
      required: true
      description: ID penyesuaian (UUID v7).
      schema:
        type: string
        format: uuid
    AdminBackgroundRequest:
      name: X-Background-Request
      in: header
      required: false
      description: |
        Isi `1` hanya pada request polling/refetch otomatis web admin. Request bertanda ini tidak memperbarui
        `sessions.last_activity_at`, sehingga idle timeout 30 menit tetap berjalan (AC F02-5, N-08). Request yang
        dipicu pengguna tidak boleh mengirim header ini. Server (AuthGuard) menghormatinya pada SETIAP operasi
        berautentikasi admin, terlepas dari deklarasi kontrak; deklarasi di sini hanya untuk GET /admin/me. Usulan
        perubahan bersama (belum dibuat): pindahkan parameter ini ke root.yaml sebagai
        `components.parameters.BackgroundRequest` agar operasi GET admin yang di-polling di domain lain (hitungan
        dashboard, antrean pembayaran, notifikasi admin) mendeklarasikannya; klien web admin mengirimnya lewat
        interceptor untuk semua refetch otomatis.
      schema:
        type: string
        pattern: ^1$
    AdminDashboardBackgroundRequest:
      name: X-Background-Request
      in: header
      required: false
      description: |
        Isi `1` hanya pada request polling/refresh otomatis web admin. Request bertanda ini tidak memperbarui
        `sessions.last_activity_at`, sehingga idle timeout 30 menit tetap berjalan (AC F02-5, N-08). Request yang
        dipicu pengguna tidak boleh mengirim header ini. Nama dan bentuk sama dengan parameter
        AdminBackgroundRequest di domain admin-auth (C1); AuthGuard menghormatinya pada setiap operasi admin.
      schema:
        type: string
        pattern: ^1$
    AdminId:
      name: adminId
      in: path
      required: true
      description: Id identitas admin (admins.id), bukan id akun login.
      schema:
        type: string
        format: uuid
    AdminMasterId:
      name: masterId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AdminMemberUserId:
      name: userId
      in: path
      required: true
      description: users.id akun alumni.
      schema:
        type: string
        format: uuid
    AppPlatform:
      name: X-App-Platform
      in: header
      required: false
      description: Platform klien mobile; menentukan versi minimum yang diperiksa (PRD 4.5).
      schema:
        $ref: "#/components/schemas/DevicePlatform"
    AppVersion:
      name: X-App-Version
      in: header
      required: false
      description: |
        Versi aplikasi Flutter (semver), dikirim di setiap request oleh klien mobile. Mutasi dari versi di bawah
        `min_app_version` platform tersebut ditolak 426 UPGRADE_REQUIRED (PRD 4.5).
      schema:
        type: string
        pattern: ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$
        examples:
          - 1.0.0
    AuditAction:
      name: action
      in: query
      required: false
      description: Nama tindakan persis, misalnya payment.approved.
      schema:
        type: string
        minLength: 1
        maxLength: 100
    AuditActorAdminId:
      name: actor_admin_id
      in: query
      required: false
      description: Identitas admin pelaku (admins.id).
      schema:
        type: string
        format: uuid
    AuditActorQuery:
      name: actor_q
      in: query
      required: false
      description: Bagian nama tampilan admin atau nama lengkap alumni pelaku.
      schema:
        type: string
        minLength: 2
        maxLength: 100
    AuditActorUserId:
      name: actor_user_id
      in: query
      required: false
      description: Akun pelaku (users.id), alumni maupun akun login admin.
      schema:
        type: string
        format: uuid
    AuditEffectiveRoleFilter:
      name: effective_role
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/AuditEffectiveRole"
    AuditEntityId:
      name: entity_id
      in: query
      required: false
      description: Id entitas persis (biasanya UUID).
      schema:
        type: string
        minLength: 1
        maxLength: 100
    AuditEntityType:
      name: entity_type
      in: query
      required: false
      description: Jenis entitas persis, misalnya payment, alumni, admin, event.
      schema:
        type: string
        minLength: 1
        maxLength: 64
    AuditEntryId:
      name: entryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AuditExportId:
      name: exportId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AuditFrom:
      name: from
      in: query
      required: false
      description: Batas bawah created_at (inklusif, UTC).
      schema:
        type: string
        format: date-time
    AuditRequestId:
      name: request_id
      in: query
      required: false
      description: Penghubung log API/worker (N-14).
      schema:
        type: string
        minLength: 1
        maxLength: 100
    AuditTo:
      name: to
      in: query
      required: false
      description: Batas atas created_at (eksklusif, UTC).
      schema:
        type: string
        format: date-time
    BlockedUserId:
      name: userId
      in: path
      required: true
      description: user_id akun alumni yang diblokir.
      schema:
        type: string
        format: uuid
    ChatEmoji:
      name: emoji
      in: path
      required: true
      description: Satu emoji (grapheme Unicode), dikodekan persen di URL; maksimal 16 karakter.
      schema:
        type: string
        minLength: 1
        maxLength: 16
    ChatMemberUserId:
      name: userId
      in: path
      required: true
      description: user_id anggota room.
      schema:
        type: string
        format: uuid
    ChatMessageId:
      name: messageId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ChatRoomId:
      name: roomId
      in: path
      required: true
      description: ID room; bukan izin akses, keanggotaan selalu diperiksa (AC F11-4).
      schema:
        type: string
        format: uuid
    ContentBannerId:
      name: bannerId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ContentCategoryId:
      name: categoryId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ContentPageId:
      name: pageId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ContentPostId:
      name: postId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      required: false
      description: Cursor opaque dari `next_cursor` halaman sebelumnya. Kosongkan untuk halaman pertama.
      schema:
        type: string
        maxLength: 512
    EventId:
      name: eventId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FileContentToken:
      name: token
      in: path
      required: true
      description: Token URL bertanda tangan (JWT HS256 kompak; bukan access token sesi).
      schema:
        type: string
        minLength: 16
        maxLength: 1024
        pattern: ^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$
    FileId:
      name: fileId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        UUID dari klien; disimpan lokal sampai hasil diketahui (PRD 4.3). Permintaan ulang dengan key dan payload
        sama mengembalikan hasil pertama; payload berbeda dengan key sama menghasilkan 409 IDEMPOTENCY_CONFLICT.
        Retensi 24 jam.
      schema:
        type: string
        format: uuid
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: |
        Versi objek yang dibaca klien (`version`). Versi berbeda menghasilkan 409 VERSION_CONFLICT dengan
        `current` berisi keadaan terbaru (AC F15-4).
      schema:
        type: string
        maxLength: 64
    Limit:
      name: limit
      in: query
      required: false
      description: Jumlah item per halaman (bawaan 30, maksimum 100).
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 30
    MasterKindPath:
      name: kind
      in: path
      required: true
      description: Jenis master terkontrol (professions atau skills).
      schema:
        $ref: "#/components/schemas/MasterKind"
    ModerationReportId:
      name: reportId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    NetworkUserId:
      name: userId
      in: path
      required: true
      description: user_id akun alumni yang dibuka profilnya.
      schema:
        type: string
        format: uuid
    NotificationId:
      name: notificationId
      in: path
      required: true
      description: Id notifikasi (UUID v7), misalnya dari payload data push.
      schema:
        type: string
        format: uuid
    PaymentId:
      name: paymentId
      in: path
      required: true
      description: ID payment (UUID v7).
      schema:
        type: string
        format: uuid
    PaymentMethodId:
      name: methodId
      in: path
      required: true
      description: ID metode bayar (UUID v7).
      schema:
        type: string
        format: uuid
    PostSlug:
      name: slug
      in: path
      required: true
      description: Slug berita (huruf kecil, angka, tanda hubung).
      schema:
        type: string
        maxLength: 160
    ReauthToken:
      name: X-Reauth-Token
      in: header
      required: true
      description: |
        Token dari POST /auth/reauth (audience kapdh-reauth, terikat sesi, berlaku maksimal 10 menit) untuk tindakan
        kredensial (ARCHITECTURE §4.3, ADR-025). Tidak ada atau kedaluwarsa menghasilkan 403 REAUTH_REQUIRED.
      schema:
        type: string
        maxLength: 2048
    ReauthTokenConditional:
      name: X-Reauth-Token
      in: header
      required: false
      description: |
        Token dari POST /auth/reauth (audience kapdh-reauth, terikat sesi, berlaku maksimal 10 menit) yang wajib HANYA
        bila permintaan memuat perubahan kredensial yang disebut deskripsi operasi, misalnya koreksi email login admin
        (reautentikasi bersyarat, ADR-025). Perubahan itu tanpa token yang sah menghasilkan 403 REAUTH_REQUIRED;
        perubahan lain pada operasi yang sama tidak memerlukannya, dan token yang tidak sah tidak menolak perubahan
        lain tersebut.
      schema:
        type: string
        maxLength: 2048
    SessionId:
      name: sessionId
      in: path
      required: true
      description: Identitas keluarga sesi dari `Session.id` (GET /auth/sessions).
      schema:
        type: string
        format: uuid
    TicketId:
      name: ticketId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    AccountSuspended:
      description: ACCOUNT_SUSPENDED; anggota dibatasi pengurus dan hanya dapat membuka portal pembatasan (PRD 2.2, 4.2).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    AdminAdminsConflict:
      description: |
        VERSION_CONFLICT bila If-Match usang (`current` = AdminAccountDetail terbaru, AC F15-4);
        VALIDATION_ERROR (409) dengan field_errors bila email login sudah dipakai identitas admin lain
        (users_kind_email_key) pada undangan, koreksi email atau pemulihan; alumni sudah tertaut ke identitas
        admin (admins_linked_alumni_user_id_key); Super Admin aktif terakhir akan diturunkan/dinonaktifkan/
        dipulihkan (AC F16-2); transisi status/undangan/pemulihan tidak diizinkan; email diubah lewat PATCH pada
        admin `active` atau `disabled` yang pernah aktif; penghapusan identitas yang pernah aktif; atau Super Admin
        memulihkan dirinya sendiri. IDEMPOTENCY_CONFLICT bila Idempotency-Key dipakai dengan payload berbeda.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    AdminAdminsForbidden:
      description: |
        FORBIDDEN tanpa izin admins.manage (hanya Super Admin, PRD 2.3), bila token bukan audience admin, atau bila
        identitas admin pemanggil tidak `active`; MFA_REQUIRED bila sesi admin belum menyelesaikan TOTP (AC F02-2).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    AdminAdminsSensitiveForbidden:
      description: |
        FORBIDDEN tanpa izin admins.manage (hanya Super Admin), bila token bukan audience admin, atau bila
        identitas admin pemanggil tidak `active`; MFA_REQUIRED bila sesi belum TOTP; REAUTH_REQUIRED bila
        X-Reauth-Token tidak ada/kedaluwarsa (lebih dari 10 menit). Hanya untuk tindakan kredensial: kirim ulang
        undangan, pemulihan, dan koreksi email login lewat PATCH (bersyarat) (PRD 2.3, AC F16-1, ADR-025).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    AdminAuditForbidden:
      description: |
        FORBIDDEN tanpa izin yang dibutuhkan (audit.read; ekspor juga audit.export) walaupun URL/id diketahui
        (AC F17-2), bila token bukan audience admin, atau bila identitas admin pemanggil tidak `active`;
        MFA_REQUIRED bila sesi admin belum menyelesaikan TOTP (AC F02-2).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    AdminNotificationsForbidden:
      description: |
        FORBIDDEN tanpa izin notifications.manage (AC F15-1), bila token bukan audience admin (misalnya token
        aplikasi alumni), atau bila identitas admin tidak `active`; MFA_REQUIRED bila sesi admin belum
        menyelesaikan TOTP (AC F02-2).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    AdminSessionForbidden:
      description: |
        Untuk operasi admin tanpa izin khusus (dasbor, lencana, katalog izin): FORBIDDEN bila token bukan audience
        admin (misalnya token aplikasi alumni) atau identitas admin tidak `active` (invited/disabled);
        MFA_REQUIRED bila sesi admin belum menyelesaikan TOTP (AC F02-2). Pada dasbor dan lencana, kekurangan izin
        per bagian tidak pernah menghasilkan 403; bagiannya dihilangkan (AC F15-1).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: |
        Konflik versi atau keadaan (VERSION_CONFLICT, PAYMENT_STATE_CONFLICT, PROOF_VERSION_CONFLICT,
        IDEMPOTENCY_CONFLICT); `current` berisi keadaan terbaru, UI menawarkan muat ulang (PRD 4.5).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Error:
      description: Galat baku (PRD 5.2). Lihat `code` untuk perilaku UI.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    FileInvalid:
      description: FILE_INVALID; tipe, ukuran atau isi berkas ditolak (N-10).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: FORBIDDEN, MEMBERSHIP_REQUIRED, atau ACCOUNT_SUSPENDED (izin atau status keanggotaan, PRD 2.2/2.3).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Maintenance:
      description: |
        MAINTENANCE; mutasi ditolak selama pemeliharaan terjadwal, baca tetap terkendali (PRD 4.5). Pesan dan
        perkiraan selesai tersedia di GET /public/config.
      headers:
        Retry-After:
          description: Perkiraan detik sampai layanan kembali, bila diketahui.
          schema:
            type: integer
            minimum: 0
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    MembershipRequired:
      description: |
        MEMBERSHIP_REQUIRED; fitur hanya untuk effective_status tertentu (PRD 2.2). Klien memuat ulang /me lalu
        mengarahkan sesuai status (onboarding untuk unverified, perpanjangan untuk expired).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    MfaRequired:
      description: MFA_REQUIRED; sesi admin belum menyelesaikan TOTP (AC F02-2).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: NOT_FOUND; objek tidak ada atau tidak berhak dilihat (tidak membedakan keduanya, N-09).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: RATE_LIMITED; lihat `retry_after_seconds` dan header Retry-After.
      headers:
        Retry-After:
          description: Detik sampai permintaan boleh diulang.
          schema:
            type: integer
            minimum: 0
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ReauthRequired:
      description: REAUTH_REQUIRED; header X-Reauth-Token tidak ada, tidak valid atau lebih dari 10 menit (tindakan kredensial, ADR-025).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthenticated:
      description: UNAUTHENTICATED; token tidak ada, kedaluwarsa atau sesi dicabut. Klien mobile mencoba refresh sekali.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UpgradeRequired:
      description: UPGRADE_REQUIRED; versi aplikasi di bawah minimum, klien menampilkan layar wajib update (PRD 4.5).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationError:
      description: VALIDATION_ERROR dengan `field_errors` per field (kunci bertitik, `_` untuk akar).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    AccountDeletion:
      type: object
      description: Status permintaan penghapusan akun tanpa data pribadi (AC F14-1).
      required:
        - request_number
        - status
        - source
        - requested_at
        - estimated_completion_at
        - completed_at
      properties:
        request_number:
          type: string
          pattern: ^DEL-[0-9]{4}-[0-9A-Z]{4,}$
          examples:
            - DEL-2026-7K3Q9X
          description: Nomor permintaan yang ditampilkan kepada pengguna dan dipakai dalam komunikasi bantuan.
        status:
          $ref: "#/components/schemas/AccountDeletionStatus"
        source:
          $ref: "#/components/schemas/AccountDeletionSource"
        requested_at:
          type: string
          format: date-time
        estimated_completion_at:
          type: string
          format: date-time
          description: Batas penyelesaian otomatis, maksimal 7 hari kalender sejak permintaan (F-14).
        completed_at:
          type:
            - string
            - "null"
          format: date-time
    AccountDeletionDataCategory:
      type: string
      enum:
        - credentials
        - profile
        - contacts
        - avatar
        - private_uploads
        - payment_proofs
        - chat_content
        - device_tokens
        - sessions
        - notifications
        - preferences
      description: |
        Kategori data yang dihapus atau menjadi placeholder tanpa isi (AC F14-3, D2): kredensial, profil, kontak,
        avatar, unggahan pribadi, file bukti transfer, isi chat buatan pengguna, token perangkat, sesi, kotak masuk
        notifikasi, dan preferensi.
    AccountDeletionDataItem:
      type: object
      required:
        - category
        - description
      properties:
        category:
          $ref: "#/components/schemas/AccountDeletionDataCategory"
        description:
          type: string
          description: Penjelasan singkat Bahasa Indonesia untuk ditampilkan.
    AccountDeletionDisclosure:
      type: object
      description: |
        Pengungkapan wajib sebelum konfirmasi penghapusan (N-15, D2, F-14) beserta peringatan pribadi pemilik akun.
        Hanya untuk pemilik akun (sesi sendiri atau challenge email terverifikasi).
      required:
        - version
        - estimated_completion_days
        - backup_retention_days
        - deleted_data
        - retained_data
        - privacy_policy_slug
        - privacy_policy_version
        - active_tickets
        - pending_refunds
        - open_payments
        - sole_admin_group_count
        - linked_admin_identity
      properties:
        version:
          type: string
          maxLength: 128
          description: |
            Versi opaque dari isi pengungkapan dan peringatan pribadi (termasuk active_tickets, pending_refunds,
            open_payments dan status suspend pemilik); berubah bila tiket/refund/pembayaran/kebijakan berubah.
            Dikirim kembali sebagai `acknowledged_disclosure_version`.
        estimated_completion_days:
          type: integer
          minimum: 1
          examples:
            - 7
          description: Penyelesaian otomatis maksimal 7 hari kalender lalu pemberitahuan email (F-14).
        backup_retention_days:
          type: integer
          minimum: 0
          examples:
            - 30
          description: Backup harian berotasi 30 hari; deletion ledger diterapkan ulang saat restore (D2, AC F14-6).
        deleted_data:
          type: array
          items:
            $ref: "#/components/schemas/AccountDeletionDataItem"
        retained_data:
          type: array
          items:
            $ref: "#/components/schemas/AccountDeletionRetainedItem"
        privacy_policy_slug:
          type: string
          examples:
            - kebijakan-privasi
          description: Slug halaman kebijakan privasi (GET /public/pages/{slug}).
        privacy_policy_version:
          type:
            - string
            - "null"
          description: Versi terbit kebijakan privasi yang menjadi dasar pengungkapan; null bila belum terbit.
        active_tickets:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/AccountDeletionTicketWarning"
        pending_refunds:
          type: array
          maxItems: 100
          description: Refund yang belum ditransfer bendahara (PRD 4.4, D6).
          items:
            $ref: "#/components/schemas/AccountDeletionRefundWarning"
        open_payments:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/AccountDeletionPaymentWarning"
        sole_admin_group_count:
          type: integer
          minimum: 0
          description: |
            Jumlah grup chat yang admin tunggalnya pengguna; kewenangan dialihkan ke anggota aktif atau grup ditutup
            otomatis tanpa menunggu respons anggota lain (AC F14-5).
        linked_admin_identity:
          type: boolean
          description: |
            True bila akun alumni ini ditautkan ke identitas pengurus. Identitas admin tidak ikut terhapus; pengalihan
            kewenangan pengurus dilakukan Super Admin (PRD 3.14).
    AccountDeletionPaymentType:
      type: string
      enum:
        - registration
        - renewal
        - ticket
      description: Jenis pembayaran yang masih terbuka (PRD 3.3).
    AccountDeletionPaymentWarning:
      type: object
      description: |
        Pembayaran `pending` milik pengguna. Saat penghapusan, yang belum berbukti (`proof_submitted` false)
        dibatalkan job; yang sudah berbukti tidak dibatalkan dan tetap diputus pengurus dalam bentuk anonim. Dana yang
        sudah ditransfer tidak otomatis dianggap dikembalikan; pengguna menghubungi bendahara sebelum menghapus
        (PRD 4.4).
      required:
        - payment_id
        - type
        - amount
        - proof_submitted
        - created_at
      properties:
        payment_id:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/AccountDeletionPaymentType"
        amount:
          $ref: "#/components/schemas/Money"
        proof_submitted:
          type: boolean
          description: True bila bukti transfer sudah diunggah (dana mungkin terkirim).
        created_at:
          type: string
          format: date-time
    AccountDeletionRefundPolicy:
      type: string
      enum:
        - full_refund
        - no_refund
        - case_by_case
        - payment_pending
      description: |
        Kebijakan refund D6 (PRD 3.9) yang berlaku untuk tiket bila pengguna bertindak SEBELUM menghapus akun;
        setelah akun dihapus tiket hangus. Dievaluasi berurutan:
        `payment_pending` tiket belum lunas (awaiting_payment/awaiting_review): pembayarannya ada di `open_payments`;
        tiket hangus, pembayaran tanpa bukti dibatalkan job, pembayaran berbukti tetap diputus pengurus dan dana yang
        sudah ditransfer diselesaikan lewat bendahara (PRD 4.4).
        `case_by_case` pemilik sedang disuspend: tiket tidak berlaku dan refund diputuskan pengurus per kasus (D6
        baris "Anggota disuspend"), termasuk bila event dibatalkan; anggota suspended tidak dapat membatalkan tiket
        sendiri.
        `full_refund` tiket berbayar lunas dan event dibatalkan pengurus, atau pembatalan sendiri masih sebelum
        `self_cancel_deadline_at` (H-3): ajukan pembatalan/refund lebih dahulu.
        `no_refund` tiket gratis, atau batas H-3 sudah lewat.
    AccountDeletionRefundWarning:
      type: object
      description: |
        Refund yang sudah dicatat (payment_adjustments kind `refund`, status `pending`) tetapi belum ditransfer
        bendahara, misalnya tiket yang dibatalkan sendiri sebelum H-3 atau event yang dibatalkan (D6, tenggat 7 hari
        kerja). Penghapusan akun tidak menganggap dana sudah dikembalikan (PRD 4.4); setelah akun dihapus bendahara
        tidak lagi dapat menghubungi pemilik dan data rekening tujuan ikut dihapus (D2), sehingga pengguna disarankan
        menunggu refund selesai.
      required:
        - adjustment_id
        - payment_id
        - payment_type
        - ticket_id
        - event_title
        - amount
        - due_at
        - destination_provided
        - created_at
      properties:
        adjustment_id:
          type: string
          format: uuid
        payment_id:
          type: string
          format: uuid
          description: Pembayaran asal (deep link `/payments/{paymentId}`).
        payment_type:
          $ref: "#/components/schemas/AccountDeletionPaymentType"
        ticket_id:
          type:
            - string
            - "null"
          format: uuid
          description: Tiket terkait bila refund berasal dari tiket event; null untuk iuran.
        event_title:
          type:
            - string
            - "null"
          maxLength: 200
        amount:
          $ref: "#/components/schemas/Money"
        due_at:
          type:
            - string
            - "null"
          format: date-time
          description: Tenggat bendahara (paling lambat 7 hari kerja sejak pembatalan, D6).
        destination_provided:
          type: boolean
          description: |
            True bila rekening tujuan refund sudah diberikan. Nilai rekening tidak pernah dikembalikan di sini
            (ARCHITECTURE §2 butir 3).
        created_at:
          type: string
          format: date-time
    AccountDeletionRequest:
      type: object
      description: Konfirmasi eksplisit penghapusan dari aplikasi (F-14).
      required:
        - confirm
        - acknowledged_disclosure_version
      properties:
        confirm:
          type: boolean
          const: true
          description: Konfirmasi eksplisit pengguna.
        acknowledged_disclosure_version:
          type: string
          minLength: 1
          maxLength: 128
          description: "`version` dari AccountDeletionDisclosure yang ditampilkan kepada pengguna."
    AccountDeletionRetainedCategory:
      type: string
      enum:
        - payments
        - tickets
        - membership_history
        - moderation_reports
        - audit_logs
      description: |
        Catatan yang tetap ada dalam bentuk anonim tanpa nama, email, telepon, foto atau snapshot identitas
        (AC F14-4, D2): jumlah, tanggal, status dan referensi transaksi minimum.
    AccountDeletionRetainedItem:
      type: object
      required:
        - category
        - description
      properties:
        category:
          $ref: "#/components/schemas/AccountDeletionRetainedCategory"
        description:
          type: string
          description: Apa yang tersisa dan mengapa, dalam Bahasa Indonesia.
    AccountDeletionSource:
      type: string
      enum:
        - app
        - web
      description: Kanal permintaan penghapusan (F-14).
    AccountDeletionStatus:
      type: string
      enum:
        - pending
        - processing
        - failed
        - completed
      description: |
        Tahap permintaan penghapusan (account_deletions.status). `failed` berarti langkah terakhir gagal dan akan
        dicoba ulang otomatis tanpa mengulang langkah yang selesai (AC F14-2, N-15); UI menampilkannya sebagai
        "Sedang diproses ulang".
    AccountDeletionTicketStatus:
      type: string
      enum:
        - awaiting_payment
        - awaiting_review
        - paid
      description: Status tiket aktif yang akan hangus saat akun dihapus (PRD 3.9, 4.4).
    AccountDeletionTicketWarning:
      type: object
      description: |
        Tiket aktif (status awaiting_payment, awaiting_review atau paid) pada event yang belum selesai, termasuk event
        yang dibatalkan dan belum diproses refund-nya. Akun dihapus -> tiket hangus; refund harus diajukan lebih
        dahulu (PRD 3.9, D6). Tiket yang sudah dibatalkan dan refund-nya sedang diproses tampil di `pending_refunds`.
      required:
        - ticket_id
        - event_id
        - event_title
        - event_starts_at
        - event_timezone
        - event_cancelled
        - status
        - total
        - refund_policy
        - self_cancel_deadline_at
      properties:
        ticket_id:
          type: string
          format: uuid
        event_id:
          type: string
          format: uuid
        event_title:
          type: string
          maxLength: 200
        event_starts_at:
          type: string
          format: date-time
        event_timezone:
          type: string
          examples:
            - Asia/Jakarta
          description: Zona tampilan event (PRD 2.1).
        event_cancelled:
          type: boolean
          description: Event dibatalkan pengurus (refund penuh, D6).
        status:
          $ref: "#/components/schemas/AccountDeletionTicketStatus"
        total:
          $ref: "#/components/schemas/Money"
        refund_policy:
          $ref: "#/components/schemas/AccountDeletionRefundPolicy"
        self_cancel_deadline_at:
          type:
            - string
            - "null"
          format: date-time
          description: Batas pembatalan sendiri dengan refund penuh (mulai event - 3 hari); null untuk event gratis.
    AccountStatus:
      type: string
      enum:
        - pending_otp
        - active
        - disabled
        - deletion_pending
        - deleted
      description: Status lapisan autentikasi `users.status` (PRD 4.2); berbeda dari EffectiveStatus.
    AdminAccount:
      type: object
      required:
        - id
        - display_name
        - email
        - role
        - status
        - permissions
        - linked_alumni
        - mfa_enrolled
        - last_login_at
        - created_at
        - invite_expires_at
        - activated_at
        - disabled_at
        - version
      properties:
        id:
          type: string
          format: uuid
          description: admins.id
        display_name:
          type: string
          maxLength: 120
        email:
          type: string
          format: email
          description: Email login identitas admin; boleh sama dengan email akun alumni tertaut karena identitasnya terpisah.
        role:
          $ref: "#/components/schemas/AdminRole"
        status:
          $ref: "#/components/schemas/AdminAccountStatus"
        permissions:
          type: array
          description: Izin efektif (super_admin = seluruh 15 izin; admin = izin yang ditugaskan), urutan katalog.
          items:
            $ref: "#/components/schemas/Permission"
        linked_alumni:
          oneOf:
            - $ref: "#/components/schemas/AdminLinkedAlumni"
            - type: "null"
        mfa_enrolled:
          type: boolean
          description: TOTP sudah diverifikasi (syarat aktivasi, PRD 3.16).
        last_login_at:
          type:
            - string
            - "null"
          format: date-time
        created_at:
          type: string
          format: date-time
          description: Waktu identitas admin dibuat (undangan atau bootstrap Super Admin pertama, PRD 8.2).
        invite_expires_at:
          type:
            - string
            - "null"
          format: date-time
          description: Batas token undangan aktif; null bila tidak ada undangan berjalan.
        activated_at:
          type:
            - string
            - "null"
          format: date-time
        disabled_at:
          type:
            - string
            - "null"
          format: date-time
        version:
          type: string
          description: Nilai untuk header If-Match.
    AdminAccountCounts:
      type: object
      required:
        - total
        - active
        - invited
        - disabled
      description: Ringkasan seluruh admin (tidak dipengaruhi filter).
      properties:
        total:
          type: integer
          minimum: 0
        active:
          type: integer
          minimum: 0
        invited:
          type: integer
          minimum: 0
        disabled:
          type: integer
          minimum: 0
    AdminAccountDetail:
      allOf:
        - $ref: "#/components/schemas/AdminAccount"
        - type: object
          required:
            - invited_by
            - permissions_version
            - active_session_count
            - updated_at
          properties:
            invited_by:
              oneOf:
                - $ref: "#/components/schemas/AdminActorRef"
                - type: "null"
            permissions_version:
              type: integer
              minimum: 1
              description: Naik setiap perubahan peran/izin/status (AC F16-3).
            active_session_count:
              type: integer
              minimum: 0
              description: Sesi admin yang belum dicabut/kedaluwarsa; dicabut semua saat dinonaktifkan.
            updated_at:
              type: string
              format: date-time
    AdminAccountPage:
      type: object
      required:
        - items
        - next_cursor
        - total
        - counts
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminAccount"
        next_cursor:
          type:
            - string
            - "null"
        total:
          type: integer
          minimum: 0
          description: Jumlah admin yang cocok dengan filter.
        counts:
          $ref: "#/components/schemas/AdminAccountCounts"
    AdminAccountSort:
      type: string
      enum:
        - display_name_asc
        - created_at_desc
        - last_login_at_desc
      default: display_name_asc
      description: Urutan daftar admin; bawaan display_name_asc.
    AdminAccountStatus:
      type: string
      enum:
        - invited
        - active
        - disabled
      description: |
        Siklus identitas admin (enum DB admin_status, F-16): `invited` (undangan terkirim, belum ganti sandi awal
        dan TOTP) -> `active` (setelah penerimaan undangan, domain admin-auth) -> `disabled` (dinonaktifkan Super
        Admin; sesi dicabut). `disabled` -> `active` hanya bila pernah aktif dan TOTP masih terverifikasi;
        `disabled` yang belum pernah aktif -> `invited` lewat kirim ulang undangan; `active` atau `disabled` yang
        pernah aktif -> `invited` lewat pemulihan (sandi dan MFA direset). Identitas yang belum pernah aktif
        (`invited` atau `disabled`) dapat dihapus permanen lewat DELETE /admin/admins/{adminId}. Label UI:
        Diundang, Aktif, Nonaktif.
    AdminAccountStatusChange:
      type: string
      enum:
        - active
        - disabled
      description: Status tujuan yang dapat diminta lewat PATCH; `invited` hanya lewat undangan/kirim ulang.
    AdminActorRef:
      type: object
      required:
        - admin_id
        - display_name
      description: Rujukan admin pelaku; display_name null bila identitas sudah dianonimkan (D2).
      properties:
        admin_id:
          type: string
          format: uuid
        display_name:
          type:
            - string
            - "null"
    AdminAdjustmentPaymentRef:
      type: object
      description: Ringkasan payment asal penyesuaian untuk tabel penyesuaian.
      required:
        - id
        - type
        - status
        - amount
        - member
        - event_title
        - decided_at
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/PaymentType"
        status:
          $ref: "#/components/schemas/PaymentStatus"
        amount:
          $ref: "#/components/schemas/Money"
        member:
          oneOf:
            - $ref: "#/components/schemas/AdminPaymentMember"
            - type: "null"
        event_title:
          type:
            - string
            - "null"
        decided_at:
          type:
            - string
            - "null"
          format: date-time
    AdminAppSettings:
      type: object
      description: Seluruh pengaturan aplikasi yang dikelola atau ditampilkan di web admin.
      required:
        - fees
        - min_app_version
        - maintenance
        - store_links
        - support
        - payment_instructions
        - membership
        - events
        - chat
      properties:
        fees:
          $ref: "#/components/schemas/FeeSettings"
        min_app_version:
          $ref: "#/components/schemas/AdminMinAppVersionSetting"
        maintenance:
          $ref: "#/components/schemas/AdminMaintenanceSetting"
        store_links:
          $ref: "#/components/schemas/AdminStoreLinksSetting"
        support:
          $ref: "#/components/schemas/AdminSupportSetting"
        payment_instructions:
          $ref: "#/components/schemas/AdminPaymentInstructionsSetting"
        membership:
          $ref: "#/components/schemas/AdminMembershipPolicy"
        events:
          $ref: "#/components/schemas/AdminEventsPolicy"
        chat:
          $ref: "#/components/schemas/AdminChatPolicy"
    AdminBackupCodes:
      type: object
      required:
        - backup_codes
        - generated_at
      properties:
        backup_codes:
          type: array
          minItems: 10
          maxItems: 10
          description: Backup code baru; kode lama tidak berlaku lagi. Hanya ditampilkan sekali.
          x-sensitive: true
          items:
            type: string
            examples:
              - 7KQ2-M9XD
        generated_at:
          type: string
          format: date-time
    AdminBanner:
      type: object
      required:
        - id
        - title
        - image
        - target
        - sort_order
        - starts_at
        - ends_at
        - active
        - state
        - version
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        image:
          $ref: "#/components/schemas/ContentImage"
        target:
          $ref: "#/components/schemas/AdminBannerTarget"
        sort_order:
          type: integer
          description: Urutan tampil naik.
        starts_at:
          type: string
          format: date-time
        ends_at:
          type:
            - string
            - "null"
          format: date-time
          description: Null = tanpa batas akhir.
        active:
          type: boolean
        state:
          $ref: "#/components/schemas/AdminBannerState"
        version:
          type: string
          description: Versi untuk If-Match (AC F15-4).
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AdminBannerCreateRequest:
      type: object
      required:
        - title
        - image_file_id
        - target_type
        - target_value
        - starts_at
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        image_file_id:
          type: string
          format: uuid
          description: Berkas purpose `banner_image` dari POST /admin/content/media.
        target_type:
          $ref: "#/components/schemas/BannerTargetType"
        target_value:
          type:
            - string
            - "null"
          maxLength: 2048
          description: Null untuk `none`; id berita/event (uuid); slug halaman; URL https untuk `url`.
        sort_order:
          type: integer
          minimum: 0
          maximum: 32767
          default: 0
        starts_at:
          type: string
          format: date-time
        ends_at:
          type:
            - string
            - "null"
          format: date-time
          description: Harus setelah starts_at; null = tanpa batas.
        active:
          type: boolean
          default: true
    AdminBannerPage:
      type: object
      required:
        - items
        - next_cursor
        - total
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminBanner"
        next_cursor:
          type:
            - string
            - "null"
        total:
          type: integer
          minimum: 0
    AdminBannerSort:
      type: string
      enum:
        - sort_order_asc
        - starts_at_desc
        - updated_at_desc
        - title_asc
      description: |
        Urutan tabel banner; bawaan `sort_order_asc` (urutan tampil Beranda: `sort_order` naik lalu `starts_at`
        turun). `starts_at_desc` mengikuti kolom "Tgl Publikasi".
    AdminBannerState:
      type: string
      enum:
        - inactive
        - scheduled
        - live
        - ended
      description: |
        Keadaan tayang turunan server: `inactive` (`active = false`), `scheduled` (`starts_at > now`), `live` (di
        dalam jendela dan aktif; tampil di Beranda), `ended` (`ends_at <= now`, tidak tampil, AC F08-2).
    AdminBannerTarget:
      type: object
      required:
        - type
        - value
        - available
        - label
        - route
        - category
      properties:
        type:
          $ref: "#/components/schemas/BannerTargetType"
        value:
          type:
            - string
            - "null"
          description: id berita/event, slug halaman, atau URL https; null untuk `none`.
        available:
          type: boolean
          description: Tujuan dapat dibuka anggota saat ini (AC F08-2); selalu true untuk `none` dan `url`.
        label:
          type:
            - string
            - "null"
          description: Judul berita/event/halaman tujuan untuk tabel pengurus; null bila tidak ada atau `none`/`url`.
        route:
          type:
            - string
            - "null"
          description: |
            Rute aplikasi yang akan dibuka anggota (`/news/{slug}`, `/events/{id}`, `/legal/{slug}`); null untuk
            `none`/`url` dan bila tujuan tidak tersedia (sama dengan `HomeBannerTarget.route`).
        category:
          description: |
            Kategori berita/event tujuan, untuk kolom "Kategori" tabel banner (guideline p13); banner tidak memiliki
            kategori sendiri di R1.0. Null untuk `none`, `page`, `url`, tujuan yang sudah dihapus, atau tujuan tanpa
            kategori. Label historis tetap dikirim walau kategori nonaktif.
          oneOf:
            - $ref: "#/components/schemas/ContentCategoryRef"
            - type: "null"
    AdminBannerUpdateRequest:
      type: object
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        image_file_id:
          type: string
          format: uuid
        target_type:
          $ref: "#/components/schemas/BannerTargetType"
        target_value:
          type:
            - string
            - "null"
          maxLength: 2048
          description: Wajib dikirim bersama target_type.
        sort_order:
          type: integer
          minimum: 0
          maximum: 32767
        starts_at:
          type: string
          format: date-time
        ends_at:
          type:
            - string
            - "null"
          format: date-time
        active:
          type: boolean
    AdminCancelPaymentRequest:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 500
          pattern: \S
          description: Alasan pembatalan; terlihat oleh pemilik payment dan tercatat di histori serta audit.
    AdminCandidate:
      type: object
      required:
        - user_id
        - full_name
        - member_number
        - email
        - profession
        - avatar_url
        - effective_status
        - eligible
        - ineligible_reason
      properties:
        user_id:
          type: string
          format: uuid
        full_name:
          type: string
        member_number:
          type:
            - string
            - "null"
          examples:
            - 06.02.01.92
        email:
          type: string
          format: email
          description: Email akun alumni (untuk Super Admin saja).
        profession:
          type:
            - string
            - "null"
          description: Label profesi, misalnya Wiraswasta.
        avatar_url:
          type:
            - string
            - "null"
          format: uri
        effective_status:
          $ref: "#/components/schemas/EffectiveStatus"
        eligible:
          type: boolean
        ineligible_reason:
          oneOf:
            - $ref: "#/components/schemas/AdminCandidateIneligibleReason"
            - type: "null"
    AdminCandidateIneligibleReason:
      type: string
      enum:
        - already_admin
        - account_inactive
        - suspended
      description: |
        Alasan alumni tidak dapat didelegasikan: `already_admin` sudah tertaut ke identitas admin yang masih ada
        (status apa pun; bebas kembali setelah identitas yang belum pernah aktif dihapus lewat DELETE
        /admin/admins/{adminId}), `account_inactive` akun belum terverifikasi atau dinonaktifkan, `suspended`
        sedang dibatasi pengurus.
    AdminCandidatePage:
      type: object
      required:
        - items
        - next_cursor
        - total
      properties:
        items:
          type: array
          items:
