    AdminEventUpdateRequest:
      type: object
      minProperties: 1
      description: Hanya field yang dikirim yang berubah (PATCH); aturan validasi sama dengan pembuatan.
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type:
            - string
            - "null"
          maxLength: 5000
        category_id:
          type:
            - string
            - "null"
          format: uuid
        location_name:
          type:
            - string
            - "null"
          maxLength: 200
        location_address:
          type:
            - string
            - "null"
          maxLength: 500
        location_url:
          type:
            - string
            - "null"
          format: uri
          pattern: ^https://
          maxLength: 500
        cover_file_id:
          type:
            - string
            - "null"
          format: uuid
          description: Berkas purpose event_cover hasil POST /admin/event-covers; null menghapus cover.
        timezone:
          type: string
          maxLength: 64
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        registration_opens_at:
          type: string
          format: date-time
        registration_closes_at:
          type: string
          format: date-time
        checkin_opens_at:
          type:
            - string
            - "null"
          format: date-time
        checkin_closes_at:
          type:
            - string
            - "null"
          format: date-time
        price:
          $ref: "#/components/schemas/Money"
        seats_total:
          type: integer
          minimum: 1
          maximum: 100000
          description: Tidak boleh di bawah held_quantity + paid_quantity (AC F15-2).
    AdminEventsPolicy:
      description: Kebijakan event dan tiket (app_settings `events`, D5, D6); baca-saja.
      allOf:
        - $ref: "#/components/schemas/AdminSettingMeta"
        - type: object
          required:
            - hold_hours
            - checkin_before_hours
            - self_cancel_days
            - review_escalation_business_days
          properties:
            hold_hours:
              type: integer
              description: Lama hold reservasi tanpa bukti (24 jam).
            checkin_before_hours:
              type: integer
              description: Check-in dibuka sebelum acara (2 jam).
            self_cancel_days:
              type: integer
              description: Batas batal mandiri dengan refund penuh (H-3).
            review_escalation_business_days:
              type: integer
              description: Eskalasi antrean bukti tiket (2 hari kerja).
    AdminInfoPage:
      allOf:
        - $ref: "#/components/schemas/AdminInfoPageSummary"
        - type: object
          required:
            - body_html
            - published
            - slug_locked
            - created_at
          properties:
            body_html:
              type: string
              description: Draf kerja yang sudah disanitasi server.
            published:
              oneOf:
                - $ref: "#/components/schemas/AdminInfoPagePublished"
                - type: "null"
            slug_locked:
              type: boolean
              description: True untuk halaman baku atau halaman yang pernah terbit.
            created_at:
              type: string
              format: date-time
    AdminInfoPageCreateRequest:
      type: object
      required:
        - slug
        - title
        - body_html
      properties:
        slug:
          type: string
          minLength: 1
          maxLength: 120
          pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
        title:
          type: string
          minLength: 1
          maxLength: 200
        body_html:
          type: string
          minLength: 1
          maxLength: 200000
          description: |
            Disanitasi server (PRD 3.8). Hasil sanitasi juga maksimal 200.000 karakter agar teks tayang selalu
            tercatat utuh di audit `page.published` (F-01); lebih dari itu -> 400 `field_errors.body_html`.
    AdminInfoPageList:
      type: object
      description: Daftar halaman admin ({items, next_cursor, total}); nama tidak memakai akhiran Page agar tidak rancu.
      required:
        - items
        - next_cursor
        - total
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminInfoPageSummary"
        next_cursor:
          type:
            - string
            - "null"
        total:
          type: integer
          minimum: 0
    AdminInfoPagePublishRequest:
      type: object
      properties:
        change_note:
          type:
            - string
            - "null"
          maxLength: 500
          description: Ringkasan perubahan untuk audit `page.published` (F-17); tidak ditampilkan publik.
    AdminInfoPagePublished:
      type: object
      description: Salinan TAYANG halaman (yang dibaca publik dan disetujui pengguna, PRD 6.2).
      required:
        - title
        - body_html
        - version
        - published_at
      properties:
        title:
          type: string
        body_html:
          type: string
        version:
          type: string
          description: Versi legal tayang (published_version), mulai 1.
        published_at:
          type: string
          format: date-time
    AdminInfoPageSort:
      type: string
      enum:
        - system_first
        - title_asc
        - updated_at_desc
        - published_at_desc
      description: |
        Urutan tabel halaman; bawaan `system_first` (halaman baku menurut urutan seed, lalu judul).
        `published_at_desc` menempatkan halaman yang belum pernah terbit di akhir.
    AdminInfoPageSummary:
      type: object
      required:
        - id
        - slug
        - title
        - legal_document
        - system
        - published_version
        - published_at
        - has_unpublished_changes
        - version
        - updated_at
        - updated_by
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        title:
          type: string
          description: Judul draf kerja.
        legal_document:
          oneOf:
            - $ref: "#/components/schemas/PageLegalDocument"
            - type: "null"
        system:
          type: boolean
          description: Halaman baku dari seed referensi (PRD 8.2); tidak dapat dihapus dan slug terkunci.
        published_version:
          type:
            - string
            - "null"
          description: Versi tayang; null bila belum pernah terbit.
        published_at:
          type:
            - string
            - "null"
          format: date-time
        has_unpublished_changes:
          type: boolean
          description: Draf berbeda dari salinan tayang (atau belum pernah terbit).
        version:
          type: string
          description: Versi draf untuk If-Match (AC F15-4); berbeda dari versi legal.
        updated_at:
          type: string
          format: date-time
        updated_by:
          oneOf:
            - $ref: "#/components/schemas/AdminContentActor"
            - type: "null"
    AdminInfoPageUpdateRequest:
      type: object
      minProperties: 1
      properties:
        slug:
          type: string
          minLength: 1
          maxLength: 120
          pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
          description: Hanya bila `slug_locked = false`.
        title:
          type: string
          minLength: 1
          maxLength: 200
        body_html:
          type: string
          minLength: 1
          maxLength: 200000
          description: Aturan sama dengan AdminInfoPageCreateRequest.body_html (hasil sanitasi maksimal 200.000 karakter).
    AdminInvitationAcceptRequest:
      type: object
      required:
        - invite_token
        - password
      properties:
        invite_token:
          type: string
          minLength: 16
          maxLength: 512
          x-sensitive: true
          description: Nilai `t` dari fragmen tautan `/invite#t=<token>`; tidak pernah dari path atau query.
        password:
          $ref: "#/components/schemas/Password"
    AdminInvitationPreview:
      type: object
      description: Ringkasan undangan untuk halaman /invite (F-16); email disamarkan bila token bocor.
      required:
        - email_masked
        - display_name
        - role
        - permissions
        - invited_by_display_name
        - expires_at
      properties:
        email_masked:
          type: string
          maxLength: 254
          examples:
            - fi***@kapdh.test
        display_name:
          type: string
          maxLength: 120
        role:
          $ref: "#/components/schemas/AdminRole"
        permissions:
          type: array
          description: Izin yang akan berlaku setelah aktivasi; super_admin seluruh izin.
          items:
            $ref: "#/components/schemas/Permission"
        invited_by_display_name:
          type:
            - string
            - "null"
          maxLength: 120
          description: Nama Super Admin pengundang; null untuk bootstrap CLI (PRD 8.2).
        expires_at:
          type: string
          format: date-time
    AdminInvitationResult:
      type: object
      required:
        - admin
        - invitation_expires_at
        - invitation_sent_at
      properties:
        admin:
          $ref: "#/components/schemas/AdminAccountDetail"
        invitation_expires_at:
          type: string
          format: date-time
          description: Batas token undangan (masa berlaku dari konfigurasi server, usulan 72 jam).
        invitation_sent_at:
          type: string
          format: date-time
          description: Waktu email undangan dijadwalkan di outbox (bukan bukti terkirim).
    AdminInvitationTokenRequest:
      type: object
      required:
        - invite_token
      properties:
        invite_token:
          type: string
          minLength: 16
          maxLength: 512
          x-sensitive: true
          description: Nilai `t` dari fragmen tautan `/invite#t=<token>`; tidak pernah dari path atau query.
    AdminInviteRequest:
      type: object
      required:
        - role
        - permissions
      description: |
        Isi `alumni_user_id` (delegasi alumni), atau `email` + `display_name` (admin tanpa tautan alumni).
      properties:
        alumni_user_id:
          type: string
          format: uuid
          description: Akun alumni yang ditautkan (dari GET /admin/admins/candidates).
        email:
          type: string
          format: email
          maxLength: 254
          description: Email login admin; bawaan email akun alumni bila alumni_user_id diisi. Dinormalisasi server.
        display_name:
          type: string
          minLength: 1
          maxLength: 120
          description: Nama tampilan; bawaan nama lengkap alumni bila alumni_user_id diisi.
        role:
          $ref: "#/components/schemas/AdminRole"
        permissions:
          type: array
          maxItems: 15
          uniqueItems: true
          description: Izin untuk peran admin; wajib kosong untuk super_admin.
          items:
            $ref: "#/components/schemas/Permission"
    AdminLinkedAlumni:
      type: object
      required:
        - user_id
        - full_name
        - member_number
        - avatar_url
      description: Akun alumni yang tertaut untuk pemeriksaan konflik kepentingan (PRD 2.3); chip "USER" di UI.
      properties:
        user_id:
          type: string
          format: uuid
        full_name:
          type: string
        member_number:
          type:
            - string
            - "null"
          description: Nomor anggota AA.SS.JK.N; null bila belum teraktivasi.
          examples:
            - 09.02.01.91
        avatar_url:
          type:
            - string
            - "null"
          format: uri
          description: |
            Foto profil alumni tertaut untuk kolom avatar tabel "Daftar Admin" (guideline hlm. 15), sama dengan
            AdminCandidate.avatar_url; null bila tidak ada foto. UI memakai inisial dari `display_name` admin
            bila null atau admin tanpa tautan alumni.
    AdminLoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 128
    AdminLoginResponse:
      type: object
      description: |
        Tantangan MFA admin setelah tahap sandi (POST /admin/auth/login) atau penerimaan undangan
        (POST /admin/auth/invitations/accept), AC F02-2. Dua jenis token tidak dapat dipertukarkan.
      required:
        - mfa_token
        - mfa_expires_at
        - totp_enrollment_required
      properties:
        mfa_token:
          type: string
          x-sensitive: true
          description: |
            Bila totp_enrollment_required=false (login): token audience kapdh-admin-mfa 5 menit, hanya untuk
            POST /admin/auth/mfa. Bila true (penerimaan undangan): token pendaftaran audience kapdh-admin-enroll
            30 menit, hanya untuk /admin/auth/totp/enroll dan /confirm. Keduanya ditolak 403 MFA_REQUIRED di API admin.
        mfa_expires_at:
          type: string
          format: date-time
        totp_enrollment_required:
          type: boolean
          description: |
            Selalu false dari login (login hanya untuk admin dengan TOTP terverifikasi) dan selalu true dari
            penerimaan undangan: lanjut ke /login/enroll dan selesaikan sebelum `mfa_expires_at` (F-16, PRD 8.2).
