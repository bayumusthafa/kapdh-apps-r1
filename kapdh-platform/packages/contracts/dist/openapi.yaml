  /admin/members/{userId}:
    get:
      tags:
        - Admin Members
      operationId: adminGetMember
      summary: Detail administratif anggota, termasuk kontak terlepas dari flag privasi (F-10, F-15).
      description: |
        Memuat identitas, kontak dan tautan sosial terlepas dari flag privasi (pengurus berizin tetap dapat
        mengakses data untuk tujuan administratif yang tercatat, F-10); setiap pembukaan detail dicatat di audit
        (`member.viewed`, tanpa salinan data). Juga memuat periode keanggotaan, status suspend, keterkaitan
        dengan akun admin, ringkasan tiket, serta ringkasan pembayaran dan moderasi. Histori lengkap ada di
        GET /admin/members/{userId}/membership-events. `version` dipakai sebagai If-Match untuk perubahan.
        Akun bukan alumni atau sudah terhapus -> 404.

        Penyaringan per izin (PRD 2.3, AC F15-1: admin hanya melihat data area izinnya), dievaluasi dari DB setiap
        request dan berlaku sama untuk respons 200 operasi lain yang mengembalikan AdminMemberDetail maupun
        `current` pada 409 VERSION_CONFLICT:
        - tanpa payments.read: `recent_payments` null;
        - tanpa events.manage DAN tanpa payments.read: `recent_tickets` null. Tiket memuat partisipasi event dan
          informasi pembayaran tiket (`total`, status awaiting_payment/awaiting_review/paid) yang hanya dibuka
          kepada pengelola event (daftar peserta, adminListEventTickets) atau pembaca pembayaran (antrean
          pembayaran tiket); events.checkin saja tidak cukup;
        - tanpa moderation.read: `moderation` null dan `suspension.reason` (alasan internal moderasi) null dengan
          `suspension.reason_redacted` true. `suspended_at`, `suspended_by` dan `member_message` (pesan yang
          memang ditampilkan ke anggota) tetap dikirim karena status suspend menentukan status keanggotaan.
        super_admin memiliki semua izin sehingga menerima detail utuh.
      x-kapdh-access:
        audience: admin
        permissions:
          - members.read
      parameters:
        - $ref: "#/components/parameters/AdminMemberUserId"
      responses:
        "200":
          description: Detail anggota.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMemberDetail"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
    patch:
      tags:
        - Admin Members
      operationId: adminUpdateMember
      summary: Ubah data administratif dan koreksi identitas anggota; nomor dihitung ulang dengan N tetap (AC F05-6).
      description: |
        Izin members.manage (PRD 2.3). Alasan wajib dan tercatat di audit bersama before/after tersaring
        (AC F17-1). Field yang tidak dikirim tidak berubah. `member_number` dan field lain di luar skema DITOLAK
        400 VALIDATION_ERROR (AC F05-6: nomor tidak pernah dari klien). Email tidak dapat diubah di sini (alur
        koreksi email terverifikasi, F-01); privasi tetap pilihan anggota.

        Koreksi identitas (full_name, gender, cohort, class_in, class_out): bila prefix AA.SS.JK berubah, server
        menghitung ulang nomor dari data tersimpan dan mempertahankan N dalam SATU UPDATE bersama segmen
        pembentuknya (constraint alumni_member_number_chk), mencatat membership_event `number_correction`
        dengan nomor lama dan baru, audit `member.number_corrected`, menerbitkan ulang QR (QR lama menjadi
        "perlu diperbarui"), dan memberi notifikasi kategori membership ke anggota (rute /kta), semuanya dalam
        satu transaksi (AC F05-6, F17-1). Contoh: 12.02.01.7 dengan kelas keluar dikoreksi menjadi 6 menjadi
        12.01.01.7. Kelas keluar tidak boleh lebih rendah dari kelas masuk (400).

        `professions`, `education`, `social_links` dan skill_ids mengikuti aturan yang sama dengan PATCH /me/profile
        (daftar pengganti, master aktif AC F10-4, SocialHandle: nama pengguna atau URL https, skema lain 400),
        termasuk aturan transisi field lama (profession_id, last_education_*, social_*) dan penolakan field lama
        bersama penggantinya. Audit tidak menyalin isi profesi/pendidikan/tautan (hanya nama field yang berubah).
        `remove_avatar` menghapus foto yang tidak pantas (berkas dilepas dan dibersihkan job). Akun deletion_pending tidak dapat diubah (400). Admin tidak dapat mengubah akun alumni yang tertaut
        ke identitas adminnya sendiri (admins.linked_alumni_user_id; konflik kepentingan, PRD 2.3) -> 403
        FORBIDDEN. Versi berbeda dari If-Match -> 409 VERSION_CONFLICT dengan `current` berbentuk
        AdminMemberDetail yang disaring per izin seperti GET detail (AC F15-4, F15-1).
      x-kapdh-access:
        audience: admin
        permissions:
          - members.read
          - members.manage
      parameters:
        - $ref: "#/components/parameters/AdminMemberUserId"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminMemberUpdate"
      responses:
        "200":
          description: Detail anggota terbaru (nomor baru bila prefix berubah) dengan version baru.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMemberDetail"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"
  /admin/members/{userId}/suspend:
    post:
      tags:
        - Admin Members
      operationId: adminSuspendMember
      summary: Batasi (suspend) anggota dari halaman anggota dengan alasan dan pesan untuk anggota (PRD 4.2, AC F12-3, F12-4).
      description: |
        Tindakan moderasi setara keputusan suspend pada adminResolveReport (moderasi hanya di web admin, F-12),
        sehingga memakai aturan izin yang SAMA dengan jalur moderasi: moderation.read dan moderation.resolve
        (PRD 2.3 "moderation.read dan moderation.resolve"), ditambah members.read untuk halaman anggota. Pelaku
        dengan demikian selalu dapat membaca kembali alasan internal yang ditulisnya. UI wajib meminta konfirmasi
        (PRD 4.5); body `confirm` harus true. Prasyarat: anggota tidak sedang suspended dan akun tidak
        deletion_pending (400 bila dilanggar dengan versi terkini). Tindakan atas akun alumni yang tertaut ke admin
        pelaku ditolak 403 FORBIDDEN (konflik kepentingan, PRD 2.3).

        Dalam SATU transaksi (AC F12-3, F17-1, F04-1): alumni.suspended_at/suspension_reason/suspension_message/
        suspended_by_admin_id diisi; tanggal periode TIDAK diubah (PRD 4.2); membership_event `suspend` dengan
        aktor dan alasan; audit `member.suspended`; notifikasi kategori account (wajib) ke anggota dengan rute
        /restricted. Setelah commit seluruh sesi umum anggota dicabut (`session.revoked` reason
        account_suspended, all_sessions true) dan socket diputus (AC F12-4, F02-6), sama dengan jalur moderasi.
        Akibat: effective_status suspended mengalahkan masa aktif, direktori menyembunyikan profil, verifikasi KTA
        menjadi Tidak aktif (AC F12-4), tiket anggota tidak berlaku untuk check-in dan refund diputuskan per kasus
        (PRD 2.2). Persetujuan pembayaran berikutnya tidak menghapus suspend (AC F07-4). Anggota dapat mengajukan
        banding dari portal pembatasan (POST /appeals, domain moderation). Pengulangan dengan Idempotency-Key sama
        mengembalikan hasil pertama. Respons dan `current` pada 409 disaring per izin seperti GET detail.
      x-kapdh-access:
        audience: admin
        permissions:
          - members.read
          - moderation.read
          - moderation.resolve
        idempotent: true
      parameters:
        - $ref: "#/components/parameters/AdminMemberUserId"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminMemberSuspendRequest"
      responses:
        "200":
          description: Anggota dibatasi; detail terbaru.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMemberDetail"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"
  /admin/members/{userId}/unsuspend:
    post:
      tags:
        - Admin Members
      operationId: adminUnsuspendMember
      summary: Cabut pembatasan anggota; status dihitung ulang dari expires_at (PRD 4.2, AC F12-3, F12-5).
      description: |
        Izin sama dengan jalur moderasi (moderation.read dan moderation.resolve, PRD 2.3) ditambah members.read;
        UI wajib meminta konfirmasi (PRD 4.5), body `confirm` harus true. Prasyarat: anggota sedang suspended
        (400 bila tidak, dengan versi terkini). Admin tidak dapat mencabut pembatasan akun alumni yang tertaut ke
        dirinya sendiri (403 FORBIDDEN, konflik kepentingan PRD 2.3).

        Dalam SATU transaksi (AC F12-3, F12-5, F17-1), dengan baris alumni terkunci:
        1. kolom suspend dikosongkan; membership_event `unsuspend` dengan aktor dan alasan; audit
           `member.unsuspended`;
        2. setiap banding aktif milik anggota (reports berkategori `appeal`, target_user_id = anggota, status
           open/in_review; dikunci FOR UPDATE) ditutup sebagai DIKABULKAN, sama dengan aturan adminResolveReport
           untuk "jalur unsuspend lain (menu anggota admin)": status resolved, action unsuspend,
           resolution_note merujuk pencabutan dari menu anggota beserta `reason`, resolved_by_admin_id = pelaku,
           resolved_at = waktu server transaksi ini, version naik, audit `moderation.report_resolved` per
           banding. Banding tampil bagi pemohon dengan outcome action_taken dan `decision_message` =
           `member_message` (atau teks baku "Pembatasan akun Anda telah dicabut pengurus" bila kosong);
        3. satu notifikasi kategori account ke anggota yang memuat `member_message` (atau teks baku) dan, bila ada
           banding yang ditutup, menyatakan banding dikabulkan; tidak ada notifikasi ganda per banding.
        effective_status dihitung ulang dari verifikasi dan expires_at, bukan otomatis verified: anggota yang masa
        aktifnya habis menjadi expired dan yang belum pernah paid menjadi unverified (AC F12-5). Idempotency-Key
        dihormati. Respons dan `current` pada 409 disaring per izin seperti GET detail.
      x-kapdh-access:
        audience: admin
        permissions:
          - members.read
          - moderation.read
          - moderation.resolve
        idempotent: true
      parameters:
        - $ref: "#/components/parameters/AdminMemberUserId"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminMemberUnsuspendRequest"
      responses:
        "200":
          description: Pembatasan dicabut; detail terbaru dengan effective_status hasil hitung ulang.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMemberDetail"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"
  /admin/members/{userId}/password-reset:
    post:
      tags:
        - Admin Members
      operationId: adminInitiateMemberPasswordReset
      summary: Super Admin menginisiasi pemulihan sandi alumni tanpa melihat atau menentukan sandi (F-16, AC F16-4).
      description: |
        Hanya Super Admin (PRD 2.3; admin dengan izin apa pun -> 403 FORBIDDEN), dengan sesi ber-TOTP dan
        reautentikasi (X-Reauth-Token <= 10 menit, ARCHITECTURE §4.3; tanpa token -> 403 REAUTH_REQUIRED).
        Body `confirm` harus true dan `reason` wajib.

        Dalam SATU transaksi (AC F16-4, F17-1): baris users dikunci; challenge OTP purpose password_reset
        diterbitkan (challenge aktif sebelumnya untuk tujuan yang sama disupersede, otp_codes_active_key,
        PRD 2.5); seluruh sesi akun target dicabut dan socket diputus setelah commit (`session.revoked` reason
        password_reset, all_sessions true); notifikasi keamanan (kategori security, wajib) ke target; audit
        `member.password_reset_initiated` tanpa kode/token; outbox `member.password_reset_initiated`. Kode tidak
        pernah ada di respons, log, audit atau URL (ARCHITECTURE §2).

        Penyerahan dan penukaran challenge (AC F16-4 "hanya melalui kanal terverifikasi", AC F02-4), satu bentuk
        kanonik yang sama dengan forgotPassword di domain auth:
        1. Email OTP dikirim ke email terverifikasi target (sinkron, ADR-004) dan memuat kode OTP serta tautan
           aplikasi `kapdh://app/forgot/otp?challenge_id=<challenge_id>` (bentuk eksternal deep link
           ARCHITECTURE §4.7, rute /forgot/otp §8.4; nama parameter sama dengan field `challenge_id` pada
           PasswordResetVerifyRequest). Tidak ada bentuk tautan lain (tanpa App Links/Universal Links di R1.0).
           challenge_id bukan rahasia tanpa kode (kode terikat challenge, 5 percobaan, 10 menit); kode hanya ada di
           badan email.
        2. Tautan membuka layar /forgot/otp yang terikat challenge tersebut (tanpa memanggil POST
           /auth/password/forgot, sehingga challenge pengurus TIDAK disupersede). Anggota memasukkan kode dan
           menukarnya dengan reset_token lewat POST /auth/password/forgot/verify (verifyPasswordResetOtp,
           challenge_id + code), lalu menyimpan sandi baru dengan POST /auth/password/reset (AC F02-4).
        3. Kode kedaluwarsa atau tidak diterima di layar itu: anggota meminta kirim ulang untuk challenge yang sama
           (POST /auth/otp/resend dengan challenge_id). Tautan tidak dapat dibuka (mis. klien email tidak
           mendukung skema aplikasi): anggota memulai "Lupa sandi" mandiri. Challenge baru mana pun menggantikan
           challenge pengurus dan tetap hanya dikirim ke email terverifikasi, sehingga pemulihan tetap dapat
           diselesaikan.
        Notifikasi keamanan (inbox/push/email pemberitahuan) hanya memberi tahu bahwa pemulihan dimulai pengurus
        dan meminta anggota membuka email; tidak memuat challenge_id maupun kode.

        Prasyarat: akun alumni berstatus active (termasuk suspended; pemulihan akun diizinkan, PRD 2.2); akun
        pending_otp, disabled atau deletion_pending -> 400. Akun alumni yang tertaut ke Super Admin pelaku
        memakai alur lupa sandi mandiri (403 FORBIDDEN). Batas pengiriman OTP per email berlaku (429, PRD 2.5).
        Idempotency-Key dihormati sehingga klik ganda tidak mengirim dua challenge.
      x-kapdh-access:
        audience: admin
        role: super_admin
        reauth: true
        idempotent: true
      parameters:
        - $ref: "#/components/parameters/AdminMemberUserId"
        - $ref: "#/components/parameters/ReauthToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminMemberPasswordResetRequest"
      responses:
        "202":
          description: Pemulihan diinisiasi; challenge dikirim ke email terverifikasi anggota.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMemberPasswordResetResult"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/ReauthRequired"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Error"
  /admin/members/{userId}/membership-events:
    get:
      tags:
        - Admin Members
      operationId: adminListMemberMembershipEvents
      summary: Histori keanggotaan dan moderasi anggota (aktivasi, renewal, suspend, unsuspend, koreksi nomor, peringatan) (PRD 4.2, 6.3).
      description: |
        Riwayat periode dan moderasi dipisahkan dari kolom periode sehingga tanggal habis tidak hilang saat
        suspend (PRD 4.2). Setiap entri memuat aktor (null untuk sistem), alasan, payment sumber
        (activation/renewal) dan nilai sebelum/sesudah. Peringatan (warn) tidak mengubah tanggal (AC F12-3).
        Urut terbaru lebih dulu, keyset (created_at, id), dengan total.

        Penyaringan per izin (PRD 2.3, AC F15-1), konsisten dengan GET detail:
        - tanpa moderation.read: entri `warn` (murni moderasi) tidak dikembalikan dan tidak dihitung di `total`;
          filter `kind=warn` ditolak 403 FORBIDDEN. Entri `suspend`/`unsuspend` tetap tampil (memengaruhi status
          keanggotaan) tetapi `reason` null dengan `reason_redacted` true;
        - alasan `number_correction` (koreksi administratif, members.manage) tampil untuk members.read.
      x-kapdh-access:
        audience: admin
        permissions:
          - members.read
      parameters:
        - $ref: "#/components/parameters/AdminMemberUserId"
        - name: kind
          in: query
          description: Filter jenis peristiwa.
          schema:
            $ref: "#/components/schemas/AdminMembershipEventKind"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Halaman histori keanggotaan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMembershipEventPage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /admin/reports:
    get:
      tags:
        - Admin Moderation
      operationId: adminListReports
      summary: Antrean laporan dengan filter status, prioritas, kategori dan SLA (izin moderation.read, F-12).
      description: |
        Bawaan `status=active` (open + in_review) urut `due` (due_at naik, lalu created_at) sehingga laporan urgent
        dan yang lewat target tampil lebih dulu. `overdue=true` hanya laporan aktif yang melewati due_at. `q`
        mencari nama atau nomor anggota pihak terlapor/pemohon. Paging keyset dengan `total` sesuai filter dan
        `counts` ringkas untuk badge menu (tidak terpengaruh filter). Item antrean tidak memuat bukti, deskripsi
        pelapor maupun identitas pelapor (minimisasi, PRD 3.12); buka detail untuk menilai.

        Konflik kepentingan (aturan domain butir a): laporan yang pihak terlapornya adalah akun alumni tertaut
        pemanggil dikecualikan dari `items`, `total`, `counts` dan hasil `q`, termasuk laporan grup yang pemanggilnya
        anggota joined grup itu dan laporan yang subjeknya kemudian ditetapkan lewat subject_user_id. Pemanggil tidak
        melihat baris, kategori, maupun jumlahnya. Hitungan laporan di dasbor dan lencana menu memakai aturan yang
        sama (aturan domain butir c) sehingga selalu sama dengan `counts` di sini.
      x-kapdh-access:
        audience: admin
        permissions:
          - moderation.read
      parameters:
        - name: status
          in: query
          required: false
          description: Saringan status; bawaan active (open + in_review).
          schema:
            $ref: "#/components/schemas/AdminModerationStatusFilter"
        - name: priority
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ModerationReportPriority"
        - name: category
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ModerationReportCategory"
        - name: target_type
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ModerationTargetType"
        - name: overdue
          in: query
          required: false
          description: true = hanya laporan aktif yang melewati target penanganan.
          schema:
            type: boolean
        - name: q
          in: query
          required: false
          description: Nama atau nomor anggota pihak terlapor/pemohon.
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: sort
          in: query
          required: false
          description: Urutan; bawaan due.
          schema:
            $ref: "#/components/schemas/AdminModerationSort"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Antrean laporan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminModerationReportPage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Error"
  /admin/reports/{reportId}:
    get:
      tags:
        - Admin Moderation
      operationId: adminGetReport
      summary: Detail laporan beserta bukti terminimalkan; setiap akses diaudit (izin moderation.read, PRD 3.12).
      description: |
        Memuat bukti snapshot saat laporan dibuat (pesan dilaporkan dan konteks, profil, atau grup), pelapor,
        pihak terlapor dengan status keanggotaan terkini, riwayat moderasi pihak terlapor, dan keputusan bila sudah
        ada. Pengurus tidak dapat menjelajah chat lain di luar bukti (PRD 3.12). Setiap pembacaan menulis audit
        `moderation.report_viewed` (aktor, laporan, request_id) sebelum respons dikirim; kegagalan audit membatalkan
        respons (AC F17-1). URL gambar bukti bertanda tangan maksimal 10 menit. Data pihak yang akunnya sudah dihapus
        tampil anonim (null) sesuai D2. Konflik kepentingan: pemanggil yang tertaut ke pihak terlapor mendapat 404
        NOT_FOUND (sama dengan laporan yang tidak ada, tanpa audit pembacaan bukti); pemanggil yang tertaut ke pelapor
        boleh membaca dengan `conflict_of_interest` true.
      x-kapdh-access:
        audience: admin
        permissions:
          - moderation.read
      parameters:
        - $ref: "#/components/parameters/ModerationReportId"
      responses:
        "200":
          description: Detail laporan untuk keputusan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminModerationReportDetail"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /admin/reports/{reportId}/claim:
    post:
      tags:
        - Admin Moderation
      operationId: adminClaimReport
      summary: Klaim laporan untuk ditinjau (status in_review) atau ambil alih klaim (moderation.resolve, F-12).
      description: |
        Mengubah open -> in_review dan mencatat pengurus peninjau (claimed_by, claimed_at) dengan UPDATE bersyarat
        versi. Laporan in_review milik pengurus lain dapat diambil alih bila If-Match sama dengan versi yang dibaca
        (pengurus sudah melihat klaim sebelumnya); klaim ulang oleh pengurus yang sama idempoten. Versi berbeda atau
        laporan sudah diputus -> 409 VERSION_CONFLICT dengan `current` = AdminModerationReportDetail terbaru.
        Konflik kepentingan: tertaut ke pihak terlapor -> 404 NOT_FOUND; tertaut ke pelapor -> 403 FORBIDDEN.
        Audit `moderation.report_claimed` dalam transaksi yang sama. Respons memuat bukti sehingga setiap klaim,
        termasuk klaim ulang idempoten, juga menulis audit `moderation.report_viewed` sebelum respons dikirim.
      x-kapdh-access:
        audience: admin
        permissions:
          - moderation.read
          - moderation.resolve
        idempotent: true
      parameters:
        - $ref: "#/components/parameters/ModerationReportId"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: Laporan sedang ditinjau pemanggil.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminModerationReportDetail"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"
  /admin/reports/{reportId}/resolve:
    post:
      tags:
        - Admin Moderation
      operationId: adminResolveReport
      summary: Putus laporan dengan dismiss, warn, suspend atau unsuspend (moderation.resolve, AC F12-3..F12-5).
      description: |
        Satu keputusan per laporan: laporan wajib open/in_review dan versinya sama dengan If-Match; selain itu 409
        VERSION_CONFLICT dengan `current` = AdminModerationReportDetail terbaru (keputusan pengurus lain menang).
        Klaim lebih dulu tidak wajib. Konflik kepentingan: tertaut ke pihak terlapor -> 404 NOT_FOUND; tertaut ke
        pelapor -> 403 FORBIDDEN; `subject_user_id` = akun tertaut pemanggil -> 403 FORBIDDEN (pengurus tidak
        memutus perkara dirinya sendiri). Semuanya atomik dalam satu transaksi: status laporan, efek keanggotaan,
        membership_events, audit (alasan, aktor, waktu, rujukan bukti; AC F12-3, F17-1) dan outbox notifikasi.

        Pihak yang dikenai tindakan (subjek) = target_user_id laporan; untuk laporan grup subjek wajib dipilih lewat
        `subject_user_id` (anggota atau mantan anggota grup itu yang pernah bergabung; undangan yang dibatalkan
        sebelum diterima tidak dihitung) dan disimpan sebagai pihak terlapor laporan
        (sejak itu laporan tunduk pada aturan konflik butir a untuk akun subjek tersebut).
        - dismiss: tidak ada perubahan pada anggota; status dismissed. Untuk banding berarti banding ditolak.
        - warn: membership_events kind warn tanpa mengubah starts_at/expires_at (AC F12-3); subjek menerima
          notifikasi kategori account berisi `member_message`; status resolved.
        - suspend (wajib `confirm: true`, PRD 4.5): subjek belum suspended (selain itu 400). Mengisi suspended_at,
          suspension_reason = `note` (internal), suspension_message = `member_message` (ditampilkan ke anggota),
          membership_events suspend; tanggal periode tidak dibuang (PRD 4.2). Setelah commit seluruh sesi umum
          dicabut (`session.revoked` reason account_suspended) dan socket diputus, akses komunitas ditolak, profil
          hilang dari direktori, verifikasi KTA menjadi Tidak aktif, dan tiket tidak berlaku (AC F12-4, PRD 2.2).
        - unsuspend (wajib `confirm: true`): subjek sedang suspended (selain itu 400, kecuali banding usang di
          bawah). Menghapus suspend dan membership_events unsuspend; effective_status dihitung ulang dari expires_at
          sehingga anggota yang masa aktifnya habis menjadi expired, bukan otomatis verified (AC F12-5). Dalam
          transaksi yang sama (di bawah kunci baris alumni subjek), banding aktif lain milik subjek ditutup sebagai
          dikabulkan (status resolved, action unsuspend, catatan merujuk laporan ini) dan pemohonnya menerima
          hasilnya (notifikasi kategori account, outcome action_taken).
        Banding (kategori appeal) hanya boleh dismiss (banding ditolak; suspend tetap berlaku) atau unsuspend
        (banding dikabulkan); tindakan lain -> 400 VALIDATION_ERROR. Banding usang =
        `evidence.contested_suspension.in_force` false, yaitu suspend yang dibanding sudah dicabut lewat jalur yang
        tidak menutup bandingnya (lihat ketergantungan di bawah). Untuk banding usang hanya `unsuspend` yang
        diterima: banding ditutup sebagai dikabulkan TANPA mengubah keanggotaan (tidak ada membership_events, tidak
        ada pencabutan sesi, suspend baru yang mungkin berlaku tidak dicabut; audit mencatat keanggotaan tidak
        berubah). `dismiss` atas banding usang -> 400 VALIDATION_ERROR pada field action, karena pemohon tidak boleh
        menerima "banding ditolak" untuk suspend yang sudah dicabut.

        Ketergantungan lintas domain (MEMBLOKIR rilis modul moderasi; belum tercantum di admin-members.yaml):
        adminUnsuspendMember dan setiap jalur unsuspend lain wajib memakai fungsi kernel keanggotaan yang sama
        dengan keputusan ini (mis. MembershipKernel.unsuspend) yang, dalam transaksi pencabutan itu, juga menutup
        banding aktif subjek sebagai dikabulkan dan menjadwalkan notifikasi hasilnya. Aturan banding usang di atas
        dan di POST /appeals hanya jaring pengaman bila ketergantungan itu terlewat.

        `remove_message=true` (hanya laporan pesan) menjadikan pesan terlapor placeholder dan mengirim
        `message.deleted`; snapshot bukti tetap tersimpan.
        Pelapor menerima notifikasi kategori account bahwa laporannya selesai ditinjau (tanpa rincian tindakan,
        AC F12-2); pemohon banding menerima `member_message`.
      x-kapdh-access:
        audience: admin
        permissions:
          - moderation.read
          - moderation.resolve
        idempotent: true
      parameters:
        - $ref: "#/components/parameters/ModerationReportId"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminModerationResolveRequest"
      responses:
        "200":
          description: Keputusan tersimpan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminModerationReportDetail"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"
  /admin/reports/{reportId}/subject-candidates:
    get:
      tags:
        - Admin Moderation
      operationId: adminListReportSubjectCandidates
      summary: Calon subjek laporan grup, yaitu anggota dan mantan anggota grup (moderation.resolve, AC F12-3, F12-4).
      description: |
        Sumber pilihan `subject_user_id` pada adminResolveReport untuk laporan grup (`target_type` room). Bukti
        laporan grup hanya memuat nama, avatar dan jumlah anggota (createReport, PRD 3.12), sehingga daftar ini
        satu-satunya cara pengurus memilih anggota yang dikenai warn/suspend tanpa menjelajah chat. Isinya memakai
        aturan yang SAMA dengan validasi `subject_user_id`: anggota grup yang pernah bergabung (status joined, atau
        left/removed setelah pernah bergabung; undangan yang dibatalkan sebelum diterima tidak dihitung). Akun yang
        sudah dihapus (D2) dan akun alumni tertaut pemanggil (pengurus tidak memutus perkara dirinya sendiri) tidak
        dicantumkan. Setiap butir hanya identitas minimum tanpa kontak dan tanpa isi chat, ditambah status
        keanggotaan terkini agar UI menawarkan suspend hanya untuk anggota yang belum disuspend. Urutan: anggota
        joined berperan admin grup, anggota joined lain, lalu mantan anggota; dalam kelompok nama naik. `q` mencari
        nama atau awalan nomor anggota. Paging keyset dengan cursor terikat `q` yang sama.

        Hanya laporan grup yang masih aktif (open/in_review); laporan selain grup atau yang sudah diputus -> 400
        VALIDATION_ERROR. Konflik kepentingan sama dengan adminGetReport (aturan domain butir a dan b): tertaut ke
        pihak terlapor (termasuk anggota joined grup itu) -> 404 NOT_FOUND; tertaut ke pelapor -> 403 FORBIDDEN.
        Pembacaan dicatat di audit seperti pembacaan bukti (`moderation.report_viewed`, aktor, laporan, request_id;
        daftar anggota tidak disalin ke audit) dalam transaksi yang sama sebelum respons dikirim (PRD 3.12, AC F17-1).
      x-kapdh-access:
        audience: admin
        permissions:
          - moderation.read
          - moderation.resolve
      parameters:
