    AdminCheckinRejection:
      description: |
        Body 409 adminCheckInTicket: bentuk Error baku (`code`, `message`, `request_id`, `current`) tanpa field
        tingkat atas tambahan; hanya `current` yang dipersempit menjadi AdminCheckinRejectionDetail. `code`:
        TICKET_ALREADY_CHECKED_IN (already_checked_in), RESERVATION_EXPIRED (ticket_expired),
        PAYMENT_STATE_CONFLICT (ticket_awaiting_payment, ticket_awaiting_review), VALIDATION_ERROR (alasan lain).
        IDEMPOTENCY_CONFLICT tidak membawa `current`. Klien Dart membaca `ApiException.current` lalu
        `AdminCheckinRejectionDetail.fromJson`.
      allOf:
        - $ref: "#/components/schemas/Error"
        - type: object
          properties:
            current:
              $ref: "#/components/schemas/AdminCheckinRejectionDetail"
    AdminCheckinRejectionDetail:
      type: object
      description: |
        Isi `current` pada penolakan check-in (AC F09-6). Dikirim lewat opsi `current` AppException, sehingga body
        tetap Error baku ARCHITECTURE §4.4 dan filter galat inti tidak perlu diubah.
      required:
        - rejection_reason
        - ticket
        - checkin_opens_at
        - checkin_closes_at
      properties:
        rejection_reason:
          $ref: "#/components/schemas/AdminCheckinRejectionReason"
        ticket:
          $ref: "#/components/schemas/AdminCheckinTicket"
        checkin_opens_at:
          type: string
          format: date-time
          description: Awal jendela check-in efektif event tiket (D5); ditampilkan untuk too_early.
        checkin_closes_at:
          type: string
          format: date-time
          description: Akhir jendela check-in efektif event tiket (D5); ditampilkan untuk too_late.
    AdminCheckinRejectionReason:
      type: string
      enum:
        - other_event
        - event_cancelled
        - ticket_cancelled
        - ticket_expired
        - ticket_awaiting_payment
        - ticket_awaiting_review
        - already_checked_in
        - holder_ineligible
        - too_early
        - too_late
      description: Alasan penolakan check-in yang dapat ditindaklanjuti petugas (AC F09-6, PRD 4.5).
    AdminCheckinRequest:
      type: object
      required:
        - event_id
        - qr_code
      properties:
