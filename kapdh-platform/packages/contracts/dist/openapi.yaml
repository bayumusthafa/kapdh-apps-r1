          maximum: 2100
    EducationLevel:
      type: string
      enum:
        - d3
        - s1
        - s2
        - s3
        - other
      description: Strata pendidikan setelah pondok; label tampilan D3, S1, S2, S3 dan Lainnya.
    EducationStatus:
      type: string
      enum:
        - "01"
        - "02"
        - "03"
      description: 01 tamat MTs dan Aliyah, 02 tamat salah satu, 03 tidak tamat (PRD 3.5); dihitung dari kelas.
    EffectiveStatus:
      type: string
      enum:
        - pending_otp
        - unverified
        - verified
        - expiring
        - expired
        - suspended
        - disabled
        - deletion_pending
      description: |
        Status efektif yang dihitung server per request dan menentukan rute klien (PRD 2.2, ARCHITECTURE §3.1).
        Klien tidak menghitung sendiri.
    EmailCorrectionRequest:
      type: object
      description: Koreksi email akun pending_otp (PRD 2.2); kepemilikan dibuktikan challenge dan sandi akun.
      required:
        - challenge_id
        - password
        - new_email
      properties:
        challenge_id:
          type: string
          format: uuid
          description: Challenge signup atau email_change milik akun (boleh kedaluwarsa, belum dikonsumsi).
        password:
          type: string
          minLength: 1
          maxLength: 128
        new_email:
          type: string
          format: email
          maxLength: 254
    EmailPreferences:
      type: object
      required:
        - payment
        - membership
        - event
      description: Saklar email transaksional per kategori; email OTP, keamanan dan akun selalu dikirim (F-13).
      properties:
        payment:
          type: boolean
        membership:
          type: boolean
        event:
          type: boolean
    Error:
      type: object
      description: Bentuk galat baku (PRD 5.2). Tidak pernah memuat token, secret atau stack trace.
      required:
        - code
        - message
        - request_id
      properties:
        code:
          $ref: "#/components/schemas/ErrorCode"
        message:
          type: string
          description: Pesan aman untuk ditampilkan dalam Bahasa Indonesia.
        request_id:
          type: string
          description: Penghubung log API, worker dan audit (N-14).
        field_errors:
          type: object
          description: Pesan per field; kunci bertitik untuk field bersarang dan `_` untuk akar.
          additionalProperties:
            type: array
            items:
              type: string
        retry_after_seconds:
          type: integer
          minimum: 0
        current:
          description: Keadaan terbaru objek untuk galat konflik (bentuk mengikuti operasi).
    ErrorCode:
      type: string
      description: |
        Kode galat final (PRD 5.2 + ARCHITECTURE §4.4). Setiap kode memiliki perilaku UI di katalog
        @kapdh/shared ERROR_UI dan katalog Dart yang dibangkitkan. Status HTTP lazim:
        VALIDATION_ERROR 400 (409 untuk email terdaftar), UNAUTHENTICATED 401, MFA_REQUIRED 403,
        REAUTH_REQUIRED 403, FORBIDDEN 403, MEMBERSHIP_REQUIRED 403, ACCOUNT_SUSPENDED 403, OTP_EXPIRED 410,
        RATE_LIMITED 429, FILE_INVALID 413/415/422, PAYMENT_STATE_CONFLICT 409, PROOF_VERSION_CONFLICT 409,
        VERSION_CONFLICT 409, EVENT_SOLD_OUT 409, RESERVATION_EXPIRED 409/410, TICKET_ALREADY_CHECKED_IN 409,
        IDEMPOTENCY_CONFLICT 409, NOT_FOUND 404, UPGRADE_REQUIRED 426, MAINTENANCE 503, INTERNAL_ERROR 500.
      enum:
        - VALIDATION_ERROR
        - UNAUTHENTICATED
        - MFA_REQUIRED
        - REAUTH_REQUIRED
        - FORBIDDEN
        - MEMBERSHIP_REQUIRED
        - ACCOUNT_SUSPENDED
        - OTP_EXPIRED
        - RATE_LIMITED
        - FILE_INVALID
        - PAYMENT_STATE_CONFLICT
        - PROOF_VERSION_CONFLICT
        - VERSION_CONFLICT
        - EVENT_SOLD_OUT
        - RESERVATION_EXPIRED
        - TICKET_ALREADY_CHECKED_IN
        - IDEMPOTENCY_CONFLICT
        - NOT_FOUND
        - UPGRADE_REQUIRED
        - MAINTENANCE
        - INTERNAL_ERROR
    EventCancellationPolicy:
      type: object
      description: |
        Aturan pembatalan dan refund D6 (PRD 3.9) yang berlaku untuk event ini, dihitung server dari pengaturan
        `events.self_cancel_days`. `summary` adalah teks siap tampil berbahasa Indonesia.
      required:
        - self_cancel_until
        - full_refund_until
        - refund_processing_business_days
        - summary
      properties:
        self_cancel_until:
          type: string
          format: date-time
          description: Batas peserta membatalkan sendiri (= starts_at).
        full_refund_until:
          type:
            - string
            - "null"
          format: date-time
          description: Pembatalan sendiri sebelum waktu ini mendapat refund penuh (H-3); null untuk event gratis.
        refund_processing_business_days:
          type: integer
          minimum: 1
          description: Tenggat bendahara memproses refund sejak pembatalan, dalam hari kerja (D6, 7).
        summary:
          type: string
          examples:
            - Batalkan sampai 12 Okt 2026 09.00 WIB (H-3) untuk refund penuh; setelah itu tanpa refund. Refund ditransfer bendahara paling lambat 7 hari kerja.
    EventCategoryList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/EventCategoryRef"
    EventCategoryRef:
      type: object
      required:
        - id
        - slug
        - label
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
          examples:
            - reuni
        label:
          type: string
          examples:
            - Reuni
    EventDetail:
      allOf:
        - $ref: "#/components/schemas/EventSummary"
        - type: object
          required:
            - description
            - location_address
            - location_url
            - registration_opens_at
            - registration_closes_at
            - checkin_opens_at
            - checkin_closes_at
            - hold_hours
            - participant_count
            - cancellation_policy
            - cancelled_at
            - cancel_reason
            - can_reserve
            - reservation_blocked_reason
            - my_ticket
            - updated_at
          properties:
            description:
              type:
                - string
                - "null"
              description: Teks polos; baris baru dipertahankan.
            location_address:
              type:
                - string
                - "null"
            location_url:
              type:
                - string
                - "null"
              format: uri
              description: Tautan peta https; klien menandai sebagai tautan luar (F-08).
            registration_opens_at:
              type: string
              format: date-time
            registration_closes_at:
              type: string
              format: date-time
            checkin_opens_at:
              type: string
              format: date-time
              description: Jendela check-in efektif; bawaan 2 jam sebelum starts_at (D5) kecuali event menetapkan lain.
            checkin_closes_at:
              type: string
              format: date-time
              description: Akhir jendela check-in efektif; bawaan ends_at (D5).
            hold_hours:
              type: integer
              minimum: 1
              description: Lama hold reservasi berbayar tanpa bukti (D5, 24); dibatasi registration_closes_at.
            participant_count:
              type: integer
              minimum: 0
              description: Jumlah tiket paid (kursi terkonfirmasi), termasuk peserta yang tidak tampil di direktori.
            cancellation_policy:
              $ref: "#/components/schemas/EventCancellationPolicy"
            cancelled_at:
              type:
                - string
                - "null"
              format: date-time
            cancel_reason:
              type:
                - string
                - "null"
              description: Alasan pembatalan dari pengurus (AC F09-7).
            can_reserve:
              type: boolean
              description: True bila pemanggil saat ini dapat POST reservasi.
            reservation_blocked_reason:
              oneOf:
                - $ref: "#/components/schemas/EventReservationBlockReason"
                - type: "null"
            my_ticket:
              description: Tiket terbaru pemanggil di event ini (status apa pun); null bila belum pernah memesan.
              oneOf:
                - $ref: "#/components/schemas/TicketSummary"
                - type: "null"
            updated_at:
              type: string
              format: date-time
    EventListPeriod:
      type: string
      enum:
        - upcoming
        - past
    EventPage:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/EventSummary"
        next_cursor:
          type:
            - string
            - "null"
    EventParticipant:
      type: object
      description: Data peserta minimum yang boleh dilihat anggota aktif (PRD 3.10); kontak tidak pernah dikirim.
      required:
        - user_id
        - full_name
        - cohort
        - cohort_code
        - avatar_url
      properties:
        user_id:
          type: string
          format: uuid
          description: Untuk membuka profil jejaring /network/members/<userId>.
        full_name:
          type: string
          examples:
            - Ahmad Yusiana
        cohort:
          type: integer
          minimum: 1
          maximum: 99
        cohort_code:
          type: string
          examples:
            - KAPDH 01
        avatar_url:
          type:
            - string
            - "null"
          format: uri
    EventParticipantPage:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/EventParticipant"
        next_cursor:
          type:
            - string
            - "null"
    EventRegistrationState:
      type: string
      enum:
        - not_yet_open
        - open
        - sold_out
        - closed
        - cancelled
      description: |
        Label pendaftaran kartu event (guideline p8) dihitung server: cancelled (event dibatalkan); closed (status
        closed/done atau `now >= registration_closes_at`, "Pendaftaran Ditutup"); not_yet_open (open tetapi
        `now < registration_opens_at`); sold_out (jendela terbuka tetapi `seats_available = 0` menurut proyeksi
        kursi pada aturan tag Events, yang sudah mengabaikan hold kedaluwarsa; kembali open bila hold aktif
        kedaluwarsa atau tiket dibatalkan); open ("Pendaftaran Dibuka").
    EventReservationBlockReason:
      type: string
      enum:
        - membership_required
        - not_yet_open
        - closed
        - sold_out
        - cancelled
        - has_active_ticket
      description: |
        Alasan pemanggil belum dapat mendaftar: membership_required (bukan verified/expiring; arahkan sesuai
        effective_status), not_yet_open, closed, sold_out, cancelled, atau has_active_ticket (buka `my_ticket`).
        Bila beberapa alasan berlaku, server mengirim yang pertama menurut urutan: membership_required,
        has_active_ticket, cancelled, closed, not_yet_open, sold_out. sold_out memakai proyeksi kursi (aturan tag
        Events), sehingga hold kedaluwarsa tidak membuat event tampak penuh.
    EventReservationRequest:
      type: object
      description: |
        Satu kursi untuk pemanggil sendiri; tidak ada jumlah atau tipe tiket (PRD 3.9, disahkan v3.2). Total tiket
        dihitung server dari harga event saat ini; `expected_price` hanya pengaman agar anggota tidak ditagih harga
        yang belum ia lihat.
      required:
        - expected_price
      properties:
        expected_price:
          $ref: "#/components/schemas/Money"
          description: |
            Harga event yang ditampilkan dan dikonfirmasi anggota (`price` dari GET /events/{eventId}; "0.00" untuk
            event gratis). Berbeda dari harga saat ini -> 409 VERSION_CONFLICT dengan `current` = EventDetail.
        payment_method_id:
          type:
            - string
            - "null"
          format: uuid
          description: Wajib untuk event berbayar (dari GET /payment-methods); wajib kosong untuk event gratis.
    EventStatus:
      type: string
      enum:
        - draft
        - open
        - closed
        - done
        - cancelled
      description: |
        Siklus event (PRD 4.4): draft (belum terbit, hanya admin) -> open (menerima reservasi dalam jendela
        pendaftaran) -> closed (pemesanan baru ditutup; tiket paid tetap berlaku untuk check-in) -> done (diset job
        sesudah acara berakhir). cancelled menutup pemesanan dan check-in; data historis tidak dihapus.
    EventSummary:
      type: object
      description: |
        Kartu event untuk daftar event dan beranda (guideline p8): cover, kategori, judul, tanggal dan label
        pendaftaran. Waktu dalam UTC; tampilkan dalam `timezone` event (PRD 2.1). `my_ticket_status` adalah status
        tiket terbaru milik pemanggil di event ini (null bila belum pernah memesan).
      required:
        - id
        - title
        - category
        - cover_url
        - starts_at
        - ends_at
        - timezone
        - location_name
        - status
        - registration_state
        - price
        - is_free
        - seats_total
        - seats_available
        - my_ticket_status
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          examples:
            - Camping Alumni KAPDH
        category:
          oneOf:
            - $ref: "#/components/schemas/EventCategoryRef"
            - type: "null"
        cover_url:
          type:
            - string
            - "null"
          format: uri
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        timezone:
          type: string
          description: Zona waktu IANA tampilan event.
          examples:
            - Asia/Jakarta
        location_name:
          type:
            - string
            - "null"
          examples:
            - Bumi Perkemahan Cibubur
        status:
          $ref: "#/components/schemas/EventStatus"
        registration_state:
          $ref: "#/components/schemas/EventRegistrationState"
        price:
          $ref: "#/components/schemas/Money"
        is_free:
          type: boolean
          description: True bila price = 0.00 (AC F09-3).
        seats_total:
          type: integer
          minimum: 1
        seats_available:
          type: integer
          minimum: 0
          description: |
            Proyeksi kursi (PRD 4.4, aturan tag Events): seats_total - paid_quantity - held_aktif; hold awaiting_payment
            yang sudah lewat `hold_expires_at` tidak dihitung walaupun belum dilepas job.
        my_ticket_status:
          oneOf:
            - $ref: "#/components/schemas/TicketStatus"
            - type: "null"
    FeeQuote:
      type: object
      description: Kutipan satu jenis iuran dari pengaturan `fees` versi aktif (D4).
      required:
        - type
        - lines
        - total
        - eligible
      properties:
        type:
          $ref: "#/components/schemas/MembershipPaymentType"
        lines:
          type: array
          items:
            $ref: "#/components/schemas/PaymentLine"
        total:
          $ref: "#/components/schemas/Money"
        eligible:
          type: boolean
          description: Pemanggil boleh membuat instruksi jenis ini sekarang.
        ineligible_reason:
          description: Diisi bila `eligible` false.
          oneOf:
            - $ref: "#/components/schemas/FeeQuoteIneligibleReason"
            - type: "null"
        open_payment_id:
          type:
            - string
            - "null"
          format: uuid
          description: Payment nonterminal (pending/rejected) jenis ini yang sudah ada; buka payment ini.
        renewal_opens_at:
          type:
            - string
            - "null"
          format: date-time
          description: Untuk renewal saat jendela belum dibuka; waktu jendela perpanjangan dibuka (AC F07-5).
    FeeQuoteIneligibleReason:
      type: string
      enum:
        - already_registered
        - registration_required
        - renewal_window_not_open
      description: |
        Alasan kutipan tidak dapat dibayar (PRD 2.2, AC F07-5): already_registered = iuran pendaftaran sudah paid;
        registration_required = perpanjangan sebelum iuran pendaftaran paid; renewal_window_not_open = sisa masa
        aktif lebih dari jendela perpanjangan (30 hari).
    FeeSettings:
      type: object
      description: |
        Komponen biaya iuran versi aktif (app_settings `fees`, D4). registration = registration_fee + card_fee;
        renewal = renewal_fee per tahun (PRD 3.3).
      required:
        - registration_fee
        - card_fee
        - renewal_fee
        - registration_total
        - version
        - effective_from
      properties:
        registration_fee:
          $ref: "#/components/schemas/Money"
        card_fee:
          $ref: "#/components/schemas/Money"
        renewal_fee:
          $ref: "#/components/schemas/Money"
        registration_total:
          $ref: "#/components/schemas/Money"
          description: registration_fee + card_fee, dihitung server dengan aritmetika desimal.
        version:
          type: string
          description: Versi `fees`; disnapshot sebagai settings_version pada payment.
        effective_from:
          type: string
          format: date-time
          description: Waktu versi ini berlaku; payment yang dibuat sejak saat ini memakai nominal ini.
        updated_by:
          description: Pengurus yang menetapkan versi ini; null untuk nilai seed referensi.
          oneOf:
            - $ref: "#/components/schemas/AdminSettingActorRef"
            - type: "null"
    FeeSettingsInput:
      type: object
      required:
        - registration_fee
        - card_fee
        - renewal_fee
      properties:
        registration_fee:
          $ref: "#/components/schemas/Money"
        card_fee:
          $ref: "#/components/schemas/Money"
        renewal_fee:
          $ref: "#/components/schemas/Money"
        reason:
          type: string
          maxLength: 500
          description: Catatan perubahan (misalnya keputusan rapat pengurus) untuk audit.
    FileAccess:
      type: object
      required:
        - url
        - expires_at
        - mime
      properties:
        url:
          type: string
          format: uri
          description: URL absolut yang langsung dapat dibuka (gambar/unduhan) tanpa header Authorization.
        expires_at:
          type:
            - string
            - "null"
          format: date-time
          description: Batas berlaku URL bertanda tangan (<= 10 menit); null untuk berkas publik (URL tetap).
        mime:
          type: string
          examples:
            - image/jpeg
            - application/pdf
          description: |
            Jenis isi berkas (image/jpeg, image/png, image/webp, application/pdf, text/csv) untuk memilih pratinjau,
            misalnya bukti transfer PDF ditampilkan sebagai dokumen di web admin.
    FileBinary:
      type: string
      format: binary
      description: Isi berkas mentah.
    FilePurpose:
      type: string
      enum:
        - avatar
        - chat_image
        - post_cover
        - banner_image
        - event_cover
        - payment_proof
        - adjustment_evidence
        - audit_export
        - payment_qr
      description: |
        Purpose berkas (sama dengan files.purpose). `audit_export` hanya dibangkitkan sistem (ekspor audit, AC F17-4)
        dan tidak dapat diunggah. `payment_qr` (ADR-026) adalah gambar QRIS statis organisasi untuk metode bayar
        qris, publik, dan hanya diunggah lewat POST /admin/payment-qr-images (settings.manage).
    FileRef:
      type: object
      description: Berkas yang siap dilampirkan (status ready). Tidak memuat nama berkas asli maupun object key.
      required:
        - id
        - purpose
        - mime
        - bytes
        - width
        - height
        - visibility
        - public_url
        - created_at
      properties:
        id:
          type: string
          format: uuid
        purpose:
          $ref: "#/components/schemas/FilePurpose"
        mime:
          type: string
          examples:
            - image/jpeg
        bytes:
          type: integer
          minimum: 0
          description: Ukuran setelah diproses (gambar di-encode ulang).
        width:
          type:
            - integer
            - "null"
          minimum: 1
          description: Lebar piksel gambar; null untuk PDF.
        height:
          type:
            - integer
            - "null"
          minimum: 1
          description: Tinggi piksel gambar; null untuk PDF.
        visibility:
          $ref: "#/components/schemas/FileVisibility"
        public_url:
          type:
            - string
            - "null"
          format: uri
          description: URL tetap untuk berkas publik; null untuk berkas privat (pakai getFileAccess).
        created_at:
          type: string
          format: date-time
    FileUploadPurpose:
      type: string
      enum:
        - avatar
        - chat_image
        - payment_proof
        - adjustment_evidence
      description: |
        Purpose yang dapat diunggah lewat POST /files; hak unggah per purpose dijelaskan di operasi. Cover berita,
        banner, cover event dan gambar QRIS diunggah lewat endpoint domainnya (POST /admin/content/media,
        POST /admin/event-covers, POST /admin/payment-qr-images).
    FileUploadRequest:
      type: object
      required:
        - purpose
        - file
      properties:
        purpose:
          $ref: "#/components/schemas/FileUploadPurpose"
        file:
          type: string
          format: binary
          description: Isi berkas (JPG/PNG/WebP <= 5 MB, atau PDF <= 10 MB khusus payment_proof). Dikirim setelah purpose.
    FileVisibility:
      type: string
      enum:
        - public
        - private
      description: |
        Publik untuk post_cover, banner_image, event_cover, payment_qr (gambar QRIS organisasi, ADR-026), dan avatar
        yang dijadikan publik sesuai pengaturan privasi pemiliknya; lainnya selalu privat (PRD 5.4).
    ForgotPasswordRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          maxLength: 254
    Gender:
      type: string
      enum:
        - male
        - female
      description: Jenis kelamin; JK 01 = male, 02 = female pada nomor anggota (PRD 3.5).
    HealthCheckState:
      type: string
      enum:
        - ok
        - fail
        - skipped
      description: Status satu dependensi; skipped bila dependensi opsional tidak dikonfigurasi (mis. REDIS_URL kosong).
    HealthReadiness:
      type: object
      required:
        - status
        - time
        - checks
      properties:
        status:
          $ref: "#/components/schemas/HealthReadinessStatus"
        time:
          type: string
          format: date-time
        checks:
          $ref: "#/components/schemas/HealthReadinessChecks"
    HealthReadinessChecks:
      type: object
      description: |
        `deletion_ledger` (opsional bagi klien lama, selalu dikirim server): deletion ledger sudah diterapkan ke
        database (AC F14-6, PRD 9.2 skenario 8). `fail` bila database belum mengenal permintaan penghapusan terbaru di
        kepala ledger storage (database dipulihkan dari backup tanpa menjalankan `account:ledger-reapply`) atau kepala
        ledger rusak; `skipped` bila storage tidak dipasang atau database/storage tidak terjangkau. `fail` membuat
        readiness 503.
      required:
        - database
        - redis
        - storage
      properties:
        database:
          $ref: "#/components/schemas/HealthCheckState"
        redis:
          $ref: "#/components/schemas/HealthCheckState"
        storage:
          $ref: "#/components/schemas/HealthCheckState"
        deletion_ledger:
          $ref: "#/components/schemas/HealthCheckState"
        outbox_oldest_pending_seconds:
          type:
            - integer
            - "null"
          minimum: 0
          description: |
            Umur event outbox pending tertua dalam detik (sinyal worker macet, PRD 5.5); null bila tidak ada atau
            database tidak dapat dibaca. Tidak memengaruhi status readiness API.
    HealthReadinessStatus:
      type: string
      enum:
        - ok
        - unavailable
    HealthStatus:
      type: object
      required:
        - status
        - time
      properties:
        status:
          type: string
          const: ok
        time:
          type: string
          format: date-time
        commit:
          type:
            - string
            - "null"
          pattern: ^[0-9a-f]{40}$
          description: |
            Commit sumber image API yang sedang melayani (opsional bagi klien; null bila image dibangun tanpa build arg
            KAPDH_COMMIT, mis. lokal). Dipakai uji asap deploy untuk membuktikan digest yang dipromosikan benar-benar
            berjalan (PRD 5.5). Bukan rahasia dan tidak memuat data pribadi.
    Home:
      type: object
      required:
        - banners
        - upcoming_events
        - posts
        - quick_access
        - generated_at
      properties:
        banners:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/HomeBanner"
        upcoming_events:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/HomeEvent"
        posts:
          type: array
          maxItems: 5
          items:
            $ref: "#/components/schemas/PostSummary"
        quick_access:
          $ref: "#/components/schemas/HomeQuickAccess"
        generated_at:
          type: string
          format: date-time
          description: Waktu server saat Beranda disusun; ditampilkan sebagai waktu pembaruan cache (AC F08-4).
    HomeBanner:
      type: object
      required:
        - id
        - title
        - image_url
        - target
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          description: Judul banner (juga label aksesibilitas gambar, N-11).
        image_url:
          type: string
          format: uri
          description: URL publik gambar banner yang sudah diproses server (N-10).
        target:
          $ref: "#/components/schemas/HomeBannerTarget"
    HomeBannerTarget:
      type: object
      description: |
        Target yang sudah diselesaikan server saat Beranda dibaca (AC F08-2). Bila `available = false` (berita
        diarsipkan/belum terbit, event draft/dibatalkan/selesai, halaman belum terbit atau dihapus), klien tetap
        menampilkan banner tetapi saat diketuk menampilkan pesan "Konten tujuan sudah tidak tersedia".
      required:
        - type
        - available
        - route
        - url
        - external
      properties:
        type:
          $ref: "#/components/schemas/BannerTargetType"
        available:
          type: boolean
          description: Target dapat dibuka saat ini; selalu true untuk `none` dan `url`.
        route:
          type:
            - string
            - "null"
          description: |
            Rute aplikasi (ARCHITECTURE §8.4) untuk target internal yang tersedia: `/news/{slug}`, `/events/{id}`,
            atau `/legal/{slug}`; null untuk `none`, `url`, atau target yang tidak tersedia.
          examples:
            - /news/contoh-selamat-datang
        url:
          type:
            - string
            - "null"
          format: uri
          description: Tautan luar https, hanya untuk `type = url`; klien menandainya sebagai tautan luar (PRD 3.8).
        external:
          type: boolean
          description: True bila target membuka tautan di luar aplikasi (`type = url`).
    HomeEvent:
      type: object
      description: |
        Ringkasan event untuk kartu Beranda (guideline p8: cover, kategori, judul, tanggal, label pendaftaran).
        Skema lokal domain konten; detail dan reservasi memakai API Events (F-09).
      required:
        - id
        - title
        - cover_url
        - category
        - starts_at
        - ends_at
        - timezone
        - location_name
        - price
        - is_free
        - seats_total
        - seats_available
        - registration_state
        - registration_opens_at
        - registration_closes_at
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        cover_url:
          type:
            - string
            - "null"
          format: uri
        category:
          oneOf:
            - $ref: "#/components/schemas/ContentCategoryRef"
            - type: "null"
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        timezone:
          type: string
          description: Zona waktu tampilan event (IANA); klien menampilkan waktu di zona ini (PRD 2.1).
          examples:
            - Asia/Jakarta
        location_name:
          type:
            - string
            - "null"
        price:
          $ref: "#/components/schemas/Money"
        is_free:
          type: boolean
          description: True bila harga 0 (AC F09-3).
        seats_total:
          type: integer
          minimum: 1
        seats_available:
          type: integer
          minimum: 0
          description: |
            seats_total - held_quantity - paid_quantity (PRD 4.4), dengan proyeksi baca kursi aturan tag Events:
            hold kedaluwarsa (tiket awaiting_payment dengan hold_expires_at <= now) yang belum dilepas job expiry
            dianggap sudah lepas, sehingga nilainya = seats_total - paid_quantity - held_aktif dan sama dengan
            respons daftar/detail event. `registration_state` memakai nilai yang sama.
        registration_state:
          $ref: "#/components/schemas/HomeEventRegistrationState"
        registration_opens_at:
          type: string
          format: date-time
        registration_closes_at:
          type: string
          format: date-time
    HomeEventRegistrationState:
      type: string
      enum:
        - not_yet_open
        - open
        - sold_out
        - closed
      description: |
        Keadaan pendaftaran untuk label kartu event (guideline p8 "Pendaftaran di Buka/Tutup"). Nilainya sama
        dengan `EventRegistrationState` domain events (F-09) tanpa `cancelled`, karena event batal tidak pernah
        tampil di Beranda; widget kartu event klien memakai satu pemetaan label untuk keduanya.
        `not_yet_open` event open tetapi `now < registration_opens_at`; `open` di dalam jendela pendaftaran dan
        kursi tersedia; `sold_out` jendela terbuka tetapi `seats_available = 0` (dapat kembali `open` bila hold
        kedaluwarsa); `closed` event berstatus closed atau `now >= registration_closes_at`.
    HomeQuickAccess:
      type: object
      description: Akses cepat KTA dan notifikasi di Beranda (PRD 3.8).
      required:
        - unread_notification_count
        - effective_status
        - member_number
        - expires_at
      properties:
        unread_notification_count:
          type: integer
          minimum: 0
          description: Notifikasi inbox dengan read_at null.
        effective_status:
          $ref: "#/components/schemas/EffectiveStatus"
        member_number:
          type:
            - string
            - "null"
          description: Nomor anggota AA.SS.JK.N untuk pintasan KTA.
          examples:
            - 29.01.01.7
        expires_at:
          type:
            - string
            - "null"
          format: date-time
          description: Akhir masa aktif; `expiring` menampilkan ajakan perpanjang (F-07).
    InboxNotification:
      type: object
      required:
        - id
        - category
        - title
        - body
        - deep_link
        - read_at
        - created_at
      description: |
        Satu entri kotak masuk (F-13). Satu peristiwa menghasilkan tepat satu entri per pengguna karena dedup_key
        unik; retry pengiriman tidak menduplikasi kotak masuk (AC F13-1, F13-6). Bentuk yang sama (tanpa
        `read_at`, ditambah `unread_count`) dikirim event realtime `notification.created`
        (events/notification.created.schema.json, ARCHITECTURE §4.9).

        Deep link satu bentuk di semua kanal (PRD 3.13, ARCHITECTURE §4.7): notifications.data.route menyimpan
        rute aplikasi sebagai STRING path (ARCHITECTURE §8.4, misalnya `/payments/<id>`); `deep_link` di REST,
        payload realtime dan payload data FCM (bersama `notification_id` dan `category`) adalah bentuk eksternal
        `kapdh://app` + path tersebut. Klien cukup mengurai satu format. Payload data FCM juga membawa `route`
        (path yang sama, untuk klien yang membaca `data.route`); keduanya tidak ada bila notifikasi tanpa rute.
        Bagian `notification` push hanya judul dan isi ringkas (alamat email/nomor telepon disamarkan sebagai
        pertahanan berlapis) dengan collapse key = id notifikasi, sehingga pengiriman ulang menggantikan, bukan
        menggandakan, notifikasi di baki perangkat. Rute tersimpan yang bukan rute aplikasi sah (§8.4) tidak pernah
        dikirim: `deep_link` menjadi null. Katalog rute per kategori:

        | rute (path)              | kategori lazim   |
        | ------------------------ | ---------------- |
        | `/payments/<payment_id>` | payment          |
        | `/payments`              | payment          |
        | `/kta`                   | membership       |
        | `/renewal`               | membership       |
        | `/events/<event_id>`     | event            |
        | `/tickets/<ticket_id>`   | event            |
        | `/news/<slug>`           | news             |
        | `/chat/<room_id>`        | chat             |
        | `/chat/invitations`      | chat             |
        | `/account/sessions`      | security         |
        | `/account/reports`       | account          |
        | `/restricted`            | account          |
        | `/deletion-status`       | account          |
        | `/notifications`         | semua (cadangan) |

        Rute yang tidak dikenal klien membuka kotak masuk. Rute bukan izin akses: membuka rute tetap memerlukan
        autentikasi dan otorisasi endpoint tujuan (AC F13-3, F13-5). Payload push di layar kunci tidak pernah
        memuat isi chat, bukti bayar atau kontak (F-13).
      properties:
        id:
          type: string
          format: uuid
        category:
          $ref: "#/components/schemas/NotificationCategory"
        title:
          type: string
        body:
          type:
            - string
            - "null"
          description: Teks ringkas tanpa isi chat, bukti bayar atau kontak (F-13).
        deep_link:
          type:
            - string
            - "null"
          maxLength: 320
          pattern: ^kapdh://app/[A-Za-z0-9/_.-]*$
          description: |
            Tujuan saat diketuk dalam bentuk eksternal `kapdh://app` + rute (lihat katalog di atas); null bila
            notifikasi hanya informasi. Klien memeriksa sesi sebelum membuka (AC F13-3).
          examples:
            - kapdh://app/payments/0192f0c2-7c1e-7d5a-9a51-1f1c2b3d4e5f
        read_at:
          type:
            - string
            - "null"
          format: date-time
        created_at:
          type: string
          format: date-time
    KtaVerification:
      type: object
      description: |
        Hasil verifikasi publik. Keempat field selalu dikirim; `member` null bila tidak berlaku dan `expiring` false
        untuk semua hasil selain active yang sisa masanya <= 30 hari (AC F06-1).
      required:
        - result
        - checked_at
        - expiring
        - member
      properties:
        result:
          $ref: "#/components/schemas/KtaVerificationResult"
        checked_at:
          type: string
          format: date-time
          description: Waktu pemeriksaan server (AC F06-1).
        expiring:
          type: boolean
          description: |
            True bila result active dan sisa masa <= 30 hari (tetap Aktif dengan tanggal habis, AC F06-1); false
            untuk hasil lain.
        member:
          oneOf:
            - $ref: "#/components/schemas/KtaVerifiedMember"
            - type: "null"
          description: |
            Identitas minimum untuk result active/expired; null untuk hasil lain dan untuk expired dari token yang
            `exp`-nya lewat lebih dari 30 hari.
    KtaVerificationResult:
      type: string
      enum:
        - active
        - expired
        - inactive
        - not_found
        - invalid_token
      description: |
        Aktif (termasuk expiring), Kedaluwarsa, Tidak aktif, Tidak ditemukan, QR tidak valid atau perlu
        diperbarui (F-06). Urutan penilaian ada di deskripsi POST /public/kta/verify; token yang `exp`-nya lewat
        tidak pernah menghasilkan `active` (AC F06-3). "Tidak dapat memverifikasi" adalah keadaan klien saat API
        tidak terjangkau atau membalas 429/5xx (AC F06-4).
    KtaVerifiedMember:
      type: object
      description: |
        Identitas minimum yang disahkan D3; hanya untuk result active atau expired. Untuk expired dari token yang
        `exp`-nya lewat, hanya bila `exp` paling lama 30 hari sebelum checked_at (lihat POST /public/kta/verify).
      required:
        - full_name
        - cohort_code
        - member_number
        - expires_at
        - avatar_url
      properties:
        full_name:
          type: string
        cohort_code:
          type: string
          examples:
            - KAPDH 29
        member_number:
          $ref: "#/components/schemas/MemberNumber"
        expires_at:
          type: string
          format: date-time
          description: Masa berlaku (tanggal habis).
        avatar_url:
          type:
            - string
            - "null"
          format: uri
          description: Foto untuk dicocokkan pemeriksa; hanya untuk result active, URL berumur pendek.
    KtaVerifyRequest:
      type: object
      required:
        - member_number
        - token
      additionalProperties: false
      properties:
        member_number:
          $ref: "#/components/schemas/MemberNumber"
        token:
          type: string
          minLength: 16
          maxLength: 2048
          description: Token QR dibaca shell dari fragmen URL (#t=); tidak pernah dicatat di log.
    LegalConsentVersions:
      type: object
      description: |
        Versi persetujuan registrasi (F-01: "Persetujuan privasi dan ketentuan dicatat beserta versi serta
        waktunya"). Server menyusunnya dari `app_settings.legal` saat dibaca, tidak pernah dari klien:
        `policy_version = "privacy:" + privacy_version + ";terms:" + terms_version` (urutan tetap, tanpa spasi),
        misalnya `privacy:3;terms:1`. Klien menampilkan kedua dokumen lalu mengirim `policy_version` apa adanya
        sebagai `accept_policy_version` (POST /auth/register); server membandingkannya dengan nilai terkini
        `app_settings.legal` dan menyimpannya di `users.policy_version`, sehingga dua teks yang disetujui dapat
        direproduksi dari audit `page.published`. Bila salah satu dokumen belum pernah terbit, `policy_version`
        null dan registrasi belum dapat dibuka (PRD 8.2 langkah 4 memblokir go-live).
      required:
        - policy_version
        - privacy_version
        - terms_version
      properties:
        policy_version:
          type:
            - string
            - "null"
          pattern: ^privacy:[1-9][0-9]*;terms:[1-9][0-9]*$
          maxLength: 64
          examples:
            - privacy:3;terms:1
        privacy_version:
          type:
            - string
            - "null"
          description: Versi tayang kebijakan-privasi; null bila belum pernah terbit.
          examples:
            - "3"
        terms_version:
          type:
            - string
            - "null"
          description: Versi tayang ketentuan; null bila belum pernah terbit.
          examples:
            - "1"
    LegalVersions:
      type: object
      description: |
        Versi terbit halaman legal (published_version pages) yang dirujuk persetujuan pengguna (F-01); null bila
        halaman belum pernah terbit. Konten halaman dibaca dari GET /public/pages/{slug} (domain content).
      required:
        - privacy_version
        - terms_version
        - community_version
      properties:
        privacy_version:
          type:
            - string
            - "null"
        terms_version:
          type:
            - string
            - "null"
        community_version:
          type:
            - string
            - "null"
    LikeState:
      type: object
      required:
        - liked
        - like_count
      properties:
        liked:
          type: boolean
        like_count:
          type: integer
          minimum: 0
    LoginNext:
      type: string
      enum:
        - home
        - verify_otp
        - deletion_pending
        - account_disabled
      description: |
        Langkah berikut setelah sandi benar (PRD 2.2): `home` sesi diterbitkan, rute dari effective_status GET /me
        (AC F02-1); `verify_otp` akun pending_otp, lanjut OTP dengan `challenge`; `deletion_pending` tampilkan
        status `deletion` (rute /deletion-status); `account_disabled` akun dinonaktifkan, tampilkan bantuan.
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 128
        device_name:
          type: string
          maxLength: 80
          description: Nama perangkat untuk daftar sesi. Platform/versi aplikasi dibaca dari header X-App-*.
    LoginResponse:
      type: object
      required:
        - next
      properties:
        next:
          $ref: "#/components/schemas/LoginNext"
        session:
          $ref: "#/components/schemas/TokenPair"
          description: Hanya bila next=home.
        challenge:
          $ref: "#/components/schemas/OtpChallenge"
          description: Hanya bila next=verify_otp.
        deletion:
          $ref: "#/components/schemas/AccountDeletion"
          description: Hanya bila next=deletion_pending; status permintaan penghapusan terbuka (F-14).
    MaintenanceStatus:
      type: object
      required:
        - active
        - message
        - until
      properties:
        active:
          type: boolean
        message:
          type:
            - string
            - "null"
          description: Penjelasan rentang/dampak untuk pengguna (PRD 4.5).
        until:
          type:
            - string
            - "null"
          format: date-time
          description: Perkiraan selesai bila diketahui.
    MarkNotificationsReadRequest:
      type: object
      description: |
        Isi tepat salah satu: `ids`, atau `all: true` (opsional dengan `up_to`). Selain itu 400 VALIDATION_ERROR.
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            format: uuid
        all:
          type: boolean
          description: True untuk menandai seluruh kotak masuk.
        up_to:
          type: string
          format: date-time
          description: Hanya bersama `all`; batas created_at (inklusif) yang ditandai.
    MarkNotificationsReadResult:
      type: object
      required:
        - updated_count
        - unread_count
      properties:
        updated_count:
          type: integer
          minimum: 0
          description: Jumlah notifikasi yang baru ditandai pada permintaan ini.
        unread_count:
          type: integer
          minimum: 0
    MasterItem:
      type: object
      required:
        - id
        - label
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
        active:
          type: boolean
          description: |
            Dikirim pada profil; false berarti master sudah dinonaktifkan dan hanya tampil sebagai label historis
            (AC F10-4). Daftar GET /masters/{kind} hanya berisi master aktif.
    MasterItemList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MasterItem"
    MasterKind:
      type: string
      enum:
        - professions
        - skills
      description: Jenis master terkontrol (master_professions, master_skills; PRD 6.2).
    Me:
      type: object
      description: |
        Profil sendiri dan status untuk perutean klien (PRD 2.2). Tidak memuat sandi, token, NIK atau alasan
        suspend internal (hanya `suspension_message` yang aman ditampilkan).
      required:
        - user_id
        - email
        - account_status
        - effective_status
        - member_number
        - cohort_code
        - starts_at
        - expires_at
        - renewal_eligible
        - renewal_opens_at
        - registration_payment
        - renewal_payment
        - suspension_message
        - profile
        - version
      properties:
        user_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        account_status:
          $ref: "#/components/schemas/AccountStatus"
        effective_status:
          $ref: "#/components/schemas/EffectiveStatus"
        member_number:
          oneOf:
            - $ref: "#/components/schemas/MemberNumber"
            - type: "null"
          description: Dialokasikan sekali saat OTP pendaftaran terverifikasi (AC F01-2, F05-1).
        cohort_code:
          type: string
          examples:
            - KAPDH 29
          description: '"KAPDH" + angkatan (PRD 3.5).'
        starts_at:
          type:
            - string
            - "null"
          format: date-time
          description: Mulai periode berjalan; null bila iuran pendaftaran belum paid.
        expires_at:
          type:
            - string
            - "null"
          format: date-time
          description: Akhir periode; keanggotaan berakhir saat now >= expires_at (PRD 2.1).
        renewal_eligible:
          type: boolean
          description: |
            True bila anggota boleh memulai atau melanjutkan iuran renewal: jendela renewal terbuka
            (now >= renewal_opens_at, juga setelah expired) dan effective_status tidak suspended (AC F07-5, PRD 2.2).
        renewal_opens_at:
          type:
            - string
            - "null"
          format: date-time
          description: expires_at dikurangi 30 hari; null bila belum pernah aktif.
        registration_payment:
          oneOf:
            - $ref: "#/components/schemas/MeMembershipPayment"
            - type: "null"
          description: Payment registration nonterminal (pending/rejected) milik sendiri; null bila tidak ada.
        renewal_payment:
          oneOf:
            - $ref: "#/components/schemas/MeMembershipPayment"
            - type: "null"
          description: Payment renewal nonterminal (pending/rejected) milik sendiri; null bila tidak ada.
        suspension_message:
          type:
            - string
            - "null"
          description: Pesan aman untuk portal pembatasan; null bila tidak suspended. Alasan internal tidak dikirim.
        profile:
          $ref: "#/components/schemas/Profile"
        version:
          type: string
          description: Versi profil alumni untuk If-Match (AC F15-4).
    MeMembershipPayment:
      type: object
      description: Penunjuk ringkas iuran keanggotaan nonterminal; detail lengkap dari GET /me/payments/{paymentId}.
      required:
        - id
        - stage
        - amount
        - proof_version
        - created_at
        - submitted_at
        - decided_at
        - rejection_reason
      properties:
        id:
          type: string
          format: uuid
        stage:
          $ref: "#/components/schemas/MeMembershipPaymentStage"
        amount:
          $ref: "#/components/schemas/Money"
        proof_version:
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time
        submitted_at:
          type:
            - string
            - "null"
          format: date-time
          description: Waktu bukti terakhir dikirim.
        decided_at:
          type:
            - string
            - "null"
          format: date-time
        rejection_reason:
          type:
            - string
            - "null"
          description: Alasan penolakan untuk pemilik pembayaran (AC F04-2); null kecuali stage rejected.
    MeMembershipPaymentStage:
      type: string
      enum:
        - awaiting_proof
        - awaiting_review
        - rejected
      description: |
        Tahap iuran terbuka untuk perutean layar (PRD 4.3): awaiting_proof = pending tanpa bukti (proof_version 0),
        awaiting_review = pending dengan bukti menunggu keputusan pengurus, rejected = ditolak dan dapat diperbaiki
        dengan payment yang sama (AC F03-3).
    MemberCard:
      type: object
      description: |
        KTA digital (PRD 3.5, guideline hal. 6, prototipe layar 6/7). Tidak memuat kontak, alamat lengkap, email
        atau secret. Field nullable selalu dikirim (null bila tidak berlaku).
      required:
        - status_label
        - member_number
        - full_name
        - cohort
        - cohort_code
        - graduation_year
        - qr
        - expires_at
        - profession_label
        - city
        - avatar_url
        - action
        - open_payment_id
        - renewal_opens_at
        - offline_valid_until
        - synced_at
      properties:
        status_label:
          $ref: "#/components/schemas/MemberCardStatus"
        member_number:
          $ref: "#/components/schemas/MemberNumber"
        full_name:
          type: string
        cohort:
          type: integer
          minimum: 1
          maximum: 99
          description: Angkatan untuk baris "Angkatan n | Profesi" (PRD 3.5).
        cohort_code:
          type: string
          examples:
            - KAPDH 29
        graduation_year:
          type: integer
          description: Tahun lulus (1996 + angkatan) yang ditampilkan terpisah di kartu (PRD 3.5).
        profession_label:
          type:
            - string
            - "null"
          description: |
            Profesi utama (pertama di Profile.professions) untuk baris "Angkatan n | Profesi"; label historis tetap
            tampil (AC F10-4).
        city:
          type:
            - string
            - "null"
          description: Kota domisili saja (disahkan v3.3).
        avatar_url:
          type:
            - string
            - "null"
          format: uri
          description: Foto (publik atau bertanda tangan maksimal 10 menit); klien menyimpan salinan gambar untuk offline. Null bila belum ada foto dan selalu null pada kartu `suspended` (klien memakai inisial).
        expires_at:
          type:
            - string
            - "null"
          format: date-time
          description: Berlaku sampai; null untuk kartu Tidak Aktif (belum pernah paid).
        qr:
          oneOf:
            - $ref: "#/components/schemas/MemberCardQr"
            - type: "null"
          description: Null bila status inactive, expired atau suspended.
        action:
          oneOf:
            - $ref: "#/components/schemas/MemberCardAction"
            - type: "null"
          description: |
            Null bila tidak ada tindakan, mis. verified sebelum jendela renewal (tampilkan Perpanjang nonaktif
            dengan renewal_opens_at) atau suspended.
        open_payment_id:
          type:
            - string
            - "null"
          format: uuid
          description: Iuran registration/renewal nonterminal yang dirujuk action continue_payment.
        renewal_opens_at:
          type:
            - string
            - "null"
          format: date-time
        offline_valid_until:
          type:
            - string
            - "null"
          format: date-time
          description: |
            Batas tampilan offline berlabel Offline = min(synced_at + 7 hari, expires_at, qr.token_expires_at);
            null bila kartu tidak boleh tampil aktif secara offline (AC F05-2, F05-3).
        synced_at:
          type: string
          format: date-time
          description: Waktu server saat kartu dibuat; ditampilkan sebagai waktu sinkronisasi terakhir.
    MemberCardAction:
      type: string
      enum:
        - pay_registration
        - continue_payment
        - renew
      description: |
        Ajakan utama pada kartu (tombol Bayar/Perpanjang, guideline hal. 6): pay_registration = unverified tanpa
        iuran pendaftaran terbuka (/onboarding/fees); continue_payment = ada iuran registration/renewal terbuka
        (`open_payment_id`, /payments/{id}); renew = jendela renewal terbuka tanpa iuran renewal terbuka
        (/renewal).
    MemberCardQr:
      type: object
      description: Ada hanya bila status kartu active atau expiring (F-05).
      required:
        - url
        - token_expires_at
      properties:
        url:
          type: string
          format: uri
          description: |
            Isi QR: `${PUBLIC_WEB_URL}/kta/{member_number}#t={token}`; token di fragmen agar tidak terkirim ke
            server web (F-06). Jangan dicatat di log.
          examples:
            - https://kapdh.or.id/kta/29.01.01.7#t=eyJ...
          x-sensitive: true
        token_expires_at:
          type: string
          format: date-time
          description: min(diterbitkan + 7 hari, expires_at) (PRD 3.5).
    MemberCardStatus:
      type: string
      enum:
        - active
        - expiring
        - inactive
        - expired
        - suspended
      description: Label status kartu, selalu ditampilkan dengan teks, bukan warna saja (PRD 4.5). active = KTA Aktif (verified); expiring = tetap aktif dengan tanggal habis (sisa <= 30 hari); inactive = KTA Tidak Aktif (unverified, iuran pendaftaran belum paid, F-05; tidak dapat dipakai sebagai bukti keanggotaan); expired = KTA Kedaluwarsa dengan ajakan perpanjang (PRD 2.2); suspended = dibatasi pengurus, tanpa QR.
    MemberNumber:
      type: string
      pattern: ^[0-9]{2}\.0[1-3]\.0[12]\.[1-9][0-9]*$
      description: |
        Nomor anggota AA.SS.JK.N (PRD 3.5): AA angkatan 2 digit, SS status pendidikan, JK 01 laki-laki/02
        perempuan, N nomor urut global dari sequence server tanpa nol di depan. Tidak pernah dikirim/ditentukan
        klien (AC F05-6).
      examples:
        - 29.01.01.7
    Membership:
      type: object
      required:
        - effective_status
        - member_number
        - card_issued_at
        - starts_at
        - expires_at
        - renewal_eligible
        - renewal_opens_at
        - renewal_payment
        - periods
      properties:
        effective_status:
          $ref: "#/components/schemas/EffectiveStatus"
        member_number:
          oneOf:
            - $ref: "#/components/schemas/MemberNumber"
            - type: "null"
        card_issued_at:
          type:
            - string
            - "null"
          format: date-time
          description: Waktu nomor anggota dialokasikan dan KTA Tidak Aktif dibuat (OTP pendaftaran, AC F05-1).
        starts_at:
          type:
            - string
            - "null"
          format: date-time
        expires_at:
          type:
            - string
            - "null"
          format: date-time
        renewal_eligible:
          type: boolean
          description: Sama dengan Me.renewal_eligible (jendela terbuka dan tidak suspended, AC F07-5).
        renewal_opens_at:
          type:
            - string
            - "null"
          format: date-time
        renewal_payment:
          oneOf:
            - $ref: "#/components/schemas/MeMembershipPayment"
            - type: "null"
        periods:
          type: array
          description: Histori periode activation/renewal, terbaru lebih dulu.
          items:
            $ref: "#/components/schemas/MembershipPeriod"
    MembershipPaymentType:
      type: string
      enum:
        - registration
        - renewal
      description: Jenis iuran keanggotaan yang dapat dibuat anggota sendiri; tiket dibuat lewat reservasi event (F-09).
    MembershipPeriod:
      type: object
      description: Satu periode hasil satu payment paid (UNIQUE payment_id, PRD 6.4).
      required:
        - kind
        - starts_at
        - expires_at
        - approved_at
        - payment_id
      properties:
        kind:
          $ref: "#/components/schemas/MembershipPeriodKind"
        starts_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        approved_at:
          type: string
          format: date-time
          description: Waktu payment disetujui pengurus.
        payment_id:
          type:
            - string
            - "null"
          format: uuid
    MembershipPeriodKind:
      type: string
      enum:
        - activation
        - renewal
      description: |
        Kosakata sama dengan membership_events.kind (PRD 6.3) dan AdminMembershipEventKind: activation = periode
        pertama dari iuran pendaftaran (payment type registration) yang disetujui; renewal = perpanjangan.
    MinAppVersion:
      type: object
      description: Versi minimum per platform (semver); mutasi dari versi lebih rendah ditolak 426 (PRD 4.5).
      required:
        - android
        - ios
      properties:
        android:
          type: string
          examples:
            - 1.0.0
        ios:
          type: string
          examples:
            - 1.0.0
    ModerationAction:
      type: string
      enum:
        - dismiss
        - warn
        - suspend
        - unsuspend
      description: Tindakan keputusan moderasi (reports.action, AC F12-3).
    ModerationAdminRef:
      type: object
      required:
        - admin_id
        - display_name
      properties:
        admin_id:
          type: string
          format: uuid
        display_name:
          type: string
          maxLength: 120
    ModerationHistoryKind:
      type: string
      enum:
        - warn
        - suspend
        - unsuspend
      description: Jenis keputusan moderasi pada riwayat keanggotaan (membership_events).
    ModerationOutcome:
      type: string
      enum:
        - no_action
        - action_taken
      description: |
        Hasil yang terlihat pelapor tanpa merinci tindakan terhadap pihak lain (AC F12-2): no_action untuk dismiss,
        action_taken untuk warn/suspend/unsuspend. Untuk banding: action_taken = dikabulkan (suspend dicabut lewat
        keputusan banding atau ditutup otomatis karena suspend dicabut lewat jalur lain), no_action = ditolak.
    ModerationReport:
      type: object
      description: |
        Laporan atau banding dari sudut pandang pelapor; tanpa bukti, tanpa identitas pengurus, tanpa catatan
        internal keputusan, dan tanpa reporter_id/target_user_id (AC F12-2). additionalProperties: false agar uji
        kontrak menolak respons yang membocorkan field tersebut.
      additionalProperties: false
      required:
        - id
        - category
        - target_type
        - target_name
        - room_name
        - description
        - status
        - priority
        - outcome
        - decision_message
        - created_at
        - due_at
        - resolved_at
      properties:
        id:
          type: string
          format: uuid
        category:
          $ref: "#/components/schemas/ModerationReportCategory"
        target_type:
          $ref: "#/components/schemas/ModerationTargetType"
        target_name:
          type:
            - string
            - "null"
          description: Nama pengguna terlapor atau pengirim pesan; null untuk laporan grup atau akun yang dihapus.
        room_name:
          type:
            - string
            - "null"
          description: Nama grup untuk laporan grup atau pesan di grup.
        description:
          type:
            - string
            - "null"
          maxLength: 2000
          x-sensitive: true
        status:
          $ref: "#/components/schemas/ModerationReportStatus"
        priority:
          $ref: "#/components/schemas/ModerationReportPriority"
        outcome:
          oneOf:
            - $ref: "#/components/schemas/ModerationOutcome"
            - type: "null"
          description: Null sampai laporan diputus.
        decision_message:
          type:
            - string
            - "null"
          maxLength: 500
          description: Pesan pengurus untuk pemohon; hanya terisi pada banding yang sudah diputus.
        created_at:
          type: string
          format: date-time
        due_at:
          type: string
          format: date-time
          description: Target penanganan (24 jam / 2 hari kerja).
        resolved_at:
          type:
            - string
            - "null"
          format: date-time
    ModerationReportCategory:
      type: string
      enum:
        - spam
        - harassment
        - hate
        - sexual
        - violence_threat
        - scam
        - other
        - appeal
      description: |
        Kategori laporan (reports.category). violence_threat = risiko ancaman/keselamatan dan sexual = konten
        seksual, termasuk eksploitasi seksual anak (keputusan PP K5): keduanya prioritas urgent dengan target 24 jam;
        appeal = banding pemohon atas dirinya sendiri (hanya lewat POST /appeals).
    ModerationReportInputCategory:
      type: string
      enum:
        - spam
        - harassment
        - hate
        - sexual
        - violence_threat
        - scam
        - other
      description: Kategori yang dapat dipilih pelapor (tanpa appeal).
    ModerationReportPage:
      type: object
      required:
        - items
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ModerationReport"
        next_cursor:
          type:
            - string
            - "null"
    ModerationReportPriority:
      type: string
      enum:
        - normal
        - urgent
      description: |
        urgent = risiko ancaman/keselamatan (violence_threat) atau konten seksual (sexual, keputusan PP K5), target
        24 jam; normal = 2 hari kerja (v3.2).
    ModerationReportStatus:
      type: string
      enum:
        - open
        - in_review
        - resolved
        - dismissed
      description: |
        Siklus laporan: open -> in_review (diklaim pengurus) -> resolved (warn/suspend/unsuspend) | dismissed
        (dismiss). open juga dapat langsung diputus.
    ModerationTargetType:
      type: string
      enum:
        - user
        - message
        - room
      description: Jenis objek yang dilaporkan (reports.target_type).
    Money:
      type: string
      pattern: ^[0-9]+\.[0-9]{2}$
      description: Nominal IDR sebagai string desimal dua angka di belakang titik, misalnya "60000.00" (PRD 6.1).
      examples:
        - "60000.00"
    MyFeeQuotes:
      type: object
      description: Kutipan iuran pendaftaran dan perpanjangan untuk pemanggil (prototipe screen_2).
      required:
        - registration
        - renewal
        - period_months
        - settings_version
        - instructions_hidden
      properties:
        registration:
          $ref: "#/components/schemas/FeeQuote"
        renewal:
          $ref: "#/components/schemas/FeeQuote"
        instructions_hidden:
          type: boolean
          description: |
            True bila platform pemanggil (`X-App-Platform`) menyembunyikan instruksi iuran (pengaturan
            `payment_instructions`, rencana cadangan D13). Klien tidak menampilkan alur bayar iuran dan mengarahkan
            anggota ke kontak dukungan; POST /me/payments dari platform ini ditolak 403 FORBIDDEN. Tanpa header
            `X-App-Platform` platform dianggap tidak menyembunyikan instruksi.
        period_months:
          type: integer
          minimum: 1
          description: Lama periode per iuran paid (12 bulan kalender sejak disetujui, PRD 2.1, D4).
        settings_version:
          type: string
          description: |
            Versi pengaturan `fees` yang dipakai kutipan ini. "0" berarti nominal belum tersimpan (kutipan memakai
            nilai bawaan kode); POST /me/payments menolaknya dengan 403 FORBIDDEN sampai pengurus menyimpan nominal.
    NetworkEducationEntry:
      type: object
      description: Satu riwayat pendidikan (bentuk sama dengan EducationEntry di me.yaml), terbaru di atas.
      required:
        - institution
        - major
        - level
        - graduation_year
      additionalProperties: false
      properties:
        institution:
          type: string
          maxLength: 120
        major:
          type:
            - string
            - "null"
          maxLength: 120
        level:
          oneOf:
            - $ref: "#/components/schemas/EducationLevel"
            - type: "null"
        graduation_year:
          type:
            - integer
            - "null"
          minimum: 1950
          maximum: 2100
    NetworkMasterRef:
      type: object
      description: |
        Rujukan master profesi/keahlian pada profil anggota. active=false berarti master sudah dinonaktifkan;
        label historis tetap ditampilkan tetapi tidak dapat dipilih lagi (AC F10-4).
      required:
        - id
        - label
        - active
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
          maxLength: 100
        active:
          type: boolean
    NetworkMemberProfile:
      type: object
      description: |
        Profil anggota untuk anggota lain (guideline p7 + v2: Angkatan, Riwayat Pendidikan, Profesi, Keahlian, Nomor
        Telpon, Tentang, Media Sosial, tombol Kirim Pesan). Kunci `email`, `phone`, `social` dan `social_links`
        hanya ada bila flag privasi pemiliknya aktif; bila mati kuncinya tidak dikirim (AC F10-2). Nilainya dapat
        null (atau [] untuk social_links) bila pemilik mengaktifkan flag tetapi belum mengisi datanya.
      required:
        - user_id
        - full_name
        - cohort
        - cohort_code
        - graduation_year
        - skills
        - professions
        - education
        - is_me
        - is_blocked_by_me
        - can_message
      additionalProperties: false
      properties:
        user_id:
          type: string
          format: uuid
        full_name:
          type: string
          maxLength: 120
        avatar_url:
          type:
            - string
            - "null"
          format: uri
          description: URL avatar (publik atau bertanda tangan maksimal 10 menit, PRD 5.4).
        cohort:
          type: integer
          minimum: 1
          maximum: 99
        cohort_code:
          type: string
          examples:
            - KAPDH 29
        graduation_year:
          type: integer
          description: Tahun lulus = 1996 + angkatan (PRD 3.5).
        city:
          type:
            - string
            - "null"
          maxLength: 80
        profession:
          oneOf:
            - $ref: "#/components/schemas/NetworkMasterRef"
            - type: "null"
          description: Deprecated (aplikasi 1.0.0); pakai `professions`. Profesi pertama yang tertaut master.
        professions:
          type: array
          maxItems: 5
          description: Profesi sesuai urutan pemilik (yang pertama = profesi utama).
          items:
            type: string
            maxLength: 100
        skills:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/NetworkMasterRef"
        education:
          type: array
          maxItems: 10
          description: Riwayat pendidikan, terbaru di atas.
          items:
            $ref: "#/components/schemas/NetworkEducationEntry"
        last_education_institution:
          type:
            - string
            - "null"
          maxLength: 120
          description: Deprecated (aplikasi 1.0.0); pakai `education`. Institusi entri pendidikan teratas.
        last_education_city:
          type:
            - string
            - "null"
          maxLength: 80
          description: Deprecated (aplikasi 1.0.0); kota lulusan terakhir dari aplikasi lama.
        bio:
          type:
            - string
            - "null"
          maxLength: 500
          description: '"Tentang"; teks bebas pemilik profil.'
        email:
          type:
            - string
            - "null"
          format: email
          description: Hanya dikirim bila show_email=true (AC F10-2).
        phone:
          type:
            - string
            - "null"
          maxLength: 24
          description: |
            Hanya dikirim bila show_phone=true; bila false kunci ini tidak ada (AC F10-2). Batas panjang sama dengan
            aturan tulis ProfileUpdate.phone (me.yaml) dan koreksi pengurus (admin-members.yaml), maksimal 24.
        social:
          $ref: "#/components/schemas/NetworkSocialLinks"
        social_links:
          type: array
          maxItems: 10
          description: |
            Tautan sosial sesuai urutan pemilik; hanya dikirim bila show_social=true, bila false kunci ini tidak ada
            (AC F10-2).
          items:
            $ref: "#/components/schemas/NetworkSocialLink"
        is_me:
          type: boolean
          description: True bila profil milik pemanggil (pratinjau tampilan publik).
        is_blocked_by_me:
          type: boolean
          description: True bila pemanggil memblokir anggota ini (F-12); UI menawarkan "Buka blokir".
        can_message:
          type: boolean
          description: |
            True bila pemanggil dapat memulai/melanjutkan pesan langsung. False bila salah satu pihak memblokir atau
            profil milik sendiri; alasan sengaja tidak dibedakan (AC F12-1).
        direct_room_id:
          type:
            - string
            - "null"
          format: uuid
          description: Room direct yang sudah ada antara pemanggil dan anggota ini; null bila belum ada.
    NetworkSocialLink:
      type: object
      description: Satu tautan sosial (bentuk sama dengan SocialLink di me.yaml).
      required:
        - platform
        - value
      additionalProperties: false
      properties:
        platform:
          $ref: "#/components/schemas/SocialPlatform"
        value:
          type: string
          maxLength: 200
    NetworkSocialLinks:
      type: object
      description: |
        Deprecated (aplikasi 1.0.0); pakai `social_links`. Tautan pertama per platform dari empat jaringan lama;
        seluruh objek hanya dikirim bila show_social=true (AC F10-2). Batas panjang sama dengan aturan tulis
        SocialHandle (me.yaml, maksimal 200) agar nilai tersimpan yang sah selalu lolos kontrak baca ini (N-13); ubah
        keduanya bersamaan.
      required:
        - instagram
        - x
        - facebook
        - linkedin
      additionalProperties: false
      properties:
        instagram:
          type:
            - string
            - "null"
          maxLength: 200
        x:
          type:
            - string
            - "null"
          maxLength: 200
        facebook:
          type:
            - string
            - "null"
          maxLength: 200
        linkedin:
          type:
            - string
            - "null"
          maxLength: 200
    NotificationCategory:
      type: string
      enum:
        - payment
        - membership
        - event
        - news
        - chat
        - security
        - account
      description: |
        Kategori notifikasi (ARCHITECTURE §4.7, enum DB notification_category). Push dapat diatur untuk payment,
        membership, event, news, chat; email untuk payment, membership, event; security dan account wajib dan tidak
        dapat dimatikan (F-13).
    NotificationChannel:
      type: string
      enum:
        - push
        - email
      description: Kanal pengiriman (enum DB notification_channel). In-app selalu ditulis dan tidak memiliki baris pengiriman.
    NotificationDeliveryStatus:
      type: string
      enum:
        - pending
        - sent
        - failed
        - cancelled
      description: |
        Status per kanal/perangkat (enum DB delivery_status): `pending` menunggu kirim atau retry terjadwal,
        `sent` diterima provider (bukan bukti dibaca), `failed` gagal permanen atau melewati batas retry,
        `cancelled` dibatalkan (preferensi dimatikan, token dicabut, token berpindah ke akun lain, akun dihapus atau
        dinonaktifkan, push tidak dikonfigurasi; alasan di `error_class`).
        Label UI: Menunggu, Terkirim, Gagal, Dibatalkan.
    NotificationPage:
      type: object
      required:
        - items
        - next_cursor
        - unread_count
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/InboxNotification"
        next_cursor:
          type:
            - string
            - "null"
        unread_count:
          type: integer
          minimum: 0
          description: Jumlah belum dibaca di seluruh kotak masuk pemanggil (tidak dipengaruhi filter).
    NotificationPreferences:
      type: object
      required:
        - push
        - email
        - mandatory_categories
        - updated_at
      properties:
        push:
          $ref: "#/components/schemas/PushPreferences"
        email:
          $ref: "#/components/schemas/EmailPreferences"
        mandatory_categories:
          type: array
          description: Kategori wajib tanpa saklar, selalu [security, account] (ARCHITECTURE §4.7).
          items:
            $ref: "#/components/schemas/NotificationCategory"
        updated_at:
          type:
            - string
            - "null"
          format: date-time
          description: Waktu perubahan terakhir; null bila pengguna belum pernah mengubah default.
    NotificationPreferencesUpdate:
      type: object
      required:
        - push
        - email
      description: Penggantian penuh preferensi; semua saklar wajib dikirim.
      properties:
        push:
          $ref: "#/components/schemas/PushPreferences"
        email:
          $ref: "#/components/schemas/EmailPreferences"
    NotificationUnreadCount:
      type: object
      required:
        - unread_count
      properties:
        unread_count:
          type: integer
          minimum: 0
    OtpChallenge:
      type: object
      description: |
        Challenge OTP tanpa kode (AC F01-1). Layar OTP menampilkan email tujuan, masa berlaku 10 menit, sisa
        percobaan "n dari 5" dan hitung mundur kirim ulang (prototype screen_1_otp).
      required:
        - challenge_id
        - purpose
        - email_masked
        - expires_at
        - resend_available_at
        - attempts_left
      properties:
        challenge_id:
          type: string
          format: uuid
        purpose:
          $ref: "#/components/schemas/OtpPurpose"
        email_masked:
          type: string
          maxLength: 254
          examples:
            - ah***@kapdh.test
          description: Email tujuan yang disamarkan; klien boleh menampilkan email lengkap yang diketik pengguna sendiri.
        expires_at:
          type: string
          format: date-time
          description: Batas berlaku kode (10 menit, PRD 2.5).
        resend_available_at:
          type: string
          format: date-time
          description: Kirim ulang tersedia mulai waktu ini (cooldown 60 detik, PRD 2.5).
        attempts_left:
          type: integer
          minimum: 0
          maximum: 5
        max_attempts:
          type: integer
          minimum: 1
          maximum: 5
          examples:
            - 5
          description: Batas percobaan per challenge (5, PRD 2.5) untuk label "Sisa percobaan n dari 5".
    OtpChallengeStatusRequest:
      type: object
      description: Permintaan baca keadaan challenge (POST /auth/otp/status); tidak memuat kode.
      required:
        - challenge_id
      properties:
        challenge_id:
          type: string
          format: uuid
          description: Dari respons penerbit challenge atau parameter `challenge` tautan email pemulihan (AC F16-4).
    OtpPurpose:
      type: string
      enum:
        - signup
        - email_change
        - password_reset
        - deletion
      description: |
        Tujuan challenge OTP; kode terikat akun, tujuan dan challenge_id (PRD 2.5). `signup` pendaftaran,
        `email_change` koreksi email akun pending_otp (PRD 2.2), `password_reset` lupa sandi (F-02), `deletion`
        penghapusan/pemeriksaan status dari web (F-14), termasuk pembatalan pendaftaran `pending_otp`. `signup` dan `email_change` berbagi satu slot aktivasi:
        paling banyak satu dari keduanya aktif per akun.
    OtpResendRequest:
      type: object
      required:
        - challenge_id
      properties:
        challenge_id:
          type: string
          format: uuid
    OtpVerifyRequest:
      type: object
      required:
        - challenge_id
        - code
      properties:
        challenge_id:
          type: string
          format: uuid
        code:
          type: string
          pattern: ^[0-9]{6}$
          x-sensitive: true
        device_name:
          type: string
          maxLength: 80
          description: Nama perangkat untuk daftar sesi, misalnya "Samsung A54". Platform/versi dari header X-App-*.
    OtpVerifyResponse:
      type: object
      description: Hasil verifikasi signup/email_change; akun aktif dengan effective_status unverified (AC F01-2).
      required:
        - session
      properties:
        session:
          $ref: "#/components/schemas/TokenPair"
    PageLegalDocument:
      type: string
      enum:
        - privacy
        - terms
        - community
      description: |
        Dokumen legal berversi yang versi tayangnya dicerminkan di `app_settings.legal` (`privacy_version`,
        `terms_version`, `community_version`; ARCHITECTURE §5.4): `privacy` = kebijakan-privasi, `terms` =
        ketentuan, `community` = ketentuan-komunitas. Setiap dokumen memiliki penghitung versi sendiri.
        Persetujuan registrasi (F-01) mencakup `privacy` dan `terms` melalui `LegalConsentVersions.policy_version`;
        `community` dibaca sebelum fitur komunitas dibuka (PRD 3.12) dan tidak termasuk string persetujuan R1.0.
    Password:
      type: string
      minLength: 2
      maxLength: 72
      description: |
        Sandi 8 sampai 72 BYTE UTF-8 (bukan karakter) dengan huruf besar, huruf kecil, angka, dan simbol
        (PRD 2.5, batas input bcrypt). minLength/maxLength JSON Schema menghitung code point, sehingga di sini
        hanya batas longgar (2..72 code point) yang tidak pernah menolak sandi valid; aturan byte ditegakkan
        server dan klien memakai checkPassword (@kapdh/shared) atau padanannya. Server menolak, tidak memotong.
      x-kapdh-utf8-bytes:
        min: 8
        max: 72
    PasswordResetGrant:
      type: object
      description: |
        Izin sekali pakai untuk menyimpan sandi baru (AC F02-4). Simpan hanya di memori layar /forgot/reset; jangan
        dipersistenkan atau dicatat.
      required:
        - reset_token
        - expires_at
      properties:
        reset_token:
          type: string
          maxLength: 512
          x-sensitive: true
          description: |
            JWT audience kapdh-password-reset yang terikat akun, challenge yang dikonsumsi dan password_hash saat ini;
            tidak berlaku lagi setelah sandi berganti (sekali pakai tanpa penyimpanan token).
        expires_at:
          type: string
          format: date-time
          description: Berlaku 10 menit sejak OTP diverifikasi.
    PasswordResetVerifyRequest:
      type: object
      required:
        - challenge_id
        - code
      properties:
        challenge_id:
          type: string
          format: uuid
        code:
          type: string
          pattern: ^[0-9]{6}$
          x-sensitive: true
    Payment:
      type: object
      description: |
        Pembayaran milik anggota (F-03). Nilai `amount` dan `lines` adalah snapshot server saat instruksi dibuat;
        perubahan pengaturan biaya tidak mengubahnya (AC F03-5). Field nullable tidak dikirim bila kosong.
      required:
        - id
        - type
        - status
        - stage
        - amount
        - lines
        - method
        - proof_version
        - created_at
        - version
        - actions
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/PaymentType"
        status:
          $ref: "#/components/schemas/PaymentStatus"
        stage:
          $ref: "#/components/schemas/PaymentStage"
        amount:
          $ref: "#/components/schemas/Money"
        lines:
          type: array
          items:
            $ref: "#/components/schemas/PaymentLine"
        method:
          $ref: "#/components/schemas/PaymentMethod"
        proof_version:
          type: integer
          minimum: 0
          description: Versi bukti aktif; 0 berarti belum ada bukti (PRD 4.3).
        proof_file_id:
          type:
            - string
            - "null"
          format: uuid
          description: |
            Bukti aktif yang diunggah pemanggil sendiri; dibuka lewat GET /files/{fileId}/access (URL <= 10 menit).
            Tidak dikirim bila bukti aktif dicatat pengurus (POST /admin/payments, rencana cadangan D13), karena
            berkas pengurus dapat memuat data pihak lain (N-09, PRD 5.4).
        transfer_note:
          type:
            - string
            - "null"
          description: |
            Catatan transfer dari pemilik untuk bukti aktif. Tidak dikirim bila bukti aktif dicatat pengurus (catatan
            itu milik pengurus).
        submitted_at:
          type:
            - string
            - "null"
          format: date-time
          description: Waktu server saat bukti aktif dikirim.
        decided_at:
          type:
            - string
            - "null"
          format: date-time
          description: Waktu keputusan terakhir pengurus.
        rejection_reason:
          type:
            - string
            - "null"
          description: Alasan penolakan terakhir, terlihat oleh pemilik (AC F04-2); alasan lama ada di histori.
        cancelled_at:
          type:
            - string
            - "null"
          format: date-time
        cancel_reason:
          type:
            - string
            - "null"
          description: Alasan pembatalan yang aman ditampilkan.
        ticket:
          description: Tiket terkait, hanya untuk type ticket.
          oneOf:
            - $ref: "#/components/schemas/PaymentTicketRef"
            - type: "null"
        period:
          description: Periode keanggotaan hasil payment iuran paid; null selain itu (F-07).
          oneOf:
            - $ref: "#/components/schemas/PaymentMembershipPeriod"
            - type: "null"
        created_at:
          type: string
          format: date-time
        version:
          type: string
          description: Versi optimistic concurrency (If-Match).
        actions:
          $ref: "#/components/schemas/PaymentActions"
    PaymentActions:
      type: object
      description: |
        Tindakan pemilik yang diizinkan server saat respons dibuat (status, jenis, versi bukti, hold tiket dan
        status efektif). Klien menampilkan tombol sesuai field ini; server tetap memeriksa ulang setiap request.
      required:
        - can_submit_proof
        - can_change_method
        - can_cancel
      properties:
        can_submit_proof:
          type: boolean
          description: |
            Kirim/ganti bukti: iuran pending atau rejected; tiket pending dengan tiket awaiting_payment sebelum
            `hold_expires_at` atau awaiting_review. False untuk iuran bila instruksi iuran disembunyikan untuk
            platform pemanggil (D13).
        can_change_method:
          type: boolean
          description: |
            Ganti rekening tujuan (pending tanpa bukti; untuk tiket hanya sebelum `hold_expires_at`). False untuk
            iuran bila instruksi iuran disembunyikan untuk platform pemanggil (D13).
        can_cancel:
          type: boolean
          description: Batalkan instruksi iuran (registration/renewal pending tanpa bukti).
    PaymentAdjustmentKind:
      type: string
      enum:
        - refund
        - correction
      description: |
        refund = pengembalian dana manual oleh bendahara (D6, PRD 3.9); correction = koreksi keuangan administratif
        atas payment paid tanpa mengubah payment asal (PRD 3.4, 4.3).
    PaymentAdjustmentStatus:
      type: string
      enum:
        - pending
        - completed
        - cancelled
      description: pending -> completed | cancelled. Rekening tujuan refund dihapus saat completed/cancelled (D2).
    PaymentAdjustmentSummary:
      type: object
      description: |
        Ringkasan penyesuaian untuk pemilik payment (D6). Alasan internal pengurus dan nilai rekening tujuan refund
        tidak ditampilkan di sini; hanya penanda apakah rekening sudah diberikan.
      required:
        - id
        - kind
        - amount
        - status
        - has_refund_destination
        - destination_required
        - created_at
        - version
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/PaymentAdjustmentKind"
        amount:
          $ref: "#/components/schemas/Money"
        status:
          $ref: "#/components/schemas/PaymentAdjustmentStatus"
        has_refund_destination:
          type: boolean
          description: |
            Rekening tujuan refund sudah tersimpan (oleh pemilik atau dicatat bendahara). Selalu false untuk
            koreksi dan setelah completed/cancelled karena rekening sudah dihapus (D2).
        destination_required:
          type: boolean
          description: |
            True bila kind refund, status pending dan rekening tujuan belum ada. Klien menampilkan formulir rekening
            tujuan (PUT /me/payments/{paymentId}/adjustments/{adjustmentId}/refund-destination) dan kontak dukungan
            sebagai alternatif (D6).
        due_at:
          type:
            - string
            - "null"
          format: date-time
          description: Tenggat bendahara untuk refund (paling lambat 7 hari kerja sejak pembatalan, D6).
        completed_at:
          type:
            - string
            - "null"
          format: date-time
        cancelled_at:
          type:
            - string
            - "null"
          format: date-time
        created_at:
          type: string
          format: date-time
        version:
          type: string
          description: Versi penyesuaian untuk If-Match saat mengirim rekening tujuan.
    PaymentDecision:
      type: object
      description: Keputusan atas versi bukti yang dibaca pengurus (AC F04-3, F04-4).
      required:
        - decision
        - expected_proof_version
        - expected_version
      properties:
        decision:
          $ref: "#/components/schemas/PaymentDecisionKind"
        expected_proof_version:
          type: integer
          minimum: 1
          description: proof_version yang dilihat pengurus di layar detail.
        expected_version:
          type: string
          maxLength: 64
          description: "`version` payment yang dilihat pengurus."
        funds_verified:
          type: boolean
          description: Wajib true untuk approve; menyatakan dana sudah terlihat di rekening tujuan (PRD 3.4).
        reason:
          type: string
          minLength: 3
          maxLength: 500
          pattern: \S
          description: Wajib untuk reject, tidak boleh kosong atau hanya spasi (AC F04-2); diabaikan untuk approve.
    PaymentDecisionKind:
      type: string
      enum:
        - approve
        - reject
    PaymentDetail:
      description: Detail pembayaran milik sendiri beserta histori dan penyesuaian (F-03, AC F03-3).
      allOf:
        - $ref: "#/components/schemas/Payment"
        - type: object
          required:
            - events
            - adjustments
            - method_active
            - instructions_hidden
          properties:
            events:
              type: array
              description: Histori urut waktu naik (terlama dahulu).
              items:
                $ref: "#/components/schemas/PaymentEvent"
            adjustments:
              type: array
              description: Penyesuaian/refund atas payment ini (kosong bila tidak ada).
              items:
                $ref: "#/components/schemas/PaymentAdjustmentSummary"
            method_active:
              type: boolean
              description: |
                False bila metode snapshot sudah dinonaktifkan pengurus; selama belum ada bukti klien menyarankan
                ganti rekening tujuan sebelum transfer.
            instructions_hidden:
              type: boolean
              description: |
                True hanya untuk payment iuran (registration/renewal) bila platform pemanggil (`X-App-Platform`)
                menyembunyikan instruksi iuran (pengaturan `payment_instructions`, rencana cadangan D13). Klien
                tidak menampilkan rekening tujuan, ajakan transfer maupun unggah bukti; hanya status, histori dan
                kontak dukungan. Selalu false untuk tiket dan untuk request tanpa header `X-App-Platform`.
    PaymentEvent:
      type: object
      description: Entri histori status dan bukti untuk timeline (prototipe screen_4 "Riwayat").
      required:
        - at
        - kind
        - actor
      properties:
        at:
          type: string
          format: date-time
        kind:
          $ref: "#/components/schemas/PaymentEventKind"
        actor:
          $ref: "#/components/schemas/PaymentEventActor"
        proof_version:
          type:
            - integer
            - "null"
          description: Versi bukti terkait untuk proof_submitted/proof_replaced/approved/rejected.
        reason:
          type:
            - string
            - "null"
          description: |
            Alasan untuk rejected (AC F03-3, F04-2) dan cancelled; kosong untuk jenis lain. Pada histori pengurus,
            entri created dari payment yang dicatat pengurus (D13) memuat catatan verifikasi; catatan ini tidak
            dikirim kepada anggota.
    PaymentEventActor:
      type: string
      enum:
        - member
        - admin
        - system
      description: |
        Pelaku entri histori. Identitas pengurus tidak ditampilkan kepada anggota; `system` untuk job (misalnya
        hold tiket kedaluwarsa) atau alur otomatis.
    PaymentEventKind:
      type: string
      enum:
        - created
        - method_changed
        - proof_submitted
        - proof_replaced
        - approved
        - rejected
        - cancelled
        - adjusted
      description: |
        Jenis entri histori payment (payment_events, append-only): created, method_changed (rekening tujuan
        diganti), proof_submitted (bukti pertama), proof_replaced (bukti pengganti, termasuk kirim ulang setelah
        ditolak), approved, rejected, cancelled, adjusted (penyesuaian/refund selesai).
    PaymentLine:
      type: object
      description: Satu baris rincian nominal yang dihitung server dan disnapshot pada payment (AC F03-5).
      required:
        - code
        - label
        - amount
      properties:
        code:
          $ref: "#/components/schemas/PaymentLineCode"
        label:
          type: string
          description: Label tampilan berbahasa Indonesia, misalnya "Register alumni baru" atau "Pembuatan KTA".
        amount:
          $ref: "#/components/schemas/Money"
    PaymentLineCode:
      type: string
      enum:
        - registration_fee
        - card_fee
        - renewal_fee
        - ticket
      description: |
        Kode baris iuran (D4, PRD 3.3): registration_fee = register alumni baru, card_fee = pembuatan KTA,
        renewal_fee = perpanjangan KTA per tahun, ticket = harga tiket event (snapshot reservasi).
    PaymentMembershipPeriod:
      type: object
      description: Periode keanggotaan yang dihasilkan payment iuran paid (F-07, membership_events).
      required:
        - starts_at
        - expires_at
      properties:
        starts_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
    PaymentMethod:
      type: object
      description: |
        Rekening tujuan transfer manual milik organisasi (D13). Pada payment, objek ini adalah SNAPSHOT saat
        instruksi dibuat atau metode diganti; perubahan metode oleh pengurus tidak mengubah payment lama (AC F15-3).
        Untuk `kind` qris: `provider` = nama metode (bawaan "QRIS"), `account_number` = NMID, `account_holder` = nama
        merchant, dan `qr_image_url` = gambar QRIS yang dipindai anggota. Gambar ikut snapshot dan tidak dapat
        diganti selama metode pernah dipakai payment (aturan adminUpdatePaymentMethod), sehingga QR pada instruksi
        selalu sama dengan yang disahkan bendahara. Instruksi iuran yang disembunyikan (D13, `instructions_hidden`)
        juga menyembunyikan gambar ini di aplikasi.
      required:
        - id
        - kind
        - provider
        - account_number
        - account_holder
      properties:
        id:
          type: string
          format: uuid
          description: ID metode asal snapshot.
        kind:
          $ref: "#/components/schemas/PaymentMethodKind"
        provider:
          type: string
          description: Nama bank atau e-wallet, misalnya BSI; untuk qris nama metode.
        account_number:
          type: string
          description: Nomor rekening atau akun tujuan organisasi; untuk qris NMID.
        account_holder:
          type: string
          description: Nama pemilik rekening tujuan; untuk qris nama merchant.
        instructions:
          type:
            - string
            - "null"
          description: Petunjuk tambahan dari pengurus (misalnya kode bank), teks polos.
        qr_image_url:
          type:
            - string
            - "null"
          format: uri
          description: |
            URL publik tetap gambar QRIS (berkas purpose `payment_qr`, GET /files/public/{fileId}, cache publik +
            ETag). Terisi hanya untuk `kind` qris; null atau tidak dikirim untuk jenis lain. Opsional agar klien dan
            respons lama tetap sah (aditif, ADR-026).
    PaymentMethodInput:
      type: object
      description: |
        Isi lengkap metode bayar (POST dan PUT penggantian penuh). Spasi di awal/akhir dipangkas server. Pada
        metode `in_use`, `kind`, `provider`, `account_number`, `account_holder` dan gambar QRIS wajib sama dengan
        nilai saat ini. Untuk qris: `provider` nama metode (mis. "QRIS"), `account_number` NMID, `account_holder`
        nama merchant.
      required:
        - kind
        - provider
        - account_number
        - account_holder
        - instructions
        - active
        - sort_order
      properties:
        kind:
          $ref: "#/components/schemas/PaymentMethodKind"
        provider:
          type: string
          minLength: 1
          maxLength: 80
          pattern: \S
        account_number:
          type: string
          minLength: 1
          maxLength: 64
          pattern: \S
        account_holder:
          type: string
          minLength: 1
          maxLength: 120
          pattern: \S
        instructions:
          type:
            - string
            - "null"
          maxLength: 1000
          description: Teks polos tanpa HTML.
        active:
          type: boolean
        sort_order:
          type: integer
          minimum: 0
          maximum: 32767
        qr_image_file_id:
          type:
            - string
            - "null"
          format: uuid
          description: |
            Gambar QRIS (ADR-026): `file_id` hasil adminUploadPaymentQrImage. Wajib untuk `kind` qris dan harus null
            atau tidak dikirim untuk jenis lain. Pada PUT: tidak dikirim = gambar tetap, null = tanpa gambar, UUID =
            ganti gambar. Opsional agar klien lama tetap sah.
    PaymentMethodKind:
      type: string
      enum:
        - bank
        - ewallet
        - qris
      description: |
        Jenis rekening tujuan transfer manual (D13). `qris` (ADR-026): QRIS statis resmi organisasi tanpa nominal;
        anggota memindai gambar `qr_image_url` lalu memasukkan nominal sendiri, kemudian mengunggah bukti seperti
        transfer biasa (tidak ada payment gateway). Klien lama yang belum mengenal nilai ini wajib memperlakukannya
        sebagai jenis tidak dikenal (SDK Dart: `unknown`).
    PaymentMethodList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PaymentMethod"
    PaymentPage:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Payment"
        next_cursor:
          type:
            - string
            - "null"
    PaymentStage:
      type: string
      enum:
        - awaiting_transfer
        - awaiting_review
        - needs_fix
        - rejected_final
        - paid
        - cancelled
      description: |
        Tahap tampilan yang dihitung server dari status, jenis dan versi bukti, agar klien tidak menurunkan aturan
        sendiri (ARCHITECTURE §2 butir 1):
        - awaiting_transfer: pending tanpa bukti (proof_version 0), tampil instruksi bayar (screen_3).
        - awaiting_review: pending dengan bukti, menunggu verifikasi pengurus (screen_4).
        - needs_fix: iuran rejected yang dapat diperbaiki dengan bukti baru (screen_5, "Perlu Perbaikan").
        - rejected_final: tiket rejected; tidak dapat dikirim ulang (AC F09-4).
        - paid: dana terverifikasi pengurus.
        - cancelled: dibatalkan pemilik, pengurus atau sistem.
    PaymentStatus:
      type: string
      enum:
        - pending
        - paid
        - rejected
        - cancelled
      description: |
        Status payment (PRD 4.3, ARCHITECTURE §3.3). pending -> paid | rejected | cancelled; rejected -> pending
        hanya untuk registration/renewal (payment sama, bukti versi baru). Tiket rejected bersifat final. paid
        tidak pernah diubah; koreksi atau refund dicatat sebagai penyesuaian (payment_adjustments). pending ->
        cancelled hanya sebelum bukti (proof_version 0): oleh pemilik, kebijakan pengurus, atau sistem saat hold
        tiket habis atau saat akun pemilik dihapus (F-14). Payment pending yang sudah berbukti tidak pernah
        dibatalkan, juga oleh penghapusan akun, karena dana mungkin sudah ditransfer (PRD 4.4); payment itu tetap
        di antrean dalam bentuk anonim dan wajib diputus pengurus (lihat adminDecidePayment).
    PaymentTicketCancelledBy:
      type: string
      enum:
        - self
        - admin
        - system
      description: Pelaku pembatalan tiket, sama dengan enum DB ticket_cancelled_by (PRD 4.4, D6).
    PaymentTicketEventStatus:
      type: string
      enum:
        - open
        - closed
        - done
        - cancelled
      description: |
        Status event dari sudut pandang payment tiket (PRD 4.4). Draft tidak pernah memiliki tiket sehingga tidak
        muncul di sini.
    PaymentTicketRef:
      type: object
      description: |
        Ringkasan tiket untuk payment jenis ticket (F-09), didefinisikan lokal agar domain payments tidak bergantung
        pada skema Events. Satu tiket = satu kursi untuk pemiliknya sendiri.
      required:
        - ticket_id
        - event_id
        - event_title
        - event_starts_at
        - event_timezone
        - ticket_status
      properties:
        ticket_id:
          type: string
          format: uuid
        event_id:
          type: string
          format: uuid
        event_title:
          type: string
        event_starts_at:
          type: string
          format: date-time
        event_timezone:
          type: string
          description: Zona tampilan event (IANA), misalnya Asia/Jakarta.
        ticket_status:
          $ref: "#/components/schemas/PaymentTicketStatus"
        hold_expires_at:
          type:
            - string
            - "null"
          format: date-time
          description: |
            Batas kirim bukti selama awaiting_payment (24 jam atau registration_closes_at, mana yang lebih dahulu,
            D5); null setelah bukti diterima atau tiket selesai.
        event_status:
          description: |
            Status event saat respons dibuat (salinan baca dari domain Events). `cancelled` berarti event dibatalkan
            pengurus: seluruh QR tidak berlaku dan refund penuh berlaku untuk peserta berbayar (D6). Tidak dikirim
            bila tidak diketahui.
          oneOf:
            - $ref: "#/components/schemas/PaymentTicketEventStatus"
            - type: "null"
        ticket_cancelled_by:
          description: |
            Pelaku pembatalan tiket (tickets.cancelled_by): self = peserta membatalkan sendiri, admin = pengurus
            (termasuk penolakan bukti dan pembatalan tiket), system = otomatis (misalnya pembatalan event atau
            penghapusan akun). Hanya untuk ticket_status cancelled; tidak dikirim selain itu.
          oneOf:
            - $ref: "#/components/schemas/PaymentTicketCancelledBy"
            - type: "null"
    PaymentTicketStatus:
      type: string
      enum:
        - awaiting_payment
        - awaiting_review
        - paid
        - expired
        - cancelled
      description: Status tiket yang ditautkan payment tiket (PRD 4.4); salinan baca dari domain Events.
    PaymentType:
      type: string
      enum:
        - registration
        - renewal
        - ticket
      description: |
        Jenis pembayaran (PRD 3.3, 3.9): registration = iuran pendaftaran (register alumni baru + pembuatan KTA),
        renewal = iuran perpanjangan KTA, ticket = pembayaran tiket event (dibuat lewat reservasi F-09).
    Permission:
      type: string
      description: Izin admin bernamespace tindakan (PRD 2.3, ARCHITECTURE §4.5). super_admin memiliki semuanya.
      enum:
        - payments.read
        - payments.decide
        - members.read
        - members.manage
        - content.manage
        - master.manage
        - events.manage
        - events.checkin
        - moderation.read
        - moderation.resolve
        - audit.read
        - audit.export
        - settings.manage
        - admins.manage
        - notifications.manage
    Post:
      allOf:
        - $ref: "#/components/schemas/PostSummary"
        - type: object
          required:
            - body_html
            - updated_at
          properties:
            body_html:
              type: string
              description: |
                HTML yang sudah disanitasi server saat disimpan (PRD 3.8): hanya tag teks dasar (p, br, h2-h4,
                strong, em, u, s, blockquote, ul, ol, li, a, img, hr); tanpa script, style, iframe, atribut on*,
                atau URL javascript:. `img` hanya dari host berkas KAPDH. Tautan luar memakai
                `target="_blank" rel="noopener noreferrer nofollow"` dan `data-external="true"` sehingga klien
                menampilkan indikasi tautan luar yang jelas.

                Rincian implementasi (aditif): `a` hanya `https:` (selalu dianggap tautan luar dan juga diberi
                `class="kapdh-external-link"`) atau `mailto:` (tanpa penanda luar); tautan dengan skema lain
                kehilangan tautannya tetapi teksnya tetap. `img` hanya `src` berbentuk
                `<API_PUBLIC_URL>/api/v1/files/public/<uuid>` (gambar konten publik) dengan `alt` wajib (N-11);
                atribut lain tidak pernah dikirim.
            updated_at:
              type: string
              format: date-time
              description: Terakhir diperbarui pengurus.
    PostPage:
      type: object
      required:
        - items
        - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PostSummary"
        next_cursor:
          type:
            - string
            - "null"
    PostSummary:
      type: object
      required:
        - id
        - slug
        - title
        - excerpt
        - cover_url
        - category
        - published_at
        - like_count
        - liked_by_me
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
          examples:
            - contoh-selamat-datang
        title:
          type: string
        excerpt:
          type:
            - string
            - "null"
          description: Ringkasan dari pengurus; null bila tidak diisi.
        cover_url:
          type:
            - string
            - "null"
          format: uri
          description: URL publik cover yang sudah diproses server (EXIF dibuang, N-10); null bila tanpa cover.
        category:
          oneOf:
            - $ref: "#/components/schemas/ContentCategoryRef"
            - type: "null"
        published_at:
          type: string
          format: date-time
        like_count:
          type: integer
          minimum: 0
          description: Jumlah like; dipelihara trigger database sehingga konsisten (AC F08-3).
        liked_by_me:
          type: boolean
    ProfessionLabel:
      type: string
      minLength: 1
      maxLength: 100
      description: |
        Satu profesi (F-10, Ubah Profil v2 "Pilih dari daftar atau ketik sendiri"). Server memangkas spasi tepi dan
        menolak karakter kontrol. Label yang sama dengan master profesi aktif (tanpa membedakan huruf besar/kecil)
        ditautkan ke master itu dan disimpan dengan ejaan master, sehingga filter direktori `profession_id` dan
        label historis master nonaktif (AC F10-4) tetap berlaku; label lain disimpan apa adanya sebagai ketikan
        sendiri.
      examples:
        - Guru
        - Penerjemah
    Profile:
      type: object
      description: |
        Profil lengkap milik sendiri (guideline hal. 7). Angkatan, kelas, jenis kelamin dan tahun akademik hanya
        dapat dikoreksi pengurus (PRD 3.5). Tahun dihitung server: lulus = 1996 + angkatan, keluar = lulus -
        (6 - kelas keluar), masuk = lulus - (6 - kelas masuk) - 1.
      required:
        - full_name
        - gender
        - cohort
        - class_in
        - class_out
        - graduation_year
        - entry_year
        - exit_year
        - education_status
        - city
        - phone
        - bio
        - last_education_institution
        - last_education_city
        - social_instagram
        - social_x
        - social_facebook
        - social_linkedin
        - profession
        - professions
        - education
        - social_links
        - skills
        - avatar_file_id
        - avatar_url
        - privacy
      properties:
        full_name:
          type: string
        gender:
          $ref: "#/components/schemas/Gender"
        cohort:
          type: integer
          minimum: 1
          maximum: 99
        class_in:
          $ref: "#/components/schemas/ClassLevel"
        class_out:
          $ref: "#/components/schemas/ClassLevel"
        graduation_year:
          type: integer
          description: 1996 + angkatan.
        entry_year:
          type: integer
        exit_year:
          type: integer
        education_status:
          $ref: "#/components/schemas/EducationStatus"
        city:
          type:
            - string
            - "null"
          description: Kota domisili (bukan alamat lengkap, PRD 3.5).
        phone:
          type:
            - string
            - "null"
        bio:
          type:
            - string
            - "null"
          maxLength: 500
          description: Tentang saya.
        last_education_institution:
          type:
            - string
            - "null"
          description: |
            Deprecated (aplikasi 1.0.0): institusi entri teratas `education`, null bila daftar kosong.
        last_education_city:
          type:
            - string
            - "null"
          description: |
            Deprecated (aplikasi 1.0.0): kota lulusan terakhir yang diisi aplikasi lama; tidak ada padanannya di
            `education` dan dikosongkan server bila institusi teratas berganti.
        social_instagram:
          type:
            - string
            - "null"
          description: |
            Deprecated (aplikasi 1.0.0): tautan pertama berplatform instagram di `social_links`, null bila tidak ada.
        social_x:
          type:
            - string
            - "null"
          description: Deprecated (aplikasi 1.0.0); sama dengan social_instagram untuk platform x.
        social_facebook:
          type:
            - string
            - "null"
          description: Deprecated (aplikasi 1.0.0); sama dengan social_instagram untuk platform facebook.
        social_linkedin:
          type:
            - string
            - "null"
          description: Deprecated (aplikasi 1.0.0); sama dengan social_instagram untuk platform linkedin.
        profession:
          oneOf:
            - $ref: "#/components/schemas/MasterItem"
            - type: "null"
          description: |
            Deprecated (aplikasi 1.0.0): profesi pertama di `professions` yang tertaut master; master nonaktif
            tetap tampil sebagai label historis (AC F10-4). Null bila semua profesi ketikan sendiri.
        professions:
          type: array
          maxItems: 5
          description: |
            Profesi (maksimal 5) sesuai urutan pemilik; yang pertama adalah profesi utama di KTA dan kartu
            direktori. Label master nonaktif tetap tampil sebagai label historis (AC F10-4).
          items:
            $ref: "#/components/schemas/ProfessionLabel"
        education:
          type: array
          maxItems: 10
          description: Riwayat pendidikan setelah pondok, terbaru di atas (lihat EducationEntry).
          items:
            $ref: "#/components/schemas/EducationEntry"
        social_links:
          type: array
          maxItems: 10
          description: Tautan sosial (maksimal 10) sesuai urutan pemilik; tampil ke anggota lain hanya bila show_social.
          items:
            $ref: "#/components/schemas/SocialLink"
        skills:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/MasterItem"
        avatar_file_id:
          type:
            - string
            - "null"
          format: uuid
        avatar_url:
          type:
            - string
            - "null"
          format: uri
          description: URL foto (publik atau bertanda tangan maksimal 10 menit, PRD 5.4). Null bila belum ada foto, dan selalu null selama anggota suspended karena URL privat tidak dapat dibuka penampil suspended (klien memakai inisial).
        privacy:
          $ref: "#/components/schemas/ProfilePrivacy"
    ProfilePrivacy:
      type: object
      description: |
        Flag privasi profil sendiri (N-15, AC F10-2). Bawaan: tampil di direktori true, sedangkan telepon, email dan
        tautan sosial false (tersembunyi). Field tersembunyi tidak ikut payload direktori/profil anggota lain;
        pengurus berizin tetap dapat membaca untuk tujuan administratif yang tercatat (F-10).
      required:
        - show_in_directory
        - show_phone
        - show_email
        - show_social
      properties:
        show_in_directory:
          type: boolean
        show_phone:
          type: boolean
        show_email:
          type: boolean
        show_social:
          type: boolean
    ProfilePrivacyUpdate:
      type: object
      description: Perubahan sebagian flag privasi; flag yang tidak dikirim tidak berubah.
      additionalProperties: false
      properties:
        show_in_directory:
          type: boolean
        show_phone:
          type: boolean
        show_email:
          type: boolean
        show_social:
          type: boolean
    ProfileUpdate:
      type: object
      description: |
        Perubahan sebagian profil sendiri. Field yang tidak dikirim tidak berubah; null pada field nullable
        mengosongkan nilai. Field identitas (nama, jenis kelamin, angkatan, kelas, email, nomor anggota) tidak
        diterima (AC F05-6); field lain di luar skema ditolak 400. Minimal satu field.
      additionalProperties: false
      minProperties: 1
      properties:
        city:
          type: string
          minLength: 1
          maxLength: 80
          description: Kota domisili yang tampil di KTA; dapat diganti tetapi tidak dikosongkan.
        phone:
          type:
            - string
            - "null"
          maxLength: 24
          pattern: ^\+?[0-9][0-9 -]{5,22}$
          description: Nomor telepon; tampil ke anggota lain hanya bila show_phone true (AC F10-2).
        bio:
          type:
            - string
            - "null"
          maxLength: 500
        professions:
          type: array
          maxItems: 5
          description: |
            Daftar profesi pengganti (maksimal 5, tanpa label ganda tanpa membedakan huruf besar/kecil); [] menghapus
            semua. Urutan dipertahankan; yang pertama menjadi profesi utama.
          items:
            $ref: "#/components/schemas/ProfessionLabel"
        education:
          type: array
          maxItems: 10
          description: Riwayat pendidikan pengganti (maksimal 10); [] menghapus semua. Server mengurutkan terbaru di atas.
          items:
            $ref: "#/components/schemas/EducationEntryInput"
        social_links:
          type: array
          maxItems: 10
          description: Tautan sosial pengganti (maksimal 10); [] menghapus semua. Urutan dipertahankan.
          items:
            $ref: "#/components/schemas/SocialLinkInput"
        last_education_institution:
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 120
          description: Deprecated (aplikasi 1.0.0); pakai `education`. Aturan transisi di updateMyProfile.
        last_education_city:
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 80
          description: Deprecated (aplikasi 1.0.0); tidak ada padanannya di `education`.
        social_instagram:
          oneOf:
            - $ref: "#/components/schemas/SocialHandle"
            - type: "null"
          description: Deprecated (aplikasi 1.0.0); pakai `social_links`. Instagram (aturan SocialHandle); null mengosongkan.
        social_x:
          oneOf:
            - $ref: "#/components/schemas/SocialHandle"
            - type: "null"
          description: Deprecated (aplikasi 1.0.0); pakai `social_links`. X (aturan SocialHandle); null mengosongkan.
        social_facebook:
          oneOf:
            - $ref: "#/components/schemas/SocialHandle"
            - type: "null"
          description: Deprecated (aplikasi 1.0.0); pakai `social_links`. Facebook (aturan SocialHandle); null mengosongkan.
        social_linkedin:
          oneOf:
            - $ref: "#/components/schemas/SocialHandle"
            - type: "null"
          description: Deprecated (aplikasi 1.0.0); pakai `social_links`. LinkedIn (aturan SocialHandle); null mengosongkan.
        profession_id:
          type:
            - string
            - "null"
          format: uuid
          description: |
            Deprecated (aplikasi 1.0.0); pakai `professions`. Master profesi aktif yang menggantikan profesi pertama
            yang tertaut master dan menjadi profesi utama; null melepasnya.
        skill_ids:
          type: array
          maxItems: 10
          uniqueItems: true
          description: Himpunan keahlian pengganti (maksimal 10) dari master aktif; [] menghapus semua.
          items:
            type: string
            format: uuid
        avatar_file_id:
          type:
            - string
            - "null"
          format: uuid
          description: Berkas milik sendiri dengan purpose avatar (POST /files); null menghapus foto.
        privacy:
          $ref: "#/components/schemas/ProfilePrivacyUpdate"
    PublicConfig:
      type: object
      required:
        - min_app_version
        - maintenance
        - store_links
        - support
        - legal
        - server_time
      properties:
        min_app_version:
          $ref: "#/components/schemas/MinAppVersion"
        maintenance:
          $ref: "#/components/schemas/MaintenanceStatus"
        store_links:
          $ref: "#/components/schemas/StoreLinks"
        support:
          $ref: "#/components/schemas/SupportContact"
        legal:
          $ref: "#/components/schemas/LegalVersions"
        server_time:
          type: string
          format: date-time
          description: Waktu server (UTC) untuk mendeteksi jam perangkat yang menyimpang.
    PublicPage:
      type: object
      description: Salinan tayang halaman informasi/legal; draf pengurus tidak pernah dikirim.
      required:
        - slug
        - title
        - body_html
        - version
        - published_at
        - legal_document
      properties:
        slug:
          type: string
          examples:
            - kebijakan-privasi
        title:
          type: string
          examples:
            - Kebijakan Privasi
        body_html:
          type: string
          description: |
            HTML tersanitasi server dengan aturan yang sama dengan `Post.body_html`; tautan luar bertanda
            `data-external="true"` dan `class="kapdh-external-link"` (PRD 3.8).
        version:
          type: string
          description: |
            Versi tayang dokumen ini (published_version). Untuk persetujuan registrasi klien mengirim
            `LegalConsentVersions.policy_version` gabungan, bukan nilai ini (F-01).
          examples:
            - "1"
        published_at:
          type: string
          format: date-time
        legal_document:
          oneOf:
            - $ref: "#/components/schemas/PageLegalDocument"
            - type: "null"
    PublicPageList:
      type: object
      required:
        - items
        - consent
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PublicPageSummary"
        consent:
          $ref: "#/components/schemas/LegalConsentVersions"
    PublicPageSummary:
      type: object
      required:
        - slug
        - title
        - version
        - published_at
        - legal_document
      properties:
        slug:
          type: string
          examples:
            - kebijakan-privasi
        title:
          type: string
          examples:
            - Kebijakan Privasi
        version:
          type: string
          description: Versi tayang dokumen ini (published_version); bukan nilai persetujuan registrasi.
          examples:
            - "1"
        published_at:
          type: string
          format: date-time
        legal_document:
          oneOf:
            - $ref: "#/components/schemas/PageLegalDocument"
            - type: "null"
    PushPreferences:
      type: object
      required:
        - payment
        - membership
        - event
        - news
        - chat
      description: Saklar push per kategori yang dapat diatur; security dan account selalu dikirim (ARCHITECTURE §4.7).
      properties:
        payment:
          type: boolean
        membership:
          type: boolean
        event:
          type: boolean
        news:
          type: boolean
        chat:
          type: boolean
    ReauthRequest:
      type: object
      description: Alumni cukup `password`; admin wajib `password` plus tepat satu dari `totp_code` atau `backup_code`.
      required:
        - password
      properties:
        password:
          type: string
          minLength: 1
          maxLength: 128
        totp_code:
          type: string
          pattern: ^[0-9]{6}$
          x-sensitive: true
          description: Kode autentikator; wajib untuk sesi admin bila backup_code tidak dikirim.
        backup_code:
          type: string
          minLength: 6
          maxLength: 32
          x-sensitive: true
          description: Backup code sekali pakai pengganti totp_code untuk sesi admin.
    ReauthResponse:
      type: object
      required:
        - reauth_token
        - expires_at
      properties:
        reauth_token:
          type: string
          x-sensitive: true
          description: |
            Dikirim lewat header X-Reauth-Token. Terikat pengguna dan keluarga sesi pemanggil (`sid` = `family_id`
            = `Session.id`), sehingga tetap berlaku setelah rotasi refresh; tidak berlaku di keluarga sesi lain.
            Simpan hanya di memori; jangan dicatat (ARCHITECTURE §2 butir 3).
        expires_at:
          type: string
          format: date-time
          description: Maksimal 10 menit sejak reautentikasi; tidak diperpanjang oleh refresh.
    RefreshRequest:
      type: object
      properties:
        refresh_token:
          type: string
          minLength: 10
          maxLength: 512
          description: Wajib untuk klien mobile; web admin memakai cookie kapdh_admin_rt.
    RefundDestinationInput:
      type: object
      description: |
        Rekening tujuan refund dari pemilik payment (D6). Disimpan sementara dan dihapus saat refund selesai atau
        dibatalkan (D2); tidak pernah dicatat di log, audit maupun ekspor (ARCHITECTURE §2 butir 3). Spasi di
        awal/akhir dipangkas server.
      required:
        - provider
        - account_number
        - account_holder
      properties:
        provider:
          type: string
          minLength: 1
          maxLength: 80
          pattern: \S
          description: Nama bank atau e-wallet tujuan.
        account_number:
          type: string
          minLength: 1
          maxLength: 64
          pattern: \S
          description: Nomor rekening atau akun tujuan refund.
          x-sensitive: true
        account_holder:
          type: string
          minLength: 1
          maxLength: 120
          pattern: \S
          description: Nama pemilik rekening tujuan refund.
          x-sensitive: true
    RegisterDeviceRequest:
      type: object
      required:
        - platform
        - token
      properties:
        platform:
          $ref: "#/components/schemas/DevicePlatform"
        token:
          type: string
          minLength: 1
          maxLength: 4096
          description: Token registrasi FCM; tidak pernah dicatat di log (ARCHITECTURE §2).
        app_version:
          type: string
          maxLength: 32
          pattern: ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$
          description: Versi aplikasi (semver), sama dengan header X-App-Version.
          examples:
            - 1.0.0
    RegisterRequest:
      type: object
      description: |
        Data Diri pendaftaran (F-01, guidelines R8). Tahun masuk, keluar dan lulus dihitung dari angkatan dan kelas
        (PRD 3.5), tidak dikirim klien. Tanpa NIK/KTP (N-09).
      required:
        - full_name
        - gender
        - email
        - password
        - cohort
        - class_in
        - class_out
        - accept_policy_version
      properties:
        full_name:
          type: string
          minLength: 2
          maxLength: 120
        gender:
          $ref: "#/components/schemas/Gender"
        email:
          type: string
          format: email
          maxLength: 254
        password:
          $ref: "#/components/schemas/Password"
        cohort:
          type: integer
          minimum: 1
          maximum: 99
          description: Angkatan; tahun lulus = 1996 + angkatan. Server menolak angkatan setelah tahun berjalan.
        class_in:
          $ref: "#/components/schemas/ClassLevel"
        class_out:
          $ref: "#/components/schemas/ClassLevel"
          description: Kelas keluar; tidak boleh sebelum kelas masuk (`field_errors.class_out`).
        accept_policy_version:
          type: string
          pattern: ^privacy:[1-9][0-9]*;terms:[1-9][0-9]*$
          maxLength: 64
          examples:
            - privacy:3;terms:1
          description: |
            `LegalConsentVersions.policy_version` dari GET /public/pages (`consent`), dikirim apa adanya setelah
            pengguna membaca dan menyetujui kebijakan privasi serta ketentuan layanan (F-01). Server
            membandingkannya dengan nilai yang disusun ulang dari `app_settings.legal` di dalam transaksi register;
            hanya nilai yang sama yang disimpan di `users.policy_version` beserta `policy_accepted_at`. Berbeda atau
            dokumen belum terbit -> 409 VERSION_CONFLICT (lihat operasi register).
    ResetPasswordRequest:
      type: object
      required:
        - reset_token
        - new_password
      properties:
        reset_token:
          type: string
          minLength: 10
          maxLength: 512
          x-sensitive: true
        new_password:
          $ref: "#/components/schemas/Password"
    Session:
      type: object
      description: Satu perangkat yang masuk (keluarga sesi), tanpa token, hash maupun IP (N-14).
      required:
        - id
        - audience
        - device_name
        - platform
        - app_version
        - created_at
        - last_seen_at
        - expires_at
        - current
      properties:
        id:
          type: string
          format: uuid
          description: Identitas keluarga sesi; stabil selama rotasi refresh.
        audience:
          $ref: "#/components/schemas/SessionAudience"
        device_name:
          type:
            - string
            - "null"
          maxLength: 80
        platform:
          type:
            - string
            - "null"
          enum:
            - android
            - ios
            - web
            - null
          description: Dari header X-App-Platform (mobile) atau `web` untuk web admin.
        app_version:
          type:
            - string
            - "null"
          maxLength: 32
          description: Dari header X-App-Version (mobile).
        created_at:
          type: string
          format: date-time
          description: Waktu login perangkat (awal keluarga sesi); tidak berubah, kunci urutan daftar sesi.
        last_seen_at:
          type: string
          format: date-time
          description: Aktivitas terakhir perangkat.
        expires_at:
          type: string
          format: date-time
          description: |
            Batas umur keluarga sesi (login + TTL refresh D1: mobile 60 hari, admin 12 jam); rotasi refresh tidak
            memperpanjangnya (PRD 5.2, N-08).
        current:
          type: boolean
          description: True untuk sesi pemanggil.
    SessionAudience:
      type: string
      enum:
        - mobile
        - admin
      description: Audience sesi; identitas alumni dan admin terpisah (PRD 2.3).
    SessionPage:
      type: object
      required:
        - items
        - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Session"
        next_cursor:
          type:
            - string
            - "null"
    SocialHandle:
      type: string
      minLength: 1
      maxLength: 200
      pattern: ^(?:@?[A-Za-z0-9._-]{1,100}|https://[A-Za-z0-9.-]+\.[A-Za-z]{2,}(?:[/?#][^\s<>"'`]*)?)$
      description: |
        Aturan tunggal untuk tautan sosial pada profil sendiri dan koreksi pengurus (F-10, N-09, N-14): nama
        pengguna (huruf, angka, titik, garis bawah, tanda hubung; @ di depan opsional dan dibuang server) atau URL
        `https://` dengan nama host. Skema lain (javascript:, data:, http:, mailto:, dll.), spasi dan karakter
        <>"'` ditolak 400 VALIDATION_ERROR. Server memeriksa ulang pola yang sama (tidak bergantung pada klien) dan
        menyimpan nilai yang sudah dinormalkan; klien merender nama pengguna sebagai tautan ke domain platform dan
        URL hanya sebagai tautan https. Platform `website` hanya menerima URL https (lihat SocialLinkInput).
      examples:
        - ahmad.uji
        - https://www.linkedin.com/in/ahmad.uji
    SocialLink:
      type: object
      required:
        - platform
        - value
      properties:
        platform:
          $ref: "#/components/schemas/SocialPlatform"
        value:
          type: string
          maxLength: 200
          description: Nilai tersimpan yang sudah lolos aturan SocialHandle (nama pengguna tanpa @ atau URL https).
    SocialLinkInput:
      type: object
      description: |
        Satu tautan sosial pada ProfileUpdate/AdminMemberUpdate. `value` memakai aturan SocialHandle; untuk
        `website` hanya URL https. Pasangan platform + nilai yang sama (tanpa membedakan huruf besar/kecil) tidak
        boleh ganda.
      additionalProperties: false
      required:
        - platform
        - value
      properties:
        platform:
          $ref: "#/components/schemas/SocialPlatform"
        value:
          $ref: "#/components/schemas/SocialHandle"
    SocialPlatform:
      type: string
      enum:
        - instagram
        - tiktok
        - x
        - facebook
        - linkedin
        - youtube
        - threads
        - telegram
        - website
      description: |
        Platform tautan sosial (Ubah Profil v2): Instagram, TikTok, X (Twitter), Facebook, LinkedIn, YouTube,
        Threads, Telegram, Situs web. Klien merender nama pengguna sebagai tautan ke domain platform; `website`
        selalu URL.
    StoreLinks:
      type: object
      description: Tautan toko aplikasi resmi untuk layar wajib update dan situs publik.
      required:
        - android
        - ios
      properties:
        android:
          type:
            - string
            - "null"
          format: uri
        ios:
          type:
            - string
            - "null"
          format: uri
    SubmitPaymentProofRequest:
      type: object
      required:
        - file_id
        - expected_proof_version
      properties:
        file_id:
          type: string
          format: uuid
          description: Hasil unggah POST /files purpose payment_proof.
        transfer_note:
          type: string
          maxLength: 200
          description: Catatan opsional (misalnya bank pengirim); menggantikan catatan bukti sebelumnya.
        expected_proof_version:
          type: integer
          minimum: 0
          description: |
            `proof_version` yang dilihat klien sebelum mengunggah (0 untuk bukti pertama). Berbeda dari versi
            server menghasilkan 409 PROOF_VERSION_CONFLICT.
    SupportContact:
      type: object
      required:
        - email
        - whatsapp
      properties:
        email:
          type: string
          format: email
          examples:
            - bantuan@kapdh.or.id
        whatsapp:
          type:
            - string
            - "null"
          description: Nomor WhatsApp admin dukungan (PRD 8.3).
    TicketCancelRequest:
      type: object
      required:
        - expected_refund_eligible
      properties:
        expected_refund_eligible:
          type: boolean
          description: Nilai `refund_eligible` yang ditampilkan kepada anggota saat konfirmasi.
        reason:
          type:
            - string
            - "null"
          maxLength: 500
          description: Alasan opsional dari peserta.
    TicketCancelledBy:
      type: string
      enum:
        - self
        - admin
        - system
      description: |
        Pihak yang membatalkan tiket: self (peserta), admin (pengurus membatalkan tiket atau instruksi pembayarannya,
        termasuk hold awaiting_payment saat event dibatalkan), system (penolakan pembayaran tiket, tiket paid dan
        awaiting_review yang dibatalkan akibat pembatalan event, penghapusan akun).
    TicketDetail:
      allOf:
        - $ref: "#/components/schemas/TicketSummary"
        - type: object
          required:
            - qr_code
            - checkin_opens_at
            - checkin_closes_at
            - cancel_reason
            - payment
            - refunds
            - can_cancel
            - refund_eligible
            - full_refund_until
            - version
          properties:
            qr_code:
              type:
                - string
                - "null"
              x-sensitive: true
              description: |
                Kode QR acak 128-bit unik (isi gambar QR apa adanya). Hanya terisi bila tiket paid dan event tidak
                cancelled (AC F09-3, F09-7); null selain itu.
            checkin_opens_at:
              type: string
              format: date-time
              description: Jendela check-in efektif (D5).
            checkin_closes_at:
              type: string
              format: date-time
            cancel_reason:
              type:
                - string
                - "null"
            payment:
              description: Payment tiket; null untuk event gratis.
              oneOf:
                - $ref: "#/components/schemas/TicketPaymentInfo"
                - type: "null"
            refunds:
              type: array
              description: |
                Semua refund atas payment tiket ini (D6), urut `created_at` turun lalu id; kosong bila tidak ada
                (termasuk event gratis). Refund berstatus cancelled tetap dikirim sebagai riwayat; klien menonjolkan
                refund pending/completed dan menampilkan yang cancelled sebagai riwayat.
              items:
                $ref: "#/components/schemas/TicketRefundInfo"
            can_cancel:
              type: boolean
              description: True bila POST /me/tickets/{ticketId}/cancel saat ini diizinkan.
            refund_eligible:
              type: boolean
              description: True bila pembatalan sekarang menghasilkan refund penuh (paid, total > 0, sebelum H-3).
            full_refund_until:
              type:
                - string
                - "null"
              format: date-time
              description: Batas refund penuh pembatalan sendiri (H-3); null bila tidak berlaku (gratis).
            version:
              type: string
    TicketEventInfo:
      type: object
      required:
        - id
        - title
        - cover_url
        - starts_at
        - ends_at
        - timezone
        - location_name
        - status
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        cover_url:
          type:
            - string
            - "null"
          format: uri
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        timezone:
          type: string
          examples:
            - Asia/Jakarta
        location_name:
          type:
            - string
            - "null"
        status:
          $ref: "#/components/schemas/EventStatus"
    TicketListView:
      type: string
      enum:
        - active
        - history
    TicketPage:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/TicketSummary"
        next_cursor:
          type:
            - string
            - "null"
    TicketPaymentInfo:
      type: object
      description: |
        Penunjuk payment tiket (`type=ticket`). Unggah/ganti bukti lewat PUT /me/payments/{id}/proof
        (submitPaymentProof) sebelum `hold_expires_at`. Penolakan mengikuti submitPaymentProof: hold sudah lewat
        atau tiket expired -> 409 RESERVATION_EXPIRED (AC F09-2); tiket cancelled atau payment rejected -> 409
        PAYMENT_STATE_CONFLICT (AC F09-4). Detail dan histori lewat GET /me/payments/{id}.
      required:
        - id
        - status
        - amount
        - method
        - proof_version
        - submitted_at
        - decided_at
        - rejection_reason
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/TicketPaymentStatus"
        amount:
          $ref: "#/components/schemas/Money"
        method:
          $ref: "#/components/schemas/TicketPaymentMethod"
        proof_version:
          type: integer
          minimum: 0
        submitted_at:
          type:
            - string
            - "null"
          format: date-time
        decided_at:
          type:
            - string
            - "null"
          format: date-time
        rejection_reason:
          type:
            - string
            - "null"
    TicketPaymentMethod:
      type: object
      description: Snapshot tujuan transfer saat payment dibuat (D13); tidak berubah walaupun metode diubah pengurus.
      required:
        - kind
        - provider
        - account_number
        - account_holder
        - instructions
      properties:
        kind:
          $ref: "#/components/schemas/TicketPaymentMethodKind"
        provider:
          type: string
          examples:
            - Bank Syariah Indonesia
        account_number:
          type: string
        account_holder:
          type: string
        instructions:
          type:
            - string
            - "null"
    TicketPaymentMethodKind:
      type: string
      enum:
        - bank
        - ewallet
        - qris
      description: |
        Sama dengan PaymentMethodKind. `qris` (ADR-026): gambar QRIS dibuka dari instruksi pembayaran
        (GET /me/payments/{id}, `method.qr_image_url`); ringkasan tiket tidak memuat gambarnya.
    TicketPaymentStatus:
      type: string
      enum:
        - pending
        - paid
        - rejected
        - cancelled
      description: Status payment tiket (PRD 4.3). Penolakan payment tiket bersifat final dan membatalkan tiket (AC F09-4).
    TicketRefundInfo:
      type: object
      description: |
        Satu refund manual oleh bendahara (satu baris payment_adjustments kind refund atas payment tiket, D6).
        Satu payment dapat memiliki beberapa refund (refund dibatalkan lalu dicatat ulang, atau refund sebagian);
        total refund pending + completed tidak pernah melebihi nominal payment (aturan adminCreatePaymentAdjustment).
        Rekening tujuan tidak pernah dikirim di sini (ARCHITECTURE §2.3, D2).
      required:
        - id
        - status
        - amount
        - due_at
        - completed_at
        - cancelled_at
        - created_at
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/TicketRefundStatus"
        amount:
          $ref: "#/components/schemas/Money"
        due_at:
          type:
            - string
            - "null"
          format: date-time
          description: Tenggat paling lambat 7 hari kerja sejak pembatalan (D6).
        completed_at:
          type:
            - string
            - "null"
          format: date-time
        cancelled_at:
          type:
            - string
            - "null"
          format: date-time
          description: Terisi bila refund ini dibatalkan bendahara (mis. dicatat ulang dengan nominal lain).
        created_at:
          type: string
          format: date-time
    TicketRefundStatus:
      type: string
      enum:
        - pending
        - completed
        - cancelled
      description: Status penyelesaian refund manual oleh bendahara (payment_adjustment kind refund, D6).
    TicketStatus:
      type: string
      enum:
        - awaiting_payment
        - awaiting_review
        - paid
        - expired
        - cancelled
      description: |
        Status tiket (PRD 4.4): awaiting_payment dan awaiting_review menahan kursi; paid mengonsumsi kursi;
        expired dan cancelled tidak mengonsumsi kursi. Check-in adalah atribut tiket (`checked_in_at`), bukan status.
    TicketSummary:
      type: object
      required:
        - id
        - status
        - event
        - total
        - hold_expires_at
        - checked_in_at
        - cancelled_at
        - cancelled_by
        - payment_status
        - created_at
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/TicketStatus"
        event:
          $ref: "#/components/schemas/TicketEventInfo"
        total:
          $ref: "#/components/schemas/Money"
        hold_expires_at:
          type:
            - string
            - "null"
          format: date-time
          description: Batas kirim bukti untuk awaiting_payment (min 24 jam, registration_closes_at; D5).
        checked_in_at:
          type:
            - string
            - "null"
          format: date-time
        cancelled_at:
          type:
            - string
            - "null"
          format: date-time
        cancelled_by:
          oneOf:
            - $ref: "#/components/schemas/TicketCancelledBy"
            - type: "null"
        payment_status:
          description: Status payment tiket; null untuk event gratis (tanpa payment, AC F09-3).
          oneOf:
            - $ref: "#/components/schemas/TicketPaymentStatus"
            - type: "null"
        created_at:
          type: string
          format: date-time
    TokenPair:
      type: object
      required:
        - access_token
        - access_expires_at
      properties:
        access_token:
          type: string
          description: JWT akses 15 menit (N-08).
        access_expires_at:
          type: string
          format: date-time
        refresh_token:
          type: string
          description: Hanya untuk klien mobile (secure storage); admin memakai cookie.
        refresh_expires_at:
          type: string
          format: date-time
    UnregisterDeviceRequest:
      type: object
      required:
        - token
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 4096
          description: Token FCM yang dicabut; tidak pernah dicatat di log (ARCHITECTURE §2).
    UpdatePaymentAdjustmentRequest:
      type: object
      description: PATCH; field yang tidak dikirim tidak berubah.
      properties:
        amount:
          $ref: "#/components/schemas/Money"
        reason:
          type: string
          minLength: 3
          maxLength: 500
          pattern: \S
        refund_destination:
          description: Isi atau ganti rekening tujuan refund; null menghapusnya.
          oneOf:
            - $ref: "#/components/schemas/AdminRefundDestination"
            - type: "null"
        evidence_file_id:
          type:
            - string
            - "null"
          format: uuid
          description: Lampirkan bukti penyelesaian; null melepasnya.
    WebDeletionConfirmRequest:
      type: object
      required:
        - deletion_token
        - confirm
        - acknowledged_disclosure_version
      properties:
        deletion_token:
          type: string
          minLength: 16
          maxLength: 512
          x-sensitive: true
        confirm:
          type: boolean
          const: true
          description: Konfirmasi eksplisit pengguna.
        acknowledged_disclosure_version:
          type: string
          minLength: 1
          maxLength: 128
          description: "`version` dari AccountDeletionDisclosure yang ditampilkan kepada pengguna."
    WebDeletionStartRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          maxLength: 254
    WebDeletionVerification:
      type: object
      description: |
        Hasil challenge terbatas penghapusan (PRD 2.2): status permintaan terbuka dan, bila dapat dihapus,
        pengungkapan serta deletion_token. Tidak memberi sesi atau akses lain.
      required:
        - email_masked
        - deletable
        - registration_pending
        - blocked_reason
        - deletion
        - disclosure
        - deletion_token
        - deletion_token_expires_at
      properties:
        email_masked:
          type: string
          maxLength: 254
          examples:
            - ah***@kapdh.test
        deletable:
          type: boolean
          description: True bila permintaan penghapusan baru dapat dikonfirmasi.
        registration_pending:
          type: boolean
          description: |
            True bila akun adalah pendaftaran `pending_otp` yang belum pernah diverifikasi; UI menampilkan
            "Batalkan pendaftaran dan hapus data" alih-alih penghapusan akun anggota (F-14, D2). False untuk akun
            lain.
        blocked_reason:
          type:
            - string
            - "null"
          enum:
            - deletion_in_progress
            - account_disabled
            - null
          description: |
            Alasan tidak dapat membuat permintaan baru: `deletion_in_progress` (lihat `deletion`), `account_disabled`
            (hubungi bantuan; penghapusan dimulai operator lewat kanal bantuan, PRD 2.2, F-14); null bila `deletable`.
        deletion:
          description: Permintaan penghapusan terbuka (status pending/processing/failed); null bila tidak ada.
          oneOf:
            - $ref: "#/components/schemas/AccountDeletion"
            - type: "null"
        disclosure:
          description: Pengungkapan dan peringatan pribadi; hanya bila `deletable`.
          oneOf:
            - $ref: "#/components/schemas/AccountDeletionDisclosure"
            - type: "null"
        deletion_token:
          type:
            - string
            - "null"
          maxLength: 512
          x-sensitive: true
          description: |
            Token sekali pakai (JWT audience kapdh-web-deletion, terikat akun, challenge, session_version dan status
            akun saat verifikasi) untuk POST /public/deletion/confirm; hanya bila `deletable`. Simpan hanya di
            memori halaman.
        deletion_token_expires_at:
          type:
            - string
            - "null"
          format: date-time
          description: Maksimal 10 menit sejak verifikasi (sama dengan batas reautentikasi F-14).
    WebDeletionVerifyRequest:
      type: object
      required:
        - challenge_id
        - code
      properties:
        challenge_id:
          type: string
          format: uuid
        code:
          type: string
          pattern: ^[0-9]{6}$
          x-sensitive: true
  securitySchemes:
    adminRefreshCookie:
      type: apiKey
      in: cookie
      name: kapdh_admin_rt
      description: |
        Refresh token web admin dalam cookie HttpOnly; Secure; SameSite=Strict; Path=/api/v1/auth (PRD 5.2).
        Hanya dipakai POST /auth/refresh dengan header Origin sama dengan ADMIN_ORIGIN. Token tidak pernah
        disimpan di localStorage.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access token 15 menit (N-08). Sesi admin hanya valid setelah TOTP; token tahap sandi (mfa_token)
        tidak dapat memanggil API admin (AC F02-2).
