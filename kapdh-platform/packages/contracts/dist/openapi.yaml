        - account_number
        - account_holder
      properties:
        provider:
          type: string
          minLength: 1
          maxLength: 80
          description: Nama bank atau e-wallet tujuan.
        account_number:
          type: string
          minLength: 1
          maxLength: 64
          description: Nomor rekening tujuan refund.
          x-sensitive: true
        account_holder:
          type: string
          minLength: 1
          maxLength: 120
          description: Nama pemilik rekening tujuan refund.
          x-sensitive: true
