# DIBANGKITKAN oleh packages/contracts/scripts/assemble.mjs dari openapi/root.yaml dan
# openapi/domains/*.yaml. JANGAN DISUNTING; ubah berkas sumbernya lalu jalankan `pnpm contracts:gen`.
openapi: 3.1.0
info:
  title: KAPDH Apps API
  version: 0.3.0
  x-kapdh-min-app-version: 1.0.0
  summary: Kontrak API KAPDH Apps (PRD v3.5).
  description: |
    Satu-satunya pintu akses untuk aplikasi Flutter, web admin, dan situs publik.
    Server selalu memeriksa identitas, izin, status keanggotaan, dan kepemilikan objek.

    Konvensi (ARCHITECTURE §6, PRD 5.2):
    - Semua JSON snake_case; nilai enum string lower_snake (kecuali ErrorCode UPPER_SNAKE dan Permission
      `domain.action`).
    - Semua waktu dikirim dalam UTC (RFC 3339); klien menampilkan Asia/Jakarta kecuali event menetapkan zona sendiri.
    - Nominal uang dikirim sebagai `Money`, string desimal IDR, misalnya "60000.00"; tidak pernah float.
    - Nullable memakai bentuk OAS 3.1 `type: [X, "null"]`.
    - Daftar memakai `cursor` + `limit` (bawaan 30, maks 100) dan respons `<Thing>Page` = {items, next_cursor};
      tabel admin menambah `total`.
    - Pembaruan berversi memakai header `If-Match: <version>`; respons membawa `version` (string).
    - Galat selalu berbentuk `Error` dengan `code` dari `ErrorCode` dan `request_id`.
    - Klien mobile mengirim `X-App-Version` dan `X-App-Platform` di setiap request (gerbang versi minimum).
  contact:
    name: Pemilik produk KAPDH Apps
servers:
  - url: https://api.kapdh.or.id/api/v1
    description: Production
  - url: https://staging-api.kapdh.or.id/api/v1
    description: Staging
  - url: http://localhost:3000/api/v1
    description: Lokal
security:
  - bearerAuth: []
tags:
  - name: Account
    description: |
      Penghapusan akun dari aplikasi dan web beserta pengungkapan retensi dan pemeriksaan status (F-14, PRD 2.2, D2,
      N-15). Kebijakan D2: tanpa periode retensi data pribadi; catatan keuangan, tiket, laporan moderasi dan audit
      hanya disimpan anonim; backup harian berotasi 30 hari dengan deletion ledger (AC F14-6).
  - name: Admin Admins
    description: |
      Undangan admin, penugasan peran dan izin, serta pemulihan akun admin oleh Super Admin dengan sesi MFA;
      reautentikasi hanya untuk kirim ulang undangan, pemulihan, dan koreksi email login (F-16, AC F16-1..F16-3,
      ADR-025).
  - name: Admin Audit
    description: Pencarian audit dan ekspor CSV asinkron dengan filter yang sama (F-17, AC F17-2..F17-4).
  - name: Admin Auth
    description: |
      Login admin dua tahap (sandi lalu TOTP atau backup code), identitas dan izin efektif, penerimaan undangan,
      pendaftaran TOTP sebelum aktivasi, backup code dan ganti sandi admin (F-02, F-16, PRD 8.2, N-08). Akun admin
      terpisah dari akun alumni (PRD 2.3). Sesi admin idle 30 menit di server; request polling latar belakang
      mengirim header X-Background-Request agar tidak memperpanjang aktivitas (AC F02-5).
  - name: Admin Content
    description: |
      Pengelolaan berita terjadwal, banner, halaman informasi/legal berversi, kategori berita dan gambar konten
      oleh pengurus berizin content.manage, serta kategori event oleh pengurus berizin events.manage (F-08, F-15,
      AC F08-1, F08-2, F15-1, F15-4, F15-5; guideline p13, p14).
  - name: Admin Dashboard
    description: Dasbor pengurus yang hanya memuat data sesuai izin (F-15, AC F15-1, PRD 3.15).
  - name: Admin Events
    description: |
      Pengelolaan event, kuota, pembatalan/refund, peserta dan check-in tiket oleh pengurus (F-09, F-15, AC F15-2,
      PRD 4.4). Aturan bersama:
      - Izin dievaluasi dari DB setiap request (AC F15-1, F16-3); super_admin memiliki semua izin.
      - Setiap mutasi menulis audit dalam transaksi yang sama (F-17: "kuota/event/tiket/check-in", AC F17-1).
      - Pembaruan berversi memakai If-Match; versi berbeda -> 409 VERSION_CONFLICT dengan `current` (AC F15-4).
        `version` event naik pada perubahan field yang diedit pengurus dan perubahan status, TIDAK pada perubahan
        penghitung kursi oleh reservasi anggota, sehingga formulir admin tidak bentrok dengan arus reservasi.
      - Setiap transaksi mengikuti urutan kunci global pada deskripsi tag Events: event, lalu tiket (urut id),
        lalu payment (urut id); id dari baris lain dibaca tanpa kunci lalu status diperiksa ulang sesudah kunci
        (PRD 6.4).
      - Angka kursi pada respons baca memakai proyeksi kursi tag Events: hold kedaluwarsa yang belum dilepas job
        tidak dihitung dalam `held_quantity`, `seats_available`, `min_seats_total` maupun statistik.
      - Refund adalah keputusan uang: refund otomatis yang diwajibkan D6 (event dibatalkan, pembatalan sendiri
        sebelum H-3) dicatat tanpa diskresi; refund diskresioner per kasus (adminCancelTicket `refund=true`)
        memerlukan payments.decide dan tunduk pada aturan konflik kepentingan (PRD 2.3, ARCHITECTURE §3.3).
  - name: Admin Masters
    description: |
      Pengelolaan master profesi dan keahlian ("Manajemen Skill & Profesi", guideline hal. 16); master terpakai
      dinonaktifkan, tidak dihapus (F-10, F-15, AC F10-4).
  - name: Admin Members
    description: |
      Pengelolaan anggota oleh pengurus: daftar dengan pencarian/filter/urutan/paging server, detail
      administratif, koreksi identitas dan nomor (AC F05-6), suspend/unsuspend (PRD 4.2, AC F12-4, F12-5),
      histori keanggotaan, dan inisiasi pemulihan sandi alumni oleh Super Admin (AC F16-4) (F-15, F-16).
  - name: Admin Moderation
    description: Antrean laporan, bukti terminimalkan dan penyelesaian moderasi oleh pengurus (F-12, F-15).
  - name: Admin Notifications
    description: Status pengiriman notifikasi per kanal dan retry terkendali oleh pengurus (F-13, AC F13-4, PRD 4.5).
  - name: Admin Payments
    description: |
      Antrean verifikasi, keputusan pembayaran, pencatatan iuran yang diverifikasi di luar aplikasi, penyesuaian
      refund/koreksi dan metode bayar oleh pengurus (F-04, F-15, D6, D13).
  - name: Admin Settings
    description: |
      Pengaturan terversi dan teraudit: biaya iuran, versi aplikasi minimum, maintenance, tautan toko, kontak
      dukungan, instruksi iuran per platform dan nilai kebijakan baca-saja (F-15, AC F15-3, F15-4, D4, D13,
      PRD 4.5).
  - name: Auth
    description: |
      Pendaftaran, OTP, koreksi email, login, sesi perangkat, pemulihan/penggantian sandi dan reautentikasi
      (F-01, F-02, PRD 2.5, PRD 5.2). Batas baseline PRD 2.5 (Usulan, final D1): OTP 6 digit berlaku 10 menit,
      5 percobaan, kirim ulang setelah 60 detik, 5 pengiriman per jam per email plus batas IP; 10 kegagalan login
      dalam 15 menit memicu cooldown 15 menit tanpa menutup jalur lupa sandi. Penolakan batas memakai 429
      RATE_LIMITED dengan `retry_after_seconds` dan header Retry-After.
  - name: Chat
    description: Chat langsung dan grup, undangan, pesan keyset, status baca dan reaksi (F-11, PRD 5.2).
  - name: Content
    description: |
      Beranda, berita (feed dan detail), like, kategori, serta halaman informasi dan legal yang dapat dibaca sebelum
      aktivasi (F-08, PRD 3.8, AC F08-1..F08-4).
  - name: Events
    description: |
      Event, peserta, reservasi satu kursi, tiket QR dan pembatalan oleh anggota (F-09, PRD 3.9, PRD 4.4, D5, D6).
      Aturan di bawah mengikat modul events, payments, account dan job; operasi merujuknya sebagai "aturan tag
      Events".

      Model (ARCHITECTURE §3.4):
      - Status event draft, open, closed, done, cancelled; status tiket awaiting_payment, awaiting_review, paid,
        expired, cancelled. Satu tiket aktif (awaiting_payment, awaiting_review, paid) per anggota per event, satu
        kursi, hanya untuk dirinya sendiri; tidak ada jumlah tiket, tipe tiket, rombongan atau tamu (disahkan v3.2).
      - Penghitung tersimpan `events.held_quantity` dan `events.paid_quantity` hanya diubah dalam transaksi yang
        mengunci baris event; CHECK menjamin held + paid <= seats_total (AC F09-1).
      - Draft tidak pernah terlihat oleh anggota (404 NOT_FOUND).

      Proyeksi baca kursi dan hold (AC F09-1, F09-2):
      - Hold kedaluwarsa adalah tiket `awaiting_payment` dengan `hold_expires_at <= now` yang belum dilepas secara
        fisik oleh job expiry (tiap menit) atau oleh transaksi tulis berikutnya pada event itu.
      - Semua respons BACA (anggota dan pengurus) memperlakukan hold kedaluwarsa sebagai sudah lepas: tiketnya
        tampil `expired`, dan `seats_available = seats_total - paid_quantity - held_aktif`, dengan
        `held_aktif = held_quantity - jumlah hold kedaluwarsa event itu`. `registration_state`, `can_reserve`,
        `reservation_blocked_reason`, `held_quantity` dan `min_seats_total` pada respons pengurus memakai nilai yang
        sama. Akibatnya tombol daftar tidak pernah tersembunyi oleh hold yang sudah habis, dan reservasi
        berikutnya melepas hold tersebut secara fisik sebelum memeriksa kuota (createEventReservation langkah 1).
      - Operasi baca tidak pernah menulis; pelepasan fisik selalu dalam transaksi tulis yang mengunci event.

      Urutan kunci global (PRD 6.4 "mengunci tiket/event dalam urutan konsisten"), berlaku bagi setiap transaksi
      yang menyentuh event, tiket atau payment tiket:
      - Urutan: (1) baris events, (2) baris tickets urut id naik, (3) baris payments urut id naik;
        payment_adjustments hanya disisipkan sesudahnya.
      - Transaksi boleh melewati tingkat yang tidak dibutuhkan, tetapi tidak pernah mengunci tingkat yang lebih awal
        sesudah memegang kunci tingkat yang lebih akhir.
      - Id yang diperoleh dari baris lain (`tickets.event_id`, `payments.ticket_id`; keduanya tidak pernah berubah)
        dibaca TANPA kunci lebih dahulu, lalu baris dikunci menurut urutan ini dan statusnya diperiksa ulang
        sesudah kunci didapat.
      - Penerapan: createEventReservation dan job expiry hold mengunci event, tiket hold kedaluwarsa (urut id), lalu
        payment-nya. cancelMyTicket dan adminCancelTicket mengunci event, tiket, lalu payment tiket.
        adminCancelEvent mengunci event, semua tiket aktif event termasuk hold kedaluwarsa (satu langkah, urut id),
        lalu payment tiket tersebut (urut id).
        adminUpdateEvent dan adminSetEventStatus mengunci event (adminUpdateEvent yang menurunkan kuota juga
        melepas hold kedaluwarsa: event, tiket, payment). adminCheckInTicket hanya memakai UPDATE bersyarat pada
        satu tiket. Penghapusan akun (F-14, "tiket hangus") mengunci per event: event, tiket, payment. Job
        pengingat H-3/H-1 mengunci event `FOR SHARE` (tanpa mengunci tiket) lalu membaca ulang status, jadwal dan
        pemegang paid, sehingga pengingat tidak pernah ditulis untuk jadwal usang atau event/tiket yang baru
        dibatalkan (AC F13-6).
      - Modul pembayaran untuk payment `type=ticket` (kirim bukti, approve, reject, batal): handler tiket mengunci
        event lalu tiket SEBELUM modul pembayaran menjalankan `SELECT payments ... FOR UPDATE` (kirim bukti cukup
        mengunci tiket karena penghitung kursi tidak berubah). Ini memerlukan hook PaymentTypeHandler yang dipanggil
        sebelum kunci payment (ARCHITECTURE §4.6, perubahan bersama C5); onApproved dan onRejected tidak boleh
        mengunci event atau tiket sesudah payment terkunci.

      Payment tiket di modul pembayaran (pemilik C3; aturan galat persis mengikuti submitPaymentProof dan
      adminDecidePayment, ringkasannya di sini):
      - Bukti dikirim lewat PUT /me/payments/{paymentId}/proof memakai `payment.id` dari tiket. Bukti sebelum
        `hold_expires_at` memindahkan tiket ke awaiting_review dan kursi tetap ditahan sampai keputusan.
      - Tiket expired atau hold sudah lewat (termasuk payment yang sudah dibatalkan sistem karena hold habis):
        409 RESERVATION_EXPIRED dengan `current` = PaymentDetail (status HTTP sama dengan submitPaymentProof dan
        createEventReservation). Tiket cancelled atau payment tiket rejected: 409 PAYMENT_STATE_CONFLICT dengan
        `current` = PaymentDetail (AC F09-2, F09-4).
      - Keputusan pengurus: approve membuat tiket paid, held menjadi paid dan QR diterbitkan (AC F04-1); reject
        bersifat final, tiket cancelled dan hold dilepas (AC F09-4).
      - Payment berbukti yang tiketnya sudah dibatalkan (event dibatalkan): approve membuat payment paid dan refund
        penuh otomatis (payment_adjustment pending, tenggat 7 hari kerja, D6), tiket tetap cancelled dan penghitung
        kursi tidak berubah; reject tidak membuat refund dan tidak melepas kursi kedua kalinya.

      Akses dan tautan:
      - Akses anggota (PRD 2.2, ARCHITECTURE §3.1): daftar event dan kategori hanya untuk anggota aktif
        (verified/expiring); anggota expired tetap membuka tiketnya (/me/tickets) dan detail event yang pernah ia
        pesan.
      - Deep link notifikasi kategori `event` (ARCHITECTURE §4.7): `/events/<eventId>` dan `/tickets/<ticketId>`.
  - name: Files
    description: |
      Unggah dan akses berkas dengan purpose dan izin berbeda (PRD 2.5, 5.4, N-10). Berkas privat tidak pernah
      dilayani dari folder publik: isi dibuka lewat URL bertanda tangan <= 10 menit yang terikat berkas, purpose,
      dan penerima, setelah pemeriksaan izin. Berkas publik (cover berita/event, banner, avatar publik) memakai URL
      tetap.
  - name: Me
    description: |
      Profil, status keanggotaan, KTA dan periode milik sendiri serta master terkontrol (F-05, F-07, F-10,
      PRD 2.2, 3.5). Semua nilai status dihitung server dari data canonical; klien hanya merender dan merutekan.
  - name: Moderation
    description: Blokir pengguna, pelaporan penyalahgunaan dan banding oleh anggota (F-12).
  - name: Network
    description: Direktori anggota aktif dan profil anggota lain; field tersembunyi tidak ikut payload (F-10, AC F10-2).
  - name: Notifications
    description: Kotak masuk resmi, deep link, preferensi push/email dan token perangkat (F-13, AC F13-1..F13-5).
  - name: Payments
    description: |
      Iuran keanggotaan organisasi (pendaftaran dan perpanjangan), metode bayar transfer manual, bukti transfer,
      pembatalan dan histori pembayaran milik sendiri, termasuk pembayaran tiket (F-03, F-07, F-09, D4, D13).
  - name: Public
    description: |
      Konfigurasi publik (versi minimum, maintenance, tautan toko, kontak bantuan, versi legal), verifikasi KTA dan
      health check tanpa autentikasi (F-06, PRD 4.5, 5.2, 5.5).
paths:
  /me/deletion/disclosure:
    get:
      tags:
        - Account
      operationId: getAccountDeletionDisclosure
      summary: Pengungkapan sebelum hapus akun; data yang dihapus/dianonimkan dan peringatan refund tiket (F-14, N-15).
      description: |
        Ditampilkan di layar /account/delete sebelum reautentikasi dan konfirmasi (N-15: retensi dan penggunaan data
        dijelaskan sebelum pengguna menyetujui). Memuat kategori data yang dihapus dan yang tersisa anonim (D2),
        perkiraan penyelesaian maksimal 7 hari kalender, rotasi backup 30 hari, serta peringatan pribadi: tiket aktif
        beserta kebijakan refund D6 yang berlaku (akun dihapus -> tiket hangus; pengguna diberi tahu untuk mengajukan
        refund lebih dahulu, PRD 3.9), refund yang sedang diproses bendahara tetapi belum ditransfer (PRD 4.4),
        pembayaran yang masih menunggu verifikasi, grup chat yang admin tunggalnya pengguna (AC F14-5), dan identitas
        pengurus tertaut. `version` wajib dikirim kembali saat konfirmasi.
        Tersedia untuk semua effective_status termasuk suspended (penghapusan deletion-only, F-14). Token sesi admin
        ditolak 403 FORBIDDEN (audience mobile).
      x-kapdh-access:
        audience: mobile
        member_access: any
      responses:
        "200":
          description: Pengungkapan terkini.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountDeletionDisclosure"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: FORBIDDEN; dipanggil dengan token sesi admin (audience salah).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"
  /me/deletion:
    post:
      tags:
        - Account
      operationId: requestAccountDeletion
      summary: Minta penghapusan akun dari aplikasi; perlu reautentikasi maksimal 10 menit dan konfirmasi (AC F14-1).
      description: |
        Wajib header X-Reauth-Token (POST /auth/reauth, maksimal 10 menit, terikat sesi) dan `confirm: true` dengan
        `acknowledged_disclosure_version` sama dengan `version` pengungkapan terkini. Dalam satu transaksi dengan
        baris users terkunci: satu permintaan `account_deletions` dibuat (nomor DEL-YYYY-XXXX, sumber `app`, batas
        7 hari), akun menjadi `deletion_pending`, semua sesi dicabut dan `session_version` naik, audit
        `account.deletion_requested` ditulis, dan outbox `account.deletion.requested` (job) serta email konfirmasi
        berisi nomor permintaan dijadwalkan. Setelah commit seluruh socket diputus (AC F14-1). Klien menampilkan
        nomor permintaan lalu menghapus token, cache KTA dan data privat lokal. Bila respons hilang, sesi sudah
        dicabut: klien masuk kembali dan POST /auth/login mengembalikan `next: deletion_pending` beserta status.

        Satu permintaan terbuka per akun (`account_deletions_user_id_open_key`); request bersamaan atau ulangan
        dengan Idempotency-Key yang sama mengembalikan permintaan yang sama. Anggota suspended dapat menghapus akun
        tanpa akses komunitas (F-14). Akun alumni pengurus tetap dapat dihapus; identitas admin tertaut tidak ikut
        terhapus dan diputus tautannya oleh job (PRD 3.14). Job dapat dilanjutkan setelah gagal (AC F14-2, N-15).

        Refund dan pembayaran terbuka (PRD 4.4, D6, D2): penghapusan tidak menunggu refund dan tidak pernah
        menganggap dana sudah dikembalikan. Job tidak menyelesaikan atau membatalkan payment_adjustments refund
        `pending` secara otomatis; catatan itu tetap ada (anonim) untuk diselesaikan atau dibatalkan bendahara
        dengan catatan penyelesaian tersendiri. Data rekening tujuan refund (`refund_destination`) disimpan paling
        lama sampai refund selesai/batal atau sampai langkah akhir job (batas `estimated_completion_at`), mana yang
        lebih dahulu, lalu dihapus bersama data pribadi lain; setelah itu bendahara tidak lagi dapat menghubungi
        pemilik. Karena itu UI menampilkan `pending_refunds` dan `active_tickets` sebelum konfirmasi dan menyarankan
        menunggu refund selesai atau mengajukan refund lebih dahulu. Pembayaran `pending` TANPA bukti dibatalkan job
        (aktor system); pembayaran `pending` yang sudah berbukti tidak dibatalkan karena dana mungkin sudah
        ditransfer, melainkan tetap diputus pengurus dalam bentuk anonim (berkas bukti dan catatan transfer dihapus;
        admin-payments adminDecidePayment). Dana yang sudah ditransfer diselesaikan lewat bendahara.

        Galat: 400 VALIDATION_ERROR (`confirm` bukan true); 403 REAUTH_REQUIRED, atau FORBIDDEN bila dipanggil
        dengan token sesi admin; 409 VERSION_CONFLICT bila pengungkapan berubah (mis. tiket atau refund baru)
        dengan `current` berisi AccountDeletionDisclosure terkini, atau IDEMPOTENCY_CONFLICT.
      x-kapdh-access:
        audience: mobile
        member_access: any
        reauth: true
        idempotent: true
      parameters:
        - $ref: "#/components/parameters/ReauthToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountDeletionRequest"
      responses:
        "202":
          description: Permintaan dibuat; akun deletion_pending dan semua sesi dicabut.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountDeletion"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: |
            REAUTH_REQUIRED (X-Reauth-Token tidak ada, tidak sah atau lebih dari 10 menit; UI membuka reautentikasi)
            atau FORBIDDEN (token sesi admin).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          $ref: "#/components/responses/Conflict"
        default:
          $ref: "#/components/responses/Error"
  /public/deletion/challenge:
    post:
      tags:
        - Account
      operationId: startWebDeletion
      summary: Mulai penghapusan atau cek status dari situs /delete-account; OTP dikirim ke email (F-14, PRD 2.2).
      description: |
        Dipakai situs publik /delete-account (tanpa aplikasi) dan layar status penghapusan aplikasi. Bila email
        milik akun alumni `active` (semua effective_status termasuk suspended: challenge deletion-only tanpa akses
        komunitas), `pending_otp` (pembatalan pendaftaran yang belum diverifikasi, kepala berkas),
        `deletion_pending` (cek status) atau `disabled` (cek status), challenge `deletion` dibuat (baris users
        dikunci, challenge `deletion` lama dibatalkan; challenge aktivasi signup/email_change tidak disentuh) dan
        kode dikirim ke email akun. Untuk email lain (tidak terdaftar, akun admin, akun yang sudah selesai dihapus)
        server mengembalikan challenge pengganti berbentuk sama tanpa email; respons, waktu dan batas 429 identik
        (non-enumerasi, PRD 2.5).
        Kirim ulang memakai POST /auth/otp/resend. Galat: 400 VALIDATION_ERROR email tidak valid; 429 RATE_LIMITED
        (5 pengiriman per jam per email plus batas IP).
      security: []
      x-kapdh-access:
        audience: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebDeletionStartRequest"
      responses:
        "202":
          description: Respons sama apa pun keadaan email.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpChallenge"
        "400":
          $ref: "#/components/responses/ValidationError"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Error"
  /public/deletion/verify:
    post:
      tags:
        - Account
      operationId: verifyWebDeletion
      summary: Verifikasi OTP penghapusan; tampilkan status dan pengungkapan, terbitkan deletion_token terbatas (F-14).
      description: |
        Kode `deletion` benar dikonsumsi sekali secara atomik. Respons adalah challenge terbatas (PRD 2.2): tidak ada
        sesi, hanya status permintaan penghapusan terbuka (`deletion`) dan, bila akun dapat dihapus, pengungkapan
        retensi/peringatan (`disclosure`) serta `deletion_token` hanya untuk POST /public/deletion/confirm: JWT
        audience `kapdh-web-deletion` berumur maksimal 10 menit (sama dengan batas reautentikasi F-14), subject
        akun, klaim `cid` challenge yang dikonsumsi, `sv` (users.session_version) dan `st` (users.status saat
        verifikasi: `active` atau `pending_otp`). Token tidak disimpan di server; sifat sekali pakainya dijamin
        konfirmasi yang mengubah akun menjadi `deletion_pending` (kepala auth.yaml).
        Bila respons hilang, kode sudah dikonsumsi: pengguna meminta challenge baru.
        Akun `active` (termasuk suspended) -> `deletable` true, `registration_pending` false.
        Akun `pending_otp` -> `deletable` true, `registration_pending` true: konfirmasi membatalkan pendaftaran yang
        belum diverifikasi dan menghapus datanya; pengungkapan berisi kategori data yang sama dengan daftar
        peringatan pribadi kosong (akun pending_otp tidak dapat membayar, memesan tiket atau masuk grup).
        Akun `deletion_pending` -> `deletable` false, `blocked_reason: deletion_in_progress`, `deletion` terisi.
        Akun `disabled` -> `deletable` false, `blocked_reason: account_disabled` (pemulihan atau penghapusan melalui
        kanal bantuan, PRD 2.2): setelah identitas pemilik diverifikasi, operator memulai permintaan penghapusan
        (sumber `web`, job dan deletion ledger yang sama) lewat CLI teraudit `account:status --action delete`
        (runbook docs/runbooks/alumni-account-disabled.md), sehingga penghapusan tetap selalu tersedia (F-14).
        Challenge pengganti dari email tak terdaftar selalu diperlakukan sebagai kode salah sampai percobaan habis.
        Galat: 400 VALIDATION_ERROR kode salah dengan sisa percobaan di `field_errors.code`; 410 OTP_EXPIRED
        (kedaluwarsa, dipakai, diganti, percobaan habis, tujuan lain); 429 RATE_LIMITED.
      security: []
      x-kapdh-access:
        audience: public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebDeletionVerifyRequest"
      responses:
        "200":
          description: OTP benar; status dan pilihan penghapusan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebDeletionVerification"
        "400":
          description: Kode salah (VALIDATION_ERROR) dengan sisa percobaan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "410":
          description: Challenge tidak berlaku (OTP_EXPIRED); minta kode baru.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Error"
  /public/deletion/confirm:
    post:
      tags:
        - Account
      operationId: confirmWebDeletion
      summary: Konfirmasi penghapusan dari web dengan deletion_token; nomor permintaan ditampilkan (AC F14-1).
      description: |
        Halaman web benar-benar menerima permintaan, bukan hanya menyarankan menghubungi pengurus (F-14).
        `confirm: true` dan `acknowledged_disclosure_version` wajib sama dengan pengungkapan terkini. Dalam satu
        transaksi dengan baris users terkunci (FOR UPDATE): deletion_token diverifikasi (tanda tangan, audience,
        kedaluwarsa, challenge `cid` milik akun bertujuan `deletion` dan sudah dikonsumsi, `sv` sama dengan
        session_version saat ini) dan akun harus masih berstatus `st` yang tercatat di token (`active` dengan
        effective_status apa pun termasuk suspended, atau `pending_otp`); lalu transisi bersyarat users
        `st` -> `deletion_pending` (`UPDATE ... WHERE status = <st> RETURNING`) serta insert account_deletions
        (`account_deletions_user_id_open_key`). Karena akun tidak lagi `st` dan session_version naik, token yang
        sama tidak pernah berhasil dua kali (sekali pakai tanpa penyimpanan token). Efek sama dengan
        POST /me/deletion (sumber `web`, termasuk perlakuan refund): sesi/socket dicabut, audit, job dan email
        konfirmasi lewat outbox. Pengulangan dengan Idempotency-Key sama mengembalikan respons pertama; tanpa key,
        pengulangan setelah berhasil menghasilkan 410 dan pengguna memeriksa status lewat challenge -> verify
        (`deletion` terisi).

        Pendaftaran `pending_otp`: dalam transaksi yang sama challenge signup/email_change yang masih aktif
        dibatalkan, sehingga kode aktivasi yang sudah terkirim tidak dapat lagi mengaktifkan akun; aktivasi dan
        konfirmasi saling eksklusif karena keduanya memakai UPDATE bersyarat pada status dengan baris users
        terkunci (aktivasi lebih dahulu -> konfirmasi 410; konfirmasi lebih dahulu -> verifikasi OTP 410). Nomor
        anggota tidak pernah dialokasikan. Job menghapus data pendaftaran seperti akun lain; email akun dapat
        dipakai mendaftar lagi setelah permintaan selesai (`users_kind_email_key` hanya berlaku untuk akun yang
        belum `deleted`).
        Galat: 400 VALIDATION_ERROR; 409 VERSION_CONFLICT bila pengungkapan berubah (`current` berisi
        AccountDeletionDisclosure terkini; token tetap berlaku sampai kedaluwarsa) atau IDEMPOTENCY_CONFLICT;
        410 OTP_EXPIRED bila deletion_token kedaluwarsa, tidak sah, sudah dipakai, atau keadaan akun berubah
        (tidak dibedakan); 429 RATE_LIMITED.
      security: []
      x-kapdh-access:
        audience: public
        idempotent: true
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebDeletionConfirmRequest"
      responses:
        "202":
          description: Permintaan dibuat (atau permintaan terbuka yang sama dikembalikan).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountDeletion"
        "400":
          $ref: "#/components/responses/ValidationError"
        "409":
          $ref: "#/components/responses/Conflict"
        "410":
          description: deletion_token tidak berlaku (OTP_EXPIRED); ulangi verifikasi email.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Error"
  /admin/admins:
    get:
      tags:
        - Admin Admins
      operationId: adminListAdmins
      summary: Daftar dan pencarian admin (Super Admin, F-16, guideline hlm. 15).
      description: |
        Tabel "Daftar Admin": nama, email login admin, peran dan akses, status. `q` mencari nama tampilan atau email
        (tanpa membedakan huruf besar/kecil). `total` mengikuti filter; `counts` adalah ringkasan seluruh admin
        untuk kartu "N Admin, M aktif". Sesi admin wajib sudah TOTP (403 MFA_REQUIRED, AC F02-2); tanpa izin
        admins.manage ditolak 403 FORBIDDEN walaupun menu disembunyikan (PRD 2.3).
      x-kapdh-access:
        audience: admin
        permissions:
          - admins.manage
      parameters:
        - name: q
          in: query
          required: false
