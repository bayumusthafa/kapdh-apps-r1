        status:
          $ref: "#/components/schemas/EventStatus"
        price:
          $ref: "#/components/schemas/Money"
        seats_total:
          type: integer
          minimum: 1
          description: Kolom "Total Tiket" (kuota).
        seats_available:
          type: integer
          minimum: 0
          description: Kolom "Sisa Tiket" = seats_total - held_quantity - paid_quantity (proyeksi kursi tag Events).
        held_quantity:
          type: integer
          minimum: 0
          description: |
            Kursi ditahan tiket awaiting_payment yang hold-nya belum lewat dan tiket awaiting_review (proyeksi kursi
            tag Events; hold kedaluwarsa yang belum dilepas job tidak dihitung).
        paid_quantity:
          type: integer
          minimum: 0
          description: Kursi dikonsumsi tiket paid.
        has_tickets:
          type: boolean
          description: True bila event pernah memiliki tiket (status apa pun); hapus dinonaktifkan (AC F15-2).
        version:
          type: string
        updated_at:
          type: string
          format: date-time
    AdminEventTargetStatus:
      type: string
      enum:
        - open
        - closed
      description: Status yang dapat diset pengurus lewat POST /admin/events/{eventId}/status.
    AdminEventTicket:
      type: object
      required:
        - id
        - event_id
        - status
        - total
        - holder
        - holder_eligible
        - hold_expires_at
        - checked_in_at
        - checked_in_by
        - cancelled_at
        - cancelled_by
        - cancel_reason
        - payment
        - refunds
        - review_overdue
        - can_refund
        - created_at
        - version
      properties:
        id:
          type: string
          format: uuid
        event_id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/TicketStatus"
        total:
          $ref: "#/components/schemas/Money"
        holder:
          $ref: "#/components/schemas/AdminEventTicketHolder"
        holder_eligible:
          type: boolean
          description: False bila akun pemegang suspended, disabled, deletion_pending atau dihapus (PRD 2.2).
        hold_expires_at:
          type:
            - string
            - "null"
          format: date-time
        checked_in_at:
          type:
            - string
            - "null"
          format: date-time
        checked_in_by:
          oneOf:
            - $ref: "#/components/schemas/AdminEventActor"
            - type: "null"
        cancelled_at:
          type:
            - string
            - "null"
          format: date-time
        cancelled_by:
          oneOf:
            - $ref: "#/components/schemas/TicketCancelledBy"
            - type: "null"
        cancel_reason:
          type:
            - string
            - "null"
        payment:
          oneOf:
            - $ref: "#/components/schemas/AdminTicketPayment"
            - type: "null"
        refunds:
          type: array
          description: |
            Semua refund atas payment tiket ini (D6), urut `created_at` turun lalu id; kosong bila tidak ada.
            Termasuk refund cancelled sebagai riwayat; total pending + completed tidak melebihi nominal payment.
          items:
            $ref: "#/components/schemas/TicketRefundInfo"
        review_overdue:
          type: boolean
          description: |
            True bila payment tiket pending berbukti dan waktu server sudah melewati `payment.review_due_at`; sama
            dengan `overdue` di antrean pembayaran (adminListPayments). Dieskalasi, tidak dibatalkan otomatis (D5,
            PRD 3.9).
        can_refund:
          type: boolean
          description: |
            True bila PEMANGGIL saat ini boleh membatalkan tiket ini dengan `refund=true`: tiket paid, total > 0,
            belum check-in, event tidak cancelled, pemanggil memiliki payments.decide, dan pemegang bukan akun alumni
            tertaut pemanggil (PRD 2.3). UI menyembunyikan pilihan refund bila false.
        created_at:
          type: string
          format: date-time
        version:
          type: string
    AdminEventTicketHolder:
      type: object
      description: Data pemegang minimum untuk pengurus event; null setelah akun dihapus (AC F14-4).
      required:
        - user_id
        - full_name
        - member_number
        - cohort
        - cohort_code
        - avatar_url
      properties:
        user_id:
          type:
            - string
            - "null"
          format: uuid
        full_name:
          type:
            - string
            - "null"
        member_number:
          type:
            - string
            - "null"
          examples:
            - 29.01.01.7
        cohort:
          type:
            - integer
            - "null"
        cohort_code:
          type:
            - string
            - "null"
          examples:
            - KAPDH 29
        avatar_url:
          type:
            - string
            - "null"
          format: uri
    AdminEventTicketPage:
      type: object
      required:
        - items
        - total
