            profession:
              oneOf:
                - $ref: "#/components/schemas/MasterItem"
                - type: "null"
              description: Deprecated (aplikasi 1.0.0); profesi pertama yang tertaut master.
            professions:
              type: array
              maxItems: 5
              description: Profesi sesuai urutan anggota (pertama = utama); ketikan sendiri maupun label master.
              items:
                $ref: "#/components/schemas/ProfessionLabel"
            profession_entries:
              type: array
              maxItems: 5
              description: |
                Entri `professions` beserta tautan masternya, sejajar dan seurutan dengan `professions` (label sama
                per indeks), sehingga setiap profesi bertaut master nonaktif dapat ditandai sebagai label historis
                (AC F10-4), bukan hanya profesi bertaut pertama (`profession`). Selalu dikirim server; opsional agar
                klien tetap berjalan terhadap API sebelum field ini ada (tanpanya hanya `profession` yang diketahui
                tautan masternya).
              items:
                $ref: "#/components/schemas/AdminMemberProfessionEntry"
            education:
              type: array
              maxItems: 10
              description: Riwayat pendidikan, terbaru di atas.
              items:
                $ref: "#/components/schemas/EducationEntry"
            social_links:
              type: array
              maxItems: 10
              description: Semua tautan sosial terlepas dari show_social (tujuan administratif, F-10).
              items:
                $ref: "#/components/schemas/SocialLink"
            skills:
              type: array
              items:
                $ref: "#/components/schemas/MasterItem"
            avatar_file_id:
              type:
                - string
                - "null"
              format: uuid
            email_verified_at:
              type:
                - string
                - "null"
              format: date-time
              description: Waktu OTP pendaftaran terverifikasi, juga waktu KTA dibuat (AC F01-2).
            last_login_at:
              type:
                - string
                - "null"
              format: date-time
            starts_at:
              type:
                - string
                - "null"
              format: date-time
            renewal_opens_at:
              type:
                - string
                - "null"
              format: date-time
            suspension:
              oneOf:
                - $ref: "#/components/schemas/AdminMemberSuspension"
                - type: "null"
            linked_admin:
              oneOf:
                - $ref: "#/components/schemas/AdminMemberLinkedAdmin"
                - type: "null"
            periods:
              type: array
              description: |
                Periode activation/renewal, terbaru lebih dulu. `kind` memakai kosakata yang sama dengan
                AdminMembershipEventKind dan membership_events.kind sehingga satu baris tampil identik di detail
                dan di GET /admin/members/{userId}/membership-events.
              items:
                $ref: "#/components/schemas/MembershipPeriod"
            recent_payments:
              type:
                - array
                - "null"
              description: Maksimal 10 pembayaran terbaru; null bila admin tidak memiliki izin payments.read (PRD 2.3).
              items:
                $ref: "#/components/schemas/AdminMemberPaymentSummary"
            recent_tickets:
              type:
                - array
                - "null"
              description: |
                Maksimal 10 tiket terbaru; null bila admin tidak memiliki events.manage maupun payments.read
                (partisipasi event dan pembayaran tiket di luar area izinnya, PRD 2.3, AC F15-1).
              items:
                $ref: "#/components/schemas/AdminMemberTicketSummary"
            moderation:
              oneOf:
                - $ref: "#/components/schemas/AdminMemberModerationSummary"
                - type: "null"
              description: Null bila admin tidak memiliki izin moderation.read.
            version:
              type: string
              description: Versi alumni untuk If-Match (AC F15-4).
    AdminMemberLinkedAdmin:
      type: object
      description: Identitas admin terpisah yang tertaut ke akun alumni ini untuk cek konflik kepentingan (PRD 2.3, F-16).
      required:
        - admin_id
        - display_name
        - role
        - status
      properties:
        admin_id:
          type: string
          format: uuid
        display_name:
          type: string
        role:
          $ref: "#/components/schemas/AdminRole"
        status:
          type: string
          enum:
            - invited
            - active
            - disabled
    AdminMemberModerationSummary:
      type: object
      description: Ringkasan moderasi tanpa bukti; detail laporan di menu moderasi (F-12).
      required:
        - open_report_count
        - total_report_count
        - warning_count
        - last_action_at
      properties:
        open_report_count:
          type: integer
          minimum: 0
          description: Laporan open/in_review terhadap anggota ini.
        total_report_count:
          type: integer
          minimum: 0
        warning_count:
          type: integer
          minimum: 0
          description: Jumlah peringatan (membership_event warn).
        last_action_at:
          type:
            - string
            - "null"
          format: date-time
          description: Waktu tindakan moderasi terakhir (warn/suspend/unsuspend).
    AdminMemberPage:
      type: object
      required:
        - items
        - next_cursor
        - total
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminMemberSummary"
        next_cursor:
          type:
            - string
            - "null"
        total:
          type: integer
          minimum: 0
          description: Jumlah anggota yang cocok dengan filter.
    AdminMemberPasswordResetRequest:
      type: object
      required:
        - reason
        - confirm
      additionalProperties: false
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 500
          description: Alasan/permintaan anggota yang menjadi dasar pemulihan, untuk audit.
        confirm:
          type: boolean
          const: true
          description: Konfirmasi eksplisit bahwa seluruh sesi anggota akan dicabut (PRD 4.5).
    AdminMemberPasswordResetResult:
      type: object
      description: Hasil inisiasi; tidak memuat kode, token atau sandi (AC F16-4).
      required:
        - initiated_at
        - sessions_revoked
        - challenge_expires_at
      properties:
        initiated_at:
          type: string
          format: date-time
        sessions_revoked:
          type: integer
          minimum: 0
          description: Jumlah sesi anggota yang dicabut.
        challenge_expires_at:
          type: string
          format: date-time
          description: Batas berlaku challenge pemulihan (OTP 10 menit, PRD 2.5).
    AdminMemberPaymentSummary:
      type: object
      description: Ringkasan pembayaran anggota tanpa bukti (bukti hanya di /admin/payments/{paymentId}).
      required:
        - id
        - type
        - status
        - amount
        - proof_version
        - created_at
        - submitted_at
        - decided_at
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/PaymentType"
        status:
          $ref: "#/components/schemas/PaymentStatus"
        amount:
          $ref: "#/components/schemas/Money"
        proof_version:
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time
        submitted_at:
          type:
            - string
            - "null"
          format: date-time
        decided_at:
          type:
            - string
            - "null"
          format: date-time
    AdminMemberProfessionEntry:
      type: object
      description: |
        Satu profesi anggota dengan tautan masternya (F-10, AC F10-4). Master nonaktif hanya tetap tertaut selama
        entrinya tidak dihapus: setelah dihapus dan disimpan, label yang diketik ulang tersimpan sebagai ketikan
        sendiri (master: null) dan anggota tidak lagi cocok dengan filter `profession_id` master itu.
      required:
        - label
        - master
      properties:
        label:
          $ref: "#/components/schemas/ProfessionLabel"
        master:
          oneOf:
            - $ref: "#/components/schemas/MasterItem"
            - type: "null"
          description: Master yang tertaut beserta `active`; null untuk profesi ketikan sendiri.
    AdminMemberSort:
      type: string
      enum:
        - registered_desc
        - registered_asc
        - name_asc
        - name_desc
        - cohort_asc
        - cohort_desc
        - member_number_asc
        - expires_at_asc
        - expires_at_desc
      description: |
        Urutan daftar anggota; setiap urutan diakhiri user_id agar keyset stabil. expires_at null (belum paid)
        diletakkan di akhir.
    AdminMemberSummary:
      type: object
      description: Baris daftar/kartu anggota (guideline hal. 12, 15, 16).
      required:
        - user_id
        - full_name
        - email
        - gender
        - cohort
        - cohort_code
        - member_number
        - city
        - avatar_url
        - profession_label
        - account_status
        - effective_status
        - expires_at
        - has_linked_admin
        - registered_at
      properties:
        user_id:
          type: string
          format: uuid
        full_name:
          type: string
        email:
          type: string
          format: email
        gender:
          $ref: "#/components/schemas/Gender"
        cohort:
          type: integer
          minimum: 1
          maximum: 99
        cohort_code:
          type: string
          examples:
            - KAPDH 29
        member_number:
          oneOf:
            - $ref: "#/components/schemas/MemberNumber"
            - type: "null"
          description: Null hanya untuk akun pending_otp (nomor dialokasikan saat OTP).
        city:
          type:
            - string
            - "null"
        avatar_url:
          type:
            - string
            - "null"
          format: uri
        profession_label:
          type:
            - string
            - "null"
          description: Profesi utama (pertama di daftar profesi); null bila tidak ada.
        account_status:
          $ref: "#/components/schemas/AccountStatus"
        effective_status:
          $ref: "#/components/schemas/EffectiveStatus"
        expires_at:
          type:
            - string
            - "null"
          format: date-time
        has_linked_admin:
          type: boolean
          description: True bila alumni tertaut ke identitas admin (label "Admin" di dasbor, F-16).
        registered_at:
          type: string
          format: date-time
    AdminMemberSuspendRequest:
      type: object
      required:
        - reason
        - member_message
        - confirm
      additionalProperties: false
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 1000
          description: Alasan internal untuk audit dan histori; tidak pernah dikirim ke anggota atau publik (F-06).
        member_message:
          type: string
          minLength: 3
          maxLength: 500
          description: Pesan aman yang ditampilkan di portal pembatasan anggota (PRD 2.2).
        confirm:
          type: boolean
          const: true
          description: Konfirmasi eksplisit dari dialog (PRD 4.5).
    AdminMemberSuspension:
      type: object
      required:
        - suspended_at
        - reason
        - reason_redacted
        - member_message
        - suspended_by
      properties:
        suspended_at:
          type: string
          format: date-time
        reason:
          type:
            - string
            - "null"
          description: |
            Alasan internal moderasi; tidak pernah dikirim ke anggota atau publik. Null bila pemanggil tidak memiliki
            izin moderation.read (lihat reason_redacted) atau bila memang tidak tercatat (PRD 2.3, AC F15-1).
        reason_redacted:
          type: boolean
          description: |
            True bila alasan disembunyikan karena pemanggil tidak memiliki izin moderation.read; UI menampilkan
            "Alasan hanya untuk pemegang izin moderasi", bukan "tanpa alasan".
        member_message:
          type:
            - string
            - "null"
          description: Pesan aman yang ditampilkan di portal pembatasan anggota (PRD 2.2).
        suspended_by:
          oneOf:
            - $ref: "#/components/schemas/AdminMemberActor"
            - type: "null"
    AdminMemberTicketStatus:
      type: string
      enum:
        - awaiting_payment
        - awaiting_review
        - paid
        - expired
        - cancelled
      description: Status tiket (PRD 4.4); checked-in adalah atribut tiket paid, bukan status.
    AdminMemberTicketSummary:
      type: object
      required:
        - id
        - event_id
        - event_title
        - event_starts_at
        - status
        - total
        - checked_in_at
        - created_at
      properties:
        id:
          type: string
          format: uuid
        event_id:
          type: string
          format: uuid
        event_title:
          type: string
        event_starts_at:
          type: string
          format: date-time
        status:
          $ref: "#/components/schemas/AdminMemberTicketStatus"
        total:
          $ref: "#/components/schemas/Money"
        checked_in_at:
          type:
            - string
            - "null"
          format: date-time
        created_at:
          type: string
          format: date-time
    AdminMemberUnsuspendRequest:
      type: object
      required:
        - reason
        - confirm
      additionalProperties: false
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 1000
          description: Alasan pencabutan pembatasan untuk audit, histori dan resolution_note banding yang ditutup.
        member_message:
          type: string
          minLength: 3
          maxLength: 500
          description: |
            Opsional. Pesan aman untuk anggota pada notifikasi pencabutan dan sebagai `decision_message` banding
            yang ditutup sebagai dikabulkan (sama dengan member_message adminResolveReport); bila tidak dikirim,
            server memakai teks baku "Pembatasan akun Anda telah dicabut pengurus".
        confirm:
          type: boolean
          const: true
          description: Konfirmasi eksplisit dari dialog (PRD 4.5).
    AdminMemberUpdate:
      type: object
      description: |
        Perubahan sebagian oleh pengurus (members.manage). `reason` wajib. Tidak menerima member_number, email,
        flag privasi atau field lain di luar skema (400, AC F05-6). Minimal satu field selain reason.
      additionalProperties: false
      required:
        - reason
      minProperties: 2
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 500
          description: Alasan perubahan untuk audit; tidak boleh hanya spasi.
        full_name:
          type: string
          minLength: 2
          maxLength: 120
        gender:
          $ref: "#/components/schemas/Gender"
        cohort:
          type: integer
          minimum: 1
          maximum: 99
        class_in:
          $ref: "#/components/schemas/ClassLevel"
        class_out:
          $ref: "#/components/schemas/ClassLevel"
        city:
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 80
        phone:
          type:
            - string
            - "null"
          maxLength: 24
          pattern: ^\+?[0-9][0-9 -]{5,22}$
        bio:
          type:
            - string
            - "null"
          maxLength: 500
        professions:
          type: array
          maxItems: 5
          description: Daftar profesi pengganti (aturan sama dengan ProfileUpdate.professions).
          items:
            $ref: "#/components/schemas/ProfessionLabel"
        education:
          type: array
          maxItems: 10
          description: Riwayat pendidikan pengganti (aturan sama dengan ProfileUpdate.education).
          items:
            $ref: "#/components/schemas/EducationEntryInput"
        social_links:
          type: array
          maxItems: 10
          description: Tautan sosial pengganti (aturan sama dengan ProfileUpdate.social_links).
          items:
            $ref: "#/components/schemas/SocialLinkInput"
        last_education_institution:
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 120
          description: Deprecated (aplikasi 1.0.0); pakai `education`.
        last_education_city:
          type:
            - string
            - "null"
          minLength: 1
          maxLength: 80
          description: Deprecated (aplikasi 1.0.0).
        social_instagram:
          oneOf:
            - $ref: "#/components/schemas/SocialHandle"
            - type: "null"
          description: Deprecated; pakai `social_links`. Instagram (aturan SocialHandle); null mengosongkan.
        social_x:
          oneOf:
            - $ref: "#/components/schemas/SocialHandle"
            - type: "null"
          description: Deprecated; pakai `social_links`. X (aturan SocialHandle); null mengosongkan.
        social_facebook:
          oneOf:
            - $ref: "#/components/schemas/SocialHandle"
            - type: "null"
          description: Deprecated; pakai `social_links`. Facebook (aturan SocialHandle); null mengosongkan.
        social_linkedin:
          oneOf:
            - $ref: "#/components/schemas/SocialHandle"
            - type: "null"
          description: Deprecated; pakai `social_links`. LinkedIn (aturan SocialHandle); null mengosongkan.
        profession_id:
          type:
            - string
            - "null"
          format: uuid
          description: Deprecated; pakai `professions`. Aturan transisi sama dengan ProfileUpdate.profession_id.
        skill_ids:
          type: array
          maxItems: 10
          uniqueItems: true
          items:
            type: string
            format: uuid
        remove_avatar:
          type: boolean
          description: true menghapus foto anggota (mis. foto tidak pantas); false diabaikan.
    AdminMembershipEvent:
      type: object
      required:
        - id
        - kind
        - created_at
        - actor
        - payment_id
        - reason
        - reason_redacted
        - before_starts_at
        - after_starts_at
        - before_expires_at
        - after_expires_at
        - before_member_number
        - after_member_number
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/AdminMembershipEventKind"
        created_at:
          type: string
          format: date-time
        actor:
          oneOf:
            - $ref: "#/components/schemas/AdminMemberActor"
            - type: "null"
          description: Null untuk tindakan sistem atau admin yang sudah dihapus.
        payment_id:
          type:
            - string
            - "null"
          format: uuid
          description: Payment sumber activation/renewal.
        reason:
          type:
            - string
            - "null"
          description: |
            Alasan internal (suspend, unsuspend, koreksi nomor, peringatan). Untuk suspend/unsuspend null bila
            pemanggil tidak memiliki izin moderation.read (reason_redacted true); entri warn tidak dikembalikan
            kepada pemanggil tersebut (PRD 2.3, AC F15-1).
        reason_redacted:
          type: boolean
          description: True bila alasan disembunyikan karena izin moderation.read tidak dimiliki pemanggil.
        before_starts_at:
          type:
            - string
            - "null"
          format: date-time
        after_starts_at:
          type:
            - string
            - "null"
          format: date-time
        before_expires_at:
          type:
            - string
            - "null"
          format: date-time
        after_expires_at:
          type:
            - string
            - "null"
          format: date-time
        before_member_number:
          type:
            - string
            - "null"
        after_member_number:
          type:
            - string
            - "null"
    AdminMembershipEventKind:
      type: string
      enum:
        - activation
        - renewal
        - suspend
        - unsuspend
        - number_correction
        - warn
      description: |
        Jenis histori keanggotaan/moderasi (membership_events.kind, PRD 6.3). Nilai activation dan renewal sama
        dengan MembershipPeriodKind pada AdminMemberDetail.periods.
    AdminMembershipEventPage:
      type: object
      required:
        - items
        - next_cursor
        - total
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminMembershipEvent"
        next_cursor:
          type:
            - string
            - "null"
        total:
          type: integer
          minimum: 0
    AdminMembershipPolicy:
      description: Kebijakan periode keanggotaan (app_settings `membership`, D4, v3.2); baca-saja.
      allOf:
        - $ref: "#/components/schemas/AdminSettingMeta"
        - type: object
          required:
            - period_months
            - expiring_days
            - renewal_window_days
          properties:
            period_months:
              type: integer
              description: Periode per iuran paid dalam bulan kalender (12).
            expiring_days:
              type: integer
              description: Sisa hari yang membuat status expiring (30).
            renewal_window_days:
              type: integer
              description: Jendela perpanjangan sebelum habis (30).
    AdminMfaRequest:
      type: object
      required:
        - mfa_token
      description: Tepat satu dari totp_code atau backup_code wajib diisi.
      properties:
        mfa_token:
          type: string
          maxLength: 2048
        totp_code:
          type: string
          pattern: ^[0-9]{6}$
          x-sensitive: true
        backup_code:
          type: string
          minLength: 6
          maxLength: 32
          x-sensitive: true
    AdminMinAppVersionInput:
      type: object
      required:
        - android
        - ios
      properties:
        android:
          type: string
          maxLength: 32
          pattern: ^[0-9]+\.[0-9]+\.[0-9]+$
          description: Semver MAJOR.MINOR.PATCH.
        ios:
          type: string
          maxLength: 32
          pattern: ^[0-9]+\.[0-9]+\.[0-9]+$
          description: Semver MAJOR.MINOR.PATCH.
    AdminMinAppVersionSetting:
      description: Versi aplikasi minimum per platform (app_settings `min_app_version`).
      allOf:
        - $ref: "#/components/schemas/AdminSettingMeta"
        - type: object
          required:
            - android
            - ios
          properties:
            android:
              type: string
              examples:
                - 1.0.0
            ios:
              type: string
              examples:
                - 1.0.0
    AdminModerationContestedSuspension:
      type: object
      description: |
        Snapshot suspend yang sedang berlaku saat banding diajukan (PRD 3.12). `in_force` menyatakan apakah suspend
        yang sama masih berlaku sekarang.
      required:
        - membership_event_id
        - suspended_at
        - suspension_reason
        - suspension_message
        - suspended_by
        - in_force
      properties:
        in_force:
          type: boolean
          description: |
            Dihitung saat dibaca: true bila alumni.suspended_at pemohon sama dengan `suspended_at` snapshot. False
            berarti banding usang (suspend yang dibanding sudah dicabut); hanya dapat ditutup dengan unsuspend
            sebagai dikabulkan tanpa mengubah keanggotaan (lihat POST /admin/reports/{reportId}/resolve).
        membership_event_id:
          type:
            - string
            - "null"
          format: uuid
          description: membership_events kind suspend terbaru milik pemohon; null bila tidak ditemukan (data lama).
        suspended_at:
          type: string
          format: date-time
        suspension_reason:
          type:
            - string
            - "null"
          maxLength: 1000
          description: Alasan internal suspend; hanya untuk pengurus.
        suspension_message:
          type:
            - string
            - "null"
          maxLength: 500
          description: Pesan yang ditampilkan kepada anggota saat disuspend.
        suspended_by:
          oneOf:
            - $ref: "#/components/schemas/ModerationAdminRef"
            - type: "null"
          description: Pengurus yang men-suspend; null bila akunnya sudah dihapus.
    AdminModerationEvidence:
      type: object
      description: |
        Bukti terminimalkan yang dicatat saat laporan dibuat (PRD 3.12, D2): hanya pesan yang dilaporkan dan konteks
        pilihan pelapor, snapshot profil, metadata grup, atau (banding) snapshot suspend yang dibanding. Tidak ada
        akses ke riwayat chat lainnya.
      required:
        - captured_at
        - messages
        - room
        - profile
        - contested_suspension
      properties:
        captured_at:
          type: string
          format: date-time
        messages:
          type: array
          maxItems: 6
          items:
            $ref: "#/components/schemas/AdminModerationEvidenceMessage"
        room:
          oneOf:
            - $ref: "#/components/schemas/AdminModerationEvidenceRoom"
            - type: "null"
        profile:
          oneOf:
            - $ref: "#/components/schemas/AdminModerationEvidenceProfile"
            - type: "null"
        contested_suspension:
          oneOf:
            - $ref: "#/components/schemas/AdminModerationContestedSuspension"
            - type: "null"
          description: Hanya banding; suspend yang dibanding. Null untuk laporan biasa.
    AdminModerationEvidenceImage:
      type: object
      required:
        - file_id
        - url
        - url_expires_at
      properties:
        file_id:
          type:
            - string
            - "null"
          format: uuid
        url:
          type:
            - string
            - "null"
          format: uri
          description: URL bertanda tangan maksimal 10 menit; null bila berkas sudah dihapus (AC F14-3).
          x-sensitive: true
        url_expires_at:
          type:
            - string
            - "null"
          format: date-time
    AdminModerationEvidenceMessage:
      type: object
      description: Snapshot pesan saat laporan dibuat.
      required:
        - message_id
        - reported
        - sender_user_id
        - sender_name
        - kind
        - body
        - image
        - created_at
        - deleted_since_report
      properties:
        message_id:
          type: string
          format: uuid
        reported:
          type: boolean
          description: True untuk pesan yang dilaporkan; false untuk pesan konteks.
        sender_user_id:
          type:
            - string
            - "null"
          format: uuid
        sender_name:
          type:
            - string
            - "null"
          description: Null bila akun pengirim sudah dihapus (D2).
        kind:
          $ref: "#/components/schemas/ChatMessageKind"
        body:
          type:
            - string
            - "null"
          maxLength: 4000
          x-sensitive: true
        image:
          oneOf:
            - $ref: "#/components/schemas/AdminModerationEvidenceImage"
            - type: "null"
        created_at:
          type: string
          format: date-time
        deleted_since_report:
          type: boolean
          description: True bila pesan aslinya sudah dihapus setelah laporan dibuat; snapshot tetap utuh.
    AdminModerationEvidenceProfile:
      type: object
      description: Snapshot profil publik minimum pihak terlapor saat laporan dibuat.
      required:
        - full_name
        - bio
        - avatar
      properties:
        full_name:
          type:
            - string
            - "null"
          maxLength: 120
        bio:
          type:
            - string
            - "null"
          maxLength: 500
        avatar:
          oneOf:
            - $ref: "#/components/schemas/AdminModerationEvidenceImage"
            - type: "null"
    AdminModerationEvidenceRoom:
      type: object
      description: |
        Snapshot metadata grup saat laporan dibuat (PRD 3.12): nama, avatar dan jumlah anggota, sehingga konteks
        tidak hilang walaupun admin grup kemudian mengganti nama/avatar atau grup ditutup.
      required:
        - room_id
        - kind
        - name
        - avatar
        - member_count
      properties:
        room_id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/ChatRoomKind"
        name:
          type:
            - string
            - "null"
          maxLength: 80
        avatar:
          oneOf:
            - $ref: "#/components/schemas/AdminModerationEvidenceImage"
            - type: "null"
          description: |
            Avatar grup yang berlaku saat laporan dibuat (avatar itu sendiri dapat menjadi konten yang dilaporkan).
            Snapshot menyimpan rujukan berkas avatar saat itu, bukan avatar grup terkini; berkas yang dirujuk bukti
            ditahan selama laporan disimpan walaupun avatar grup diganti atau dihapus. URL bertanda tangan maksimal
            10 menit. Null bila grup tidak memiliki avatar saat laporan dibuat; bila berkasnya sudah dihapus sesuai
            retensi D2, objek tetap ada dengan url null.
        member_count:
          type: integer
          minimum: 0
          maximum: 100
    AdminModerationHistoryEntry:
      type: object
      required:
        - kind
        - reason
        - actor_name
        - created_at
      properties:
        kind:
          $ref: "#/components/schemas/ModerationHistoryKind"
        reason:
          type:
            - string
            - "null"
          maxLength: 1000
          description: Alasan internal pengurus.
        actor_name:
          type:
            - string
            - "null"
          description: Nama tampilan pengurus; null bila akun admin dihapus.
        created_at:
          type: string
          format: date-time
    AdminModerationParty:
      type: object
      description: Identitas minimum anggota dalam moderasi (tanpa kontak). Null bila akun sudah dihapus (D2).
      required:
        - user_id
        - full_name
        - member_number
        - cohort
      properties:
        user_id:
          type: string
          format: uuid
        full_name:
          type: string
          maxLength: 120
        member_number:
          type:
            - string
            - "null"
          examples:
            - 29.01.01.7
        cohort:
          type:
            - integer
            - "null"
    AdminModerationQueueCounts:
      type: object
      description: |
        Ringkasan antrean untuk badge menu, tidak terpengaruh filter, setelah pengecualian konflik kepentingan
        (aturan domain butir a). Sumber acuan semua hitungan laporan untuk pengurus: DashboardModeration dan
        AdminNavBadges.reports_open wajib dihitung dengan aturan visibilitas yang sama sehingga angkanya selalu
        sama untuk pemanggil yang sama (aturan domain butir c).
      required:
        - open
        - in_review
        - overdue
        - urgent
      properties:
        open:
          type: integer
          minimum: 0
        in_review:
          type: integer
          minimum: 0
        overdue:
          type: integer
          minimum: 0
          description: Laporan aktif yang melewati due_at.
        urgent:
          type: integer
          minimum: 0
          description: Laporan aktif berprioritas urgent.
    AdminModerationReportDetail:
      allOf:
        - $ref: "#/components/schemas/AdminModerationReportItem"
        - type: object
          required:
            - description
            - reporter
            - target_member
            - room_id
            - evidence
            - target_history
            - open_reports_against_target
            - resolution
            - conflict_of_interest
            - version
          properties:
            description:
              type:
                - string
                - "null"
              maxLength: 2000
              description: Penjelasan pelapor atau alasan banding; null bila akun penulisnya sudah dihapus (D2).
              x-sensitive: true
            reporter:
              oneOf:
                - $ref: "#/components/schemas/AdminModerationParty"
                - type: "null"
              description: Pelapor; null bila akunnya sudah dihapus (D2). Tidak pernah dibuka kepada terlapor.
            target_member:
              oneOf:
                - $ref: "#/components/schemas/AdminModerationTargetMember"
                - type: "null"
            room_id:
              type:
                - string
                - "null"
              format: uuid
            evidence:
              $ref: "#/components/schemas/AdminModerationEvidence"
            target_history:
              type: array
              description: Riwayat warn/suspend/unsuspend pihak terlapor, terbaru dulu (maksimal 20).
              maxItems: 20
              items:
                $ref: "#/components/schemas/AdminModerationHistoryEntry"
            open_reports_against_target:
              type: integer
              minimum: 0
              description: Laporan aktif lain terhadap pihak terlapor yang sama.
            resolution:
              oneOf:
                - $ref: "#/components/schemas/AdminModerationResolution"
                - type: "null"
            conflict_of_interest:
              type: boolean
              description: |
                True bila akun alumni tertaut pemanggil adalah pelapor; klaim/keputusan ditolak 403. (Pemanggil yang
                tertaut ke pihak terlapor tidak pernah menerima laporan ini sama sekali, aturan domain butir a.)
            version:
              type: string
              description: Versi laporan untuk If-Match klaim/keputusan.
    AdminModerationReportItem:
      type: object
      description: Baris antrean moderasi (tanpa bukti, deskripsi, maupun identitas pelapor).
      required:
        - id
        - category
        - priority
        - status
        - target_type
        - subject
        - room_name
        - created_at
        - due_at
        - overdue
        - claimed_by
        - claimed_at
        - action
        - resolved_at
      properties:
        id:
          type: string
          format: uuid
        category:
          $ref: "#/components/schemas/ModerationReportCategory"
        priority:
          $ref: "#/components/schemas/ModerationReportPriority"
        status:
          $ref: "#/components/schemas/ModerationReportStatus"
        target_type:
          $ref: "#/components/schemas/ModerationTargetType"
        subject:
          oneOf:
            - $ref: "#/components/schemas/AdminModerationParty"
            - type: "null"
          description: Pihak terlapor atau pemohon banding; null untuk laporan grup tanpa subjek atau akun dihapus.
        room_name:
          type:
            - string
            - "null"
          description: Nama grup terkait (laporan grup atau pesan di grup).
        created_at:
          type: string
          format: date-time
        due_at:
          type: string
          format: date-time
          description: Target penanganan (24 jam / 2 hari kerja).
        overdue:
          type: boolean
          description: Aktif dan melewati due_at (waktu server).
        claimed_by:
          oneOf:
            - $ref: "#/components/schemas/ModerationAdminRef"
            - type: "null"
        claimed_at:
          type:
            - string
            - "null"
          format: date-time
        action:
          oneOf:
            - $ref: "#/components/schemas/ModerationAction"
            - type: "null"
        resolved_at:
          type:
            - string
            - "null"
          format: date-time
    AdminModerationReportPage:
      type: object
      required:
        - items
        - total
        - counts
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminModerationReportItem"
        total:
          type: integer
          minimum: 0
        next_cursor:
          type:
            - string
            - "null"
        counts:
          $ref: "#/components/schemas/AdminModerationQueueCounts"
    AdminModerationResolution:
      type: object
      required:
        - action
        - note
        - member_message
        - message_removed
        - resolved_at
        - resolved_by
      properties:
        action:
          $ref: "#/components/schemas/ModerationAction"
        note:
          type: string
          maxLength: 1000
          description: Alasan internal keputusan (AC F12-3).
        member_message:
          type:
            - string
            - "null"
          maxLength: 500
          description: Pesan aman untuk anggota.
        message_removed:
          type: boolean
        resolved_at:
          type: string
          format: date-time
        resolved_by:
          oneOf:
            - $ref: "#/components/schemas/ModerationAdminRef"
            - type: "null"
          description: Null bila akun admin sudah dihapus; aktor tetap tercatat di audit.
    AdminModerationResolveRequest:
      type: object
      required:
        - action
        - note
      properties:
        action:
          $ref: "#/components/schemas/ModerationAction"
        note:
          type: string
          minLength: 3
          maxLength: 1000
          description: Alasan keputusan untuk catatan internal dan audit; wajib, tidak boleh hanya spasi (AC F12-3).
        member_message:
          type: string
          minLength: 3
          maxLength: 500
          description: |
            Pesan aman untuk anggota yang dikenai keputusan (tanpa identitas pelapor). Wajib untuk warn dan suspend
            serta untuk keputusan banding; opsional untuk dismiss laporan biasa dan unsuspend.
        subject_user_id:
          type: string
          format: uuid
          description: Hanya laporan grup; anggota/mantan anggota grup (pernah bergabung) yang dikenai warn atau suspend.
        remove_message:
          type: boolean
          default: false
          description: Hanya laporan pesan; jadikan pesan terlapor placeholder.
        confirm:
          type: boolean
          description: Wajib true untuk suspend dan unsuspend (konfirmasi eksplisit, PRD 4.5).
    AdminModerationRoomMemberStatus:
      type: string
      enum:
        - joined
        - left
        - removed
      description: |
        Keanggotaan calon subjek di grup yang dilaporkan (room_members.status): joined = anggota saat ini;
        left/removed = mantan anggota yang pernah bergabung.
    AdminModerationSort:
      type: string
      enum:
        - due
        - newest
        - oldest
      description: due = due_at naik (paling mendesak dulu); newest/oldest = created_at.
    AdminModerationStatusFilter:
      type: string
      enum:
        - active
        - open
        - in_review
        - resolved
        - dismissed
        - all
      description: active = open + in_review (antrean kerja); all = semua status.
    AdminModerationSubjectCandidate:
      allOf:
        - $ref: "#/components/schemas/AdminModerationTargetMember"
        - type: object
          description: |
            Anggota atau mantan anggota grup yang dapat dipilih sebagai `subject_user_id` (laporan grup).
            `room_role` adalah peran di grup; untuk mantan anggota, peran terakhir sebelum keluar/dikeluarkan.
          required:
            - room_status
            - room_role
          properties:
            room_status:
              $ref: "#/components/schemas/AdminModerationRoomMemberStatus"
            room_role:
              $ref: "#/components/schemas/ChatMemberRole"
    AdminModerationSubjectCandidatePage:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminModerationSubjectCandidate"
        next_cursor:
          type:
            - string
            - "null"
    AdminModerationTargetMember:
      allOf:
        - $ref: "#/components/schemas/AdminModerationParty"
        - type: object
          description: Pihak terlapor/pemohon dengan status keanggotaan terkini untuk keputusan.
          required:
            - effective_status
            - expires_at
            - suspended_at
            - suspension_message
          properties:
            effective_status:
              $ref: "#/components/schemas/EffectiveStatus"
            expires_at:
              type:
                - string
                - "null"
              format: date-time
            suspended_at:
              type:
                - string
                - "null"
              format: date-time
            suspension_message:
              type:
                - string
                - "null"
              maxLength: 500
    AdminNavBadges:
      type: object
      description: |
        Field hanya ada bila izinnya dimiliki (AC F15-1). Lencana pembayaran sengaja tidak ada di sini; sumber
        tunggalnya GET /admin/payments/summary.
      properties:
        reports_open:
          type: integer
          minimum: 0
          description: moderation.read; laporan open atau in_review.
        failed_jobs:
          type: integer
          minimum: 0
          description: |
            notifications.manage; hanya kegagalan yang dapat ditindak = DashboardJobs.failed_delivery_count +
            DashboardJobs.dead_outbox_count (definisi dan jendela waktu identik). Outbox `failed` yang masih
            dicoba ulang otomatis dan penghapusan akun gagal tidak dihitung, sehingga lencana turun ke nol setelah
            seluruh kegagalan yang dapat ditindak dikirim ulang atau keluar dari jendela.
    AdminNotificationDelivery:
      type: object
      required:
        - id
        - notification_id
        - category
        - channel
        - status
        - platform
        - attempt
        - next_retry_at
        - provider_status
        - error_class
        - sent_at
        - created_at
        - updated_at
        - recipient
        - retryable
      properties:
        id:
          type: string
          format: uuid
        notification_id:
          type: string
          format: uuid
        category:
          $ref: "#/components/schemas/NotificationCategory"
        channel:
          $ref: "#/components/schemas/NotificationChannel"
        status:
          $ref: "#/components/schemas/NotificationDeliveryStatus"
        platform:
          description: Platform perangkat untuk push (tanpa token); null untuk email.
          oneOf:
            - $ref: "#/components/schemas/DevicePlatform"
            - type: "null"
        attempt:
          type: integer
          minimum: 0
        next_retry_at:
          type:
            - string
            - "null"
          format: date-time
        provider_status:
          type:
            - string
            - "null"
          examples:
            - accepted
        error_class:
          type:
            - string
            - "null"
          examples:
            - UNREGISTERED
        sent_at:
          type:
            - string
            - "null"
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        recipient:
          description: Null bila akun penerima sudah dihapus.
          oneOf:
            - $ref: "#/components/schemas/AdminDeliveryRecipient"
            - type: "null"
        retryable:
          type: boolean
          description: |
            True bila status failed dan target masih sah: penerima ada dan akunnya aktif (users.status bukan
            disabled atau deleted), preferensi kategori/kanal
            aktif, dan untuk push token belum dicabut serta masih milik penerima notifikasi
            (device_tokens.user_id = notifications.user_id, AC F13-5; keluarga sesi tidak diperiksa). Definisi
            yang sama dipakai filter `retryable`, predikat retry, dan hitungan dasbor/lencana job gagal.
    AdminNotificationDeliveryPage:
      type: object
      required:
        - items
        - next_cursor
        - total
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminNotificationDelivery"
        next_cursor:
          type:
            - string
            - "null"
        total:
          type: integer
          minimum: 0
    AdminOutboxEvent:
      type: object
      required:
        - id
        - topic
        - status
        - attempts
        - next_attempt_at
        - in_progress
        - last_error
        - request_id
        - dispatched_at
        - created_at
        - retryable
      properties:
        id:
          type: string
          format: uuid
        topic:
          type: string
          examples:
            - notification.created
        status:
          $ref: "#/components/schemas/AdminOutboxStatus"
        attempts:
          type: integer
          minimum: 0
        next_attempt_at:
          type: string
          format: date-time
        in_progress:
          type: boolean
          description: Sedang diklaim dispatcher (locked_until di masa depan).
        last_error:
          type:
            - string
            - "null"
          description: Pesan galat aman tanpa PII (N-14).
        request_id:
          type:
            - string
            - "null"
        dispatched_at:
          type:
            - string
            - "null"
          format: date-time
        created_at:
          type: string
          format: date-time
        retryable:
          type: boolean
          description: |
            True bila status failed atau dead DAN tidak in_progress; sama dengan predikat UPDATE bersyarat
            adminRetryOutboxEvents.
    AdminOutboxEventPage:
      type: object
      required:
        - items
        - next_cursor
        - total
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminOutboxEvent"
        next_cursor:
          type:
            - string
            - "null"
        total:
          type: integer
          minimum: 0
    AdminOutboxRetryRequest:
      type: object
      required:
        - event_ids
      properties:
        event_ids:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items:
            type: string
            format: uuid
    AdminOutboxRetryResult:
      type: object
      required:
        - requeued
        - skipped
      properties:
        requeued:
          type: array
          items:
            $ref: "#/components/schemas/AdminOutboxEvent"
        skipped:
          type: array
          items:
            $ref: "#/components/schemas/AdminOutboxRetrySkip"
    AdminOutboxRetrySkip:
      type: object
      required:
        - event_id
        - reason
      properties:
        event_id:
          type: string
          format: uuid
        reason:
          $ref: "#/components/schemas/AdminOutboxRetrySkipReason"
    AdminOutboxRetrySkipReason:
      type: string
      enum:
        - not_found
        - in_progress
        - not_retryable
      description: |
        `in_progress`: event failed/dead sedang diklaim dispatcher (locked_until di masa depan), lease tidak
        diputus. `not_retryable`: status bukan failed/dead (sudah pending atau dispatched).
    AdminOutboxSort:
      type: string
      enum:
        - created_at_desc
        - created_at_asc
        - next_attempt_at_asc
      default: created_at_desc
    AdminOutboxStatus:
      type: string
      enum:
        - pending
        - dispatched
        - failed
        - dead
      description: |
        Status outbox (outbox_events_status_chk): `pending` menunggu dispatch, `dispatched` diteruskan ke antrean,
        `failed` gagal dan akan dicoba ulang dengan backoff, `dead` melewati batas percobaan dan butuh tindakan.
    AdminPaymentActions:
      type: object
      description: Tindakan yang diizinkan server untuk pemanggil pada payment ini (izin, status, konflik kepentingan).
      required:
        - can_decide
        - can_cancel
        - can_adjust
      properties:
        can_decide:
          type: boolean
          description: Pending berbukti, memiliki payments.decide, dan tidak berkonflik kepentingan.
        can_cancel:
          type: boolean
          description: |
            Pending tanpa bukti (proof_version 0), memiliki payments.decide, dan tidak berkonflik kepentingan
            (PRD 4.3). Payment rejected tidak pernah dapat dibatalkan pengurus.
        can_adjust:
          type: boolean
          description: Paid, memiliki payments.decide, dan tidak berkonflik kepentingan.
    AdminPaymentActorRef:
      type: object
      description: Pengurus pelaku tindakan (untuk akuntabilitas internal, F-17).
      required:
        - admin_id
        - display_name
      properties:
        admin_id:
          type: string
          format: uuid
        display_name:
          type: string
    AdminPaymentAdjustment:
      type: object
      description: Penyesuaian refund atau koreksi atas payment paid (PRD 6.3, D6).
      required:
        - id
        - payment_id
        - payment
        - kind
        - amount
        - reason
        - status
        - has_refund_destination
        - refund_destination
        - evidence_file_id
        - due_at
        - overdue
        - created_by
        - completed_by
        - completed_at
        - cancelled_by
        - cancelled_at
        - cancel_reason
        - created_at
        - updated_at
        - version
      properties:
        id:
          type: string
          format: uuid
        payment_id:
          type: string
          format: uuid
        payment:
          $ref: "#/components/schemas/AdminAdjustmentPaymentRef"
        kind:
          $ref: "#/components/schemas/PaymentAdjustmentKind"
        amount:
          $ref: "#/components/schemas/Money"
        reason:
          type: string
          description: Alasan internal pengurus.
        status:
          $ref: "#/components/schemas/PaymentAdjustmentStatus"
        has_refund_destination:
          type: boolean
          description: |
            Rekening tujuan refund sudah dicatat, oleh pemilik lewat aplikasi (setMyRefundDestination) atau oleh
            pengurus (selalu false setelah completed/cancelled).
        refund_destination:
          description: |
            Hanya untuk pemegang payments.decide yang tidak berkonflik kepentingan, kind refund, status pending;
            selain itu null (D2).
          oneOf:
            - $ref: "#/components/schemas/AdminRefundDestination"
            - type: "null"
        evidence_file_id:
          type:
            - string
            - "null"
          format: uuid
          description: Bukti penyelesaian (purpose adjustment_evidence), dibuka lewat GET /files/{fileId}/access.
        due_at:
          type:
            - string
            - "null"
          format: date-time
          description: Tenggat refund 7 hari kerja (D6); null untuk koreksi.
        overdue:
          type: boolean
          description: Pending dan sudah melewati `due_at`.
        created_by:
          description: Pengurus pencatat; null bila dibuat sistem (pembatalan event atau tiket, D6).
          oneOf:
            - $ref: "#/components/schemas/AdminPaymentActorRef"
            - type: "null"
        completed_by:
          oneOf:
            - $ref: "#/components/schemas/AdminPaymentActorRef"
            - type: "null"
        completed_at:
          type:
            - string
            - "null"
          format: date-time
        cancelled_by:
          description: |
            Pengurus yang membatalkan penyesuaian (kolom payment_adjustments.cancelled_by_admin_id); null bila
            belum dibatalkan atau akun admin sudah tidak ada.
          oneOf:
            - $ref: "#/components/schemas/AdminPaymentActorRef"
            - type: "null"
        cancelled_at:
          type:
            - string
            - "null"
          format: date-time
        cancel_reason:
          type:
            - string
            - "null"
          description: |
            Alasan pembatalan (kolom payment_adjustments.cancel_reason, wajib tidak kosong saat cancelled); null
            selain itu.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        version:
          type: string
    AdminPaymentAdjustmentPage:
      type: object
      required:
        - items
        - total
        - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminPaymentAdjustment"
        total:
          type: integer
          minimum: 0
        next_cursor:
          type:
            - string
            - "null"
    AdminPaymentAdjustmentSort:
      type: string
      enum:
        - due_at_asc
        - created_at_desc
      description: due_at_asc = tenggat terdekat dahulu (bawaan); created_at_desc = terbaru dahulu.
    AdminPaymentDetail:
      description: Detail payment untuk keputusan pengurus (F-04).
      allOf:
        - $ref: "#/components/schemas/AdminPaymentItem"
        - type: object
          required:
            - lines
            - method
            - method_id
            - method_active
            - proof
            - transfer_note
            - rejection_reason
            - rejection_count
            - decided_by
            - cancelled_at
            - cancel_reason
            - ticket
            - period
            - settings_version
            - events
            - adjustments
            - conflict_of_interest
            - refund_on_approve
            - actions
          properties:
            lines:
              type: array
              items:
                $ref: "#/components/schemas/PaymentLine"
            method:
              $ref: "#/components/schemas/PaymentMethod"
            method_id:
              type:
                - string
                - "null"
              format: uuid
              description: Metode asal yang masih tertaut (snapshot tetap di `method`).
            method_active:
              type: boolean
              description: Metode asal masih aktif.
            proof:
              description: |
                Bukti aktif; null bila belum ada bukti, atau bila berkas bukti sudah dihapus bersama akun pemilik
                (D2, AC F14-4; `proof_version` tetap >= 1 dan `member` null). Untuk payment seperti itu pengurus
                memutus berdasarkan pencocokan mutasi (`funds_verified`), lihat adminDecidePayment.
              oneOf:
                - $ref: "#/components/schemas/AdminPaymentProof"
                - type: "null"
            transfer_note:
              type:
                - string
                - "null"
              description: |
                Catatan transfer bukti aktif (dari anggota, atau dari pengurus untuk iuran yang dicatat lewat
                POST /admin/payments); null setelah akun pemilik dihapus (D2).
            rejection_reason:
              type:
                - string
                - "null"
              description: Alasan penolakan terakhir.
            rejection_count:
              type: integer
              minimum: 0
              description: Jumlah penolakan sebelumnya (prototipe screen_8 "Riwayat - Belum pernah ditolak").
            decided_by:
              description: Pengurus yang memutus terakhir.
              oneOf:
                - $ref: "#/components/schemas/AdminPaymentActorRef"
                - type: "null"
            cancelled_at:
              type:
                - string
                - "null"
              format: date-time
            cancel_reason:
              type:
                - string
                - "null"
            ticket:
              oneOf:
                - $ref: "#/components/schemas/PaymentTicketRef"
                - type: "null"
            period:
              oneOf:
                - $ref: "#/components/schemas/PaymentMembershipPeriod"
                - type: "null"
            settings_version:
              type:
                - string
                - "null"
              description: Versi pengaturan `fees` yang disnapshot (null untuk tiket, AC F03-5).
            events:
              type: array
              description: Histori lengkap urut waktu naik.
              items:
                $ref: "#/components/schemas/AdminPaymentEvent"
            adjustments:
              type: array
              items:
                $ref: "#/components/schemas/AdminPaymentAdjustment"
            conflict_of_interest:
              type: boolean
              description: True bila payment milik alumni yang tertaut ke admin pemanggil (PRD 2.3).
            refund_on_approve:
              type: boolean
              description: |
                True bila menyetujui payment ini akan membuat refund sistem penuh dalam transaksi yang sama: payment
                tiket pending berbukti yang tiketnya sudah cancelled karena event dibatalkan pengurus atau peserta
                membatalkan sendiri sampai H-3 (D6). Dihitung server dengan aturan yang sama dengan handler tiket
                saat approve, agar layar keputusan menampilkan akibatnya sebelum pengurus menyetujui. False untuk
                iuran dan untuk tiket yang dibatalkan dengan sebab lain (pengurus, suspend, akun dihapus; refund
                diputuskan per kasus). `ticket.event_status` dan `ticket.ticket_cancelled_by` menjelaskan sebabnya.
            actions:
              $ref: "#/components/schemas/AdminPaymentActions"
    AdminPaymentEvent:
      description: Entri histori untuk pengurus, termasuk berkas bukti versi lama dan admin pelaku (U-02, F-17).
      allOf:
        - $ref: "#/components/schemas/PaymentEvent"
        - type: object
          required:
            - proof_file_id
            - actor_admin
          properties:
            proof_file_id:
              type:
                - string
                - "null"
              format: uuid
              description: |
                Berkas bukti untuk proof_submitted/proof_replaced (versi lama tetap dapat dibuka). Null bila berkas
                sudah dihapus bersama akun pemilik (D2, AC F14-4); kolom histori append-only tidak diubah, API
                mengembalikan null untuk berkas berstatus deleted.
            actor_admin:
              description: Pengurus pelaku untuk entri oleh admin; null untuk anggota atau sistem.
              oneOf:
                - $ref: "#/components/schemas/AdminPaymentActorRef"
                - type: "null"
    AdminPaymentInstructionsInput:
      type: object
      description: Penggantian penuh daftar platform yang menyembunyikan instruksi bayar iuran.
      required:
        - dues_hidden_platforms
      properties:
        dues_hidden_platforms:
          type: array
          maxItems: 2
          uniqueItems: true
          items:
            $ref: "#/components/schemas/DevicePlatform"
        reason:
          type: string
          maxLength: 500
          description: Catatan perubahan untuk audit (misalnya hasil review App Store).
    AdminPaymentInstructionsSetting:
      description: |
        Platform yang menyembunyikan instruksi bayar iuran (app_settings `payment_instructions`, rencana cadangan
        D13).
      allOf:
        - $ref: "#/components/schemas/AdminSettingMeta"
        - type: object
          required:
            - dues_hidden_platforms
          properties:
            dues_hidden_platforms:
              type: array
              description: Platform tanpa instruksi bayar iuran di aplikasi; kosong berarti semua menampilkannya.
              items:
                $ref: "#/components/schemas/DevicePlatform"
    AdminPaymentItem:
      type: object
      description: Baris antrean pembayaran (prototipe screen_8, guidelines p17).
      required:
        - id
        - type
        - status
        - stage
        - amount
        - member
        - event_title
        - event_starts_at
        - ticket_status
        - event_cancelled
        - submitted_at
        - decided_at
        - review_due_at
        - proof_version
        - overdue
        - created_at
        - version
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: "#/components/schemas/PaymentType"
        status:
          $ref: "#/components/schemas/PaymentStatus"
        stage:
          $ref: "#/components/schemas/PaymentStage"
        amount:
          $ref: "#/components/schemas/Money"
        member:
          description: Null bila akun pemilik sudah dihapus dan payment dianonimkan (D2, AC F14-4).
          oneOf:
            - $ref: "#/components/schemas/AdminPaymentMember"
            - type: "null"
        event_title:
          type:
            - string
            - "null"
          description: Judul event untuk payment tiket ("Tiket - judul"); null untuk iuran.
        event_starts_at:
          type:
            - string
            - "null"
          format: date-time
          description: |
            Waktu mulai event untuk payment tiket, agar antrean menampilkan urgensi sebelum hari H (PRD 4.4); null
            untuk iuran.
        ticket_status:
          description: |
            Status tiket terkait untuk payment tiket; null untuk iuran. `cancelled` atau `expired` pada payment
            pending berbukti berarti keputusan tidak menghidupkan tiket (lihat adminDecidePayment).
          oneOf:
            - $ref: "#/components/schemas/PaymentTicketStatus"
            - type: "null"
        event_cancelled:
          type:
            - boolean
            - "null"
          description: |
            True bila event payment tiket dibatalkan pengurus (seluruh QR tidak berlaku, refund penuh D6); null
            untuk iuran.
        submitted_at:
          type:
            - string
            - "null"
          format: date-time
          description: Waktu bukti aktif dikirim; dasar urutan dan usia antrean (PRD 3.4).
        decided_at:
          type:
            - string
            - "null"
          format: date-time
        review_due_at:
          type:
            - string
            - "null"
          format: date-time
          description: |
            Batas review untuk payment pending berbukti; null selain itu. Iuran: `submitted_at` + 1 hari kerja.
            Tiket: yang lebih dahulu antara `submitted_at` + 2 hari kerja (D5) dan pembukaan jendela check-in
            event (PRD 4.4). Rumus lengkap di adminListPayments.
        proof_version:
          type: integer
          minimum: 0
        overdue:
          type: boolean
          description: Pending berbukti yang sudah melewati `review_due_at`.
        created_at:
          type: string
          format: date-time
        version:
          type: string
    AdminPaymentMember:
      type: object
      description: |
        Identitas minimum pemilik payment untuk pengurus berizin. Tanpa email, telepon atau alamat (N-09).
      required:
        - user_id
        - full_name
        - member_number
        - cohort
        - effective_status
      properties:
        user_id:
          type: string
          format: uuid
        full_name:
          type: string
        member_number:
          type:
            - string
            - "null"
          description: Nomor anggota AA.SS.JK.N (PRD 3.5); null hanya bila belum dialokasikan.
        cohort:
          type: integer
          minimum: 1
          description: Angkatan (AA), misalnya 29.
        effective_status:
          $ref: "#/components/schemas/EffectiveStatus"
    AdminPaymentMethod:
      description: Metode bayar dengan atribut pengelolaan (F-15).
      allOf:
        - $ref: "#/components/schemas/PaymentMethod"
        - type: object
          required:
            - active
            - sort_order
            - in_use
            - qr_image_file_id
            - version
            - created_at
            - updated_at
          properties:
            active:
              type: boolean
              description: Ditampilkan ke anggota dan dapat dipilih untuk payment baru.
            sort_order:
              type: integer
              minimum: 0
              maximum: 32767
            in_use:
              type: boolean
              description: |
                Pernah dirujuk payment, termasuk metode yang kemudian ditinggalkan karena pemilik mengganti rekening
                tujuan sebelum bukti (PRD 4.3); nilai true tidak pernah kembali false. Metode seperti ini hanya dapat
                dinonaktifkan (tidak dihapus), dan identitas rekeningnya (kind, provider, account_number,
                account_holder, gambar QRIS) tidak dapat diubah.
            qr_image_file_id:
              type:
                - string
                - "null"
              format: uuid
              description: |
                Berkas `payment_qr` gambar QRIS (ADR-026); terisi hanya untuk `kind` qris. Pratinjaunya di
                `qr_image_url`.
            version:
              type: string
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    AdminPaymentMethodPage:
      type: object
      required:
        - items
        - total
        - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminPaymentMethod"
        total:
          type: integer
          minimum: 0
          description: Jumlah seluruh metode sesuai filter.
        next_cursor:
          type:
            - string
            - "null"
    AdminPaymentPage:
      type: object
      required:
        - items
        - total
        - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminPaymentItem"
        total:
          type: integer
          minimum: 0
          description: Jumlah seluruh hasil filter.
        next_cursor:
          type:
            - string
            - "null"
    AdminPaymentProof:
      type: object
      description: |
        Metadata bukti aktif. Isi berkas hanya dibuka lewat GET /files/{fileId}/access setelah pemeriksaan izin
        (PRD 5.4); nama berkas asli tidak disimpan (object_key tanpa data pribadi).
      required:
        - file_id
        - version
        - mime
        - bytes
        - submitted_at
      properties:
        file_id:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
          description: Sama dengan `proof_version` payment.
        mime:
          type: string
          examples:
            - image/jpeg
            - application/pdf
        bytes:
          type: integer
          minimum: 0
        submitted_at:
          type: string
          format: date-time
    AdminPaymentQrImage:
      type: object
      description: Gambar QRIS publik yang sudah diproses server (purpose payment_qr, ADR-026).
      required:
        - file_id
        - url
        - mime
        - bytes
        - width
        - height
      properties:
        file_id:
          type: string
          format: uuid
          description: Nilai untuk `qr_image_file_id` pada adminCreatePaymentMethod/adminUpdatePaymentMethod.
        url:
          type: string
          format: uri
          description: URL publik gambar hasil proses untuk pratinjau.
        mime:
          type: string
          enum:
            - image/png
            - image/jpeg
        bytes:
          type: integer
          minimum: 0
        width:
          type: integer
          minimum: 512
        height:
          type: integer
          minimum: 512
    AdminPaymentQrImageUploadRequest:
      type: object
      required:
        - file
      properties:
        file:
          type: string
          format: binary
          description: Gambar QRIS statis PNG/JPG maksimal 5 MB, sisi terpendek minimal 512 piksel (N-10, ADR-026).
    AdminPaymentSort:
      type: string
      enum:
        - submitted_at_asc
        - submitted_at_desc
        - review_due_at_asc
        - decided_at_desc
        - created_at_desc
      description: |
        submitted_at_asc = paling lama menunggu dahulu (bawaan antrean, usia antrean terbesar di atas);
        submitted_at_desc = bukti terbaru dahulu; review_due_at_asc = batas review terdekat dahulu (tiket event yang
        mendekati hari H naik ke atas, PRD 4.4); decided_at_desc = keputusan terbaru dahulu (tab Disetujui/Ditolak);
        created_at_desc = instruksi terbaru dahulu. Nilai kosong pada kolom urut diletakkan di akhir.
    AdminPaymentSummary:
      type: object
      description: Hitungan antrean saat `generated_at` (badge menu dan dasbor F-15).
      required:
        - awaiting_review_count
        - overdue_count
        - awaiting_transfer_count
        - awaiting_review_by_type
        - adjustments_pending_count
        - adjustments_overdue_count
        - generated_at
      properties:
        awaiting_review_count:
          type: integer
          minimum: 0
          description: Pending berbukti (siap diputus).
        overdue_count:
          type: integer
          minimum: 0
          description: Bagian awaiting_review yang lewat batas review.
        awaiting_transfer_count:
          type: integer
          minimum: 0
          description: Pending tanpa bukti.
        awaiting_review_by_type:
          $ref: "#/components/schemas/AdminPaymentTypeCounts"
        adjustments_pending_count:
          type: integer
          minimum: 0
        adjustments_overdue_count:
          type: integer
          minimum: 0
          description: Penyesuaian pending lewat `due_at`.
        generated_at:
          type: string
          format: date-time
    AdminPaymentTypeCounts:
      type: object
      required:
        - registration
        - renewal
        - ticket
      properties:
        registration:
          type: integer
          minimum: 0
        renewal:
          type: integer
          minimum: 0
        ticket:
          type: integer
          minimum: 0
    AdminPermissionCatalog:
      type: object
      required:
        - permissions
        - roles
      properties:
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/AdminPermissionInfo"
        roles:
          type: array
          items:
            $ref: "#/components/schemas/AdminRoleInfo"
    AdminPermissionGroup:
      type: string
      enum:
        - payments
        - members
        - content
        - events
        - moderation
        - audit
        - settings
        - admins
        - notifications
      description: Kelompok tampilan izin di formulir admin.
    AdminPermissionInfo:
      type: object
      required:
        - permission
        - label
        - description
        - group
        - requires
        - assignable
      properties:
        permission:
          $ref: "#/components/schemas/Permission"
        label:
          type: string
          examples:
            - Putuskan pembayaran
        description:
          type: string
        group:
          $ref: "#/components/schemas/AdminPermissionGroup"
        requires:
          type: array
          description: Izin prasyarat yang wajib ikut ditugaskan.
          items:
            $ref: "#/components/schemas/Permission"
        assignable:
          type: boolean
          description: False untuk admins.manage (hanya melekat pada Super Admin, PRD 2.3).
    AdminPost:
      allOf:
        - $ref: "#/components/schemas/AdminPostSummary"
        - type: object
          required:
            - excerpt
            - body_html
            - announced_at
            - slug_locked
            - author
          properties:
            excerpt:
              type:
                - string
                - "null"
            body_html:
              type: string
              description: HTML yang sudah disanitasi server (PRD 3.8).
            announced_at:
              type:
                - string
                - "null"
              format: date-time
              description: Waktu notifikasi berita dibuat job content.announce; terisi sekali (AC F15-5).
            slug_locked:
              type: boolean
              description: |
                True bila berita pernah tampil ke anggota, diturunkan sebagai `published_at IS NOT NULL AND
                published_at <= now` (invarian waktu terbit pada publish/unschedule/archive); slug tidak dapat
                diubah lagi agar tautan `/news/{slug}` di notifikasi dan banner tetap berlaku.
            author:
              oneOf:
                - $ref: "#/components/schemas/AdminContentActor"
                - type: "null"
    AdminPostCreateRequest:
      type: object
      required:
        - title
        - body_html
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: Judul; spasi di tepi dipangkas.
        slug:
          type: string
          minLength: 1
          maxLength: 160
          pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
          description: Opsional; kosong = dibangkitkan dari judul dan dibuat unik.
        excerpt:
          type:
            - string
            - "null"
          maxLength: 300
        body_html:
          type: string
          minLength: 1
          maxLength: 200000
          description: |
            HTML dari editor; disanitasi server sebelum disimpan (PRD 3.8). Kosong setelah sanitasi ditolak. Hasil
            sanitasi juga maksimal 200.000 karakter (atribut tautan luar dan escape `&`/`<` menambah panjang);
            lebih dari itu -> 400 `field_errors.body_html`.
        cover_file_id:
          type:
            - string
            - "null"
          format: uuid
          description: Berkas purpose `post_cover` dari POST /admin/content/media.
        category_id:
          type:
            - string
            - "null"
          format: uuid
          description: Kategori `post` yang aktif.
    AdminPostPage:
      type: object
      required:
        - items
        - next_cursor
        - total
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AdminPostSummary"
        next_cursor:
          type:
            - string
            - "null"
        total:
          type: integer
          minimum: 0
    AdminPostPublishRequest:
      type: object
      properties:
        published_at:
          type:
            - string
            - "null"
          format: date-time
          description: |
            Kosong/null = terbit sekarang (waktu server); masa depan = terjadwal; lampau ditolak (400). Berita yang
            pernah tampil (draft hasil restore dengan `slug_locked = true`) hanya menerima null dan kembali tampil
            dengan Tgl Publikasi aslinya; masa depan -> 409 VALIDATION_ERROR.
    AdminPostSort:
      type: string
      enum:
        - updated_at_desc
        - published_at_desc
        - created_at_desc
        - title_asc
      description: Urutan tabel berita; bawaan `updated_at_desc`.
    AdminPostState:
      type: string
      enum:
        - draft
        - scheduled
        - published
        - archived
      description: |
        Keadaan berita untuk pengurus (F-08), diturunkan server dari kolom status dan published_at (tidak
        disimpan): `draft` = status draft; `scheduled` = status published dengan `published_at > now` (belum
        tampil, AC F08-1); `published` = status published dengan `published_at <= now` (tampil di feed);
        `archived` = status archived, tidak tampil dan tidak pernah dihidupkan kembali oleh job (AC F15-5).
        Transisi: draft -> scheduled|published (publish; draft yang pernah tampil hanya -> published),
        scheduled -> scheduled|published (publish ulang), scheduled -> draft (unschedule, published_at
        dikosongkan), scheduled -> published (waktu tiba), draft|scheduled|published -> archived (archive;
        published_at berita terjadwal dikosongkan), archived -> draft (restore). Hapus hanya draft atau archived.
    AdminPostSummary:
      type: object
      required:
        - id
        - slug
        - title
        - state
        - category
        - cover
        - published_at
        - like_count
        - version
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        title:
          type: string
        state:
          $ref: "#/components/schemas/AdminPostState"
        category:
          oneOf:
            - $ref: "#/components/schemas/ContentCategoryRef"
            - type: "null"
        cover:
          oneOf:
            - $ref: "#/components/schemas/ContentImage"
            - type: "null"
        published_at:
          type:
            - string
            - "null"
          format: date-time
          description: |
            Waktu terbit (kolom "Tgl Publikasi"). `scheduled`: waktu terjadwal di masa depan. `published`: waktu
            tayang pertama. `draft`/`archived`: waktu tayang pertama bila berita pernah tampil (selalu <= now),
            null bila belum pernah tampil; jadwal yang dibatalkan atau diarsipkan sebelum tiba tidak disimpan.
        like_count:
          type: integer
          minimum: 0
        version:
          type: string
          description: Versi untuk If-Match (AC F15-4).
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AdminPostUpdateRequest:
      type: object
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        slug:
          type: string
          minLength: 1
          maxLength: 160
          pattern: ^[a-z0-9]+(-[a-z0-9]+)*$
          description: Hanya bila `slug_locked = false`.
        excerpt:
          type:
            - string
            - "null"
          maxLength: 300
        body_html:
          type: string
          minLength: 1
          maxLength: 200000
          description: Aturan sama dengan AdminPostCreateRequest.body_html (hasil sanitasi maksimal 200.000 karakter).
        cover_file_id:
          type:
            - string
            - "null"
          format: uuid
        category_id:
          type:
            - string
            - "null"
          format: uuid
          description: Kategori `post`; kategori nonaktif hanya boleh dipertahankan, tidak dipilih baru.
    AdminProfile:
      type: object
      description: |
        Identitas admin untuk shell web admin (nama dan peran di sidebar, menu berizin). Tidak memuat data akun
        alumni tertaut selain penanda keberadaannya.

        `email`, `has_linked_alumni` dan `backup_codes_remaining` wajib (F-16, PRD 2.3) sejak modul admin-auth fase C
        mengisinya pada setiap respons 200 (perubahan opsional -> wajib pada respons tidak memutus klien di kabel,
        N-13). Penolakan memutus pembayaran akun tertaut tetap ditegakkan server (ARCHITECTURE §3.3).
      required:
        - admin_id
        - display_name
        - email
        - role
        - permissions
        - permissions_version
        - has_linked_alumni
        - backup_codes_remaining
      properties:
        admin_id:
          type: string
          format: uuid
        display_name:
          type: string
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 254
          description: Email login admin.
        role:
          $ref: "#/components/schemas/AdminRole"
        permissions:
          type: array
          description: Izin efektif; super_admin selalu seluruh izin (ARCHITECTURE §4.5).
          items:
            $ref: "#/components/schemas/Permission"
        permissions_version:
          type: integer
          minimum: 1
        has_linked_alumni:
          type: boolean
          description: |
            True bila identitas admin ditautkan ke akun alumni (`admins.linked_alumni_user_id` terisi) untuk
            pemeriksaan konflik kepentingan; pembayaran milik akun itu tidak dapat diputus admin ini (PRD 2.3,
            ARCHITECTURE §3.3).
        backup_codes_remaining:
          type: integer
          minimum: 0
          maximum: 10
          description: |
            Sisa backup code yang belum dipakai (panjang `mfa_totp.backup_code_hashes`); UI menyarankan buat ulang
            bila sedikit.
        previous_login_at:
          type:
            - string
            - "null"
          format: date-time
          description: |
            Waktu login admin berhasil SEBELUM sesi saat ini, untuk deteksi akses yang tidak dikenal (F-02, N-08).
            Bukan `users.last_login_at`, yang sudah ditimpa oleh login sesi ini. Server mengambil audit
            `admin.login` terbaru milik admin ini (ditulis POST /admin/auth/mfa dan /admin/auth/totp/confirm; indeks
            `audit_logs_actor_admin_id_created_at_idx`) yang lebih awal dari awal keluarga sesi pemanggil
            (`created_at` terkecil baris dengan family_id yang sama). Null bila sesi ini login pertama atau audit tersebut
            sudah tidak ada. Daftar perangkat yang masih masuk ada di GET /auth/sessions.
    AdminRecordPaymentRequest:
      type: object
      description: |
        Pencatatan iuran yang dananya sudah diverifikasi pengurus di luar aplikasi (rencana cadangan D13). Nominal
        tidak dikirim; server menghitungnya dari pengaturan `fees` versi aktif (PRD 3.3).
      required:
        - user_id
        - type
        - payment_method_id
        - proof_file_id
        - funds_verified
        - reason
      properties:
        user_id:
          type: string
          format: uuid
          description: Akun alumni pemilik iuran.
        type:
          $ref: "#/components/schemas/MembershipPaymentType"
        payment_method_id:
          type: string
          format: uuid
          description: Rekening organisasi tempat dana diterima (aktif atau nonaktif); disnapshot pada payment.
        proof_file_id:
          type: string
          format: uuid
          description: |
            Berkas purpose payment_proof yang diunggah pengurus pemanggil sebagai bukti verifikasi (misalnya
            tangkapan mutasi); menjadi bukti versi berikutnya (versi 1 untuk payment baru). Hanya memuat transaksi
            anggota ini (transaksi pihak lain ditutup/dipotong, N-09). Tidak pernah dibuka kepada anggota dan ikut
            dihapus saat akun pemilik dihapus (D2).
        transfer_note:
          type: string
          maxLength: 200
          description: Catatan transfer opsional (misalnya bank pengirim dan tanggal mutasi).
        funds_verified:
          type: boolean
          description: Wajib true; dana sudah dicocokkan dengan mutasi rekening tujuan (PRD 3.4).
        reason:
          type: string
          minLength: 3
          maxLength: 500
          pattern: \S
          description: |
            Catatan verifikasi dan alasan pencatatan oleh pengurus. Disimpan pada entri histori created (hanya
            terlihat oleh pengurus) dan di audit; tidak dikirim kepada anggota.
    AdminRecoveryRequest:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 500
          description: |
            Alasan pemulihan untuk audit (misalnya "perangkat TOTP hilang, diverifikasi lewat telepon"); tidak
            boleh hanya spasi dan tidak boleh memuat sandi atau kode.
        email:
          type: string
          format: email
          maxLength: 254
          description: |
            Opsional: email login baru bila admin kehilangan akses ke alamat lama. Dinormalisasi server; undangan
            pemulihan dikirim ke alamat ini dan pemberitahuan keamanan juga ke alamat lama (F-16, PRD 10).
    AdminRecoveryResult:
      type: object
      required:
        - admin
        - invitation_expires_at
        - invitation_sent_at
        - revoked_session_count
      properties:
        admin:
          $ref: "#/components/schemas/AdminAccountDetail"
          description: Admin sesudah pemulihan (status invited, mfa_enrolled false, active_session_count 0).
        invitation_expires_at:
          type: string
          format: date-time
          description: Batas token undangan pemulihan (konfigurasi server yang sama dengan undangan).
        invitation_sent_at:
          type: string
          format: date-time
          description: Waktu email pemulihan dijadwalkan di outbox (bukan bukti terkirim).
        revoked_session_count:
          type: integer
          minimum: 0
          description: Jumlah sesi admin yang dicabut oleh pemulihan ini.
    AdminRefundDestination:
      type: object
      description: |
        Rekening tujuan refund yang diminta saat proses refund saja (PRD 3.9) dan dihapus saat penyesuaian selesai
        atau dibatalkan (D2). Biasanya dikirim pemilik lewat aplikasi (setMyRefundDestination, bentuk sama dengan
        RefundDestinationInput); pengurus mengisinya hanya bila diterima lewat kanal dukungan resmi. Tidak pernah
        dicatat di log, audit maupun ekspor (ARCHITECTURE §2 butir 3).
      required:
