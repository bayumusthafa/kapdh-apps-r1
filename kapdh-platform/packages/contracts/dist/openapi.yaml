        berikutnya; kotak masuk in-app tetap ditulis dan riwayat keputusan tetap terlihat (F-13, AC F13-2).
        Pengiriman yang sudah dijadwalkan untuk kategori yang dimatikan dibatalkan worker sebelum dikirim
