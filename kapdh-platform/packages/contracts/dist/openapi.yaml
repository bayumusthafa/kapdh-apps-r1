    AuditEntrySort:
      type: string
      enum:
        - created_at_desc
        - created_at_asc
      default: created_at_desc
    AuditExport:
      type: object
      description: |
        Job ekspor audit (AC F17-4). Disimpan pada tabel yang sudah ada tanpa tabel job baru; id ekspor dipakai
        sebagai entity_id audit dengan entity_type `audit_export`:

        | Fakta                       | Ditulis oleh, kapan                         | Isi                                            |
        | --------------------------- | ------------------------------------------- | ---------------------------------------------- |
        | audit `audit.export.requested` | API, transaksi permintaan (+ outbox)     | actor admin peminta, created_at, after.filters |
        | audit `audit.export.completed` | worker, SATU transaksi dengan INSERT files | effective_role system, after {file_id, row_count} |
        | audit `audit.export.failed`    | worker                                    | effective_role system, after {failure_reason}  |
        | files purpose `audit_export`   | worker, bersama entri completed            | owner_user_id = akun login peminta, private, status ready, attached_at, expires_at, bytes |

        Penurunan field: `requested_by`/`requested_at`/`filters` dari entri requested; `completed_at` = created_at
        entri completed/failed; `row_count` dari entri completed; `bytes` dan `expires_at` dari baris files;
        `file_name` = `audit-<YYYYMMDD requested_at UTC>-<8 hex awal id>.csv`. Status (urutan prioritas):
        1. entri completed ada: `expired` bila berkasnya berstatus deleted, hilang, atau expires_at <= sekarang;
           selain itu `ready`;
        2. entri failed ada: `failed` dengan failure_reason dari entri;
        3. belum ada entri terminal dan sekarang > requested_at + batas waktu ekspor: `failed` (`timed_out`);
        4. selain itu `processing`.

        Aturan worker agar status monoton dan sekali jadi: job mengambil pg_advisory_xact_lock atas id ekspor,
        memeriksa ulang bahwa belum ada entri terminal dan batas waktu belum lewat (jam database), lalu menulis
        tepat satu entri terminal; job yang dimulai atau selesai setelah batas waktu berhenti tanpa menulis berkas.
        Galat sementara memakai retry outbox/antrean; `processing_failed` ditulis saat retry habis. Pembersihan
        `maintenance.cleanup` menghapus berkas kedaluwarsa (files.status deleted) sehingga status menjadi
        `expired`. Integrator boleh memindahkan keadaan ini ke tabel job khusus kelak tanpa mengubah kontrak.
        Isi berkas `ready` selalu sudah melewati netralisasi formula dan penyamaran kolom privat/secret yang
        dijelaskan pada adminCreateAuditExport (AC F17-3).
      required:
        - id
        - status
        - filters
        - requested_by
        - requested_at
        - completed_at
        - expires_at
        - row_count
        - file_name
        - bytes
        - failure_reason
      properties:
        id:
          type: string
          format: uuid
          description: Id ekspor (entity_id entri audit audit_export).
        status:
          $ref: "#/components/schemas/AuditExportStatus"
        filters:
          $ref: "#/components/schemas/AuditFilter"
        requested_by:
          $ref: "#/components/schemas/AdminActorRef"
          description: Admin peminta (actor_admin_id entri audit.export.requested).
        requested_at:
          type: string
          format: date-time
        completed_at:
          type:
            - string
            - "null"
          format: date-time
          description: Waktu entri terminal (completed atau failed); null selama processing dan untuk timed_out.
        expires_at:
          type:
            - string
            - "null"
          format: date-time
          description: Berkas privat dihapus otomatis pada waktu ini (AC F17-4); terisi untuk ready dan expired.
        row_count:
          type:
            - integer
            - "null"
          minimum: 0
        file_name:
          type:
            - string
            - "null"
          description: Nama unduhan tanpa data pribadi; terisi untuk ready dan expired.
          examples:
            - audit-20261012-0192f0c2.csv
        bytes:
          type:
            - integer
            - "null"
          minimum: 0
        failure_reason:
          oneOf:
            - $ref: "#/components/schemas/AuditExportFailureReason"
            - type: "null"
    AuditExportAccess:
      type: object
      required:
        - url
        - expires_at
        - file_name
      properties:
        url:
          type: string
          format: uri
          description: URL bertanda tangan jangka pendek yang terikat berkas dan purpose.
        expires_at:
          type: string
          format: date-time
          description: Maksimal 10 menit (PRD 5.4).
        file_name:
          type: string
    AuditExportFailureReason:
      type: string
      enum:
        - row_limit_exceeded
        - processing_failed
        - timed_out
      description: |
        `row_limit_exceeded`: hasil filter melebihi batas baris ekspor, persempit filter. `processing_failed`: galat
        job/storage yang tidak pulih setelah retry; minta ekspor baru (rincian ada di log worker dengan request_id,
        N-14). `timed_out`: job tidak selesai sebelum batas waktu ekspor (konfigurasi server, usulan 1 jam sejak
        diminta), misalnya antrean hilang; minta ekspor baru.
    AuditExportPage:
      type: object
      required:
        - items
        - next_cursor
        - total
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuditExport"
        next_cursor:
          type:
            - string
            - "null"
        total:
          type: integer
          minimum: 0
    AuditExportStatus:
      type: string
      enum:
        - processing
        - ready
        - failed
        - expired
      description: |
        Siklus job ekspor: processing (diterima, menunggu atau sedang dikerjakan worker) -> ready | failed;
        ready -> expired saat berkas dihapus otomatis (AC F17-4). `failed` dan `expired` final. Label UI: Diproses,
        Siap, Gagal, Kedaluwarsa. Penurunan status dari tabel yang ada dijelaskan di skema AuditExport.
    AuditFilter:
      type: object
      description: |
        Filter audit yang sama dengan parameter GET /admin/audit/entries (AC F17-4). Semua opsional; `to` harus
        setelah `from`.
      properties:
        actor_q:
          type: string
          minLength: 2
          maxLength: 100
        actor_admin_id:
          type: string
          format: uuid
        actor_user_id:
          type: string
          format: uuid
        effective_role:
          $ref: "#/components/schemas/AuditEffectiveRole"
        action:
          type: string
          minLength: 1
          maxLength: 100
        entity_type:
          type: string
          minLength: 1
          maxLength: 64
        entity_id:
          type: string
          minLength: 1
          maxLength: 100
        request_id:
          type: string
          minLength: 1
          maxLength: 100
        from:
          type: string
          format: date-time
          description: Inklusif (UTC).
        to:
          type: string
          format: date-time
          description: Eksklusif (UTC).
    BannerTargetType:
      type: string
      enum:
        - none
        - post
        - event
        - page
        - url
      description: |
        Jenis target banner (tabel banners): `none` tidak dapat diketuk; `post` membuka detail berita; `event`
        membuka detail event; `page` membuka halaman informasi/legal; `url` membuka tautan luar https dengan indikasi
        tautan luar yang jelas (PRD 3.8).
    BlockedMember:
      type: object
      description: Anggota yang diblokir pemanggil; identitas minimum tanpa kontak (N-09).
      required:
        - user_id
        - full_name
        - avatar_url
        - blocked_at
      additionalProperties: false
      properties:
        user_id:
          type: string
          format: uuid
        full_name:
          type: string
          maxLength: 120
        avatar_url:
          type:
            - string
            - "null"
          format: uri
        blocked_at:
          type: string
          format: date-time
    BlockedMemberPage:
      type: object
      required:
        - items
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/BlockedMember"
        next_cursor:
          type:
            - string
            - "null"
    CancelPaymentAdjustmentRequest:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 500
          pattern: \S
    CancelPaymentRequest:
      type: object
      properties:
        reason:
          type: string
          maxLength: 200
          description: Alasan opsional dari pemilik; tersimpan di histori.
    ChangePasswordRequest:
      type: object
      required:
        - current_password
        - new_password
      properties:
        current_password:
          type: string
          minLength: 1
          maxLength: 128
        new_password:
          $ref: "#/components/schemas/Password"
    ChangePaymentMethodRequest:
      type: object
      required:
        - payment_method_id
      properties:
        payment_method_id:
          type: string
          format: uuid
          description: Metode aktif dari GET /payment-methods.
    ChatDirectRoomRequest:
      type: object
      required:
        - user_id
      properties:
        user_id:
          type: string
          format: uuid
          description: Lawan bicara (akun alumni).
    ChatGroupCreateRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: Nama grup; dipangkas server dan tidak boleh kosong (rooms_name_chk).
        avatar_file_id:
          type:
            - string
            - "null"
          format: uuid
          description: Berkas purpose chat_image milik pemanggil.
        invitee_user_ids:
          type: array
          maxItems: 99
          uniqueItems: true
          description: Calon anggota yang diundang (wajib menerima sendiri).
          items:
            type: string
            format: uuid
    ChatGroupCreated:
      type: object
      required:
        - room
        - invitations
      additionalProperties: false
      properties:
        room:
          $ref: "#/components/schemas/ChatRoom"
        invitations:
          $ref: "#/components/schemas/ChatInviteOutcome"
    ChatImage:
      type: object
      description: Gambar pesan; URL bertanda tangan maksimal 10 menit, terikat berkas dan sesi penerima (PRD 5.4).
      required:
        - file_id
        - url
        - url_expires_at
        - mime
        - width
        - height
      additionalProperties: false
      properties:
        file_id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
          x-sensitive: true
        url_expires_at:
          type: string
          format: date-time
        mime:
          type: string
          examples:
            - image/jpeg
        width:
          type:
            - integer
            - "null"
          minimum: 1
        height:
          type:
            - integer
            - "null"
          minimum: 1
    ChatInvitation:
      type: object
      description: Undangan grup tertunda untuk pemanggil.
      required:
        - room_id
        - room_name
        - room_avatar_url
        - member_count
        - invited_by
        - invited_at
      additionalProperties: false
      properties:
        room_id:
          type: string
          format: uuid
        room_name:
          type: string
          maxLength: 80
        room_avatar_url:
          type:
            - string
            - "null"
          format: uri
        member_count:
          type: integer
          minimum: 0
          maximum: 100
        invited_by:
          oneOf:
            - $ref: "#/components/schemas/ChatUserRef"
            - type: "null"
          description: Admin grup yang mengundang; null bila akunnya sudah dihapus.
        invited_at:
          type: string
          format: date-time
    ChatInvitationPage:
      type: object
      required:
        - items
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ChatInvitation"
        next_cursor:
          type:
            - string
            - "null"
    ChatInviteOutcome:
      type: object
      required:
        - invited_user_ids
        - skipped
      additionalProperties: false
      properties:
        invited_user_ids:
          type: array
          items:
            type: string
            format: uuid
        skipped:
          type: array
          items:
            $ref: "#/components/schemas/ChatInviteSkip"
    ChatInviteRequest:
      type: object
      required:
        - user_ids
      properties:
        user_ids:
          type: array
          minItems: 1
          maxItems: 50
          uniqueItems: true
          items:
            type: string
            format: uuid
    ChatInviteSkip:
      type: object
      required:
        - user_id
        - reason
      additionalProperties: false
      properties:
        user_id:
          type: string
          format: uuid
        reason:
          $ref: "#/components/schemas/ChatInviteSkipReason"
    ChatInviteSkipReason:
      type: string
      enum:
        - already_member
        - already_invited
        - room_full
        - not_invitable
      description: |
        Alasan undangan dilewati. not_invitable sengaja tidak membedakan akun tidak ada, bukan anggota aktif, diri
        sendiri, blokir, atau anggota yang tersembunyi dari direktori tanpa pernah satu grup dengan pengundang
        (F-12, N-09, PRD 3.10).
    ChatLeaveRequest:
      type: object
      description: Kirim objek kosong bila bukan admin terakhir.
      properties:
        successor_user_id:
          type: string
          format: uuid
          description: Anggota joined yang dipromosikan menjadi admin; wajib bila pemanggil admin terakhir (AC F11-5).
    ChatMemberListStatus:
      type: string
      enum:
        - joined
        - invited
      description: Saringan daftar anggota; invited hanya untuk admin grup.
    ChatMemberRole:
      type: string
      enum:
        - admin
        - member
      description: Peran di grup (room_members.role); room direct selalu member.
    ChatMemberStatus:
      type: string
      enum:
        - invited
        - joined
        - left
        - removed
        - declined
      description: |
        Siklus keanggotaan (room_members.status): invited -> joined | declined | removed (dibatalkan admin);
        joined -> left | removed. Undangan ulang mengembalikan ke invited.
    ChatMemberUpdate:
      type: object
      required:
        - role
      properties:
        role:
          $ref: "#/components/schemas/ChatMemberRole"
    ChatMessage:
      type: object
      description: |
        Pesan chat. Bentuk JSON sama dengan RealtimeChatMessage pada event message.created. Placeholder pesan
        terhapus: deleted_at terisi, body/image null, reaksi kosong.
      required:
        - id
        - room_id
        - client_message_id
        - kind
        - sender
        - body
        - image
        - reply_to
        - reactions
        - created_at
        - deleted_at
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        room_id:
          type: string
          format: uuid
        client_message_id:
          type:
            - string
            - "null"
          format: uuid
          description: ID dari klien pengirim untuk deduplikasi retry (AC F11-2); null untuk pesan sistem.
        kind:
          $ref: "#/components/schemas/ChatMessageKind"
        sender:
          oneOf:
            - $ref: "#/components/schemas/ChatUserRef"
            - type: "null"
          description: Null untuk pesan sistem atau pengirim yang akunnya sudah dihapus.
        body:
          type:
            - string
            - "null"
          maxLength: 4000
          description: |
            Isi teks atau keterangan gambar; pesan sistem berisi teks yang dirangkai server dengan nama terkini (akun
            yang sudah dihapus tampil "Seorang anggota", AC F14-3). Tidak pernah dilog.
          x-sensitive: true
        image:
          oneOf:
            - $ref: "#/components/schemas/ChatImage"
            - type: "null"
        reply_to:
          oneOf:
            - $ref: "#/components/schemas/ChatMessageReply"
            - type: "null"
        reactions:
          type: array
          items:
            $ref: "#/components/schemas/ChatReaction"
        created_at:
          type: string
          format: date-time
          description: |
            Diisi server di bawah kunci baris room dan naik ketat per room, sehingga urutan (created_at, id) sama
            dengan urutan commit (AC F11-3).
        deleted_at:
          type:
            - string
            - "null"
          format: date-time
    ChatMessageKind:
      type: string
      enum:
        - text
        - image
        - system
      description: Jenis pesan (messages.kind); system ditulis server (mis. anggota bergabung/keluar).
    ChatMessagePage:
      type: object
      required:
        - items
      additionalProperties: false
      properties:
        items:
          type: array
          description: Urut naik (created_at, id).
          items:
            $ref: "#/components/schemas/ChatMessage"
        next_cursor:
          type:
            - string
            - "null"
          description: ID pesan untuk request berikutnya ke arah yang sama (`before` atau `after`); null bila habis.
    ChatMessagePreview:
      type: object
      description: Pratinjau pesan terakhir di daftar room.
      required:
        - id
        - kind
        - sender_user_id
        - sender_name
        - preview
        - has_image
        - deleted
        - created_at
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/ChatMessageKind"
        sender_user_id:
          type:
            - string
            - "null"
          format: uuid
        sender_name:
          type:
            - string
            - "null"
        preview:
          type:
            - string
            - "null"
          maxLength: 120
          description: Potongan isi teks (maksimal 120 karakter); null bila terhapus atau gambar tanpa keterangan.
          x-sensitive: true
        has_image:
          type: boolean
        deleted:
          type: boolean
        created_at:
          type: string
          format: date-time
    ChatMessageReactions:
      type: object
      required:
        - message_id
        - reactions
      additionalProperties: false
      properties:
        message_id:
          type: string
          format: uuid
        reactions:
          type: array
          items:
            $ref: "#/components/schemas/ChatReaction"
    ChatMessageReply:
      type: object
      description: |
        Rujukan pesan yang dibalas. available=false bila pesan itu terhapus atau di luar riwayat yang boleh dibaca
        pemanggil; pratinjau lalu null. Pada event realtime available selalu false dan pratinjau null karena riwayat
        yang boleh dibaca berbeda per anggota (klien memakai salinan lokal pesan `id`).
      required:
        - id
        - available
        - sender_name
        - preview
        - has_image
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        available:
          type: boolean
        sender_name:
          type:
            - string
            - "null"
        preview:
          type:
            - string
            - "null"
          maxLength: 120
          x-sensitive: true
        has_image:
          type: boolean
    ChatMuteRequest:
      type: object
      required:
        - muted
      properties:
        muted:
          type: boolean
    ChatPeer:
      type: object
      description: Lawan bicara di room direct (field ChatUserRef ditambah `available`).
      required:
        - user_id
        - full_name
        - avatar_url
        - available
      additionalProperties: false
      properties:
        user_id:
          type: string
          format: uuid
        full_name:
          type: string
          maxLength: 120
        avatar_url:
          type:
            - string
            - "null"
          format: uri
        available:
          type: boolean
          description: |
            False bila lawan bicara tidak lagi anggota aktif (expired/suspended), akunnya dihapus, atau ia
            memblokir pemanggil; alasan sengaja tidak dibedakan (N-09, AC F12-1).
    ChatReaction:
      type: object
      required:
        - emoji
        - count
        - reacted_by_me
      additionalProperties: false
      properties:
        emoji:
          type: string
          minLength: 1
          maxLength: 16
        count:
          type: integer
          minimum: 1
        reacted_by_me:
          type: boolean
    ChatReadRequest:
      type: object
      required:
        - message_id
      properties:
        message_id:
          type: string
          format: uuid
          description: Pesan terakhir yang sudah ditampilkan klien.
    ChatReadState:
      type: object
      required:
        - room_id
        - last_read_message_id
        - last_read_at
        - unread_count
      additionalProperties: false
      properties:
        room_id:
          type: string
          format: uuid
        last_read_message_id:
          type:
            - string
            - "null"
          format: uuid
        last_read_at:
          type:
            - string
            - "null"
          format: date-time
        unread_count:
          type: integer
          minimum: 0
          maximum: 999
    ChatRoom:
      type: object
      description: |
        Detail room untuk anggota joined: seluruh field ChatRoomSummary (diulang, bukan allOf, agar
        additionalProperties: false berlaku; ubah keduanya bersamaan) ditambah izin kirim, read cursor dan versi.
      required:
        - id
        - kind
        - title
        - avatar_url
        - peer
        - member_count
        - my_role
        - muted
        - unread_count
        - last_message
        - last_message_at
        - name
        - avatar_file_id
        - can_send
        - send_restriction
        - can_manage
        - last_read_message_id
        - peer_last_read_message_id
        - history_visible_from
        - closed_at
        - created_at
        - version
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/ChatRoomKind"
        title:
          type: string
          description: Nama grup, atau nama lawan bicara untuk room direct ("Akun dihapus" bila akunnya dihapus).
        avatar_url:
          type:
            - string
            - "null"
          format: uri
          description: Avatar grup atau avatar lawan bicara; URL bertanda tangan maksimal 10 menit bila privat.
        peer:
          oneOf:
            - $ref: "#/components/schemas/ChatPeer"
            - type: "null"
          description: Objek lawan bicara untuk room direct; null untuk grup atau bila akun lawan bicara dihapus.
        member_count:
          type: integer
          minimum: 0
          maximum: 100
          description: Jumlah anggota joined.
        my_role:
          $ref: "#/components/schemas/ChatMemberRole"
        muted:
          type: boolean
        unread_count:
          type: integer
          minimum: 0
          maximum: 999
        last_message:
          oneOf:
            - $ref: "#/components/schemas/ChatMessagePreview"
            - type: "null"
        last_message_at:
          type:
            - string
            - "null"
          format: date-time
        name:
          type:
            - string
            - "null"
          maxLength: 80
          description: Nama grup; null untuk room direct.
        avatar_file_id:
          type:
            - string
            - "null"
          format: uuid
          description: Berkas avatar grup.
        can_send:
          type: boolean
          description: False bila server akan menolak pengiriman.
        send_restriction:
          oneOf:
            - $ref: "#/components/schemas/ChatSendRestriction"
            - type: "null"
          description: Alasan can_send false; null bila boleh mengirim.
        can_manage:
          type: boolean
          description: True bila pemanggil admin grup yang belum ditutup (ubah info, undang, kelola anggota).
        last_read_message_id:
          type:
            - string
            - "null"
          format: uuid
          description: Read cursor pemanggil.
        peer_last_read_message_id:
          type:
            - string
            - "null"
          format: uuid
          description: Read cursor lawan bicara (room direct) untuk status "terbaca"; null untuk grup.
        history_visible_from:
          type:
            - string
            - "null"
          format: date-time
          description: Batas awal riwayat yang dapat dibaca pemanggil (waktu bergabung); null = sejak awal.
        closed_at:
          type:
            - string
            - "null"
          format: date-time
        created_at:
          type: string
          format: date-time
        version:
          type: string
          description: Versi room untuk If-Match pada PATCH.
    ChatRoomKind:
      type: string
      enum:
        - direct
        - group
      description: Jenis room (rooms.kind).
    ChatRoomMember:
      type: object
      description: |
        Anggota atau undangan tertunda dalam grup: field ChatUserRef (nama dan avatar saja, tanpa kontak) ditambah
        peran dan status keanggotaan.
      required:
        - user_id
        - full_name
        - avatar_url
        - role
        - status
        - invited_at
        - joined_at
        - last_read_message_id
        - is_me
      additionalProperties: false
      properties:
        user_id:
          type: string
          format: uuid
        full_name:
          type: string
          maxLength: 120
        avatar_url:
          type:
            - string
            - "null"
          format: uri
        role:
          $ref: "#/components/schemas/ChatMemberRole"
        status:
          $ref: "#/components/schemas/ChatMemberStatus"
        invited_at:
          type:
            - string
            - "null"
          format: date-time
        joined_at:
          type:
            - string
            - "null"
          format: date-time
        last_read_message_id:
          type:
            - string
            - "null"
          format: uuid
          description: Read cursor anggota joined (status "terbaca"); null untuk undangan.
        is_me:
          type: boolean
    ChatRoomMemberPage:
      type: object
      required:
        - items
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ChatRoomMember"
        next_cursor:
          type:
            - string
            - "null"
    ChatRoomPage:
      type: object
      required:
        - items
        - pending_invitation_count
        - unread_room_count
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ChatRoomSummary"
        next_cursor:
          type:
            - string
            - "null"
        pending_invitation_count:
          type: integer
          minimum: 0
          description: Jumlah undangan grup tertunda milik pemanggil.
        unread_room_count:
          type: integer
          minimum: 0
          description: Jumlah room (semua jenis) yang memiliki pesan belum dibaca.
    ChatRoomSummary:
      type: object
      description: |
        Item daftar room (tab Pesan / Pesan Grup). ChatRoom mengulang seluruh field ini (bukan allOf, agar
        additionalProperties: false berlaku pada keduanya); ubah keduanya bersamaan.
      required:
        - id
        - kind
        - title
        - avatar_url
        - peer
        - member_count
        - my_role
        - muted
        - unread_count
        - last_message
        - last_message_at
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: "#/components/schemas/ChatRoomKind"
        title:
          type: string
          description: Nama grup, atau nama lawan bicara untuk room direct ("Akun dihapus" bila akunnya dihapus).
        avatar_url:
          type:
            - string
            - "null"
          format: uri
          description: Avatar grup atau avatar lawan bicara; URL bertanda tangan maksimal 10 menit bila privat.
        peer:
          oneOf:
            - $ref: "#/components/schemas/ChatPeer"
            - type: "null"
          description: |
            Selalu ada. Objek lawan bicara untuk room direct (dipakai membuka profil, blokir dan lapor dari daftar room
            dan header room); null untuk grup atau bila akun lawan bicara sudah dihapus.
        member_count:
          type: integer
          minimum: 0
          maximum: 100
          description: Jumlah anggota joined.
        my_role:
          $ref: "#/components/schemas/ChatMemberRole"
        muted:
          type: boolean
        unread_count:
          type: integer
          minimum: 0
          maximum: 999
        last_message:
          oneOf:
            - $ref: "#/components/schemas/ChatMessagePreview"
            - type: "null"
        last_message_at:
          type:
            - string
            - "null"
          format: date-time
    ChatRoomUpdate:
      type: object
      description: Hanya field yang dikirim yang diubah.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        avatar_file_id:
          type:
            - string
            - "null"
          format: uuid
          description: Berkas purpose chat_image milik pemanggil; null menghapus avatar.
    ChatSendKind:
      type: string
      enum:
        - text
        - image
      description: Jenis pesan yang boleh dikirim anggota.
    ChatSendMessageRequest:
      type: object
      required:
        - client_message_id
        - kind
      properties:
        client_message_id:
          type: string
          format: uuid
          description: UUID dari klien, disimpan lokal sampai ack diterima dan dipakai ulang saat retry (PRD 4.3).
        kind:
          $ref: "#/components/schemas/ChatSendKind"
        body:
          type: string
          minLength: 1
          maxLength: 4000
          description: Wajib untuk text (tidak boleh hanya spasi); opsional untuk image sebagai keterangan.
          x-sensitive: true
        image_file_id:
          type: string
          format: uuid
          description: Wajib untuk image; berkas purpose chat_image.
        reply_to_id:
          type:
            - string
            - "null"
          format: uuid
    ChatSendRestriction:
      type: string
      enum:
        - blocked
        - peer_unavailable
        - room_closed
      description: |
        Alasan pengiriman ditolak server (room direct kecuali room_closed):
        - blocked = pemanggil memblokir lawan bicara (AC F12-1); UI menawarkan "Buka blokir".
        - peer_unavailable = lawan bicara tidak lagi anggota aktif, akunnya dihapus, ATAU lawan bicara memblokir
          pemanggil. Blokir dari pihak lain sengaja dilaporkan sebagai peer_unavailable agar pihak yang diblokir
          tidak mengetahuinya (sama dengan can_message di profil, N-09).
        - room_closed = grup ditutup.
    ChatUserRef:
      type: object
      description: |
