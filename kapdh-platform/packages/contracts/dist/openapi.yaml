        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: FORBIDDEN tanpa izin payments.read; MFA_REQUIRED bila sesi admin belum TOTP.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"
  /admin/payment-adjustments/{adjustmentId}:
    get:
      tags:
        - Admin Payments
      operationId: adminGetPaymentAdjustment
      summary: Detail penyesuaian (payments.read, D6).
      description: |
        `refund_destination` hanya dikirim kepada pemegang payments.decide selama status pending dan tidak
        berkonflik kepentingan; selain itu null dengan `has_refund_destination` sebagai penanda (D2).
      x-kapdh-access:
        audience: admin
        permissions:
          - payments.read
      parameters:
        - $ref: "#/components/parameters/AdjustmentId"
      responses:
        "200":
          description: Detail penyesuaian.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPaymentAdjustment"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: FORBIDDEN tanpa izin payments.read; MFA_REQUIRED bila sesi admin belum TOTP.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
    patch:
      tags:
        - Admin Payments
      operationId: adminUpdatePaymentAdjustment
      summary: Ubah nominal, alasan, rekening tujuan atau bukti penyesuaian pending (payments.decide, D6).
      description: |
        Hanya untuk status pending. Field yang tidak dikirim tidak berubah; `refund_destination` null menghapus
        rekening tujuan, dan hanya boleh untuk kind refund. Aturan nominal sama dengan pembuatan. Audit mencatat
        perubahan tanpa isi rekening tujuan. Kunci: baris payment asal (FOR UPDATE) lalu baris penyesuaian, agar
        pemeriksaan total refund berurutan dengan pembuatan penyesuaian lain. Galat 409 PAYMENT_STATE_CONFLICT bila
        bukan pending dan VERSION_CONFLICT bila If-Match usang (termasuk bila pemilik baru saja mengirim rekening
        tujuan), dengan `current` AdminPaymentAdjustment.
      x-kapdh-access:
        audience: admin
        permissions:
          - payments.read
          - payments.decide
      parameters:
        - $ref: "#/components/parameters/AdjustmentId"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePaymentAdjustmentRequest"
      responses:
