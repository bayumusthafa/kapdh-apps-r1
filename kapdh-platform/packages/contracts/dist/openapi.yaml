                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /events/{eventId}/reservations:
    post:
      tags:
        - Events
      operationId: createEventReservation
      summary: Daftar event, satu kursi untuk diri sendiri; event gratis langsung paid (AC F09-1, F09-3, D5).
      description: |
        Hanya anggota aktif (verified/expiring). Dijalankan dalam SATU transaksi yang lebih dahulu mengunci baris
        event (`SELECT ... FOR UPDATE`), mengikuti urutan kunci global event -> tiket -> payment (aturan tag Events):
        1. Hold yang sudah lewat `hold_expires_at` pada event ini dilepas lebih dahulu (AC F09-2, "request
           berikutnya"): tiket tersebut dikunci urut id lalu payment pending-nya; tiket -> expired, payment ->
           cancelled, held_quantity dikurangi tepat sekali (UPDATE bersyarat `status='awaiting_payment'`). Sesudah
           langkah ini penghitung tersimpan sama dengan proyeksi baca (aturan tag Events), sehingga kuota yang
           ditampilkan GET /events/{eventId} juga yang dipakai langkah 4.
        2. Event wajib `open` dan `registration_opens_at <= now < registration_closes_at`; selain itu
           409 RESERVATION_EXPIRED (`registration_state` pada `current` menjelaskan sebabnya).
        3. Pemanggil sudah punya tiket aktif (awaiting_payment, awaiting_review, paid) di event ini, misalnya
           ketukan ganda dengan Idempotency-Key berbeda (PRD 9.2): 409 VERSION_CONFLICT. `current.my_ticket` menunjuk
           tiket aktif itu dan `current.reservation_blocked_reason = has_active_ticket`, sehingga klien yang memuat
           ulang detail event langsung menampilkan tombol buka tiket. Indeks unik parsial
           tickets_user_id_event_id_active_key menjadi penjaga terakhir untuk request paralel.
        4. `seats_available = 0`: 409 EVENT_SOLD_OUT. Request paralel tidak pernah membuat held + paid melebihi
           seats_total; transaksi gagal tidak meninggalkan hold (AC F09-1).
        5. `expected_price` wajib sama dengan `price` event saat ini (harga yang dikonfirmasi anggota pada layar
           Detail Tiket, guideline p8). Bila pengurus mengubah harga di antara tampilan dan kirim: 409
           VERSION_CONFLICT dan tidak ada hold yang dibuat; klien menampilkan harga baru dari `current` dan meminta
           konfirmasi ulang (PRD 4.4, PRD 4.5).
        6. Event berbayar (`price > 0`): `payment_method_id` wajib dan harus metode aktif; event gratis: field ini
           wajib kosong. Pelanggaran: 400 VALIDATION_ERROR (`field_errors.payment_method_id`).
        Setiap 409 bisnis operasi ini (langkah 2 sampai 5) membawa `current` dengan SATU bentuk: EventDetail
        terbaru untuk pemanggil, dihitung sesudah langkah 1 (PRD 4.5 "muat ulang data terbaru").
        Hasil event berbayar: tiket `awaiting_payment`, `total = price` saat ini (snapshot; perubahan harga tidak
        mengubah tiket ini, PRD 4.4), `hold_expires_at = min(now + hold_hours, registration_closes_at)` (D5),
        held_quantity +1, dan payment `type=ticket` pending (nominal dan metode disnapshot) yang dirujuk
        `payment.id`. Klien lalu mengunggah bukti (POST /files purpose payment_proof, kemudian
        PUT /me/payments/{paymentId}/proof) sebelum `hold_expires_at`; bukti tepat waktu memindahkan tiket ke
        awaiting_review dan kursi tetap ditahan sampai keputusan. Bukti sesudah hold lewat ditolak submitPaymentProof
        dengan 409 RESERVATION_EXPIRED (AC F09-2; aturan lengkap payment tiket di tag Events). Keputusan pengurus di
        antrean pembayaran: approve -> tiket paid, held menjadi paid, QR diterbitkan (AC F04-1); reject -> payment
        rejected final, tiket cancelled dan hold dilepas (AC F09-4).
        Hasil event gratis: tiket langsung `paid` dengan total 0.00, QR diterbitkan, paid_quantity +1, tanpa
        payment (AC F09-3).
        Tiket expired/cancelled sebelumnya tidak menghalangi: pendaftaran ulang selalu membuat tiket dan payment
        baru; bukti tidak menghidupkan tiket lama (AC F09-4, PRD 6.4).
        Audit `ticket.reserved` ditulis dalam transaksi yang sama (F-17). Ulangi dengan Idempotency-Key yang sama
        setelah jaringan putus; hasil pertama dikembalikan (PRD 4.3).
      x-kapdh-access:
        audience: mobile
        member_access: active
        idempotent: true
      parameters:
        - $ref: "#/components/parameters/EventId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventReservationRequest"
      responses:
        "201":
          description: Tiket dibuat (awaiting_payment untuk event berbayar, paid untuk event gratis).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketDetail"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: MEMBERSHIP_REQUIRED bila effective_status bukan verified/expiring (unverified, expired); ACCOUNT_SUSPENDED bila suspended (PRD 2.2).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            EVENT_SOLD_OUT (kuota habis), RESERVATION_EXPIRED (pendaftaran belum dibuka, sudah ditutup, atau event
            tidak open), VERSION_CONFLICT (sudah punya tiket aktif, lihat `current.my_ticket`; atau `expected_price`
            berbeda dari harga saat ini); ketiganya dengan `current` = EventDetail terbaru untuk pemanggil. Atau
            IDEMPOTENCY_CONFLICT (key sama dengan payload berbeda) tanpa `current`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Error"
  /me/tickets:
    get:
      tags:
        - Events
      operationId: listMyTickets
      summary: Tiket milik sendiri, aktif atau riwayat (F-09, PRD 2.2, PRD 4.4).
      description: |
        - `view=active` (bawaan): tiket awaiting_payment, awaiting_review atau paid untuk event yang belum berakhir
          dan tidak dibatalkan; urut `starts_at` event naik lalu id tiket.
        - `view=history`: tiket lainnya (expired, cancelled, event selesai/dibatalkan); urut `created_at` turun.
        Anggota expired tetap melihat dan memakai tiket paid (PRD 2.2). Tiket awaiting_payment yang hold-nya sudah
        lewat dikembalikan sebagai expired (masuk `view=history`) walaupun job expiry belum berjalan; ini proyeksi
        baca tanpa penulisan, pelepasan fisik tetap tepat sekali oleh job atau transaksi tulis berikutnya (aturan tag
        Events, AC F09-2).
      x-kapdh-access:
        audience: mobile
        member_access: nonsuspended
      parameters:
        - name: view
          in: query
          required: false
          description: Tiket aktif (bawaan) atau riwayat.
          schema:
            $ref: "#/components/schemas/TicketListView"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Halaman tiket.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketPage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccountSuspended"
        default:
          $ref: "#/components/responses/Error"
  /me/tickets/{ticketId}:
    get:
      tags:
        - Events
      operationId: getMyTicket
      summary: Detail tiket sendiri, hitung mundur hold, pembayaran, QR dan kelayakan pembatalan (F-09, PRD 4.4).
      description: |
        `qr_code` hanya terisi bila tiket `paid` dan event tidak cancelled (AC F09-7); selain itu null. Anggota
        expired tetap memperoleh QR tiket paid (PRD 2.2); anggota suspended tidak dapat membuka endpoint ini dan
        tiketnya ditolak saat check-in. `hold_expires_at` dipakai untuk hitung mundur awaiting_payment; hold yang
        sudah lewat tampil expired (proyeksi baca, aturan tag Events). `payment` menunjuk payment tiket untuk unggah
        bukti lewat API pembayaran. `refunds` memuat refund yang tercatat atas payment tiket (D6). Tiket milik
        pengguna lain menghasilkan 404 (N-09).
      x-kapdh-access:
        audience: mobile
        member_access: nonsuspended
      parameters:
        - $ref: "#/components/parameters/TicketId"
      responses:
        "200":
          description: Detail tiket.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketDetail"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccountSuspended"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /me/tickets/{ticketId}/cancel:
    post:
      tags:
        - Events
      operationId: cancelMyTicket
      summary: Batalkan tiket sendiri; refund penuh bila tiket berbayar dibatalkan sampai H-3 (D6, PRD 3.9).
      description: |
        Boleh untuk tiket `awaiting_payment` atau `paid` yang belum check-in, selama event belum dimulai
        (`now < starts_at`) dan tidak cancelled. Dalam satu transaksi mengikuti urutan kunci global: `event_id` tiket
        dibaca tanpa kunci, lalu baris event dikunci, kemudian tiket dan payment-nya; kepemilikan, status, versi dan
        kelayakan refund diperiksa ulang sesudah kunci didapat:
        - awaiting_payment: tiket cancelled (`cancelled_by=self`), hold dilepas, payment pending dibatalkan.
        - paid: tiket cancelled, QR tidak berlaku, paid_quantity -1. Payment tetap `paid` (tidak pernah diubah).
          Bila `total > 0` dan `now < full_refund_until` (starts_at dikurangi `self_cancel_days` = 3 hari kalender
          dalam zona waktu event, "H-3"), dibuat payment_adjustment refund pending sebesar total dengan tenggat
          7 hari kerja (D6); sesudah batas itu pembatalan tetap boleh tetapi tanpa refund. Event gratis tidak
          memiliki refund; pembatalan melepas kursi.
        - awaiting_review: ditolak 409 PAYMENT_STATE_CONFLICT karena bukti sedang ditinjau dan dana mungkin sudah
          ditransfer (PRD 4.3: pemilik hanya membatalkan sebelum bukti); tunggu keputusan atau hubungi pengurus.
        `expected_refund_eligible` wajib sama dengan `refund_eligible` yang ditampilkan; bila batas H-3 terlewati
        di antara tampilan dan kirim, server menolak 409 VERSION_CONFLICT dengan `current` = TicketDetail terbaru
        sehingga anggota tidak kehilangan refund tanpa sadar. Versi tiket (If-Match) yang berubah atau tiket yang
        tidak lagi dapat dibatalkan juga menghasilkan 409 VERSION_CONFLICT dengan `current`. Audit
        `ticket.cancelled` ditulis dalam transaksi yang sama (F-17). Rekening tujuan refund diminta saat proses
        refund oleh bendahara, bukan di sini (D6, D2).
      x-kapdh-access:
        audience: mobile
        member_access: nonsuspended
        idempotent: true
      parameters:
        - $ref: "#/components/parameters/TicketId"
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TicketCancelRequest"
      responses:
        "200":
          description: Tiket cancelled beserta refund bila ada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketDetail"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccountSuspended"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            VERSION_CONFLICT (versi tiket berubah, tiket tidak dapat dibatalkan lagi, atau kelayakan refund berubah;
            `current` = TicketDetail), PAYMENT_STATE_CONFLICT (bukti sedang ditinjau; `current` = TicketDetail), atau
            IDEMPOTENCY_CONFLICT.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        default:
          $ref: "#/components/responses/Error"
  /files:
    post:
      tags:
        - Files
      operationId: uploadFile
      summary: Unggah berkas dengan purpose tertentu (N-10).
      description: |
        Multipart dengan field `purpose` lalu satu berkas pada field `file`. Field `purpose` WAJIB dikirim sebelum
        `file` (urutan bagian multipart) agar hak unggah dan kuota diperiksa sebelum isi dibaca; urutan terbalik
        → 400 VALIDATION_ERROR. Batas baca stream per purpose: 5 MB untuk purpose gambar, 10 MB untuk
        `payment_proof`; lebih besar → 413 FILE_INVALID.

        Tipe ditentukan dari magic bytes (bukan ekstensi atau Content-Type klien); ekstensi/Content-Type yang
        menyamarkan tipe ditolak 415. Gambar JPG/PNG/WebP <= 5 MB didekode aman (dimensi/piksel berlebihan ditolak
        422), diputar sesuai orientasi lalu di-encode ulang sehingga EXIF/GPS terbuang. PDF <= 10 MB hanya untuk
        `payment_proof`; PDF berskrip/berlampiran ditolak 422.

        Kuota: maksimal 10 unggahan berhasil per purpose per pengguna per 24 jam bergulir, ditambah batas 30
        percobaan per jam → 429 RATE_LIMITED dengan `retry_after_seconds`.

        Hak unggah per purpose:
        - anggota (sesi aplikasi): `avatar` dan `payment_proof` (effective_status selain suspended), `chat_image`
          (verified/expiring); sesi admin → 403 kecuali butir berikut;
        - pengurus (sesi admin): `adjustment_evidence` (`payments.decide`, bukti penyelesaian penyesuaian/refund D6)
          dan `payment_proof` (`payments.decide`, bukti verifikasi untuk pembayaran yang dicatat pengurus,
          adminRecordPayment D13; berkas milik akun login admin dan tidak pernah dibuka kepada anggota); sesi
          anggota → 403 untuk `adjustment_evidence`.

        Gambar publik konten TIDAK diunggah lewat endpoint ini (purpose lain → 400 pada `purpose`): `post_cover` dan
        `banner_image` lewat POST /admin/content/media (`content.manage`), `event_cover` lewat
        POST /admin/event-covers (`events.manage`), dan gambar QRIS `payment_qr` lewat POST /admin/payment-qr-images
        (`settings.manage`, ADR-026), sehingga izin area itu yang diperiksa; pemeriksaan isi, kuota dan pembersihan
        berkas sama.

        Berkas baru belum terkait objek; endpoint domain melampirkannya lewat `file_id`. Berkas yang tidak dilampirkan
        dalam 24 jam dihapus job `files.cleanup-temp` (PRD 2.5).
      x-kapdh-access:
        audience: any
        member_access: nonsuspended
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/FileUploadRequest"
      responses:
        "201":
          description: Berkas diterima, diproses, dan siap dilampirkan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileRef"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: Purpose bukan untuk audience/izin pemanggil (FORBIDDEN), atau MEMBERSHIP_REQUIRED / ACCOUNT_SUSPENDED.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/FileInvalid"
        "415":
          $ref: "#/components/responses/FileInvalid"
        "422":
          $ref: "#/components/responses/FileInvalid"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Error"
  /files/{fileId}/access:
    get:
      tags:
        - Files
      operationId: getFileAccess
      summary: URL baca berkas setelah pemeriksaan izin (PRD 5.4).
      description: |
        Berkas privat: kebijakan akses purpose diperiksa lebih dulu (pemilik; pengurus `payments.read` untuk bukti
        bayar, termasuk versi bukti lama yang dirujuk riwayat pembayaran, dan bukti penyesuaian; `members.read` untuk
        avatar; ekspor audit hanya untuk `audit.read` + `audit.export` yang juga pemohon ekspor atau Super Admin,
        dengan jalur unduh utama adminGetAuditExportAccess; aturan modul seperti anggota room untuk gambar chat;
        `moderation.read` untuk gambar chat dan avatar yang dirujuk bukti laporan, HANYA bila minimal satu laporan
        perujuk terlihat bagi pemanggil menurut aturan konflik kepentingan admin-moderation butir a, dan setiap akses
        itu dicatat audit `moderation.evidence_viewed` sebelum URL diterbitkan), lalu
        URL bertanda tangan berumur <= 10 menit terikat berkas + purpose + keluarga sesi pemanggil (Session.id). URL
        tetap berlaku melewati rotasi refresh, tetapi berhenti berlaku bila sesi dicabut (logout, logout semua
        perangkat, suspend). Berkas publik: URL tetap dan `expires_at` null. `mime` memberi tahu klien cara
        menampilkan isi (gambar atau PDF) tanpa menebak dari URL. Berkas yang tidak ada, belum siap, atau tidak boleh
        dibuka → 404 tanpa membedakan alasannya (N-09).
      x-kapdh-access:
        audience: any
        member_access: nonsuspended
      parameters:
        - $ref: "#/components/parameters/FileId"
      responses:
        "200":
          description: URL baca berkas.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FileAccess"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /files/content/{token}:
    get:
      tags:
        - Files
      operationId: getFileContent
      summary: Isi berkas privat lewat token URL bertanda tangan (dipakai langsung sebagai URL gambar/unduhan).
      description: |
        Tanpa header Authorization: token di path adalah kredensial berumur <= 10 menit hasil `getFileAccess` atau
        URL yang disematkan API; klien memakai `url` apa adanya. Token rusak/diubah/kedaluwarsa, sesi penerima
        dicabut, atau berkas sudah dihapus → 404. Respons `Cache-Control: private, no-store` (cache publik tidak
        boleh menyimpan bukti, chat, atau ekspor, PRD 5.4); gambar ditampilkan inline, PDF dan CSV diunduh sebagai
        lampiran.
      x-kapdh-access:
        audience: public
      security: []
      parameters:
        - $ref: "#/components/parameters/FileContentToken"
      responses:
        "200":
          description: Isi berkas.
          headers:
            Cache-Control:
              description: Selalu `private, no-store`.
              schema:
                type: string
          content:
            image/jpeg:
              schema:
                $ref: "#/components/schemas/FileBinary"
            image/png:
              schema:
                $ref: "#/components/schemas/FileBinary"
            image/webp:
              schema:
                $ref: "#/components/schemas/FileBinary"
            application/pdf:
              schema:
                $ref: "#/components/schemas/FileBinary"
            text/csv:
              schema:
                $ref: "#/components/schemas/FileBinary"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /files/public/{fileId}:
    get:
      tags:
        - Files
      operationId: getPublicFile
      summary: Isi berkas publik (cover berita/event, banner, avatar publik) dengan cache publik.
      description: |
        Hanya berkas bervisibilitas publik yang siap; selain itu 404 (berkas privat tidak pernah dilayani di sini).
        Isi berkas tidak pernah berubah untuk id yang sama, sehingga respons `Cache-Control: public, max-age=86400`
        dan `ETag` (sha256 isi); `If-None-Match` yang cocok → 304 tanpa isi.
      x-kapdh-access:
        audience: public
      security: []
      parameters:
        - $ref: "#/components/parameters/FileId"
      responses:
        "200":
          description: Isi gambar publik.
          headers:
            ETag:
              description: Validator kuat dari sha256 isi.
              schema:
                type: string
            Cache-Control:
              description: "`public, max-age=86400`."
              schema:
                type: string
          content:
            image/jpeg:
              schema:
                $ref: "#/components/schemas/FileBinary"
            image/png:
              schema:
                $ref: "#/components/schemas/FileBinary"
            image/webp:
              schema:
                $ref: "#/components/schemas/FileBinary"
        "304":
          description: Tidak berubah sejak ETag yang dikirim klien.
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /me:
    get:
      tags:
        - Me
      operationId: getMe
      summary: Profil sendiri, status akun, effective_status dan penunjuk iuran terbuka untuk perutean klien (PRD 2.2, AC F02-1).
      description: |
        Dipanggil setelah login, saat aplikasi kembali aktif, dan setelah galat MEMBERSHIP_REQUIRED atau
        ACCOUNT_SUSPENDED untuk menentukan rute (routeForStatus, PRD 2.2). Dapat dipanggil semua effective_status
        yang memiliki sesi (unverified, verified, expiring, expired, suspended). Akun pending_otp tidak memperoleh
        sesi (login mengarah ke OTP); akun disabled/deletion_pending sesinya dicabut sehingga mendapat 401.

        Perutean onboarding (prototipe layar 2, 3, 4, 5) memakai `registration_payment`:
        - effective_status unverified dan `registration_payment` null: layar Biaya KTA (/onboarding/fees);
        - stage `awaiting_proof`: layar pembayaran/unggah bukti (/payments/{id});
        - stage `awaiting_review`: layar Menunggu Verifikasi;
        - stage `rejected`: layar Ditolak dengan `rejection_reason` (AC F03-3, F04-2).
        Perpanjangan memakai `renewal_eligible`, `renewal_opens_at` dan `renewal_payment` dengan aturan yang sama
        (AC F07-5). Nilai `version` dipakai sebagai If-Match pada PATCH /me/profile.
      x-kapdh-access:
        audience: mobile
        member_access: any
      responses:
        "200":
          description: Profil dan status terkini.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        default:
          $ref: "#/components/responses/Error"
  /me/profile:
    patch:
      tags:
        - Me
      operationId: updateMyProfile
      summary: Ubah profil umum, profesi/keahlian, avatar dan privasi sendiri (F-10, PRD 4.6, AC F10-2, F10-4).
      description: |
        Hanya field yang dikirim yang diubah (PATCH); null pada field nullable berarti mengosongkan. Hanya untuk
        effective_status nonsuspended (unverified, verified, expiring, expired); suspended mendapat 403
        ACCOUNT_SUSPENDED.

        Field identitas keanggotaan TIDAK dapat diubah lewat endpoint ini (PRD 3.5, 6.4, AC F05-6): nama lengkap,
        jenis kelamin, angkatan, kelas masuk/keluar, email dan nomor anggota. Nomor dialokasikan saat OTP
        terverifikasi sehingga setelah itu koreksi hanya oleh pengurus berizin members.manage
        (PATCH /admin/members/{userId}); email lewat alur koreksi email terverifikasi (F-01). Body yang memuat
        field di luar skema (mis. member_number, cohort) ditolak 400 VALIDATION_ERROR dan tidak ada field yang
        berubah.

        Aturan server:
        - `professions`, `education` dan `social_links` masing-masing MENGGANTIKAN seluruh daftar ([] mengosongkan);
          aturan per daftar ada di ProfileUpdate. Profesi yang cocok dengan label master aktif (tanpa membedakan
          huruf besar/kecil) ditautkan ke master itu; label lain disimpan sebagai ketikan sendiri.
        - skill_ids hanya boleh menunjuk master aktif, kecuali master nonaktif yang SUDAH terpasang pada profil ini
          (label historis tetap, AC F10-4); selain itu 400 VALIDATION_ERROR pada field tersebut. skill_ids
          menggantikan seluruh himpunan keahlian (maksimal 10, tanpa duplikat).
        - avatar_file_id wajib berkas milik pemanggil dengan purpose `avatar` dan status ready; selain itu 422
          FILE_INVALID (tanpa membedakan berkas milik orang lain dari berkas yang tidak ada, N-09).
        - Privasi: kontak dan tautan sosial bawaan tersembunyi (show_phone/show_email/show_social false, N-15);
          field tersembunyi tidak ikut payload direktori/profil anggota lain (AC F10-2).
        - Setiap tautan sosial memakai aturan SocialHandle: nama pengguna atau URL https; skema lain (javascript:,
          data:, http:, dll.) ditolak 400 VALIDATION_ERROR pada field tersebut (N-09, N-14).
        - Perubahan avatar/kota/profesi tercermin pada GET /me/card berikutnya.

        Masa transisi aplikasi 1.0.0 (field lama, deprecated): `profession_id`, `last_education_institution`,
        `last_education_city` dan `social_instagram`/`social_x`/`social_facebook`/`social_linkedin` tetap diterima.
        Masing-masing hanya mengubah satu entri daftar barunya: profession_id melepas profesi pertama yang tertaut
        master lalu menaruh master baru (wajib aktif) sebagai profesi utama, atau null melepasnya saja; 400 pada
        profession_id bila daftar profesi sudah penuh (5); last_education_institution mengganti institusi entri
        pendidikan teratas atau membuat entri baru (null menghapus entri teratas); social_<platform> mengganti tautan
        pertama platform itu atau menambahkannya di akhir (null menghapusnya; 400 pada field itu bila tautan baru
        tidak muat karena daftar sudah penuh, 10). last_education_city hanya disimpan
        untuk dibaca kembali oleh aplikasi lama dan dikosongkan server bila institusi teratas berganti. Field lama
        bersama penggantinya dalam satu body (mis. profession_id dengan professions, social_x dengan social_links)
        ditolak 400 VALIDATION_ERROR pada field lama.
        Versi berbeda dari If-Match menghasilkan 409 VERSION_CONFLICT dengan `current` berbentuk Me (AC F15-4).
      x-kapdh-access:
        audience: mobile
        member_access: nonsuspended
      parameters:
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: Profil terbaru dengan version baru.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccountSuspended"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/FileInvalid"
        "426":
          $ref: "#/components/responses/UpgradeRequired"
        "503":
          $ref: "#/components/responses/Maintenance"
        default:
          $ref: "#/components/responses/Error"
  /me/card:
    get:
      tags:
        - Me
      operationId: getMyCard
      summary: Data KTA digital, status kartu, ajakan bayar/perpanjang dan token QR bertanda tangan (F-05, AC F05-1..F05-5).
      description: |
        Kartu dibuat saat OTP pendaftaran terverifikasi dengan status Tidak Aktif dan menjadi Aktif setelah
        registration paid (AC F05-1). Isi mengikuti guideline hal. 6 dan prototipe layar 6/7: foto, nama,
        angkatan + profesi, kode angkatan "KAPDH n", tahun lulus, kota saja (bukan alamat lengkap), nomor anggota,
        QR, masa berlaku, label status dengan tombol Bayar/Perpanjang, dan waktu sinkronisasi.

        Token QR hanya diterbitkan bila status kartu `active` atau `expiring` (verified/expiring, tidak suspended);
        token JWT bertanda tangan server berumur maksimal 7 hari dan tidak melewati expires_at (PRD 3.5,
        ARCHITECTURE §3.2). Setiap pemanggilan menerbitkan token baru; token lama tetap tunduk expiry dan status
        server terbaru (AC F05-5). Koreksi nomor oleh admin membuat QR lama "perlu diperbarui" (AC F05-6).

        Cache offline (AC F05-2..F05-4): klien menyimpan respons ini bersama id pengguna dan menampilkannya
        berlabel Offline hanya sampai `offline_valid_until`; null berarti kartu tidak boleh tampil aktif secara
        offline. Cache dihapus saat logout/ganti akun. Anggota suspended mendapat label `suspended` tanpa QR
        sehingga cache aktif langsung diganti saat kembali online (AC F05-4).
      x-kapdh-access:
        audience: mobile
        member_access: any
      responses:
        "200":
          description: KTA terkini.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberCard"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        default:
          $ref: "#/components/responses/Error"
  /me/membership:
    get:
      tags:
        - Me
      operationId: getMyMembership
      summary: Periode keanggotaan, jendela dan kelayakan perpanjangan, serta histori periode sendiri (F-07, AC F07-1..F07-5).
      description: |
        Status dihitung dari timestamp saat request, bukan dari jadwal worker (AC F07-3). Jendela renewal dibuka
        30 hari sebelum expires_at dan tetap terbuka setelah expired, tanpa masa tenggang (AC F07-5, D4). Renewal
        menambah 12 bulan kalender Asia/Jakarta dari max(expires_at lama, approved_at) (AC F07-1, F07-2). Suspend
        tidak membuang tanggal periode (PRD 4.2) tetapi menutup kelayakan pembayaran baru (PRD 2.2). Dapat dibaca
        semua effective_status yang memiliki sesi, termasuk expired dan suspended (riwayat sendiri).
      x-kapdh-access:
        audience: mobile
        member_access: any
      responses:
        "200":
          description: Keanggotaan dan histori periode (terbaru lebih dulu).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Membership"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        default:
          $ref: "#/components/responses/Error"
  /masters/{kind}:
    get:
      tags:
        - Me
      operationId: listMasters
      summary: Master profesi atau keahlian yang AKTIF untuk pemilihan profil dan filter direktori (F-10, AC F10-4).
      description: |
        Hanya master aktif, urut sort_order lalu label. Master nonaktif tidak dapat dipilih baru, tetapi tetap
        tampil sebagai label historis pada profil yang sudah memakainya (AC F10-4). Daftar kecil sehingga tidak
        dipaging. Pengelolaan oleh pengurus ada di /admin/masters/{kind} (master.manage).
      x-kapdh-access:
        audience: mobile
        member_access: nonsuspended
      parameters:
        - $ref: "#/components/parameters/MasterKindPath"
      responses:
        "200":
          description: Daftar master aktif.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MasterItemList"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccountSuspended"
        default:
          $ref: "#/components/responses/Error"
  /blocks:
    get:
      tags:
        - Moderation
      operationId: listBlocks
      summary: Daftar anggota yang saya blokir (F-12, layar Akun > Diblokir).
      description: |
        Hanya blokir yang dibuat pemanggil (blocker = pemanggil), terbaru dulu. Pemanggil tidak pernah diberi tahu
        siapa yang memblokir dirinya.
      x-kapdh-access:
        audience: mobile
        member_access: active
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Halaman blokir.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockedMemberPage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Error"
  /blocks/{userId}:
    put:
      tags:
        - Moderation
      operationId: blockMember
      summary: Blokir anggota; berlaku dua arah untuk pesan direct dan undangan grup (AC F12-1).
      description: |
        Idempoten: blokir yang sudah ada dikembalikan apa adanya. Memblokir diri sendiri -> 400 VALIDATION_ERROR
        (blocks_self_chk); akun alumni yang tidak ada -> 404. Efek setelah commit:
        - pengiriman pesan dan reaksi di room direct antara keduanya ditolak dari pihak mana pun (AC F12-1), walaupun
          room/socket sudah ada; riwayat lama tetap dapat dibaca kedua pemilik room;
        - undangan grup antara keduanya ditolak, dan undangan tertunda dari salah satu pihak kepada yang lain
          dibatalkan (event `room.member_changed` change=invitation_cancelled dengan actor_user_id null hanya ke
          kanal user calon anggota dan admin grup, sehingga pembatalan tidak dapat dibedakan dari tindakan sistem
          lain);
        - di grup yang sama, blokir tidak mengubah aturan room atau menghapus pesan orang lain; gunakan mute atau
          laporan (PRD 3.12);
        - anggota yang diblokir tidak diberi tahu; perangkat pemanggil menerima `room.updated` untuk room direct
          (changes berisi send_permission) bila room itu ada.
      x-kapdh-access:
        audience: mobile
        member_access: active
      parameters:
        - $ref: "#/components/parameters/BlockedUserId"
      responses:
        "200":
          description: Blokir aktif.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlockedMember"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
    delete:
      tags:
        - Moderation
      operationId: unblockMember
      summary: Buka blokir; idempoten (F-12).
      description: |
        Menghapus blokir yang dibuat pemanggil saja; blokir dari pihak lain tetap berlaku sehingga pesan direct
        tetap ditolak selama blokir pihak lain ada (AC F12-1). Blokir yang tidak ada tetap 204 (idempoten); user_id
        bukan UUID atau diri sendiri -> 400 VALIDATION_ERROR. Undangan yang sudah dibatalkan tidak dipulihkan.
        Perangkat pemanggil menerima `room.updated` (changes berisi send_permission) untuk room direct bila ada.
      x-kapdh-access:
        audience: mobile
        member_access: active
      parameters:
        - $ref: "#/components/parameters/BlockedUserId"
      responses:
        "204":
          description: Blokir dibuka.
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Error"
  /reports:
    get:
      tags:
        - Moderation
      operationId: listMyReports
      summary: Laporan dan banding yang saya kirim beserta statusnya (AC F12-2).
      description: |
        Hanya laporan dengan reporter = pemanggil, terbaru dulu. Status dan hasil hanya terlihat oleh pelapor
        (AC F12-2); bukti dan identitas pengurus tidak dikirim. Tersedia untuk semua status anggota (riwayat sendiri).
      x-kapdh-access:
        audience: mobile
        member_access: any
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Halaman laporan milik sendiri.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModerationReportPage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        default:
          $ref: "#/components/responses/Error"
    post:
      tags:
        - Moderation
      operationId: createReport
      summary: Laporkan pengguna, pesan, atau grup yang dapat diakses pelapor (AC F12-2, PRD 3.12).
      description: |
        Hanya anggota aktif. `target_type` menentukan field wajib (field lain tidak boleh diisi, 400):
        - user: `target_user_id`, anggota lain yang terlihat di direktori bagi pelapor atau pernah berada di room yang
          sama (keduanya pernah bergabung; undangan yang dibatalkan sebelum diterima tidak dihitung); selain itu 404.
          Bukti: snapshot profil publik minimum (nama, bio, avatar).
        - message: `message_id`, pesan orang lain di room tempat pelapor anggota joined dan terlihat baginya; selain
          itu 404. `context_message_ids` (maksimal 5, room sama, terlihat bagi pelapor) boleh ditambahkan sebagai
          konteks. Bukti: snapshot pesan (isi, gambar, pengirim, waktu) sehingga tetap tersedia walaupun pesan
          kemudian dihapus. Pengirim pesan menjadi pihak terlapor.
        - room: `room_id`, grup tempat pelapor anggota joined; room direct -> 400 (laporkan pengguna/pesannya).
          Bukti: nama, avatar (rujukan berkas avatar saat itu) dan jumlah anggota grup.
        Berkas yang dirujuk bukti (gambar pesan, avatar profil/grup) ditahan selama laporan disimpan walaupun pesan
        dihapus atau avatar diganti; hanya dihapus sesuai retensi D2.
        Melaporkan diri sendiri -> 400 (gunakan POST /appeals untuk banding).

        Prioritas dan target penanganan dihitung server (v3.2, keputusan PP K5): violence_threat dan sexual = urgent,
        due_at 24 jam; kategori lain normal, due_at 2 hari kerja (Senin-Jumat WIB). Bila pelapor masih memiliki
        laporan aktif (open/in_review) atas target yang sama, laporan itu dikembalikan (200) tanpa membuat laporan
        baru. Pihak terlapor tidak diberi tahu (AC F12-2). Idempotency-Key mengembalikan hasil pertama saat diulang;
        laju pelaporan dibatasi (429).
      x-kapdh-access:
        audience: mobile
        member_access: active
        idempotent: true
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateModerationReportRequest"
      responses:
        "200":
          description: Laporan aktif yang sama dari pelapor ini sudah ada dan dikembalikan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModerationReport"
        "201":
          description: Laporan tercatat.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModerationReport"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Error"
  /reports/{reportId}:
    get:
      tags:
        - Moderation
      operationId: getMyReport
      summary: Detail status laporan atau banding milik sendiri (AC F12-2).
      description: |
        Hanya pelapor; laporan milik orang lain -> 404 tanpa membedakan alasan (N-09). Tanpa bukti dan tanpa
        identitas pengurus. `decision_message` hanya terisi untuk banding (pesan pengurus kepada pemohon).
      x-kapdh-access:
        audience: mobile
        member_access: any
      parameters:
        - $ref: "#/components/parameters/ModerationReportId"
      responses:
        "200":
          description: Laporan milik sendiri.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModerationReport"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        default:
          $ref: "#/components/responses/Error"
  /appeals:
    post:
      tags:
        - Moderation
      operationId: createAppeal
      summary: Ajukan banding atas suspend yang sedang berlaku dari portal pembatasan (PRD 3.12 mekanisme banding).
      description: |
        Banding dicatat sebagai laporan berkategori `appeal` dengan target_type user dan target = pemohon sendiri,
        sehingga masuk antrean moderasi yang sama (prioritas normal, due_at 2 hari kerja). Dipanggil dari portal
        pembatasan aplikasi (PRD 2.2), sehingga tersedia walaupun pemohon suspended (member_access: any).

        Yang dapat dibanding di R1.0 hanya suspend yang SEDANG berlaku (alumni.suspended_at terisi, dari jalur
        mana pun: keputusan laporan atau menu anggota admin); selain itu 403 FORBIDDEN. Warn tidak dapat dibanding
        lewat endpoint ini karena tidak membatasi akses maupun mengubah tanggal keanggotaan (AC F12-3); keberatan
        atas peringatan disampaikan lewat kontak dukungan. Keputusan yang dibanding tidak dipilih klien: server
        menyimpan snapshot suspend yang berlaku (membership_events suspend terbaru, suspended_at, suspension_message)
        di bukti banding sehingga pengurus tahu persis keputusan mana yang dibanding.

        Satu banding aktif per pemohon. Transaksi mengunci baris alumni pemohon lebih dulu (SELECT ... FOR UPDATE,
        kunci yang sama dengan jalur suspend/unsuspend) sehingga pengajuan paralel dan pencabutan suspend
        berurutan. Bila masih ada banding open/in_review atas suspend yang SAMA (snapshot suspended_at = suspended_at
        yang berlaku), banding itu dikembalikan (200) tanpa membuat yang baru. Banding hanya dapat diputus dismiss
        (ditolak, outcome no_action) atau unsuspend (dikabulkan, outcome action_taken).

        Setiap jalur unsuspend menutup banding aktif pemohon sebagai dikabulkan dalam transaksi pencabutan itu
        (ketergantungan lintas domain, lihat POST /admin/reports/{reportId}/resolve). Jaring pengaman bila jalur itu
        terlewat: banding aktif yang usang (suspend yang dibandingnya sudah dicabut, lalu pemohon disuspend lagi
        dengan suspended_at berbeda) tidak pernah dikembalikan; dalam transaksi yang sama banding usang ditutup
        sebagai dikabulkan (status resolved, action unsuspend, outcome action_taken, tanpa perubahan keanggotaan)
        dan banding baru untuk suspend yang berlaku dibuat (201). Setelah banding ditolak, banding baru boleh
        diajukan (dibatasi laju). Hasil dikirim lewat notifikasi kategori account dan tampil di
        GET /reports/{reportId} (`outcome`, `decision_message`). Idempotency-Key mengembalikan hasil pertama saat
        diulang; laju dibatasi (429).
      x-kapdh-access:
        audience: mobile
        member_access: any
        idempotent: true
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAppealRequest"
      responses:
        "200":
          description: Banding aktif sudah ada dan dikembalikan.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModerationReport"
        "201":
          description: Banding tercatat.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModerationReport"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Error"
  /directory:
    get:
      tags:
        - Network
      operationId: searchDirectory
      summary: Cari dan filter direktori anggota aktif dengan paging keyset (F-10, AC F10-1, F10-3).
      description: |
        Hanya untuk anggota aktif (verified/expiring, tidak suspended). Hasil hanya memuat anggota yang memenuhi
        aturan tampil direktori pada saat request (status terkini, bukan cache): users.status=active,
        effective_status verified/expiring, tidak suspended, dan show_in_directory=true. Pemanggil sendiri dan
        anggota yang memblokir pemanggil tidak ikut hasil.

        Pencarian `q` mencocokkan nama (tanpa membedakan huruf besar/kecil, sebagian kata). Filter angkatan, kelas,
        kota, profesi dan keahlian digabung dengan AND; profesi/keahlian memakai ID master terkontrol dari
        GET /masters/{kind}. Filter profesi cocok bila SALAH SATU profesi anggota tertaut master itu (profesi boleh
        lebih dari satu; ketikan sendiri tidak tertaut master). Master yang sudah nonaktif tetap dapat dipakai
        sebagai filter agar anggota dengan label historis tetap dapat ditemukan (AC F10-4).

        Paging keyset stabil tanpa duplikasi antarhalaman (AC F10-1): urutan `name_asc` = (nama, user_id),
        `cohort_desc` = (angkatan menurun, nama, user_id). `total` dihitung dengan filter yang sama. Bawaan 30,
        maksimum 100 per halaman. Request dibatasi laju untuk mencegah scraping (429 RATE_LIMITED).

        Kartu hasil hanya memuat field kartu guideline p7 (avatar, nama, profesi, kota, pendidikan teratas, keahlian,
        kode angkatan); kontak (email, telepon, sosial) tidak pernah ada di hasil pencarian (AC F10-2).
      x-kapdh-access:
        audience: mobile
        member_access: active
      parameters:
        - name: q
          in: query
          required: false
          description: Kata kunci nama anggota (minimal 2 karakter setelah dipangkas).
          schema:
            type: string
            minLength: 2
            maxLength: 100
        - name: cohort
          in: query
          required: false
          description: Angkatan (AA pada nomor anggota, PRD 3.5).
          schema:
            type: integer
            minimum: 1
            maximum: 99
        - name: class_level
          in: query
          required: false
          description: |
            Kelas yang pernah ditempuh (1-3 = 1-3 MTs, 4-6 = 1-3 Aliyah); cocok bila
            class_in <= class_level <= class_out.
          schema:
            $ref: "#/components/schemas/ClassLevel"
        - name: city
          in: query
          required: false
          description: Kota domisili; cocok persis tanpa membedakan huruf besar/kecil.
          schema:
            type: string
            minLength: 1
            maxLength: 80
        - name: profession_id
          in: query
          required: false
          description: ID master profesi (master_professions).
          schema:
            type: string
            format: uuid
        - name: skill_id
          in: query
          required: false
          description: ID master keahlian (master_skills).
          schema:
            type: string
            format: uuid
        - name: sort
          in: query
          required: false
          description: Urutan hasil; bawaan name_asc.
          schema:
            $ref: "#/components/schemas/DirectorySort"
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Halaman direktori beserta total sesuai filter.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectoryPage"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Error"
  /directory/{userId}:
    get:
      tags:
        - Network
      operationId: getMemberProfile
      summary: Profil anggota lain yang menghormati flag privasi (F-10, AC F10-2, F10-4).
      description: |
        Hanya untuk anggota aktif. Profil hanya tersedia bila anggota tersebut memenuhi aturan tampil direktori
        (lihat GET /directory) dan tidak memblokir pemanggil; selain itu 404 NOT_FOUND tanpa membedakan alasan
        (N-09). Pemanggil boleh membuka profilnya sendiri (is_me=true) untuk pratinjau tampilan publik, termasuk
        saat show_in_directory=false.

        Privasi (AC F10-2, N-15): `email` hanya dikirim bila show_email=true, `phone` hanya bila show_phone=true,
        `social` dan `social_links` hanya bila show_social=true. Bila flag mati, kuncinya tidak ada di payload. Data
        administratif (nomor anggota, masa aktif, alasan suspend, kelas masuk/keluar) tidak pernah dikirim; pengurus
        berizin membacanya lewat API admin yang diaudit.

        Master profesi/keahlian yang sudah dinonaktifkan tetap ditampilkan sebagai label historis dengan
        active=false (AC F10-4). `can_message` false bila salah satu pihak memblokir, atau profil milik sendiri;
        alasan tidak dibedakan. `direct_room_id` berisi room direct yang sudah ada antara keduanya (bila ada) agar
        tombol "Kirim Pesan" langsung membuka percakapan; bila null, klien memanggil POST /chat/direct.
      x-kapdh-access:
        audience: mobile
        member_access: active
      parameters:
        - $ref: "#/components/parameters/NetworkUserId"
      responses:
        "200":
          description: Profil anggota sesuai privasi pemiliknya.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NetworkMemberProfile"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        default:
          $ref: "#/components/responses/Error"
  /notifications:
    get:
      tags:
        - Notifications
      operationId: listNotifications
      summary: Kotak masuk notifikasi sendiri, riwayat resmi (F-13, AC F13-2).
      description: |
        Kotak masuk in-app adalah riwayat resmi dan selalu ditulis, apa pun preferensi push/email atau izin push OS
        (F-13, AC F13-2). Urutan terbaru dahulu dengan keyset (created_at, id) menurun (indeks
        notifications_user_id_created_at_id_idx, PRD 6.5). Hanya notifikasi milik pemanggil yang dikembalikan.
        `unread_count` dihitung atas seluruh kotak masuk (tidak dipengaruhi filter) untuk lencana lonceng.
        Cursor terikat pada filter; cursor tidak valid atau dari filter lain menghasilkan 400 VALIDATION_ERROR.
      x-kapdh-access:
        audience: mobile
        member_access: any
      parameters:
        - name: unread_only
          in: query
          required: false
          description: True untuk hanya menampilkan notifikasi yang belum dibaca.
          schema:
