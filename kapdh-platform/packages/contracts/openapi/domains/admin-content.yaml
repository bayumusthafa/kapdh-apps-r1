        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: VERSION_CONFLICT (`current`) atau VALIDATION_ERROR (kategori masih dipakai).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
