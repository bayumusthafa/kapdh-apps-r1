              schema: { $ref: "#/components/schemas/AdminContentCategoryPage" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        default: { $ref: "#/components/responses/Error" }
    post:
      tags: [Admin Content]
      operationId: adminCreateEventCategory
      summary: Buat kategori event (guideline p14 "Manajemen Kategori", izin events.manage).
      description: |
        Kategori dibuat dengan `kind = event`. `slug` kosong dibangkitkan dari label. Slug unik per jenis; sudah
