  /admin/content/media:
    post:
      tags: [Admin Content]
      operationId: adminUploadContentMedia
      summary: Unggah gambar cover berita atau banner (N-10, PRD 2.5).
      description: |
        JPG/PNG <= 5 MB; magic bytes diperiksa, dimensi/decompression berlebihan ditolak, EXIF dibuang dan gambar
        di-encode ulang (N-10). Berkas berpurpose `post_cover`/`banner_image` bervisibilitas publik karena tampil di
        aplikasi; tidak boleh berisi data pribadi. Berkas yang tidak dilampirkan ke berita/banner dalam 24 jam
        dihapus job `files.cleanup-temp` (PRD 2.5). Batas 10 unggahan berhasil per purpose per admin per 24 jam
        bergulir (N-10) -> 429 RATE_LIMITED.
      x-kapdh-access: { audience: admin, permissions: [content.manage] }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/AdminContentMediaUploadRequest" }
      responses:
        "201":
          description: Gambar diterima dan diproses.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContentMedia" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "413": { $ref: "#/components/responses/FileInvalid" }
        "415": { $ref: "#/components/responses/FileInvalid" }
        "422": { $ref: "#/components/responses/FileInvalid" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }

components:
  parameters:
    ContentPostId:
      name: postId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ContentBannerId:
      name: bannerId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ContentPageId:
      name: pageId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ContentCategoryId:
      name: categoryId
      in: path
      required: true
      schema: { type: string, format: uuid }

  schemas:
    AdminContentActor:
      type: object
      description: Pengurus pelaku (nama tampilan saja; tanpa email/kontak).
      required: [admin_id, display_name]
      properties:
        admin_id: { type: string, format: uuid }
        display_name: { type: string }

    ContentImage:
      type: object
      description: Gambar konten publik yang sudah diproses server (N-10).
      required: [file_id, url]
      properties:
        file_id: { type: string, format: uuid }
        url: { type: string, format: uri }

    AdminPostState:
      type: string
      enum: [draft, scheduled, published, archived]
      description: |
        Keadaan berita untuk pengurus (F-08), diturunkan server dari kolom status dan published_at (tidak
        disimpan): `draft` = status draft; `scheduled` = status published dengan `published_at > now` (belum
        tampil, AC F08-1); `published` = status published dengan `published_at <= now` (tampil di feed);
        `archived` = status archived, tidak tampil dan tidak pernah dihidupkan kembali oleh job (AC F15-5).
        Transisi: draft -> scheduled|published (publish; draft yang pernah tampil hanya -> published),
        scheduled -> scheduled|published (publish ulang), scheduled -> draft (unschedule, published_at
        dikosongkan), scheduled -> published (waktu tiba), draft|scheduled|published -> archived (archive;
        published_at berita terjadwal dikosongkan), archived -> draft (restore). Hapus hanya draft atau archived.

    AdminPostSort:
      type: string
      enum: [updated_at_desc, published_at_desc, created_at_desc, title_asc]
      description: Urutan tabel berita; bawaan `updated_at_desc`.

    AdminPostSummary:
      type: object
      required:
        [id, slug, title, state, category, cover, published_at, like_count, version, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        title: { type: string }
        state: { $ref: "#/components/schemas/AdminPostState" }
        category:
          oneOf:
            - $ref: "#/components/schemas/ContentCategoryRef"
            - type: "null"
        cover:
          oneOf:
            - $ref: "#/components/schemas/ContentImage"
            - type: "null"
        published_at:
          type: [string, "null"]
          format: date-time
          description: |
            Waktu terbit (kolom "Tgl Publikasi"). `scheduled`: waktu terjadwal di masa depan. `published`: waktu
            tayang pertama. `draft`/`archived`: waktu tayang pertama bila berita pernah tampil (selalu <= now),
            null bila belum pernah tampil; jadwal yang dibatalkan atau diarsipkan sebelum tiba tidak disimpan.
        like_count: { type: integer, minimum: 0 }
        version: { type: string, description: Versi untuk If-Match (AC F15-4). }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AdminPost:
      allOf:
        - $ref: "#/components/schemas/AdminPostSummary"
        - type: object
          required: [excerpt, body_html, announced_at, slug_locked, author]
          properties:
            excerpt: { type: [string, "null"] }
            body_html: { type: string, description: HTML yang sudah disanitasi server (PRD 3.8). }
            announced_at:
              type: [string, "null"]
              format: date-time
              description: Waktu notifikasi berita dibuat job content.announce; terisi sekali (AC F15-5).
            slug_locked:
              type: boolean
              description: |
                True bila berita pernah tampil ke anggota, diturunkan sebagai `published_at IS NOT NULL AND
                published_at <= now` (invarian waktu terbit pada publish/unschedule/archive); slug tidak dapat
                diubah lagi agar tautan `/news/{slug}` di notifikasi dan banner tetap berlaku.
            author:
              oneOf:
                - $ref: "#/components/schemas/AdminContentActor"
                - type: "null"

    AdminPostPage:
      type: object
      required: [items, next_cursor, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AdminPostSummary" }
        next_cursor: { type: [string, "null"] }
        total: { type: integer, minimum: 0 }

    AdminPostCreateRequest:
      type: object
      required: [title, body_html]
      properties:
        title: { type: string, minLength: 1, maxLength: 200, description: Judul; spasi di tepi dipangkas. }
        slug:
          type: string
          minLength: 1
          maxLength: 160
          pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
          description: Opsional; kosong = dibangkitkan dari judul dan dibuat unik.
        excerpt: { type: [string, "null"], maxLength: 300 }
        body_html:
          type: string
          minLength: 1
          maxLength: 200000
          description: HTML dari editor; disanitasi server sebelum disimpan (PRD 3.8). Kosong setelah sanitasi ditolak.
        cover_file_id:
          type: [string, "null"]
          format: uuid
          description: Berkas purpose `post_cover` dari POST /admin/content/media.
        category_id:
          type: [string, "null"]
          format: uuid
          description: Kategori `post` yang aktif.

    AdminPostUpdateRequest:
      type: object
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        slug:
          type: string
          minLength: 1
          maxLength: 160
          pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
          description: Hanya bila `slug_locked = false`.
        excerpt: { type: [string, "null"], maxLength: 300 }
        body_html: { type: string, minLength: 1, maxLength: 200000 }
        cover_file_id: { type: [string, "null"], format: uuid }
        category_id:
          type: [string, "null"]
          format: uuid
          description: Kategori `post`; kategori nonaktif hanya boleh dipertahankan, tidak dipilih baru.

    AdminPostPublishRequest:
      type: object
      properties:
        published_at:
          type: [string, "null"]
          format: date-time
          description: |
            Kosong/null = terbit sekarang (waktu server); masa depan = terjadwal; lampau ditolak (400). Berita yang
            pernah tampil (draft hasil restore dengan `slug_locked = true`) hanya menerima null dan kembali tampil
            dengan Tgl Publikasi aslinya; masa depan -> 409 VALIDATION_ERROR.

    AdminBannerState:
      type: string
      enum: [inactive, scheduled, live, ended]
      description: |
        Keadaan tayang turunan server: `inactive` (`active = false`), `scheduled` (`starts_at > now`), `live` (di
        dalam jendela dan aktif; tampil di Beranda), `ended` (`ends_at <= now`, tidak tampil, AC F08-2).

    AdminBannerSort:
      type: string
      enum: [sort_order_asc, starts_at_desc, updated_at_desc, title_asc]
      description: |
        Urutan tabel banner; bawaan `sort_order_asc` (urutan tampil Beranda: `sort_order` naik lalu `starts_at`
        turun). `starts_at_desc` mengikuti kolom "Tgl Publikasi".

    AdminBannerTarget:
      type: object
      required: [type, value, available, label, route, category]
      properties:
        type: { $ref: "#/components/schemas/BannerTargetType" }
        value:
          type: [string, "null"]
          description: id berita/event, slug halaman, atau URL https; null untuk `none`.
        available:
          type: boolean
          description: Tujuan dapat dibuka anggota saat ini (AC F08-2); selalu true untuk `none` dan `url`.
        label:
          type: [string, "null"]
          description: Judul berita/event/halaman tujuan untuk tabel pengurus; null bila tidak ada atau `none`/`url`.
        route:
          type: [string, "null"]
          description: |
            Rute aplikasi yang akan dibuka anggota (`/news/{slug}`, `/events/{id}`, `/legal/{slug}`); null untuk
            `none`/`url` dan bila tujuan tidak tersedia (sama dengan `HomeBannerTarget.route`).
        category:
          description: |
            Kategori berita/event tujuan, untuk kolom "Kategori" tabel banner (guideline p13); banner tidak memiliki
            kategori sendiri di R1.0. Null untuk `none`, `page`, `url`, tujuan yang sudah dihapus, atau tujuan tanpa
            kategori. Label historis tetap dikirim walau kategori nonaktif.
          oneOf:
            - $ref: "#/components/schemas/ContentCategoryRef"
            - type: "null"

    AdminBanner:
      type: object
      required:
        - id
        - title
        - image
        - target
        - sort_order
        - starts_at
        - ends_at
        - active
        - state
        - version
        - created_at
        - updated_at
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        image: { $ref: "#/components/schemas/ContentImage" }
        target: { $ref: "#/components/schemas/AdminBannerTarget" }
        sort_order: { type: integer, description: Urutan tampil naik. }
        starts_at: { type: string, format: date-time }
        ends_at: { type: [string, "null"], format: date-time, description: Null = tanpa batas akhir. }
        active: { type: boolean }
        state: { $ref: "#/components/schemas/AdminBannerState" }
        version: { type: string, description: Versi untuk If-Match (AC F15-4). }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AdminBannerPage:
      type: object
      required: [items, next_cursor, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AdminBanner" }
        next_cursor: { type: [string, "null"] }
        total: { type: integer, minimum: 0 }

    AdminBannerCreateRequest:
      type: object
      required: [title, image_file_id, target_type, target_value, starts_at]
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        image_file_id:
          type: string
          format: uuid
          description: Berkas purpose `banner_image` dari POST /admin/content/media.
        target_type: { $ref: "#/components/schemas/BannerTargetType" }
        target_value:
          type: [string, "null"]
          maxLength: 2048
          description: Null untuk `none`; id berita/event (uuid); slug halaman; URL https untuk `url`.
        sort_order: { type: integer, minimum: 0, maximum: 32767, default: 0 }
        starts_at: { type: string, format: date-time }
        ends_at:
          type: [string, "null"]
          format: date-time
          description: Harus setelah starts_at; null = tanpa batas.
        active: { type: boolean, default: true }

    AdminBannerUpdateRequest:
      type: object
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 120 }
        image_file_id: { type: string, format: uuid }
        target_type: { $ref: "#/components/schemas/BannerTargetType" }
        target_value:
          { type: [string, "null"], maxLength: 2048, description: Wajib dikirim bersama target_type. }
        sort_order: { type: integer, minimum: 0, maximum: 32767 }
        starts_at: { type: string, format: date-time }
        ends_at: { type: [string, "null"], format: date-time }
        active: { type: boolean }

    AdminInfoPageSort:
      type: string
      enum: [system_first, title_asc, updated_at_desc, published_at_desc]
      description: |
        Urutan tabel halaman; bawaan `system_first` (halaman baku menurut urutan seed, lalu judul).
        `published_at_desc` menempatkan halaman yang belum pernah terbit di akhir.

    AdminInfoPagePublished:
      type: object
      description: Salinan TAYANG halaman (yang dibaca publik dan disetujui pengguna, PRD 6.2).
      required: [title, body_html, version, published_at]
      properties:
        title: { type: string }
        body_html: { type: string }
        version: { type: string, description: "Versi legal tayang (published_version), mulai 1." }
        published_at: { type: string, format: date-time }

    AdminInfoPageSummary:
      type: object
      required:
        - id
        - slug
        - title
        - legal_document
        - system
        - published_version
        - published_at
        - has_unpublished_changes
        - version
        - updated_at
        - updated_by
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        title: { type: string, description: Judul draf kerja. }
        legal_document:
          oneOf:
            - $ref: "#/components/schemas/PageLegalDocument"
            - type: "null"
        system:
          type: boolean
          description: Halaman baku dari seed referensi (PRD 8.2); tidak dapat dihapus dan slug terkunci.
        published_version:
          { type: [string, "null"], description: Versi tayang; null bila belum pernah terbit. }
        published_at: { type: [string, "null"], format: date-time }
        has_unpublished_changes:
          type: boolean
          description: Draf berbeda dari salinan tayang (atau belum pernah terbit).
        version:
          { type: string, description: Versi draf untuk If-Match (AC F15-4); berbeda dari versi legal. }
        updated_at: { type: string, format: date-time }
        updated_by:
          oneOf:
            - $ref: "#/components/schemas/AdminContentActor"
            - type: "null"

    AdminInfoPage:
      allOf:
        - $ref: "#/components/schemas/AdminInfoPageSummary"
        - type: object
          required: [body_html, published, slug_locked, created_at]
          properties:
            body_html: { type: string, description: Draf kerja yang sudah disanitasi server. }
            published:
              oneOf:
                - $ref: "#/components/schemas/AdminInfoPagePublished"
                - type: "null"
            slug_locked:
              type: boolean
              description: True untuk halaman baku atau halaman yang pernah terbit.
            created_at: { type: string, format: date-time }

    AdminInfoPageList:
      type: object
      description: Daftar halaman admin ({items, next_cursor, total}); nama tidak memakai akhiran Page agar tidak rancu.
      required: [items, next_cursor, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AdminInfoPageSummary" }
        next_cursor: { type: [string, "null"] }
        total: { type: integer, minimum: 0 }

    AdminInfoPageCreateRequest:
      type: object
      required: [slug, title, body_html]
      properties:
        slug: { type: string, minLength: 1, maxLength: 120, pattern: "^[a-z0-9]+(-[a-z0-9]+)*$" }
        title: { type: string, minLength: 1, maxLength: 200 }
        body_html:
          { type: string, minLength: 1, maxLength: 200000, description: Disanitasi server (PRD 3.8). }

    AdminInfoPageUpdateRequest:
      type: object
      minProperties: 1
      properties:
        slug:
          type: string
          minLength: 1
          maxLength: 120
          pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
          description: Hanya bila `slug_locked = false`.
        title: { type: string, minLength: 1, maxLength: 200 }
        body_html: { type: string, minLength: 1, maxLength: 200000 }

    AdminInfoPagePublishRequest:
      type: object
      properties:
        change_note:
          type: [string, "null"]
          maxLength: 500
          description: Ringkasan perubahan untuk audit `page.published` (F-17); tidak ditampilkan publik.

    AdminContentCategorySort:
      type: string
      enum: [sort_order_asc, label_asc, usage_desc, updated_at_desc]
      description: Urutan tabel kategori; bawaan `sort_order_asc` (lalu `label`), sama dengan urutan tab anggota.

    AdminContentCategory:
      type: object
      description: |
        Kategori untuk tabel "Manajemen Kategori" (berita: guideline p13, izin content.manage; event: guideline
        p14, izin events.manage).
      required: [id, kind, slug, label, sort_order, active, usage_count, version, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/ContentCategoryKind" }
        slug: { type: string }
        label: { type: string }
        sort_order: { type: integer }
        active: { type: boolean }
        usage_count:
          type: integer
          minimum: 0
          description: |
            Jumlah berita (semua keadaan, untuk `post`) atau event (semua status, untuk `event`) yang memakai
            kategori; lebih dari 0 berarti kategori tidak dapat dihapus, hanya dinonaktifkan.
        version: { type: string, description: Versi untuk If-Match (AC F15-4). }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AdminContentCategoryPage:
      type: object
      required: [items, next_cursor, total]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AdminContentCategory" }
        next_cursor: { type: [string, "null"] }
        total: { type: integer, minimum: 0 }

    AdminContentCategoryCreateRequest:
      type: object
      description: Jenis kategori ditentukan path (post-categories atau event-categories), bukan body.
      required: [label]
      properties:
        label: { type: string, minLength: 1, maxLength: 80 }
        slug:
          type: string
          minLength: 1
          maxLength: 80
          pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
          description: Opsional; kosong = dibangkitkan dari label. Unik per jenis.
        sort_order: { type: integer, minimum: 0, maximum: 32767, default: 0 }
        active: { type: boolean, default: true }

    AdminContentCategoryUpdateRequest:
      type: object
      minProperties: 1
      properties:
        label: { type: string, minLength: 1, maxLength: 80 }
        slug: { type: string, minLength: 1, maxLength: 80, pattern: "^[a-z0-9]+(-[a-z0-9]+)*$" }
        sort_order: { type: integer, minimum: 0, maximum: 32767 }
        active: { type: boolean }

    ContentMediaPurpose:
      type: string
      enum: [post_cover, banner_image]
      description: Purpose berkas gambar konten (files.purpose); menentukan tempat berkas boleh dilampirkan.

    AdminContentMediaUploadRequest:
      type: object
      required: [purpose, file]
      properties:
        purpose: { $ref: "#/components/schemas/ContentMediaPurpose" }
        file: { type: string, format: binary, description: Gambar JPG/PNG maksimal 5 MB (N-10). }

    ContentMedia:
      type: object
      required: [file_id, purpose, url, mime, bytes, width, height]
      properties:
        file_id: { type: string, format: uuid }
        purpose: { $ref: "#/components/schemas/ContentMediaPurpose" }
        url: { type: string, format: uri, description: URL publik gambar hasil proses untuk pratinjau. }
        mime: { type: string, examples: [image/jpeg] }
        bytes: { type: integer, minimum: 0 }
        width: { type: integer, minimum: 1 }
        height: { type: integer, minimum: 1 }
