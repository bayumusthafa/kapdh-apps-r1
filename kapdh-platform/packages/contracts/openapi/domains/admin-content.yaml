      x-kapdh-access: { audience: admin, permissions: [events.manage] }
      parameters:
        - $ref: "#/components/parameters/ContentCategoryId"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminContentCategoryUpdateRequest" }
      responses:
        "200":
          description: Kategori event diperbarui.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminContentCategory" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: VERSION_CONFLICT (`current`) atau VALIDATION_ERROR (slug sudah dipakai).
