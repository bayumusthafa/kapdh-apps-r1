# Domain notifications (C7 Admin & notifications): kotak masuk in-app, rute deep link per kategori, preferensi kanal
# dan token perangkat FCM (F-13). Modul API: apps/api/src/modules/notifications.
#
# Akses (ARCHITECTURE §3.1, §4.3): seluruh operasi memakai audience mobile dengan member_access `any`, sehingga anggota
# unverified, expired dan suspended tetap dapat membuka kotak masuk (AC F13-2, PRD 2.2). Admin tidak memiliki kotak
# masuk; status pengiriman untuk pengurus ada di domain admin-notifications.
tags:
  - name: Notifications
    description: Kotak masuk resmi, deep link, preferensi push/email dan token perangkat (F-13, AC F13-1..F13-5).

paths:
  /notifications:
    get:
      tags: [Notifications]
      operationId: listNotifications
      summary: Kotak masuk notifikasi sendiri, riwayat resmi (F-13, AC F13-2).
      description: |
        Kotak masuk in-app adalah riwayat resmi dan selalu ditulis, apa pun preferensi push/email atau izin push OS
        (F-13, AC F13-2). Urutan terbaru dahulu dengan keyset (created_at, id) menurun (indeks
        notifications_user_id_created_at_id_idx, PRD 6.5). Hanya notifikasi milik pemanggil yang dikembalikan.
        `unread_count` dihitung atas seluruh kotak masuk (tidak dipengaruhi filter) untuk lencana lonceng.
        Cursor terikat pada filter; cursor tidak valid atau dari filter lain menghasilkan 400 VALIDATION_ERROR.
      x-kapdh-access: { audience: mobile, member_access: any }
      parameters:
        - name: unread_only
          in: query
          required: false
          description: True untuk hanya menampilkan notifikasi yang belum dibaca.
          schema: { type: boolean, default: false }
        - name: category
          in: query
          required: false
          description: Saring per kategori.
          schema: { $ref: "#/components/schemas/NotificationCategory" }
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Halaman kotak masuk.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationPage" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        default: { $ref: "#/components/responses/Error" }

  /notifications/unread-count:
    get:
      tags: [Notifications]
      operationId: getNotificationUnreadCount
      summary: Jumlah notifikasi belum dibaca untuk lencana lonceng (F-13).
      description: |
        Bacaan ringan untuk lencana di Beranda tanpa memuat halaman kotak masuk. Event realtime
        `notification.created` membawa jumlah terbaru; endpoint ini dipakai saat aplikasi kembali ke foreground atau
        setelah reconnect (ARCHITECTURE §4.9).
      x-kapdh-access: { audience: mobile, member_access: any }
      responses:
        "200":
          description: Jumlah belum dibaca.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationUnreadCount" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        default: { $ref: "#/components/responses/Error" }

  /notifications/{notificationId}:
    get:
      tags: [Notifications]
      operationId: getNotification
      summary: Satu notifikasi milik sendiri, dipakai sebelum membuka deep link dari push (AC F13-3, F13-5).
      description: |
        Saat push diketuk, aplikasi memanggil endpoint ini dengan `notification_id` dari payload push sebelum membuka
        objek tujuan. Sesi yang sudah logout ditolak 401, dan notifikasi milik akun lain (berganti akun) menghasilkan
        404 NOT_FOUND tanpa membedakan tidak ada atau bukan milik (AC F13-3, F13-5, N-09). Rute tujuan tetap
        diperiksa ulang oleh endpoint objeknya (misalnya pembayaran milik sendiri), jadi rute bukan izin akses.
        Endpoint ini tidak menandai dibaca; panggil POST /notifications/read. `notificationId` yang bukan UUID
        menghasilkan 400 VALIDATION_ERROR.
      x-kapdh-access: { audience: mobile, member_access: any }
      parameters:
        - $ref: "#/components/parameters/NotificationId"
      responses:
        "200":
          description: Notifikasi.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InboxNotification" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Error" }

  /notifications/read:
    post:
      tags: [Notifications]
      operationId: markNotificationsRead
      summary: Tandai notifikasi tertentu atau semua sebagai dibaca (F-13).
      description: |
        Isi tepat salah satu: `ids` (1..100 id) atau `all: true`. Dengan `all`, `up_to` opsional membatasi pada
        notifikasi dengan created_at <= up_to, sehingga notifikasi yang datang setelah layar dimuat tidak ikut
        ditandai. Id yang tidak ada atau milik akun lain diabaikan tanpa galat (N-09). Operasi idempoten secara
        alami: read_at yang sudah terisi tidak diubah. Kombinasi tidak valid menghasilkan 400 VALIDATION_ERROR.
      x-kapdh-access: { audience: mobile, member_access: any }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MarkNotificationsReadRequest" }
      responses:
        "200":
          description: Jumlah yang baru ditandai dan sisa belum dibaca.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MarkNotificationsReadResult" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "426": { $ref: "#/components/responses/UpgradeRequired" }
        "503": { $ref: "#/components/responses/Maintenance" }
        default: { $ref: "#/components/responses/Error" }

  /notifications/preferences:
    get:
      tags: [Notifications]
      operationId: getNotificationPreferences
      summary: Preferensi kategori push dan email (F-13, AC F13-2).
      description: |
        Baris preferensi yang tidak ada berarti aktif (default). Kategori security dan account wajib dan selalu
        dikirim; keduanya dilaporkan di `mandatory_categories` dan tidak memiliki saklar (ARCHITECTURE §4.7).
      x-kapdh-access: { audience: mobile, member_access: any }
      responses:
        "200":
          description: Preferensi efektif.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationPreferences" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        default: { $ref: "#/components/responses/Error" }
    put:
      tags: [Notifications]
      operationId: updateNotificationPreferences
      summary: Simpan seluruh preferensi push dan email; security dan account tidak dapat dimatikan (F-13).
      description: |
        Mengganti seluruh preferensi (semua saklar wajib dikirim). Mematikan kategori hanya menghentikan push/email
        berikutnya; kotak masuk in-app tetap ditulis dan riwayat keputusan tetap terlihat (F-13, AC F13-2).
        Pengiriman yang sudah dijadwalkan untuk kategori yang dimatikan dibatalkan worker sebelum dikirim
        (status cancelled). Push untuk security/account dan email OTP tidak dipengaruhi preferensi.
      x-kapdh-access: { audience: mobile, member_access: any }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationPreferencesUpdate" }
      responses:
        "200":
          description: Preferensi tersimpan.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationPreferences" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "426": { $ref: "#/components/responses/UpgradeRequired" }
        "503": { $ref: "#/components/responses/Maintenance" }
        default: { $ref: "#/components/responses/Error" }

  /devices:
    put:
      tags: [Notifications]
      operationId: registerDevice
      summary: Daftarkan atau perbarui token FCM perangkat untuk keluarga sesi saat ini (AC F13-4, F13-5).
      description: |
        Upsert berdasarkan token (device_tokens_token_key). Token diikat ke pengguna pemanggil dan ke KELUARGA sesi
        pemanggil (`sessions.family_id`), bukan ke satu baris sesi: rotasi refresh (AC F02-3) membuat baris
        sessions baru dalam keluarga yang sama setiap kali access token diperbarui (sekitar 15 menit) dan
        menandai baris lama `replaced_by`, sedangkan identitas sesi yang stabil adalah keluarganya (Session.id
        pada domain auth). device_tokens.session_id menunjuk baris keluarga yang terakhir diketahui; setiap
        pencocokan token dengan sesi selalu melalui `sessions.family_id`.

        Langkah dalam SATU transaksi:
        1. Baris sesi pemanggil (sid access token) dibaca untuk family_id. Baris sesi AKTIF keluarga itu dikunci
           (FOR NO KEY UPDATE, urutan kunci yang sama dengan logout/pencabutan sesi) sehingga pendaftaran yang
           bersamaan dengan logout berurutan: bila keluarga sudah dicabut, 401 UNAUTHENTICATED dan token tidak
           pernah aktif untuk sesi yang sudah keluar. Baris device_tokens untuk token ini
           dikunci (SELECT ... FOR UPDATE; bila belum ada, INSERT ... ON CONFLICT (token) DO NOTHING lalu dikunci).
        2. Token berpindah AKUN (device_tokens.user_id berbeda dari pemanggil, misalnya logout lalu masuk akun
           lain di perangkat yang sama): seluruh pengiriman `pending` pada token itu dibatalkan (status
           `cancelled`, error_class `token_reassigned`) SEBELUM token diikat ke pemanggil, sehingga judul dan isi
           notifikasi akun lama tidak pernah sampai ke akun baru (AC F13-5, N-09). Pengiriman `failed` akun lama
           tetap sebagai riwayat dan tidak dapat dikirim ulang ke perangkat ini (adminRetryNotificationDeliveries
           melewatinya dengan alasan `token_reassigned`).
        3. Pengguna yang SAMA, baik dalam keluarga sesi yang sama (setelah rotasi refresh atau token FCM
           diperbarui) maupun keluarga baru (masuk ulang tanpa logout, atau session_id kosong karena baris sesi lama
           dibersihkan): tidak ada pengiriman yang dibatalkan; pengiriman `pending` tetap dikirim ke perangkat
           pemiliknya sehingga tidak ada notifikasi yang hilang (AC F13-1).
        4. Token diikat: user_id = pemanggil, session_id = baris sesi pemanggil saat ini, platform, app_version;
           revoked_at, failure_class dan failure_count dikosongkan; last_seen_at diperbarui.
        5. Token lain milik pemanggil yang belum dicabut dan terikat ke baris mana pun dari keluarga sesi yang
           sama (token FCM lama perangkat ini yang telah diperbarui) dicabut. Pengiriman `pending`-nya dipindahkan
           ke token baru (UPDATE device_token_id) kecuali sudah ada pengiriman untuk notifikasi yang sama ke token
           baru (notification_deliveries_target_key); sisanya dibatalkan dengan error_class `token_revoked`. Push
           yang sudah dijadwalkan tidak hilang dan tidak terkirim ganda (AC F13-1).

        Sebagai pertahanan berlapis, worker hanya mengirim push bila pada saat klaim pengiriman (statement yang
        sama) device_tokens.revoked_at IS NULL DAN device_tokens.user_id = notifications.user_id; selain itu
        pengiriman dibatalkan tanpa dikirim. Predikat yang sama diperiksa ulang untuk SETIAP pengiriman tepat
        sebelum provider dipanggil (transaksi pendek: token dikunci FOR SHARE, lalu baris pengiriman FOR UPDATE
        dengan syarat masih `pending` dan attempt klaim yang sama), sehingga logout, unregister, perpindahan token
        atau preferensi yang commit setelah klaim tetapi sebelum giliran sebuah pengiriman selalu mencegah
        pengiriman itu. Yang dapat lolos hanya percobaan yang SUDAH berjalan di provider saat pencabutan commit
        (paling lama batas waktu satu percobaan, 60 detik); bila provider menerimanya, riwayat mencatatnya `sent`
        apa adanya. Predikat yang sama dipakai retry admin, jadi `token_reassigned` selalu berarti token kini
        milik AKUN lain.

        Pencabutan berbasis keluarga (AC F13-5): logout, logout-all, pencabutan sesi (DELETE
        /auth/sessions/{sessionId}), reuse refresh token yang mencabut keluarga, dan penghapusan akun mencabut
        setiap token yang session_id-nya menunjuk baris mana pun dari keluarga yang dicabut
        (`device_tokens.session_id IN (SELECT id FROM sessions WHERE family_id = ...)`) dalam transaksi
        pencabutan, dan membatalkan pengiriman `pending`-nya (error_class `token_revoked`). Agar ikatan tidak putus
        oleh pembersihan baris sesi lama (FK ON DELETE SET NULL), rotasi refresh memindahkan device_tokens.session_id
        dari baris lama ke baris baru dalam transaksi rotasi yang sama (modul auth), dan job pembersihan sesi
        mencabut token keluarga yang kedaluwarsa sebelum menghapus barisnya. Sesi yang berakhir tanpa logout (refresh
        kedaluwarsa) juga berarti keluar: job worker `notifications.device-sweep` (setiap jam) mencabut token yang
        keluarga sesinya tidak lagi memiliki baris aktif (belum dicabut dan belum kedaluwarsa) atau yang tidak terikat
        baris sesi mana pun, beserta pengiriman `pending`-nya (`token_revoked`); token yang diikat ulang ke sesi baru
        secara bersamaan tidak ikut dicabut. PUT /devices dari keluarga sesi yang sudah kedaluwarsa ditolak 401.
        Token tidak pernah dicatat di log atau audit (ARCHITECTURE §2) dan tidak pernah dikembalikan API.
      x-kapdh-access: { audience: mobile, member_access: any }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterDeviceRequest" }
      responses:
        "204": { description: Token terdaftar untuk sesi ini. }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "426": { $ref: "#/components/responses/UpgradeRequired" }
        "503": { $ref: "#/components/responses/Maintenance" }
        default: { $ref: "#/components/responses/Error" }

  /devices/unregister:
    post:
      tags: [Notifications]
      operationId: unregisterDevice
      summary: Cabut token FCM perangkat ini, misalnya sebelum logout atau saat izin push dicabut (AC F13-5).
      description: |
        Token dikirim di body, bukan di path, agar tidak tercatat di log akses. Hanya token milik pemanggil
        (device_tokens.user_id = pemanggil, keluarga sesi mana pun) yang dicabut (revoked_at diisi) dan, dalam
        transaksi yang sama, pengiriman `pending` pada token itu dibatalkan
        (`cancelled`, error_class `token_revoked`); token yang tidak dikenal atau milik akun lain diabaikan dengan
        respons yang sama (N-09). Pemanggilan berulang tetap 204. Logout tetap mencabut token sesi di server
        walaupun panggilan ini gagal karena jaringan (AC F13-5).
      x-kapdh-access: { audience: mobile, member_access: any }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UnregisterDeviceRequest" }
      responses:
        "204": { description: Token tidak lagi menerima notifikasi. }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "426": { $ref: "#/components/responses/UpgradeRequired" }
        "503": { $ref: "#/components/responses/Maintenance" }
        default: { $ref: "#/components/responses/Error" }

components:
  parameters:
    NotificationId:
      name: notificationId
      in: path
      required: true
      description: Id notifikasi (UUID v7), misalnya dari payload data push.
      schema: { type: string, format: uuid }

  schemas:
    NotificationCategory:
      type: string
      enum: [payment, membership, event, news, chat, security, account]
      description: |
        Kategori notifikasi (ARCHITECTURE §4.7, enum DB notification_category). Push dapat diatur untuk payment,
        membership, event, news, chat; email untuk payment, membership, event; security dan account wajib dan tidak
        dapat dimatikan (F-13).

    InboxNotification:
      type: object
      required: [id, category, title, body, deep_link, read_at, created_at]
      description: |
        Satu entri kotak masuk (F-13). Satu peristiwa menghasilkan tepat satu entri per pengguna karena dedup_key
        unik; retry pengiriman tidak menduplikasi kotak masuk (AC F13-1, F13-6). Bentuk yang sama (tanpa
        `read_at`, ditambah `unread_count`) dikirim event realtime `notification.created`
        (events/notification.created.schema.json, ARCHITECTURE §4.9).

        Deep link satu bentuk di semua kanal (PRD 3.13, ARCHITECTURE §4.7): notifications.data.route menyimpan
        rute aplikasi sebagai STRING path (ARCHITECTURE §8.4, misalnya `/payments/<id>`); `deep_link` di REST,
        payload realtime dan payload data FCM (bersama `notification_id` dan `category`) adalah bentuk eksternal
        `kapdh://app` + path tersebut. Klien cukup mengurai satu format. Payload data FCM juga membawa `route`
        (path yang sama, untuk klien yang membaca `data.route`); keduanya tidak ada bila notifikasi tanpa rute.
        Bagian `notification` push hanya judul dan isi ringkas (alamat email/nomor telepon disamarkan sebagai
        pertahanan berlapis) dengan collapse key = id notifikasi, sehingga pengiriman ulang menggantikan, bukan
        menggandakan, notifikasi di baki perangkat. Rute tersimpan yang bukan rute aplikasi sah (§8.4) tidak pernah
        dikirim: `deep_link` menjadi null. Katalog rute per kategori:

        | rute (path)              | kategori lazim   |
        | ------------------------ | ---------------- |
        | `/payments/<payment_id>` | payment          |
        | `/payments`              | payment          |
        | `/kta`                   | membership       |
        | `/renewal`               | membership       |
        | `/events/<event_id>`     | event            |
        | `/tickets/<ticket_id>`   | event            |
        | `/news/<slug>`           | news             |
        | `/chat/<room_id>`        | chat             |
        | `/chat/invitations`      | chat             |
        | `/account/sessions`      | security         |
        | `/account/reports`       | account          |
        | `/restricted`            | account          |
        | `/deletion-status`       | account          |
        | `/notifications`         | semua (cadangan) |

        Rute yang tidak dikenal klien membuka kotak masuk. Rute bukan izin akses: membuka rute tetap memerlukan
        autentikasi dan otorisasi endpoint tujuan (AC F13-3, F13-5). Payload push di layar kunci tidak pernah
        memuat isi chat, bukti bayar atau kontak (F-13).
      properties:
        id: { type: string, format: uuid }
        category: { $ref: "#/components/schemas/NotificationCategory" }
        title: { type: string }
        body:
          type: [string, "null"]
          description: Teks ringkas tanpa isi chat, bukti bayar atau kontak (F-13).
        deep_link:
          type: [string, "null"]
          maxLength: 320
          pattern: "^kapdh://app/[A-Za-z0-9/_.-]*$"
          description: |
            Tujuan saat diketuk dalam bentuk eksternal `kapdh://app` + rute (lihat katalog di atas); null bila
            notifikasi hanya informasi. Klien memeriksa sesi sebelum membuka (AC F13-3).
          examples: ["kapdh://app/payments/0192f0c2-7c1e-7d5a-9a51-1f1c2b3d4e5f"]
        read_at: { type: [string, "null"], format: date-time }
        created_at: { type: string, format: date-time }

    NotificationPage:
      type: object
      required: [items, next_cursor, unread_count]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/InboxNotification" }
        next_cursor: { type: [string, "null"] }
        unread_count:
          type: integer
          minimum: 0
          description: Jumlah belum dibaca di seluruh kotak masuk pemanggil (tidak dipengaruhi filter).

    NotificationUnreadCount:
      type: object
      required: [unread_count]
      properties:
        unread_count: { type: integer, minimum: 0 }

    MarkNotificationsReadRequest:
      type: object
      description: |
        Isi tepat salah satu: `ids`, atau `all: true` (opsional dengan `up_to`). Selain itu 400 VALIDATION_ERROR.
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items: { type: string, format: uuid }
        all:
          type: boolean
          description: True untuk menandai seluruh kotak masuk.
        up_to:
          type: string
          format: date-time
          description: Hanya bersama `all`; batas created_at (inklusif) yang ditandai.

    MarkNotificationsReadResult:
      type: object
      required: [updated_count, unread_count]
      properties:
        updated_count:
          type: integer
          minimum: 0
          description: Jumlah notifikasi yang baru ditandai pada permintaan ini.
        unread_count: { type: integer, minimum: 0 }

    PushPreferences:
      type: object
      required: [payment, membership, event, news, chat]
      description: Saklar push per kategori yang dapat diatur; security dan account selalu dikirim (ARCHITECTURE §4.7).
      properties:
        payment: { type: boolean }
        membership: { type: boolean }
        event: { type: boolean }
        news: { type: boolean }
        chat: { type: boolean }

    EmailPreferences:
      type: object
      required: [payment, membership, event]
      description: Saklar email transaksional per kategori; email OTP, keamanan dan akun selalu dikirim (F-13).
      properties:
        payment: { type: boolean }
        membership: { type: boolean }
        event: { type: boolean }

    NotificationPreferences:
      type: object
      required: [push, email, mandatory_categories, updated_at]
      properties:
        push: { $ref: "#/components/schemas/PushPreferences" }
        email: { $ref: "#/components/schemas/EmailPreferences" }
        mandatory_categories:
          type: array
          description: Kategori wajib tanpa saklar, selalu [security, account] (ARCHITECTURE §4.7).
          items: { $ref: "#/components/schemas/NotificationCategory" }
        updated_at:
          type: [string, "null"]
          format: date-time
          description: Waktu perubahan terakhir; null bila pengguna belum pernah mengubah default.

    NotificationPreferencesUpdate:
      type: object
      required: [push, email]
      description: Penggantian penuh preferensi; semua saklar wajib dikirim.
      properties:
        push: { $ref: "#/components/schemas/PushPreferences" }
        email: { $ref: "#/components/schemas/EmailPreferences" }

    RegisterDeviceRequest:
      type: object
      required: [platform, token]
      properties:
        platform: { $ref: "#/components/schemas/DevicePlatform" }
        token:
          type: string
          minLength: 1
          maxLength: 4096
          description: Token registrasi FCM; tidak pernah dicatat di log (ARCHITECTURE §2).
        app_version:
          type: string
          maxLength: 32
          pattern: '^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$'
          description: Versi aplikasi (semver), sama dengan header X-App-Version.
          examples: ["1.0.0"]

    UnregisterDeviceRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 4096
