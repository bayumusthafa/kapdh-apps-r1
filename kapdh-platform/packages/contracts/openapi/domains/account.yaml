# Domain account (C1 Identity): penghapusan akun dari aplikasi (F-14) dan dari situs /delete-account tanpa aplikasi,
# termasuk pengungkapan retensi (D2, N-15) dan pemeriksaan status dengan challenge terbatas (PRD 2.2).
# Modul API: apps/api/src/modules/account (+ job account.deletion). `x-kapdh-access` dijelaskan di kepala auth.yaml.
#
# Alur aplikasi : GET /me/deletion/disclosure -> POST /auth/reauth -> POST /me/deletion (X-Reauth-Token, konfirmasi).
# Alur web      : POST /public/deletion/challenge -> POST /public/deletion/verify (OTP; status + pengungkapan +
#                 deletion_token) -> POST /public/deletion/confirm (deletion_token, konfirmasi).
# Status        : akun deletion_pending tidak memiliki sesi. Statusnya terlihat lewat POST /auth/login
#                 (next=deletion_pending, sandi sebagai challenge) atau alur web challenge -> verify (OTP).
# pending_otp   : pendaftaran yang belum pernah diverifikasi tidak memiliki sesi, tetapi datanya (nama, jenis
#                 kelamin, email, angkatan/kelas, hash sandi) tetap data pribadi (D2, N-15). Pemilik email dapat
#                 membatalkan pendaftaran dan menghapus datanya lewat alur web yang sama tanpa harus mengaktifkan akun
#                 (yang akan mengalokasikan nomor anggota): OTP `deletion` ke email akun membuktikan kepemilikan
#                 alamat itu. Layar OTP aplikasi menautkan "Batalkan pendaftaran" ke /delete-account (F-14).
tags:
  - name: Account
    description: |
      Penghapusan akun dari aplikasi dan web beserta pengungkapan retensi dan pemeriksaan status (F-14, PRD 2.2, D2,
      N-15). Kebijakan D2: tanpa periode retensi data pribadi; catatan keuangan, tiket, laporan moderasi dan audit
      hanya disimpan anonim; backup harian berotasi 30 hari dengan deletion ledger (AC F14-6).

paths:
  /me/deletion/disclosure:
    get:
      tags: [Account]
      operationId: getAccountDeletionDisclosure
      summary: Pengungkapan sebelum hapus akun; data yang dihapus/dianonimkan dan peringatan refund tiket (F-14, N-15).
      description: |
        Ditampilkan di layar /account/delete sebelum reautentikasi dan konfirmasi (N-15: retensi dan penggunaan data
        dijelaskan sebelum pengguna menyetujui). Memuat kategori data yang dihapus dan yang tersisa anonim (D2),
        perkiraan penyelesaian maksimal 7 hari kalender, rotasi backup 30 hari, serta peringatan pribadi: tiket aktif
        beserta kebijakan refund D6 yang berlaku (akun dihapus -> tiket hangus; pengguna diberi tahu untuk mengajukan
        refund lebih dahulu, PRD 3.9), refund yang sedang diproses bendahara tetapi belum ditransfer (PRD 4.4),
        pembayaran yang masih menunggu verifikasi, grup chat yang admin tunggalnya pengguna (AC F14-5), dan identitas
        pengurus tertaut. `version` wajib dikirim kembali saat konfirmasi.
        Tersedia untuk semua effective_status termasuk suspended (penghapusan deletion-only, F-14). Token sesi admin
        ditolak 403 FORBIDDEN (audience mobile).
      x-kapdh-access: { audience: mobile, member_access: any }
      responses:
        "200":
          description: Pengungkapan terkini.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountDeletionDisclosure" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: FORBIDDEN; dipanggil dengan token sesi admin (audience salah).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/Error" }

  /me/deletion:
    post:
      tags: [Account]
      operationId: requestAccountDeletion
      summary: Minta penghapusan akun dari aplikasi; perlu reautentikasi maksimal 10 menit dan konfirmasi (AC F14-1).
      description: |
        Wajib header X-Reauth-Token (POST /auth/reauth, maksimal 10 menit, terikat sesi) dan `confirm: true` dengan
        `acknowledged_disclosure_version` sama dengan `version` pengungkapan terkini. Dalam satu transaksi dengan
        baris users terkunci: satu permintaan `account_deletions` dibuat (nomor DEL-YYYY-XXXX, sumber `app`, batas
        7 hari), akun menjadi `deletion_pending`, semua sesi dicabut dan `session_version` naik, audit
        `account.deletion_requested` ditulis, dan outbox `account.deletion.requested` (job) serta email konfirmasi
        berisi nomor permintaan dijadwalkan. Setelah commit seluruh socket diputus (AC F14-1). Klien menampilkan
        nomor permintaan lalu menghapus token, cache KTA dan data privat lokal. Bila respons hilang, sesi sudah
        dicabut: klien masuk kembali dan POST /auth/login mengembalikan `next: deletion_pending` beserta status.

        Satu permintaan terbuka per akun (`account_deletions_user_id_open_key`); request bersamaan atau ulangan
        dengan Idempotency-Key yang sama mengembalikan permintaan yang sama. Anggota suspended dapat menghapus akun
        tanpa akses komunitas (F-14). Akun alumni pengurus tetap dapat dihapus; identitas admin tertaut tidak ikut
        terhapus dan diputus tautannya oleh job (PRD 3.14). Job dapat dilanjutkan setelah gagal (AC F14-2, N-15).

        Refund dan pembayaran terbuka (PRD 4.4, D6, D2): penghapusan tidak menunggu refund dan tidak pernah
        menganggap dana sudah dikembalikan. Job tidak menyelesaikan atau membatalkan payment_adjustments refund
        `pending` secara otomatis; catatan itu tetap ada (anonim) untuk diselesaikan atau dibatalkan bendahara
        dengan catatan penyelesaian tersendiri. Data rekening tujuan refund (`refund_destination`) disimpan paling
        lama sampai refund selesai/batal atau sampai langkah akhir job (batas `estimated_completion_at`), mana yang
        lebih dahulu, lalu dihapus bersama data pribadi lain; setelah itu bendahara tidak lagi dapat menghubungi
        pemilik. Karena itu UI menampilkan `pending_refunds` dan `active_tickets` sebelum konfirmasi dan menyarankan
        menunggu refund selesai atau mengajukan refund lebih dahulu. Pembayaran `pending` dibatalkan job; dana yang
        sudah ditransfer diselesaikan lewat bendahara.

        Galat: 400 VALIDATION_ERROR (`confirm` bukan true); 403 REAUTH_REQUIRED, atau FORBIDDEN bila dipanggil
        dengan token sesi admin; 409 VERSION_CONFLICT bila pengungkapan berubah (mis. tiket atau refund baru)
        dengan `current` berisi AccountDeletionDisclosure terkini, atau IDEMPOTENCY_CONFLICT.
      x-kapdh-access: { audience: mobile, member_access: any, reauth: true, idempotent: true }
      parameters:
        - $ref: "#/components/parameters/ReauthToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountDeletionRequest" }
      responses:
        "202":
          description: Permintaan dibuat; akun deletion_pending dan semua sesi dicabut.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountDeletion" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: |
            REAUTH_REQUIRED (X-Reauth-Token tidak ada, tidak sah atau lebih dari 10 menit; UI membuka reautentikasi)
            atau FORBIDDEN (token sesi admin).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409": { $ref: "#/components/responses/Conflict" }
        default: { $ref: "#/components/responses/Error" }

  /public/deletion/challenge:
    post:
      tags: [Account]
      operationId: startWebDeletion
      summary: Mulai penghapusan atau cek status dari situs /delete-account; OTP dikirim ke email (F-14, PRD 2.2).
      description: |
        Dipakai situs publik /delete-account (tanpa aplikasi) dan layar status penghapusan aplikasi. Bila email
        milik akun alumni `active` (semua effective_status termasuk suspended: challenge deletion-only tanpa akses
        komunitas), `pending_otp` (pembatalan pendaftaran yang belum diverifikasi, kepala berkas),
        `deletion_pending` (cek status) atau `disabled` (cek status), challenge `deletion` dibuat (baris users
        dikunci, challenge `deletion` lama dibatalkan; challenge aktivasi signup/email_change tidak disentuh) dan
        kode dikirim ke email akun. Untuk email lain (tidak terdaftar, akun admin, akun yang sudah selesai dihapus)
        server mengembalikan challenge pengganti berbentuk sama tanpa email; respons, waktu dan batas 429 identik
        (non-enumerasi, PRD 2.5).
        Kirim ulang memakai POST /auth/otp/resend. Galat: 400 VALIDATION_ERROR email tidak valid; 429 RATE_LIMITED
        (5 pengiriman per jam per email plus batas IP).
      security: []
      x-kapdh-access: { audience: public }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebDeletionStartRequest" }
      responses:
        "202":
          description: Respons sama apa pun keadaan email.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OtpChallenge" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }

  /public/deletion/verify:
    post:
      tags: [Account]
      operationId: verifyWebDeletion
      summary: Verifikasi OTP penghapusan; tampilkan status dan pengungkapan, terbitkan deletion_token terbatas (F-14).
      description: |
        Kode `deletion` benar dikonsumsi sekali secara atomik. Respons adalah challenge terbatas (PRD 2.2): tidak ada
        sesi, hanya status permintaan penghapusan terbuka (`deletion`) dan, bila akun dapat dihapus, pengungkapan
        retensi/peringatan (`disclosure`) serta `deletion_token` hanya untuk POST /public/deletion/confirm: JWT
        audience `kapdh-web-deletion` berumur maksimal 10 menit (sama dengan batas reautentikasi F-14), subject
        akun, klaim `cid` challenge yang dikonsumsi, `sv` (users.session_version) dan `st` (users.status saat
        verifikasi: `active` atau `pending_otp`). Token tidak disimpan di server; sifat sekali pakainya dijamin
        konfirmasi yang mengubah akun menjadi `deletion_pending` (kepala auth.yaml).
        Bila respons hilang, kode sudah dikonsumsi: pengguna meminta challenge baru.
        Akun `active` (termasuk suspended) -> `deletable` true, `registration_pending` false.
        Akun `pending_otp` -> `deletable` true, `registration_pending` true: konfirmasi membatalkan pendaftaran yang
        belum diverifikasi dan menghapus datanya; pengungkapan berisi kategori data yang sama dengan daftar
        peringatan pribadi kosong (akun pending_otp tidak dapat membayar, memesan tiket atau masuk grup).
        Akun `deletion_pending` -> `deletable` false, `blocked_reason: deletion_in_progress`, `deletion` terisi.
        Akun `disabled` -> `deletable` false, `blocked_reason: account_disabled` (pemulihan atau penghapusan melalui
        kanal bantuan, PRD 2.2).
        Challenge pengganti dari email tak terdaftar selalu diperlakukan sebagai kode salah sampai percobaan habis.
        Galat: 400 VALIDATION_ERROR kode salah dengan sisa percobaan di `field_errors.code`; 410 OTP_EXPIRED
        (kedaluwarsa, dipakai, diganti, percobaan habis, tujuan lain); 429 RATE_LIMITED.
      security: []
      x-kapdh-access: { audience: public }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebDeletionVerifyRequest" }
      responses:
        "200":
          description: OTP benar; status dan pilihan penghapusan.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebDeletionVerification" }
        "400":
          description: Kode salah (VALIDATION_ERROR) dengan sisa percobaan.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "410":
          description: Challenge tidak berlaku (OTP_EXPIRED); minta kode baru.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }

  /public/deletion/confirm:
    post:
      tags: [Account]
      operationId: confirmWebDeletion
      summary: Konfirmasi penghapusan dari web dengan deletion_token; nomor permintaan ditampilkan (AC F14-1).
      description: |
        Halaman web benar-benar menerima permintaan, bukan hanya menyarankan menghubungi pengurus (F-14).
        `confirm: true` dan `acknowledged_disclosure_version` wajib sama dengan pengungkapan terkini. Dalam satu
        transaksi dengan baris users terkunci (FOR UPDATE): deletion_token diverifikasi (tanda tangan, audience,
        kedaluwarsa, challenge `cid` milik akun bertujuan `deletion` dan sudah dikonsumsi, `sv` sama dengan
        session_version saat ini) dan akun harus masih berstatus `st` yang tercatat di token (`active` dengan
        effective_status apa pun termasuk suspended, atau `pending_otp`); lalu transisi bersyarat users
        `st` -> `deletion_pending` (`UPDATE ... WHERE status = <st> RETURNING`) serta insert account_deletions
        (`account_deletions_user_id_open_key`). Karena akun tidak lagi `st` dan session_version naik, token yang
        sama tidak pernah berhasil dua kali (sekali pakai tanpa penyimpanan token). Efek sama dengan
        POST /me/deletion (sumber `web`, termasuk perlakuan refund): sesi/socket dicabut, audit, job dan email
        konfirmasi lewat outbox. Pengulangan dengan Idempotency-Key sama mengembalikan respons pertama; tanpa key,
        pengulangan setelah berhasil menghasilkan 410 dan pengguna memeriksa status lewat challenge -> verify
        (`deletion` terisi).

        Pendaftaran `pending_otp`: dalam transaksi yang sama challenge signup/email_change yang masih aktif
        dibatalkan, sehingga kode aktivasi yang sudah terkirim tidak dapat lagi mengaktifkan akun; aktivasi dan
        konfirmasi saling eksklusif karena keduanya memakai UPDATE bersyarat pada status dengan baris users
        terkunci (aktivasi lebih dahulu -> konfirmasi 410; konfirmasi lebih dahulu -> verifikasi OTP 410). Nomor
        anggota tidak pernah dialokasikan. Job menghapus data pendaftaran seperti akun lain; email akun dapat
        dipakai mendaftar lagi setelah permintaan selesai (`users_kind_email_key` hanya berlaku untuk akun yang
        belum `deleted`).
        Galat: 400 VALIDATION_ERROR; 409 VERSION_CONFLICT bila pengungkapan berubah (`current` berisi
        AccountDeletionDisclosure terkini; token tetap berlaku sampai kedaluwarsa) atau IDEMPOTENCY_CONFLICT;
        410 OTP_EXPIRED bila deletion_token kedaluwarsa, tidak sah, sudah dipakai, atau keadaan akun berubah
        (tidak dibedakan); 429 RATE_LIMITED.
      security: []
      x-kapdh-access: { audience: public, idempotent: true }
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebDeletionConfirmRequest" }
      responses:
        "202":
          description: Permintaan dibuat (atau permintaan terbuka yang sama dikembalikan).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountDeletion" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "409": { $ref: "#/components/responses/Conflict" }
        "410":
          description: deletion_token tidak berlaku (OTP_EXPIRED); ulangi verifikasi email.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }

components:
  schemas:
    AccountDeletionRequest:
      type: object
      description: Konfirmasi eksplisit penghapusan dari aplikasi (F-14).
      required: [confirm, acknowledged_disclosure_version]
      properties:
        confirm: { type: boolean, const: true, description: Konfirmasi eksplisit pengguna. }
        acknowledged_disclosure_version:
          type: string
          minLength: 1
          maxLength: 128
          description: "`version` dari AccountDeletionDisclosure yang ditampilkan kepada pengguna."

    AccountDeletionStatus:
      type: string
      enum: [pending, processing, failed, completed]
      description: |
        Tahap permintaan penghapusan (account_deletions.status). `failed` berarti langkah terakhir gagal dan akan
        dicoba ulang otomatis tanpa mengulang langkah yang selesai (AC F14-2, N-15); UI menampilkannya sebagai
        "Sedang diproses ulang".

    AccountDeletionSource:
      type: string
      enum: [app, web]
      description: Kanal permintaan penghapusan (F-14).

    AccountDeletion:
      type: object
      description: Status permintaan penghapusan akun tanpa data pribadi (AC F14-1).
      required: [request_number, status, source, requested_at, estimated_completion_at, completed_at]
      properties:
        request_number:
          type: string
          pattern: "^DEL-[0-9]{4}-[0-9A-Z]{4,}$"
          examples: ["DEL-2026-7K3Q9X"]
          description: Nomor permintaan yang ditampilkan kepada pengguna dan dipakai dalam komunikasi bantuan.
        status: { $ref: "#/components/schemas/AccountDeletionStatus" }
        source: { $ref: "#/components/schemas/AccountDeletionSource" }
        requested_at: { type: string, format: date-time }
        estimated_completion_at:
          type: string
          format: date-time
          description: Batas penyelesaian otomatis, maksimal 7 hari kalender sejak permintaan (F-14).
        completed_at: { type: [string, "null"], format: date-time }

    AccountDeletionDataCategory:
      type: string
      enum:
        - credentials
        - profile
        - contacts
        - avatar
        - private_uploads
        - payment_proofs
        - chat_content
        - device_tokens
        - sessions
        - notifications
        - preferences
      description: |
        Kategori data yang dihapus atau menjadi placeholder tanpa isi (AC F14-3, D2): kredensial, profil, kontak,
        avatar, unggahan pribadi, file bukti transfer, isi chat buatan pengguna, token perangkat, sesi, kotak masuk
        notifikasi, dan preferensi.

    AccountDeletionDataItem:
      type: object
      required: [category, description]
      properties:
        category: { $ref: "#/components/schemas/AccountDeletionDataCategory" }
        description: { type: string, description: Penjelasan singkat Bahasa Indonesia untuk ditampilkan. }

    AccountDeletionRetainedCategory:
      type: string
      enum: [payments, tickets, membership_history, moderation_reports, audit_logs]
      description: |
        Catatan yang tetap ada dalam bentuk anonim tanpa nama, email, telepon, foto atau snapshot identitas
        (AC F14-4, D2): jumlah, tanggal, status dan referensi transaksi minimum.

    AccountDeletionRetainedItem:
      type: object
      required: [category, description]
      properties:
        category: { $ref: "#/components/schemas/AccountDeletionRetainedCategory" }
        description: { type: string, description: "Apa yang tersisa dan mengapa, dalam Bahasa Indonesia." }

    AccountDeletionTicketStatus:
      type: string
      enum: [awaiting_payment, awaiting_review, paid]
      description: Status tiket aktif yang akan hangus saat akun dihapus (PRD 3.9, 4.4).

    AccountDeletionRefundPolicy:
      type: string
      enum: [full_refund, no_refund, case_by_case, payment_pending]
      description: |
        Kebijakan refund D6 (PRD 3.9) yang berlaku untuk tiket bila pengguna bertindak SEBELUM menghapus akun;
        setelah akun dihapus tiket hangus. Dievaluasi berurutan:
        `payment_pending` tiket belum lunas (awaiting_payment/awaiting_review): pembayarannya ada di `open_payments`
        dan dibatalkan job; dana yang sudah ditransfer diselesaikan lewat bendahara (PRD 4.4).
        `case_by_case` pemilik sedang disuspend: tiket tidak berlaku dan refund diputuskan pengurus per kasus (D6
        baris "Anggota disuspend"), termasuk bila event dibatalkan; anggota suspended tidak dapat membatalkan tiket
        sendiri.
        `full_refund` tiket berbayar lunas dan event dibatalkan pengurus, atau pembatalan sendiri masih sebelum
        `self_cancel_deadline_at` (H-3): ajukan pembatalan/refund lebih dahulu.
        `no_refund` tiket gratis, atau batas H-3 sudah lewat.

    AccountDeletionTicketWarning:
      type: object
      description: |
        Tiket aktif (status awaiting_payment, awaiting_review atau paid) pada event yang belum selesai, termasuk event
        yang dibatalkan dan belum diproses refund-nya. Akun dihapus -> tiket hangus; refund harus diajukan lebih
        dahulu (PRD 3.9, D6). Tiket yang sudah dibatalkan dan refund-nya sedang diproses tampil di `pending_refunds`.
      required:
        - ticket_id
        - event_id
        - event_title
        - event_starts_at
        - event_timezone
        - event_cancelled
        - status
        - total
        - refund_policy
        - self_cancel_deadline_at
      properties:
        ticket_id: { type: string, format: uuid }
        event_id: { type: string, format: uuid }
        event_title: { type: string, maxLength: 200 }
        event_starts_at: { type: string, format: date-time }
        event_timezone:
          { type: string, examples: [Asia/Jakarta], description: Zona tampilan event (PRD 2.1). }
        event_cancelled: { type: boolean, description: "Event dibatalkan pengurus (refund penuh, D6)." }
        status: { $ref: "#/components/schemas/AccountDeletionTicketStatus" }
        total: { $ref: "#/components/schemas/Money" }
        refund_policy: { $ref: "#/components/schemas/AccountDeletionRefundPolicy" }
        self_cancel_deadline_at:
          type: [string, "null"]
          format: date-time
          description: Batas pembatalan sendiri dengan refund penuh (mulai event - 3 hari); null untuk event gratis.

    AccountDeletionRefundWarning:
      type: object
      description: |
        Refund yang sudah dicatat (payment_adjustments kind `refund`, status `pending`) tetapi belum ditransfer
        bendahara, misalnya tiket yang dibatalkan sendiri sebelum H-3 atau event yang dibatalkan (D6, tenggat 7 hari
        kerja). Penghapusan akun tidak menganggap dana sudah dikembalikan (PRD 4.4); setelah akun dihapus bendahara
        tidak lagi dapat menghubungi pemilik dan data rekening tujuan ikut dihapus (D2), sehingga pengguna disarankan
        menunggu refund selesai.
      required:
        - adjustment_id
        - payment_id
        - payment_type
        - ticket_id
        - event_title
        - amount
        - due_at
        - destination_provided
        - created_at
      properties:
        adjustment_id: { type: string, format: uuid }
        payment_id:
          type: string
          format: uuid
          description: "Pembayaran asal (deep link `/payments/{paymentId}`)."
        payment_type: { $ref: "#/components/schemas/AccountDeletionPaymentType" }
        ticket_id:
          type: [string, "null"]
          format: uuid
          description: Tiket terkait bila refund berasal dari tiket event; null untuk iuran.
        event_title: { type: [string, "null"], maxLength: 200 }
        amount: { $ref: "#/components/schemas/Money" }
        due_at:
          type: [string, "null"]
          format: date-time
          description: Tenggat bendahara (paling lambat 7 hari kerja sejak pembatalan, D6).
        destination_provided:
          type: boolean
          description: |
            True bila rekening tujuan refund sudah diberikan. Nilai rekening tidak pernah dikembalikan di sini
            (ARCHITECTURE §2 butir 3).
        created_at: { type: string, format: date-time }

    AccountDeletionPaymentType:
      type: string
      enum: [registration, renewal, ticket]
      description: Jenis pembayaran yang masih terbuka (PRD 3.3).

    AccountDeletionPaymentWarning:
      type: object
      description: |
        Pembayaran `pending` yang akan dibatalkan saat penghapusan. Dana yang sudah ditransfer tidak otomatis
        dianggap dikembalikan; pengguna menghubungi bendahara sebelum menghapus (PRD 4.4).
      required: [payment_id, type, amount, proof_submitted, created_at]
      properties:
        payment_id: { type: string, format: uuid }
        type: { $ref: "#/components/schemas/AccountDeletionPaymentType" }
        amount: { $ref: "#/components/schemas/Money" }
        proof_submitted:
          { type: boolean, description: True bila bukti transfer sudah diunggah (dana mungkin terkirim). }
        created_at: { type: string, format: date-time }

    AccountDeletionDisclosure:
      type: object
      description: |
        Pengungkapan wajib sebelum konfirmasi penghapusan (N-15, D2, F-14) beserta peringatan pribadi pemilik akun.
        Hanya untuk pemilik akun (sesi sendiri atau challenge email terverifikasi).
      required:
        - version
        - estimated_completion_days
        - backup_retention_days
        - deleted_data
        - retained_data
        - privacy_policy_slug
        - privacy_policy_version
        - active_tickets
        - pending_refunds
        - open_payments
        - sole_admin_group_count
        - linked_admin_identity
      properties:
        version:
          type: string
          maxLength: 128
          description: |
            Versi opaque dari isi pengungkapan dan peringatan pribadi (termasuk active_tickets, pending_refunds,
            open_payments dan status suspend pemilik); berubah bila tiket/refund/pembayaran/kebijakan berubah.
            Dikirim kembali sebagai `acknowledged_disclosure_version`.
        estimated_completion_days:
          type: integer
          minimum: 1
          examples: [7]
          description: Penyelesaian otomatis maksimal 7 hari kalender lalu pemberitahuan email (F-14).
        backup_retention_days:
          type: integer
          minimum: 0
          examples: [30]
          description: Backup harian berotasi 30 hari; deletion ledger diterapkan ulang saat restore (D2, AC F14-6).
        deleted_data:
          type: array
          items: { $ref: "#/components/schemas/AccountDeletionDataItem" }
        retained_data:
          type: array
          items: { $ref: "#/components/schemas/AccountDeletionRetainedItem" }
        privacy_policy_slug:
          type: string
          examples: [kebijakan-privasi]
          description: Slug halaman kebijakan privasi (GET /public/pages/{slug}).
        privacy_policy_version:
          type: [string, "null"]
          description: Versi terbit kebijakan privasi yang menjadi dasar pengungkapan; null bila belum terbit.
        active_tickets:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/AccountDeletionTicketWarning" }
        pending_refunds:
          type: array
          maxItems: 100
          description: Refund yang belum ditransfer bendahara (PRD 4.4, D6).
          items: { $ref: "#/components/schemas/AccountDeletionRefundWarning" }
        open_payments:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/AccountDeletionPaymentWarning" }
        sole_admin_group_count:
          type: integer
          minimum: 0
          description: |
            Jumlah grup chat yang admin tunggalnya pengguna; kewenangan dialihkan ke anggota aktif atau grup ditutup
            otomatis tanpa menunggu respons anggota lain (AC F14-5).
        linked_admin_identity:
          type: boolean
          description: |
            True bila akun alumni ini ditautkan ke identitas pengurus. Identitas admin tidak ikut terhapus; pengalihan
            kewenangan pengurus dilakukan Super Admin (PRD 3.14).

    WebDeletionStartRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, format: email, maxLength: 254 }

    WebDeletionVerifyRequest:
      type: object
      required: [challenge_id, code]
      properties:
        challenge_id: { type: string, format: uuid }
        code: { type: string, pattern: "^[0-9]{6}$", x-sensitive: true }

    WebDeletionVerification:
      type: object
      description: |
        Hasil challenge terbatas penghapusan (PRD 2.2): status permintaan terbuka dan, bila dapat dihapus,
        pengungkapan serta deletion_token. Tidak memberi sesi atau akses lain.
      required:
        - email_masked
        - deletable
        - registration_pending
        - blocked_reason
        - deletion
        - disclosure
        - deletion_token
        - deletion_token_expires_at
      properties:
        email_masked: { type: string, maxLength: 254, examples: ["ah***@email.com"] }
        deletable: { type: boolean, description: True bila permintaan penghapusan baru dapat dikonfirmasi. }
        registration_pending:
          type: boolean
          description: |
            True bila akun adalah pendaftaran `pending_otp` yang belum pernah diverifikasi; UI menampilkan
            "Batalkan pendaftaran dan hapus data" alih-alih penghapusan akun anggota (F-14, D2). False untuk akun
            lain.
        blocked_reason:
          type: [string, "null"]
          enum: [deletion_in_progress, account_disabled, null]
          description: |
            Alasan tidak dapat membuat permintaan baru: `deletion_in_progress` (lihat `deletion`), `account_disabled`
            (hubungi bantuan, PRD 2.2); null bila `deletable`.
        deletion:
          description: Permintaan penghapusan terbuka (status pending/processing/failed); null bila tidak ada.
          oneOf:
            - $ref: "#/components/schemas/AccountDeletion"
            - type: "null"
        disclosure:
          description: Pengungkapan dan peringatan pribadi; hanya bila `deletable`.
          oneOf:
            - $ref: "#/components/schemas/AccountDeletionDisclosure"
            - type: "null"
        deletion_token:
          type: [string, "null"]
          maxLength: 512
          x-sensitive: true
          description: |
            Token sekali pakai (JWT audience kapdh-web-deletion, terikat akun, challenge, session_version dan status
            akun saat verifikasi) untuk POST /public/deletion/confirm; hanya bila `deletable`. Simpan hanya di
            memori halaman.
        deletion_token_expires_at:
          type: [string, "null"]
          format: date-time
          description: Maksimal 10 menit sejak verifikasi (sama dengan batas reautentikasi F-14).

    WebDeletionConfirmRequest:
      type: object
      required: [deletion_token, confirm, acknowledged_disclosure_version]
      properties:
        deletion_token: { type: string, minLength: 16, maxLength: 512, x-sensitive: true }
        confirm: { type: boolean, const: true, description: Konfirmasi eksplisit pengguna. }
        acknowledged_disclosure_version:
          type: string
          minLength: 1
          maxLength: 128
          description: "`version` dari AccountDeletionDisclosure yang ditampilkan kepada pengguna."
