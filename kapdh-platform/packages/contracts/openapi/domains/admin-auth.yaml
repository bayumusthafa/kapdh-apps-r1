# Domain admin-auth (C1 Identity): login admin dua tahap (sandi lalu TOTP/backup code), identitas dan izin efektif,
# penerimaan undangan admin, pendaftaran TOTP sebelum aktivasi, backup code, dan ganti sandi admin.
# Modul API: apps/api/src/modules/admin-auth. `x-kapdh-access` dijelaskan di kepala auth.yaml.
#
# Siklus identitas admin (F-16, PRD 8.2, admins.status invited|active|disabled):
#   1. Super Admin mengundang (domain admin-admins, C7), bootstrap CLI membuat Super Admin pertama, atau Super Admin
#      mereset MFA (lihat bawah); semuanya menghasilkan tautan undangan sekali pakai `/invite/<token>` berbatas
#      waktu (`invite_expires_at`) yang dikirim ke email admin (status invited, sandi awal acak yang tidak diketahui
#      siapa pun).
#   2. POST /admin/auth/invitations/preview  -> tampilkan siapa/peran/izin undangan.
#   3. POST /admin/auth/invitations/accept   -> sandi awal diganti; token undangan dikonsumsi; mfa_token PENDAFTARAN.
#   4. POST /admin/auth/totp/enroll          -> secret + otpauth URI (QR).
#   5. POST /admin/auth/totp/confirm         -> kode benar: TOTP terverifikasi, admin `active`, backup code, sesi.
#
# Jendela pendaftaran dibatasi waktu (AC F02-2, N-08): mfa_token pendaftaran dari langkah 3 (audience
# `kapdh-admin-enroll`, berlaku 30 menit sejak penerimaan, tidak diperpanjang dan tidak dapat diterbitkan ulang) adalah
# SATU-SATUNYA kredensial untuk langkah 4-5. Tidak ada jalur sandi-saja menuju pendaftaran TOTP: POST /admin/auth/login
# hanya melayani admin `active` dengan TOTP terverifikasi dan menolak 401 admin `invited` (sudah atau belum menerima
# undangan) maupun admin tanpa TOTP terverifikasi. Admin yang tidak menyelesaikan langkah 5 dalam 30 menit tetap
# `invited` tanpa token undangan dan tidak dapat masuk; Super Admin menerbitkan undangan ulang (token baru berbatas
# waktu, kembali ke langkah 2).
#
# Reset MFA oleh Super Admin (C7, AC F16-1, MFA + reautentikasi) = undangan ulang: dalam satu transaksi baris mfa_totp
# (secret dan backup code) dihapus, semua sesi admin dicabut dan session_version naik, status kembali `invited` dengan
# token undangan baru; admin mengulang langkah 2-5 termasuk sandi baru. Trigger admins_guard_last_super_admin tetap
# menjaga Super Admin aktif terakhir (AC F16-2). Tidak ada akses API admin sebelum TOTP terbukti (AC F02-2; tanpa aal1
# di production).
tags:
  - name: Admin Auth
    description: |
      Login admin dua tahap (sandi lalu TOTP atau backup code), identitas dan izin efektif, penerimaan undangan,
      pendaftaran TOTP sebelum aktivasi, backup code dan ganti sandi admin (F-02, F-16, PRD 8.2, N-08). Akun admin
      terpisah dari akun alumni (PRD 2.3). Sesi admin idle 30 menit di server; request polling latar belakang
      mengirim header X-Background-Request agar tidak memperpanjang aktivitas (AC F02-5).

paths:
  /admin/auth/login:
    post:
      tags: [Admin Auth]
      operationId: adminLogin
      summary: Tahap sandi admin; hasilnya hanya mfa_token, belum bisa memanggil API admin (AC F02-2).
      description: |
        Admin masuk dengan email (guidelines "Email atau Username": identitas admin R1.0 hanya email). Hanya admin
        `active` (akun users `active`) dengan TOTP terverifikasi yang dapat login: sandi benar menghasilkan
        `mfa_token` audience `kapdh-admin-mfa` berumur 5 menit dengan `totp_enrollment_required: false`.
        `mfa_token` ini hanya berlaku untuk POST /admin/auth/mfa; ditolak 401 di /admin/auth/totp/* dan 403
        MFA_REQUIRED di seluruh API admin (AC F02-2).

        Pendaftaran TOTP TIDAK pernah dibuka dari login (lihat kepala berkas): admin `invited` (sudah atau belum
        menerima undangan, termasuk setelah reset MFA) dan admin tanpa TOTP terverifikasi ditolak 401 yang sama
        dengan sandi salah, sehingga sandi yang bocor tidak cukup untuk mendaftarkan autentikator penyerang.
        Halaman login menampilkan petunjuk umum "Belum menyelesaikan aktivasi? Minta undangan ulang ke Super Admin."

        Galat: 401 UNAUTHENTICATED "Email atau sandi salah" untuk kredensial salah, akun tidak dikenal, admin
        `disabled`, admin `invited`, atau admin tanpa TOTP terverifikasi (tidak dibedakan); 429 RATE_LIMITED
        setelah 10 kegagalan dalam 15 menit per email atau ambang per IP (PRD 2.5). Admin yang lupa sandi meminta
        undangan ulang ke Super Admin (F-16).
      security: []
      x-kapdh-access: { audience: public }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminLoginRequest" }
      responses:
        "200":
          description: Sandi benar; lanjut ke TOTP atau pendaftaran TOTP.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminLoginResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }

  /admin/auth/mfa:
    post:
      tags: [Admin Auth]
      operationId: adminVerifyMfa
      summary: Verifikasi TOTP atau backup code; menerbitkan access token di body dan refresh cookie HttpOnly (F-02).
      description: |
        Tepat satu dari `totp_code` atau `backup_code`, dengan `mfa_token` dari POST /admin/auth/login. TOTP
        diterima dalam jendela langkah yang sempit dan setiap langkah hanya sekali (`mfa_totp.last_used_step`,
        anti-replay, UPDATE bersyarat). Backup code sekali pakai dikonsumsi secara atomik (UPDATE bersyarat), sisanya
        terlihat di GET /admin/me `backup_codes_remaining`. Berhasil: sesi admin `mfa_level` 2 dibuat,
        `users.last_login_at` diperbarui, audit `admin.login` ditulis, access token di body dan refresh token di
        cookie `kapdh_admin_rt` (tidak pernah di localStorage, PRD 5.2).

        Kode salah adalah galat formulir, sama dengan /totp/confirm dan POST /auth/reauth: 400 VALIDATION_ERROR
        dengan `field_errors.totp_code` atau `field_errors.backup_code` berisi sisa percobaan (mis. "Kode salah.
        Sisa percobaan 3."); mfa_token tetap berlaku sampai kedaluwarsa sehingga UI tetap di layar /login/mfa.
        401 UNAUTHENTICATED hanya untuk mfa_token yang tidak sah atau kedaluwarsa (termasuk mfa_token pendaftaran),
        admin tidak lagi `active`, atau TOTP tidak terverifikasi; UI kembali ke /login.
        Galat lain: 400 VALIDATION_ERROR bila tidak ada kode atau keduanya dikirim; 429 RATE_LIMITED setelah 5
        kegagalan dalam 15 menit per admin (juga dihitung ke ambang per IP).
      security: []
      x-kapdh-access: { audience: public }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminMfaRequest" }
      responses:
        "200":
          description: Sesi admin aktif.
          headers:
            Set-Cookie:
              description: kapdh_admin_rt; HttpOnly; Secure; SameSite=Strict; Path=/api/v1/auth
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminSession" }
        "400":
          description: |
            VALIDATION_ERROR: kode TOTP/backup salah (`field_errors.totp_code` atau `field_errors.backup_code`
            dengan sisa percobaan), atau kode tidak dikirim/dikirim keduanya. Tetap di layar MFA.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401":
          description: |
            UNAUTHENTICATED: mfa_token tidak sah atau kedaluwarsa, admin tidak aktif, atau TOTP tidak terverifikasi;
            kembali ke halaman login.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }

  /admin/auth/invitations/preview:
    post:
      tags: [Admin Auth]
      operationId: adminPreviewInvitation
      summary: Lihat undangan admin dari token sekali pakai sebelum menerima (F-16, PRD 8.2).
      description: |
        Halaman `/invite/<token>` membaca token dari URL lalu mengirimnya di body (token tidak pernah ditaruh di
        query/path API agar tidak tercatat di log akses). Tidak mengonsumsi token. Hanya hash token yang disimpan
        (`admins.invite_token_hash`). 410 OTP_EXPIRED bila token tidak dikenal, kedaluwarsa, sudah dipakai, atau
        undangan dibatalkan (tidak dibedakan); 429 RATE_LIMITED per IP.
      security: []
      x-kapdh-access: { audience: public }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminInvitationTokenRequest" }
      responses:
        "200":
          description: Undangan berlaku.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminInvitationPreview" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "410":
          description: Undangan tidak berlaku (OTP_EXPIRED); minta undangan baru ke Super Admin.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }

  /admin/auth/invitations/accept:
    post:
      tags: [Admin Auth]
      operationId: adminAcceptInvitation
      summary: Terima undangan admin dan ganti sandi awal dengan token sekali pakai (F-16, PRD 8.2 langkah 3).
      description: |
        Dalam satu transaksi dengan baris admin terkunci: token undangan diverifikasi (hash, belum kedaluwarsa,
        status `invited`) lalu dikonsumsi (`invite_token_hash` dan `invite_expires_at` dikosongkan), sandi awal
        acak diganti sandi pilihan admin (aturan PRD 2.5), email akun admin dianggap terverifikasi, dan audit
        `admin.invitation_accepted` ditulis. Admin TETAP `invited` sampai TOTP dikonfirmasi; respons memberi
        `mfa_token` PENDAFTARAN dengan `totp_enrollment_required: true`: audience `kapdh-admin-enroll`, berlaku
        30 menit sejak penerimaan (`mfa_expires_at`), terikat admin dan HMAC password_hash yang baru disimpan. Token
        ini satu-satunya kredensial pendaftaran TOTP, tidak diperpanjang oleh /totp/enroll, dan tidak dapat
        diperoleh lagi lewat login (kepala berkas); simpan hanya di memori halaman. Bila kedaluwarsa sebelum
        /totp/confirm berhasil, admin meminta undangan ulang ke Super Admin.
        Galat: 400 VALIDATION_ERROR `field_errors.password`; 410 OTP_EXPIRED bila token tidak berlaku (termasuk
        penerimaan kedua yang kalah balapan); 429 RATE_LIMITED per IP.
      security: []
      x-kapdh-access: { audience: public }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminInvitationAcceptRequest" }
      responses:
        "200":
          description: Sandi tersimpan; lanjut pendaftaran TOTP.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminLoginResponse" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "410":
          description: Undangan tidak berlaku (OTP_EXPIRED).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }

  /admin/auth/totp/enroll:
    post:
      tags: [Admin Auth]
      operationId: adminStartTotpEnrollment
      summary: Mulai pendaftaran TOTP; menghasilkan secret dan otpauth URI untuk QR (F-02, F-16).
      description: |
        Hanya dengan mfa_token pendaftaran dari POST /admin/auth/invitations/accept (audience `kapdh-admin-enroll`,
        30 menit); mfa_token login ditolak 401. Token dianggap tidak berlaku bila admin tidak lagi `invited`, undangan
        ulang telah diterbitkan (`invite_token_hash` terisi lagi), akun users tidak `active`, atau password_hash tidak
        lagi sama dengan pengikat token. Membuat secret TOTP baru (disimpan terenkripsi AES-GCM di `mfa_totp`,
        `verified_at` kosong) dan menggantikan secret yang belum terverifikasi sebelumnya; boleh diulang selama token
        berlaku (mis. QR gagal dipindai) tanpa memperpanjang masa berlakunya. Secret hanya ditampilkan di respons ini
        dan tidak pernah dicatat di log atau audit (ARCHITECTURE §2 butir 3). Galat: 401 UNAUTHENTICATED mfa_token
        tidak berlaku atau kedaluwarsa (minta undangan ulang); 403 FORBIDDEN bila TOTP sudah terverifikasi
        (pendaftaran ulang hanya melalui reset MFA oleh Super Admin, yaitu undangan ulang); 429 RATE_LIMITED.
      security: []
      x-kapdh-access: { audience: public }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminTotpEnrollmentRequest" }
      responses:
        "200":
          description: Secret dibuat; tampilkan QR dari otpauth_uri.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminTotpEnrollment" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }

  /admin/auth/totp/confirm:
    post:
      tags: [Admin Auth]
      operationId: adminConfirmTotpEnrollment
      summary: Konfirmasi kode TOTP pertama; admin aktif, backup code diterbitkan, sesi admin dibuat (F-16, PRD 8.2).
      description: |
        Memakai mfa_token pendaftaran yang sama dengan /totp/enroll (syarat berlakunya sama; mfa_token login ditolak
        401). Dalam satu transaksi dengan baris admin terkunci dan status masih `invited` tanpa undangan ulang
        (UPDATE bersyarat): kode diverifikasi terhadap secret yang belum terverifikasi (anti-replay langkah), TOTP
        ditandai `verified_at` dengan UPDATE bersyarat (hanya satu konfirmasi menang), 10 backup code baru dibuat
        (hanya hash yang disimpan), admin `invited` menjadi `active` dengan `activated_at`, audit
        `admin.activated`/`admin.mfa_enrolled` ditulis, email pemberitahuan keamanan dijadwalkan lewat outbox
        (`admin.security_notice`), dan sesi admin `mfa_level` 2 dibuat (refresh cookie). Backup code hanya
        ditampilkan sekali di respons ini.
        Galat: 400 VALIDATION_ERROR `field_errors.totp_code` kode salah atau pendaftaran belum dimulai; 401
        UNAUTHENTICATED mfa_token tidak berlaku; 403 FORBIDDEN TOTP sudah terverifikasi (termasuk konfirmasi
        bersamaan yang kalah); 429 RATE_LIMITED setelah 5 kode salah dalam 15 menit.
      security: []
      x-kapdh-access: { audience: public }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdminTotpConfirmRequest" }
      responses:
        "200":
          description: TOTP aktif; simpan backup code sekarang.
          headers:
            Set-Cookie:
              description: kapdh_admin_rt; HttpOnly; Secure; SameSite=Strict; Path=/api/v1/auth
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminTotpEnrollmentResult" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }

  /admin/me:
    get:
      tags: [Admin Auth]
      operationId: getAdminMe
      summary: Identitas admin, izin efektif dan versi izin untuk menyusun menu (AC F15-1, F16-3).
      description: |
        Izin dibaca dari database setiap request; `super_admin` memiliki seluruh 15 izin (ARCHITECTURE §4.5).
        `permissions_version` naik setiap perubahan izin; klien yang melihat versi berbeda memuat ulang menu, dan
        server tetap menolak hak yang dicabut walaupun token belum kedaluwarsa (AC F16-3). Menu yang disembunyikan
        tidak menggantikan pemeriksaan izin API (PRD 2.3). Dipanggil tanpa X-Background-Request untuk tombol
        "Tetap masuk" pada peringatan idle (AC F02-5); polling berkala wajib mengirim X-Background-Request.
        Galat: 401 UNAUTHENTICATED (sesi dicabut atau idle 30 menit); 403 MFA_REQUIRED bila memakai mfa_token;
        403 FORBIDDEN bila admin tidak lagi aktif atau dipanggil dengan token sesi mobile.
      x-kapdh-access: { audience: admin }
      parameters:
        - $ref: "#/components/parameters/AdminBackgroundRequest"
      responses:
        "200":
          description: Admin.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminProfile" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: |
            MFA_REQUIRED (token tahap sandi, AC F02-2) atau FORBIDDEN (admin tidak lagi aktif, atau token sesi
            mobile).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/Error" }

  /admin/auth/backup-codes:
    post:
      tags: [Admin Auth]
      operationId: adminRegenerateBackupCodes
      summary: Buat ulang 10 backup code; yang lama tidak berlaku lagi (F-02). Perlu reautentikasi.
      description: |
        Wajib header X-Reauth-Token dari POST /auth/reauth (sandi + TOTP, maksimal 10 menit). Dalam satu
        transaksi seluruh hash backup code lama diganti 10 hash baru, audit `admin.backup_codes_regenerated` (tanpa
        kode) ditulis, dan email pemberitahuan keamanan dijadwalkan lewat outbox. Kode hanya ditampilkan sekali.
        Galat: 401 UNAUTHENTICATED; 403 REAUTH_REQUIRED, MFA_REQUIRED, atau FORBIDDEN (admin tidak aktif, token
        sesi mobile).
      x-kapdh-access: { audience: admin, reauth: true }
      parameters:
        - $ref: "#/components/parameters/ReauthToken"
      responses:
        "200":
          description: Backup code baru.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminBackupCodes" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: |
            REAUTH_REQUIRED (X-Reauth-Token tidak ada, tidak sah atau lebih dari 10 menit), MFA_REQUIRED, atau
            FORBIDDEN (admin tidak aktif, token sesi mobile).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        default: { $ref: "#/components/responses/Error" }

  /admin/auth/password/change:
    post:
      tags: [Admin Auth]
      operationId: adminChangePassword
      summary: Ganti sandi admin dengan sandi lama; sesi admin lain dicabut (AC F02-4, N-08).
      description: |
        Mensyaratkan sandi saat ini. Dalam satu transaksi sandi baru (aturan PRD 2.5) disimpan, sesi admin lain
        dicabut (sesi saat ini tetap), audit `admin.password_changed` ditulis tanpa nilai sandi, dan email
        pemberitahuan keamanan dijadwalkan lewat outbox (`admin.security_notice`). Socket sesi lain diputus setelah
        commit. Sandi lama salah -> 400 VALIDATION_ERROR `field_errors.current_password` (bukan 401) dan dihitung
        ke batas kegagalan login (429 setelah ambang).
      x-kapdh-access: { audience: admin }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePasswordRequest" }
      responses:
        "204": { description: Sandi admin diganti; sesi lain dicabut. }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403":
          description: MFA_REQUIRED atau FORBIDDEN (admin tidak aktif, token sesi mobile).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }

components:
  parameters:
    AdminBackgroundRequest:
      name: X-Background-Request
      in: header
      required: false
      description: |
        Isi `1` hanya pada request polling/refetch otomatis web admin. Request bertanda ini tidak memperbarui
        `sessions.last_activity_at`, sehingga idle timeout 30 menit tetap berjalan (AC F02-5, N-08). Request yang
        dipicu pengguna tidak boleh mengirim header ini. Server (AuthGuard) menghormatinya pada SETIAP operasi
        berautentikasi admin, terlepas dari deklarasi kontrak; deklarasi di sini hanya untuk GET /admin/me. Usulan
        perubahan bersama (belum dibuat): pindahkan parameter ini ke root.yaml sebagai
        `components.parameters.BackgroundRequest` agar operasi GET admin yang di-polling di domain lain (hitungan
        dashboard, antrean pembayaran, notifikasi admin) mendeklarasikannya; klien web admin mengirimnya lewat
        interceptor untuk semua refetch otomatis.
      schema: { type: string, pattern: "^1$" }

  schemas:
    AdminLoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 1, maxLength: 128 }

    AdminLoginResponse:
      type: object
      description: |
        Tantangan MFA admin setelah tahap sandi (POST /admin/auth/login) atau penerimaan undangan
        (POST /admin/auth/invitations/accept), AC F02-2. Dua jenis token tidak dapat dipertukarkan.
      required: [mfa_token, mfa_expires_at, totp_enrollment_required]
      properties:
        mfa_token:
          type: string
          x-sensitive: true
          description: |
            Bila totp_enrollment_required=false (login): token audience kapdh-admin-mfa 5 menit, hanya untuk
            POST /admin/auth/mfa. Bila true (penerimaan undangan): token pendaftaran audience kapdh-admin-enroll
            30 menit, hanya untuk /admin/auth/totp/enroll dan /confirm. Keduanya ditolak 403 MFA_REQUIRED di API admin.
        mfa_expires_at: { type: string, format: date-time }
        totp_enrollment_required:
          type: boolean
          description: |
            Selalu false dari login (login hanya untuk admin dengan TOTP terverifikasi) dan selalu true dari
            penerimaan undangan: lanjut ke /login/enroll dan selesaikan sebelum `mfa_expires_at` (F-16, PRD 8.2).

    AdminMfaRequest:
      type: object
      required: [mfa_token]
      description: Tepat satu dari totp_code atau backup_code wajib diisi.
      properties:
        mfa_token: { type: string, maxLength: 2048 }
        totp_code: { type: string, pattern: "^[0-9]{6}$", x-sensitive: true }
        backup_code: { type: string, minLength: 6, maxLength: 32, x-sensitive: true }

    AdminSession:
      type: object
      required: [access_token, access_expires_at, idle_timeout_seconds]
      properties:
        access_token: { type: string, description: Disimpan di memori web admin saja (PRD 5.2). }
        access_expires_at: { type: string, format: date-time }
        idle_timeout_seconds:
          type: integer
          examples: [1800]
          description: Idle timeout server 30 menit (N-08); UI memperingatkan 2 menit sebelumnya (AC F02-5).

    AdminProfile:
      type: object
      description: |
        Identitas admin untuk shell web admin (nama dan peran di sidebar, menu berizin). Tidak memuat data akun
        alumni tertaut selain penanda keberadaannya.
      required: [admin_id, display_name, role, permissions, permissions_version]
      properties:
        admin_id: { type: string, format: uuid }
        display_name: { type: string, maxLength: 120 }
        email: { type: string, format: email, maxLength: 254, description: Email login admin. }
        role: { $ref: "#/components/schemas/AdminRole" }
        permissions:
          type: array
          description: Izin efektif; super_admin selalu seluruh izin (ARCHITECTURE §4.5).
          items: { $ref: "#/components/schemas/Permission" }
        permissions_version: { type: integer, minimum: 1 }
        has_linked_alumni:
          type: boolean
          description: |
            True bila identitas admin ditautkan ke akun alumni untuk pemeriksaan konflik kepentingan; pembayaran
            milik akun itu tidak dapat diputus admin ini (PRD 2.3, ARCHITECTURE §3.3).
        backup_codes_remaining:
          type: integer
          minimum: 0
          maximum: 10
          description: Sisa backup code yang belum dipakai; UI menyarankan buat ulang bila sedikit.
        last_login_at:
          type: [string, "null"]
          format: date-time
          description: Login berhasil sebelumnya (setelah MFA), untuk deteksi akses yang tidak dikenal.

    AdminInvitationTokenRequest:
      type: object
      required: [invite_token]
      properties:
        invite_token: { type: string, minLength: 16, maxLength: 512 }

    AdminInvitationPreview:
      type: object
      description: Ringkasan undangan untuk halaman /invite (F-16); email disamarkan bila token bocor.
      required: [email_masked, display_name, role, permissions, invited_by_display_name, expires_at]
      properties:
        email_masked: { type: string, maxLength: 254, examples: ["ba***@kapdh.or.id"] }
        display_name: { type: string, maxLength: 120 }
        role: { $ref: "#/components/schemas/AdminRole" }
        permissions:
          type: array
          description: Izin yang akan berlaku setelah aktivasi; super_admin seluruh izin.
          items: { $ref: "#/components/schemas/Permission" }
        invited_by_display_name:
          type: [string, "null"]
          maxLength: 120
          description: Nama Super Admin pengundang; null untuk bootstrap CLI (PRD 8.2).
        expires_at: { type: string, format: date-time }

    AdminInvitationAcceptRequest:
      type: object
      required: [invite_token, password]
      properties:
        invite_token: { type: string, minLength: 16, maxLength: 512 }
        password: { $ref: "#/components/schemas/Password" }

    AdminTotpEnrollmentRequest:
      type: object
      required: [mfa_token]
      properties:
        mfa_token: { type: string, maxLength: 2048 }

    AdminTotpEnrollment:
      type: object
      description: Data pendaftaran autentikator (RFC 6238). Jangan disimpan klien setelah konfirmasi.
      required: [secret, otpauth_uri, issuer, account_name, algorithm, digits, period_seconds]
      properties:
        secret:
          type: string
          pattern: "^[A-Z2-7]+=*$"
          description: Secret base32 untuk dimasukkan manual bila QR tidak dapat dipindai.
          x-sensitive: true
        otpauth_uri:
          type: string
          pattern: "^otpauth://totp/"
          maxLength: 1024
          description: URI otpauth untuk dirender sebagai QR oleh web admin (memuat secret).
          x-sensitive: true
        issuer: { type: string, examples: ["KAPDH Admin"] }
        account_name: { type: string, description: Label akun di aplikasi autentikator (email admin). }
        algorithm: { type: string, examples: [SHA1] }
        digits: { type: integer, examples: [6] }
        period_seconds: { type: integer, examples: [30] }

    AdminTotpConfirmRequest:
      type: object
      required: [mfa_token, totp_code]
      properties:
        mfa_token: { type: string, maxLength: 2048 }
        totp_code: { type: string, pattern: "^[0-9]{6}$", x-sensitive: true }

    AdminTotpEnrollmentResult:
      type: object
      required: [session, backup_codes, backup_codes_generated_at]
      properties:
        session: { $ref: "#/components/schemas/AdminSession" }
        backup_codes:
          type: array
          minItems: 10
          maxItems: 10
          description: Backup code sekali pakai; hanya ditampilkan sekali, server menyimpan hash.
          x-sensitive: true
          items: { type: string, examples: ["7KQ2-M9XD"] }
        backup_codes_generated_at: { type: string, format: date-time }

    AdminBackupCodes:
      type: object
      required: [backup_codes, generated_at]
      properties:
        backup_codes:
          type: array
          minItems: 10
          maxItems: 10
          description: Backup code baru; kode lama tidak berlaku lagi. Hanya ditampilkan sekali.
          x-sensitive: true
          items: { type: string, examples: ["7KQ2-M9XD"] }
        generated_at: { type: string, format: date-time }
