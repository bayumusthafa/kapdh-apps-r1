# Domain public (C2 Membership): endpoint tanpa autentikasi untuk gerbang aplikasi, halaman informasi,
# verifikasi KTA, dan health check. Modul API: apps/api/src/modules/public (+ membership/content untuk KTA/halaman).
tags:
  - name: Public
    description: |
      Konfigurasi publik (versi minimum, maintenance, tautan toko), halaman informasi, verifikasi KTA dan health
      check (F-06, F-08, PRD 4.5).

paths:
  /health:
    get:
      tags: [Public]
      operationId: getHealth
      summary: Health check untuk monitor eksternal dan orkestrator (PRD 5.5, N-05).
      security: []
      responses:
        "200":
          description: API hidup.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthStatus" }
        default: { $ref: "#/components/responses/Error" }

  /health/ready:
    get:
      tags: [Public]
      operationId: getHealthReadiness
      summary: Readiness; memeriksa PostgreSQL, Redis (bila dikonfigurasi) dan storage (PRD 5.5, N-05).
      description: |
        Dipakai orkestrator (Coolify/Traefik) dan Uptime Kuma. 200 bila semua dependensi wajib siap, 503 bila
        ada yang gagal. Hanya nama komponen dan status ok/fail/skipped, ditambah umur event outbox pending tertua
        sebagai sinyal worker macet (PRD 5.5); tidak memuat pesan galat, host, versi atau data lain (N-14).
        Tidak dicache.
      security: []
      responses:
        "200":
          description: Semua dependensi wajib siap.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthReadiness" }
        "503":
          description: Ada dependensi wajib yang tidak siap.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HealthReadiness" }
        default: { $ref: "#/components/responses/Error" }

  /public/config:
    get:
      tags: [Public]
      operationId: getPublicConfig
      summary: Versi aplikasi minimum, status maintenance, tautan toko, kontak bantuan dan versi legal (PRD 4.5, 5.2).
      description: |
        Dibaca layar splash Flutter sebelum login (gerbang aplikasi, ARCHITECTURE §8.3) dan oleh situs publik.
        Sumber: app_settings min_app_version, maintenance, store_links, support dan legal (ARCHITECTURE §5.4).
        Tetap dilayani selama maintenance. Tidak memuat secret atau data pribadi.
      security: []
      responses:
        "200":
          description: Konfigurasi.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicConfig" }
        default: { $ref: "#/components/responses/Error" }

  /public/pages/{slug}:
    get:
      tags: [Public]
      operationId: getPublicPage
      summary: Halaman legal dan informasi (privasi, ketentuan, bantuan, tentang) yang dapat dibaca sebelum aktivasi (F-08).
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string, maxLength: 120 }
      responses:
        "200":
          description: Halaman.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicPage" }
        "404": { $ref: "#/components/responses/NotFound" }
        default: { $ref: "#/components/responses/Error" }

  /public/kta/verify:
    post:
      tags: [Public]
      operationId: verifyKta
      summary: Verifikasi token QR KTA; status selalu dari server (F-06).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KtaVerifyRequest" }
      responses:
        "200":
          description: Hasil verifikasi.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KtaVerification" }
        "429": { $ref: "#/components/responses/RateLimited" }
        default: { $ref: "#/components/responses/Error" }

components:
  schemas:
    HealthStatus:
      type: object
      required: [status, time]
      properties:
        status: { type: string, const: ok }
        time: { type: string, format: date-time }

    HealthCheckState:
      type: string
      enum: [ok, fail, skipped]
      description: Status satu dependensi; skipped bila dependensi opsional tidak dikonfigurasi (mis. REDIS_URL kosong).

    HealthReadinessStatus:
      type: string
      enum: [ok, unavailable]

    HealthReadinessChecks:
      type: object
      required: [database, redis, storage]
      properties:
        database: { $ref: "#/components/schemas/HealthCheckState" }
        redis: { $ref: "#/components/schemas/HealthCheckState" }
        storage: { $ref: "#/components/schemas/HealthCheckState" }
        outbox_oldest_pending_seconds:
          type: [integer, "null"]
          minimum: 0
          description: |
            Umur event outbox pending tertua dalam detik (sinyal worker macet, PRD 5.5); null bila tidak ada atau
            database tidak dapat dibaca. Tidak memengaruhi status readiness API.

    HealthReadiness:
      type: object
      required: [status, time, checks]
      properties:
        status: { $ref: "#/components/schemas/HealthReadinessStatus" }
        time: { type: string, format: date-time }
        checks: { $ref: "#/components/schemas/HealthReadinessChecks" }

    MinAppVersion:
      type: object
      description: Versi minimum per platform (semver); mutasi dari versi lebih rendah ditolak 426 (PRD 4.5).
      required: [android, ios]
      properties:
        android: { type: string, examples: ["1.0.0"] }
        ios: { type: string, examples: ["1.0.0"] }

    MaintenanceStatus:
      type: object
      required: [active, message, until]
      properties:
        active: { type: boolean }
        message: { type: [string, "null"], description: Penjelasan rentang/dampak untuk pengguna (PRD 4.5). }
        until: { type: [string, "null"], format: date-time, description: Perkiraan selesai bila diketahui. }

    StoreLinks:
      type: object
      description: Tautan toko aplikasi resmi untuk layar wajib update dan situs publik.
      required: [android, ios]
      properties:
        android: { type: [string, "null"], format: uri }
        ios: { type: [string, "null"], format: uri }

    SupportContact:
      type: object
      required: [email, whatsapp]
      properties:
        email: { type: string, format: email, examples: [bantuan@kapdh.or.id] }
        whatsapp: { type: [string, "null"], description: Nomor WhatsApp admin dukungan (PRD 8.3). }

    LegalVersions:
      type: object
      description: |
        Versi terbit halaman legal (published_version pages) yang dirujuk persetujuan pengguna (F-01); null bila
        halaman belum pernah terbit.
      required: [privacy_version, terms_version, community_version]
      properties:
        privacy_version: { type: [string, "null"] }
        terms_version: { type: [string, "null"] }
        community_version: { type: [string, "null"] }

    PublicConfig:
      type: object
      required: [min_app_version, maintenance, store_links, support, legal, server_time]
      properties:
        min_app_version: { $ref: "#/components/schemas/MinAppVersion" }
        maintenance: { $ref: "#/components/schemas/MaintenanceStatus" }
        store_links: { $ref: "#/components/schemas/StoreLinks" }
        support: { $ref: "#/components/schemas/SupportContact" }
        legal: { $ref: "#/components/schemas/LegalVersions" }
        server_time:
          type: string
          format: date-time
          description: Waktu server (UTC) untuk mendeteksi jam perangkat yang menyimpang.

    PublicPage:
      type: object
      required: [slug, title, body_html, version, published_at]
      properties:
        slug: { type: string }
        title: { type: string }
        body_html: { type: string, description: HTML tersanitasi server. }
        version: { type: string }
        published_at: { type: string, format: date-time }

    KtaVerifyRequest:
      type: object
      required: [member_number, token]
      properties:
        member_number: { type: string, examples: ["29.01.01.7"] }
        token: { type: string, description: "Dibaca shell dari fragmen URL (#t=)." }

    KtaVerificationResult:
      type: string
      enum: [active, expired, inactive, not_found, invalid_token]
      description: Aktif, Kedaluwarsa, Tidak aktif, Tidak ditemukan, QR tidak valid atau perlu diperbarui (F-06).

    KtaVerifiedMember:
      type: object
      description: Identitas minimum; hanya untuk result active atau expired.
      properties:
        full_name: { type: string }
        cohort_code: { type: string }
        member_number: { type: string }
        expires_at: { type: string, format: date-time }

    KtaVerification:
      type: object
      required: [result, checked_at]
      properties:
        result: { $ref: "#/components/schemas/KtaVerificationResult" }
        checked_at: { type: string, format: date-time }
        member:
          oneOf:
            - $ref: "#/components/schemas/KtaVerifiedMember"
            - type: "null"
